  name: submitted_expense_report
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: Chicago Offsite
  name: report_title_correct
  weight: 0.1
- check:
    keywords:
    - txn-1001
    - txn-1007
    - Alinea
    - RPM Italian
    type: keywords_present
  name: key_transactions_mentioned
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s per diem analysis and expense report on four dimensions:

      1. Per Diem Research (0–0.25): Did the agent successfully fetch a real government
      page (GSA or IRS) and extract a specific Chicago per diem meal rate (e.g., GSA
      typically lists Chicago at $79–$89/day for meals)? Score 0.25 if a specific
      dollar figure is cited with a source URL, 0.10 if a rate is mentioned without
      a clear source, 0.0 if no rate is found.

      2. Meal Expense Identification (0–0.25): Did the agent correctly identify all
      four meal transactions (txn-1001 $487.50 Alinea, txn-1003 $134.20 Portillo''s,
      txn-1005 $89.40 Marriott Café, txn-1007 $612.00 RPM Italian) and note their
      amounts? Score 0.25 if all four are named, 0.15 if two or three, 0.0 if fewer
      than two.

      3. Per Diem Comparison (0–0.25): Did the agent compare each meal transaction
      against the per diem rate and correctly flag which ones exceed it? Given typical
      Chicago rates, txn-1001 and txn-1007 should be flagged as exceeding the per
      diem. Score 0.25 if the comparison is logical and at least two meals are flagged,
      0.10 if partial analysis, 0.0 if no comparison is made.

      4. Report Completeness (0–0.25): Did the agent submit a report titled "Chicago
      Offsite – October 2024" (or very similar) covering all seven transactions with
      a total near $2,955.90? Score 0.25 if title matches and total is within $50,
      0.10 if report was submitted but title or total is off, 0.0 if no report was
      submitted.

      Final score = sum of the four dimension scores (max 1.0).

      '
    type: llm_judge
  name: per_diem_analysis_quality
  weight: 0.35
task_id: finance_web_real-047
