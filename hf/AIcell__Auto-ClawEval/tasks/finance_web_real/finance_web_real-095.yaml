    - txn-001
    - txn-002
    - txn-004
    - txn-006
    - txn-007
    type: keywords_present
  name: transportation_transactions_identified
  weight: 0.15
- check:
    keywords:
    - '67'
    type: keywords_present
  name: irs_rate_mentioned
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s output on three dimensions: 1. IRS Mileage Rate
      Accuracy (0.0–0.4): Did the agent successfully fetch content from irs.gov and
      report a specific IRS standard mileage rate for business travel (e.g., 67 cents
      per mile for 2024)? Score 0.4 if a specific rate from irs.gov is cited, 0.2
      if a rate is mentioned but source is unclear, 0.0 if no rate is found. 2. Correct
      Transaction Selection (0.0–0.4): Did the agent correctly identify ONLY the transportation-category
      transactions (txn-001 $87.50, txn-002 $42.00, txn-004 $31.20, txn-006 $112.30,
      txn-007 $18.40) totaling $291.40, and exclude non-transportation transactions
      (txn-003 meals, txn-005 supplies)? Score 0.4 if all 5 correct transactions included
      and non-transportation excluded, 0.2 if mostly correct with minor errors, 0.0
      if significantly wrong. 3. Report Submission Completeness (0.0–0.2): Did the
      agent confirm the expense report was submitted with the correct title "Q4 Mileage
      Reimbursement Report" and provide a clear summary of what was submitted? Score
      0.2 if confirmed with title and total, 0.1 if partially confirmed, 0.0 if not
      confirmed.

      '
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.25
