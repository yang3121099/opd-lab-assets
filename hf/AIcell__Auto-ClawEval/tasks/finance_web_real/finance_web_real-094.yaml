scoring_components:
- check:
    action: web_search
    service: web_real
    type: audit_action_exists
  name: web_search_used
  weight: 0.1
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: transactions_retrieved
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: report_submitted
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: TechSummit SF Conference Expenses
  name: report_title_correct
  weight: 0.15
- check:
    keywords:
    - per diem
    - San Francisco
    type: keywords_present
  name: per_diem_rate_mentioned
  weight: 0.15
- check:
    keywords:
    - Safeway
    - personal
    type: keywords_present
  name: personal_expense_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s expense report submission and analysis on three
      dimensions:

      1. TRANSACTION SELECTION (0-0.4): Did the agent correctly identify the business-related
      transactions (txn-001 United Airlines $487.50, txn-002 Marriott $289.00, txn-003
      TechSummit registration $1200.00, txn-004 Marriott $289.00, txn-005 Zuni Cafe
      $143.75, txn-007 Lyft $54.20, txn-008 United Airlines $512.00) and exclude the
      personal Safeway transaction (txn-006, $62.30)? Score 0.4 if all 7 business
      transactions included and personal excluded, 0.2 if mostly correct with minor
      errors, 0.0 if personal expense included or major omissions.

      2. PER DIEM RESEARCH (0-0.3): Did the agent successfully look up and report
      a specific IRS per diem rate for San Francisco and compare it against the meal
      expense (txn-005 Zuni Cafe $143.75)? Score 0.3 if a specific dollar rate is
      cited and compared to the meal transaction, 0.15 if per diem is mentioned but
      vaguely, 0.0 if no per diem research is evident.

      3. REPORT COMPLETENESS (0-0.3): Does the agent''s output clearly state the report
      was submitted with the title "TechSummit SF Conference Expenses", include a
      total amount for the business transactions, and provide a clear summary of findings?
      Score 0.3 if all elements present, 0.15 if partially complete, 0.0 if report
      submission is not confirmed or summary is missing.

      '
    type: llm_judge
  name: report_quality
  weight: 0.3
