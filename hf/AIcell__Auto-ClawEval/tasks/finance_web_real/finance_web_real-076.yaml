  service: finance
- description: Get details of a specific transaction by ID
  endpoint: /finance/transactions/get
  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with selected transactions and total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
- description: Search the web for real-time information
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Send a notification to a channel with a message
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web_real
