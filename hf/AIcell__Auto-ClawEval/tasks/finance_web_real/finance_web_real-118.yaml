category: finance
claw_eval_id: T69_micron_capex_analysis
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 487.5
      category: travel
      date: '2024-10-14'
      description: United Airlines flight SFO roundtrip
      id: txn-001
      status: approved
      vendor: United Airlines
    - amount: 34.2
      category: transportation
      date: '2024-10-14'
      description: Uber to SFO airport
      id: txn-002
      status: approved
      vendor: Uber
    - amount: 1240.0
      category: lodging
      date: '2024-10-15'
      description: Hotel Zephyr San Francisco - 4 nights
      id: txn-003
      status: approved
      vendor: Hotel Zephyr
    - amount: 312.8
      category: meals
      date: '2024-10-15'
      description: Team dinner at Waterbar Restaurant
      id: txn-004
      status: approved
      vendor: Waterbar Restaurant
    - amount: 89.45
      category: meals
      date: '2024-10-16'
      description: Breakfast and lunch - client meetings
      id: txn-005
      status: approved
      vendor: Various SF Restaurants
    - amount: 650.0
      category: conference
      date: '2024-10-17'
      description: Conference registration fee
      id: txn-006
      status: approved
      vendor: TechSummit 2024
    - amount: 175.0
      category: personal
      date: '2024-10-18'
      description: Personal spa treatment
      id: txn-007
      status: pending
      vendor: Spa Vitale
    - amount: 52.1
