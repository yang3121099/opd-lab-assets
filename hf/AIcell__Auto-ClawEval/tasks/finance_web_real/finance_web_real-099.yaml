- check:
    rubric: 'Evaluate the agent''s overall performance on this task across three dimensions:

      1. TRANSACTION FILTERING (0–0.4): Did the agent correctly identify ONLY the
      six sustainability-category transactions (txn-2401: $1,850.00 GreenArch Consulting;
      txn-2402: $3,420.50 EcoLite Solutions; txn-2404: $2,275.00 WasteWise Inc.; txn-2405:
      $4,100.00 ClearPath Environmental; txn-2407: $6,750.00 VoltPoint Technologies;
      txn-2408: $2,160.00 EcoLearn Academy) and correctly exclude non-sustainability
      transactions (txn-2403 meals $980.00, txn-2406 office supplies $310.00)? Score
      0.4 if all six included and two excluded correctly, 0.2 if minor errors, 0.0
      if major omissions or wrong inclusions.

      2. CARBON CREDIT RESEARCH INTEGRATION (0–0.3): Did the agent actually search
      for voluntary carbon credit market prices, report a plausible current price
      (typically $5–$50 USD per tonne CO2 for voluntary markets), and meaningfully
      incorporate this information into the report title or a contextual note? Score
      0.3 if research is cited and integrated with context, 0.15 if research was done
      but integration is superficial, 0.0 if no research or fabricated data.

      3. REPORT TITLE AND PRESENTATION (0–0.3): Is the submitted report title descriptive,
      professional, and does it reference both the Green Office Initiative and the
      carbon credit/sustainability investment context? Does the agent clearly communicate
      the total of $20,555.50 and provide a coherent summary? Score 0.3 if title is
      specific and contextual with all elements, 0.15 if adequate but generic, 0.0
      if missing key elements.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.35
