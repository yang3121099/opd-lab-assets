prompt: 'Our company recently ran a "Green Office Initiative" pilot program in Q1
  2024, and I need you to compile an official expense report for all sustainability-related
  transactions from that period. Before submitting the report, please look up the
  current average market price for voluntary carbon credits (in USD per tonne CO2)
  so we can include a brief note in the report title about whether our spending aligns
  with industry sustainability investment benchmarks. Submit the expense report with
  a descriptive title that references the carbon credit context, includes all sustainability
  transactions, and reflects the correct total.

  '
reference_solution: "1. Call list_transactions with start_date \"2024-01-01\" and\
  \ end_date \"2024-03-31\" to retrieve all Q1 2024 transactions. 2. Review the returned\
  \ transactions and filter to only those with category \"sustainability\":\n   txn-2401\
  \ ($1,850.00), txn-2402 ($3,420.50), txn-2404 ($2,275.00), txn-2405 ($4,100.00),\
  \ txn-2407 ($6,750.00), txn-2408 ($2,160.00).\n   Exclude txn-2403 (meals) and txn-2406\
  \ (office_supplies).\n3. Calculate the total: 1850.00 + 3420.50 + 2275.00 + 4100.00\
  \ + 6750.00 + 2160.00 = $20,555.50. 4. Use web_search to look up \"voluntary carbon\
  \ credit market price per tonne CO2 2024\" to find current pricing context. 5. Optionally\
  \ use web_fetch to retrieve more detailed information from a relevant result. 6.\
  \ Incorporate the carbon credit price finding into a descriptive report title, e.g.,\n\
  \   \"Q1 2024 Green Office Initiative Expenses — Sustainability Investment Report\
  \ (Carbon Credit Context: ~$X/tonne CO2)\".\n7. Call submit_report with the descriptive\
  \ title, the six sustainability transaction IDs, and total_amount of 20555.50. 8.\
  \ Report back to the user with the submitted report details, the sustainability\
  \ transactions included, the excluded transactions\n   and why, the carbon credit\
  \ price found, and a note on how the company's spending relates to sustainability\
  \ benchmarks."
