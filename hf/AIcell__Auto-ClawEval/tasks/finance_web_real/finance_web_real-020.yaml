prompt: 'Our CFO suspects there may be duplicate or suspicious charges from a vendor
  called "CloudSync Solutions" in the past month. Please investigate the individual
  transactions from CloudSync Solutions by retrieving their details, look up the current
  market rate for cloud storage services online to assess whether the charges are
  reasonable, and then compile a formal expense report titled "CloudSync Solutions
  Vendor Review" summarizing your findings and the total amount charged.

  '
reference_solution: "1. Call list_transactions with start_date \"2024-11-01\" and\
  \ end_date \"2024-11-30\" to identify all CloudSync Solutions transactions. 2. Call\
  \ get_transaction for each of the 7 transaction IDs (txn-1041, txn-1047, txn-1055,\
  \ txn-1063, txn-1078, txn-1082, txn-1090) to retrieve full details. 3. Analyze the\
  \ transaction details and identify two sets of duplicate charges:\n   - txn-1041\
  \ and txn-1047: both $1,200.00 Enterprise tier subscriptions in the same month.\n\
  \   - txn-1082 and txn-1090: both $875.00 Emergency support fees on the same day\
  \ (Nov 30).\n4. Use web_search to look up current market rates for enterprise cloud\
  \ storage subscriptions and professional services/migration support to assess whether\
  \ the charges are reasonable. 5. Calculate the total amount: 1200.00 + 1200.00 +\
  \ 340.50 + 2750.00 + 1200.00 + 875.00 + 875.00 = 8440.50. 6. Call submit_report\
  \ with title \"CloudSync Solutions Vendor Review\", all 7 transaction IDs, and total_amount\
  \ 8440.50. 7. Present a written summary to the CFO identifying the duplicate charges,\
  \ the market rate comparison, and a recommendation to dispute or investigate the\
  \ duplicates."
