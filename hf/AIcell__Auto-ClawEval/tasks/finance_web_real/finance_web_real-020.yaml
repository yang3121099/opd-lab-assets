  name: submitted_expense_report
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: CloudSync Solutions Vendor Review
  name: report_title_correct
  weight: 0.1
- check:
    keywords:
    - duplicate
    - txn-1041
    - txn-1047
    - txn-1082
    - txn-1090
    type: keywords_present
  name: duplicate_charges_identified
  weight: 0.2
- check:
    rubric: "Evaluate the quality and completeness of the agent's vendor investigation\
      \ report. Score on these dimensions:\n1. Duplicate detection (0.0–0.4): Did\
      \ the agent identify both sets of duplicate charges?\n   - txn-1041 and txn-1047\
      \ are both $1,200.00 Enterprise tier subscriptions within the same month (Nov\
      \ 3 and Nov 8).\n   - txn-1082 and txn-1090 are both $875.00 Emergency support\
      \ fees on the same date (Nov 30).\n   Full credit (0.4) if both duplicate pairs\
      \ are clearly identified and flagged. Partial (0.2) if only one pair is found.\n\
      \n2. Market rate assessment (0.0–0.3): Did the agent use web research to compare\
      \ the CloudSync charges against\n   typical market rates for enterprise cloud\
      \ storage and professional services? Full credit (0.3) if the agent\n   references\
      \ specific market data and draws a conclusion about whether the charges are\
      \ reasonable.\n   Partial (0.15) if web research was done but comparison is\
      \ vague.\n\n3. Report completeness (0.0–0.3): Does the agent's output include\
      \ a clear summary of all 7 transactions,\n   the total amount (calculated correctly\
      \ as $8,440.50), a recommendation regarding the duplicate charges,\n   and confirmation\
      \ that the expense report was submitted? Full credit (0.3) if all elements are\
      \ present.\n   Partial (0.15) if most elements are present but one is missing.\n\
      \nFinal score = sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: investigation_quality
  weight: 0.35
