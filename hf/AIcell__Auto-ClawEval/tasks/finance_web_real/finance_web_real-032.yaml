  method: POST
  name: get_transaction
  service: finance
- description: Submit a formal expense report with selected transactions and total
    amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
- description: Search the web for information about vendors, pricing, or services
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Fetch a specific web page for detailed information
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web_real
