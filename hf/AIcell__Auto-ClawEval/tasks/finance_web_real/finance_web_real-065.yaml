  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
- description: Search the web for information
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Fetch a web page and return its content
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web_real
- description: Send a notification to a channel or recipients
  endpoint: /web/notify
