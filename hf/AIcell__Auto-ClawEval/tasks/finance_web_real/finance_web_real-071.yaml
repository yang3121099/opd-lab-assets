- check:
    rubric: 'Evaluate the quality and completeness of the agent''s expense benchmark
      analysis. Score on these dimensions:

      1. Benchmark data sourced (0.0-0.25): Did the agent fetch real benchmark data
      from a credible online source (e.g., GBTA, GSA per diem, travel industry reports)
      and cite specific figures for hotel rates, airfare, or per diem?

      2. Transaction coverage (0.0-0.25): Did the agent correctly identify and include
      the travel-category transactions (txn-001 through txn-007, noting txn-003 is
      meals not travel) and compute a reasonable total? The travel transactions sum
      to approximately $2,497.30 (txn-001: $487.50, txn-002: $398.00, txn-004: $612.00,
      txn-005: $389.00, txn-006: $67.80, txn-007: $543.00).

      3. Comparative analysis (0.0-0.25): Did the agent meaningfully compare specific
      transactions against benchmarks? For example, noting that the NYC Hilton at
      $389/night (txn-005) or Chicago Marriott at $199/night average (txn-002, 2 nights)
      compares to typical rates, or that the Delta flight to JFK at $612 (txn-004)
      is above/below average domestic airfare?

      4. Flagging and recommendations (0.0-0.25): Did the agent flag any transactions
      as notably above or below typical rates with a clear rationale, and provide
      actionable observations for the finance team?

      Score 1.0 for excellent coverage of all four dimensions, 0.75 for three dimensions
      well covered, 0.5 for two dimensions, 0.25 for one dimension, 0.0 if the analysis
      is missing or purely generic with no real benchmark data.

      '
    type: llm_judge
  name: benchmark_comparison_quality
  weight: 0.4
