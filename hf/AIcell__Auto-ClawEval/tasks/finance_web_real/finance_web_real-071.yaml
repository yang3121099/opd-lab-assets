prompt: 'Our team recently completed a series of business trips and I need you to
  review the travel-related transactions from the past month, look up current industry
  benchmarks for business travel costs (hotel nightly rates, flight costs, per diem)
  from a reputable source online, and then submit an expense report titled "Q4 Travel
  Expense Review" that includes all travel transactions. In your response, summarize
  how our actual spending compares to industry benchmarks and flag any transactions
  that appear significantly above or below typical rates.

  '
reference_solution: '1. Call list_transactions with a date range covering November
  2024 (start_date: 2024-11-01, end_date: 2024-11-30) to retrieve all transactions.
  2. Review the returned transactions and identify those in the ''travel'' category:
  txn-001 (flight $487.50), txn-002 (hotel $398.00), txn-004 (flight $612.00), txn-005
  (hotel $389.00), txn-006 (ground transport $67.80), txn-007 (flight $543.00). Note
  txn-003 is meals category. 3. Use web_search to find reputable sources for business
  travel benchmarks (e.g., GBTA Business Travel Index, GSA per diem rates, or travel
  industry reports). 4. Use web_fetch to retrieve benchmark data from one or more
  credible URLs, extracting typical figures for domestic airfare, hotel nightly rates
  in major cities, and ground transportation. 5. Compare each travel transaction against
  the benchmarks: e.g., average domestic airfare ~$300-400 (Delta JFK at $612 is high),
  average hotel in Chicago ~$180-220/night (Marriott at $199/night is reasonable),
  NYC hotel ~$250-350/night (Hilton at $389 is slightly above average). 6. Calculate
  the total of all travel transactions: $487.50 + $398.00 + $612.00 + $389.00 + $67.80
  + $543.00 = $2,497.30. 7. Call submit_report with title "Q4 Travel Expense Review",
  the list of travel transaction IDs, and total_amount 2497.30. 8. Provide a written
  summary comparing actual spend to benchmarks, flagging the Delta JFK flight (txn-004)
  and NYC Hilton (txn-005) as potentially above typical rates, and noting the Chicago
  hotel (txn-002) as within normal range.'
