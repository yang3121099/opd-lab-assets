category: finance
claw_eval_id: T66_finance_bros_gross_profit
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 4250.0
      category: Technology
      date: '2024-07-08'
      description: AWS Cloud Infrastructure - July
      id: txn-001
      status: approved
      vendor: Amazon Web Services
    - amount: 3100.0
      category: Events
      date: '2024-07-22'
      description: Team offsite venue rental
      id: txn-002
      status: approved
      vendor: Grand Hyatt Conference Center
    - amount: 5800.0
      category: Technology
      date: '2024-08-05'
      description: SaaS licenses - Salesforce Q3
      id: txn-003
      status: approved
      vendor: Salesforce Inc.
    - amount: 620.0
      category: Office Supplies
      date: '2024-08-19'
      description: Office supplies restock
      id: txn-004
      status: approved
      vendor: Staples Business
    - amount: 2875.0
      category: Travel
      date: '2024-09-03'
      description: Executive travel - NYC summit
      id: txn-005
      status: approved
      vendor: Delta Airlines / Marriott
    - amount: 6400.0
