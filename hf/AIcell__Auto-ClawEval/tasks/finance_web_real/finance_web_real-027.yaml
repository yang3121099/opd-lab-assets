  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Engineering Offsite Retreat – October 2024
  name: report_title_exact
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-002
    - txn-003
    - txn-004
    - txn-005
    - txn-007
    - '1066.45'
    type: keywords_present
  name: correct_transactions_and_total
  weight: 0.2
- check:
    keywords:
    - mileage
    - cents per mile
    type: keywords_present
  name: mileage_rate_mentioned
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s final summary on the following dimensions:

      1. CORRECT TRANSACTION SELECTION (0–0.4): Did the agent correctly include only
      Travel and Meals transactions from Oct 14–15, 2024? The correct transactions
      are txn-001 ($189.00, Marriott Courtyard), txn-002 ($312.50, The Rustic Table
      Restaurant), txn-003 ($54.00, City Express Shuttle), txn-004 ($189.00, Marriott
      Courtyard), txn-005 ($178.75, Harvest Grain Cafe), and txn-007 ($143.20, Enterprise
      Rent-A-Car). txn-006 (Supplies, Staples) must NOT be included. Score 0.4 if
      all six correct transactions are identified and txn-006 is excluded, 0.2 if
      minor omissions, 0.0 if txn-006 is included or major transactions are missing.

      2. CORRECT TOTAL (0–0.3): The correct total is $1,066.45. Score 0.3 if the total
      is exactly correct, 0.15 if within $5 due to rounding explanation, 0.0 if significantly
      wrong.

      3. MILEAGE RATE CONTEXT (0–0.2): Did the agent report a specific, plausible
      IRS standard mileage rate (e.g., 67 cents per mile for 2024) sourced from the
      web? Score 0.2 if a specific rate with source context is provided, 0.1 if mentioned
      vaguely, 0.0 if absent.

      4. CLARITY AND PROFESSIONALISM (0–0.1): Is the summary well-organized, clearly
      listing vendors, amounts, and the report title "Engineering Offsite Retreat
      – October 2024"? Score 0.1 if excellent, 0.05 if adequate, 0.0 if disorganized.

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.25
