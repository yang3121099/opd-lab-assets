- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: Q4 Business Travel Reimbursement
  name: report_title_correct
  weight: 0.1
- check:
    keywords:
    - '67'
    - mileage
    - IRS
    type: keywords_present
  name: irs_mileage_rate_mentioned
  weight: 0.15
- check:
    keywords:
    - txn-004
    - txn-005
    - United Airlines
    - Marriott
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s expense report submission and explanation on three
      dimensions:

      1. MILEAGE RATE RESEARCH (0-0.4): Did the agent successfully look up and report
      the 2024 IRS standard mileage rate (67 cents per mile as of 2024)? Did they
      explain its relevance to the mileage transactions (txn-001: $47.85, txn-002:
      $31.20, txn-007: $52.10)?

      2. TRANSACTION SELECTION (0-0.4): Did the agent correctly identify and include
      the travel-related transactions? The report should include at minimum the travel
      category transactions (txn-004: United Airlines $412.00, txn-005: Marriott $289.00)
      and ideally the mileage transactions (txn-001, txn-002, txn-007). Non-travel
      items like office supplies (txn-006: Staples $63.40) should be excluded. Meals
      (txn-003) inclusion is debatable but agent should justify.

      3. REPORT CLARITY (0-0.2): Is the agent''s output clear, well-organized, and
      does it provide a reasonable total amount and explanation of what was included
      and why?

      Score 1.0 if all three dimensions are well-addressed, 0.7 if two are strong,
      0.4 if only one is addressed, 0.0 if the output is missing or incoherent.

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.25
