    - Hotel Allegro
    - Gibsons
    - United Airlines
    - txn-88
    type: keywords_present
  name: key_transactions_mentioned
  weight: 0.15
- check:
    keywords:
    - per diem
    - GSA
    type: keywords_present
  name: per_diem_compliance_noted
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s expense report submission and compliance analysis
      on three dimensions:

      1. COMPLETENESS (0-1): Did the agent identify all 8 Chicago trip transactions
      (txn-8801 through txn-8808) covering Oct 14-18, 2024, and include them in the
      submitted report? The total should be approximately $1,483.65. Score 1.0 if
      all transactions are accounted for, 0.5 if 5-7 are included, 0.0 if fewer than
      5.

      2. GSA PER DIEM ANALYSIS (0-1): Did the agent actually fetch the GSA per diem
      page and report specific rate information for Chicago, IL? The agent should
      compare the lodging rate ($219/night at Hotel Allegro) and meal expenses against
      GSA limits, and flag txn-8804 (Gibsons dinner at $143.75) as potentially exceeding
      the standard meal per diem. Score 1.0 if specific GSA rates are cited and compared
      to actual expenses, 0.5 if per diem is discussed generally without specific
      numbers, 0.0 if no comparison is made.

      3. POLICY NOTES QUALITY (0-1): Does the agent provide actionable compliance
      notes, such as flagging the pending status of txn-8804 (Gibsons, $143.75) and
      noting whether lodging at $219/night is within or exceeds GSA limits? Score
      1.0 if specific transactions are called out with clear policy guidance, 0.5
      if notes are vague, 0.0 if no compliance notes are provided.

      Final score = average of the three dimensions.

      '
    type: llm_judge
  name: report_quality_and_compliance
  weight: 0.3
