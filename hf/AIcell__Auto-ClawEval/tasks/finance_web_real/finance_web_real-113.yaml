prompt: 'I just returned from a business trip to Chicago and need to submit an expense
  report for my travel transactions from October 14-18, 2024. Before submitting, please
  look up the current GSA per diem rates for Chicago, IL on the GSA website (https://www.gsa.gov/travel/plan-book/per-diem-rates)
  to verify whether my meal and lodging expenses are within the allowed limits, then
  compile and submit the expense report with a summary of any policy compliance notes.

  '
reference_solution: '1. Call list_transactions with start_date "2024-10-14" and end_date
  "2024-10-18" to retrieve all 8 Chicago trip transactions (txn-8801 through txn-8808).
  2. Call web_fetch on https://www.gsa.gov/travel/plan-book/per-diem-rates (or a Chicago-specific
  GSA per diem page) to retrieve the official lodging and meal per diem rates for
  Chicago, IL for FY2024/2025. 3. Compare the fetched GSA rates against the actual
  transaction amounts: lodging at Hotel Allegro ($219/night across 4 nights) vs. the
  GSA lodging rate, and meal expenses (txn-8804 Gibsons at $143.75, txn-8806 Portillo''s
  at $22.40) vs. the GSA M&IE rate. 4. Note that txn-8804 (Gibsons Bar & Steakhouse,
  $143.75) is still in "pending" status and likely exceeds the standard GSA meal per
  diem, requiring additional justification. 5. Calculate the total: $387.50 + $219.00
  + $219.00 + $143.75 + $219.00 + $22.40 + $219.00 + $54.00 = $1,483.65. 6. Call submit_report
  with title "Chicago Business Trip Oct 14-18 2024", all 8 transaction IDs, total_amount
  1483.65. 7. Provide a written summary to the user including the GSA per diem rates
  found, a compliance assessment for each expense category, and a note about txn-8804''s
  pending status and potential policy exception needed.'
