category: finance
claw_eval_id: T65_finance_x_inv_turnover
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 487.5
      category: travel
      date: '2024-10-14'
      description: United Airlines flight SFO roundtrip
      id: txn-1001
