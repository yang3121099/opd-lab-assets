category: finance
claw_eval_id: T67zh_synopsys_china_revenue
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 1240.0
      category: Office Supplies
      date: '2024-07-15'
      description: Bulk office supplies - paper and toner
      id: TXN-4401
      status: pending_review
      vendor: Meridian Supplies
    - amount: 875.5
      category: Office Supplies
      date: '2024-07-22'
      description: Bulk office supplies - binders and folders
      id: TXN-4402
      status: pending_review
      vendor: Meridian Supplies
    - amount: 634.75
      category: Office Supplies
      date: '2024-07-29'
      description: Bulk office supplies - desk accessories
      id: TXN-4403
      status: pending_review
      vendor: Meridian Supplies
    - amount: 520.0
      category: Meals & Entertainment
      date: '2024-07-10'
      description: Catering for board meeting
      id: TXN-4410
      status: approved
      vendor: City Catering Co.
    - amount: 2100.0
      category: Software
      date: '2024-08-01'
      description: Software license renewal
      id: TXN-4415
