  name: list_transactions
  service: finance
- description: Search the web for information about vendors, pricing, or policies
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Fetch a specific web page to retrieve detailed content
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web_real
- description: Submit an expense report with a title, list of transaction IDs, and
    total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
- description: Send a notification to a channel or recipients
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web_real
