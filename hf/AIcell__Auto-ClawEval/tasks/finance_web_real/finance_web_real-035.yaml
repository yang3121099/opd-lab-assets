category: finance
claw_eval_id: T60_finance_tko_endeavor_cost
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 1842.5
      category: travel
      date: '2024-10-07'
      description: ANA Airlines - Round trip SFO to NRT
      id: txn-001
      status: pending
      vendor: ANA Airlines
    - amount: 980.0
      category: travel
      date: '2024-10-08'
      description: Shinjuku Hotel - 4 nights
      id: txn-002
      status: pending
      vendor: Shinjuku Grand Hotel
    - amount: 420.0
      category: meals
      date: '2024-10-09'
      description: Team dinner at Sukiyabashi Jiro
      id: txn-003
      status: pending
      vendor: Sukiyabashi Jiro
    - amount: 95.0
      category: travel
      date: '2024-10-10'
      description: Tokyo Metro passes - team of 6
      id: txn-004
      status: pending
      vendor: Tokyo Metro
    - amount: 180.0
      category: meals
      date: '2024-10-11'
      description: Team lunch at Ichiran Ramen
      id: txn-005
      status: pending
      vendor: Ichiran Ramen
    - amount: 67.3
      category: supplies
      date: '2024-10-12'
      description: Office supplies from Tokyu Hands
      id: txn-006
