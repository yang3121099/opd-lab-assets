- check:
    action: web_search
    service: web_real
    type: audit_action_exists
  name: used_web_search
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: report_submitted
  weight: 0.15
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Q4 Remote Work Equipment Refresh
  name: report_title_correct
  weight: 0.15
- check:
    keywords:
    - txn-001
    - txn-002
    - txn-004
    - txn-005
    - txn-007
    type: keywords_present
  name: equipment_transactions_identified
  weight: 0.15
- check:
    keywords:
    - Rosewood Bistro
    - CleanPro
    type: keywords_absent
  name: non_equipment_excluded
  weight: 0.1
- check:
    rubric: "Evaluate the agent's expense report submission and summary on three dimensions:\n\
      1. TRANSACTION SELECTION (0.0-0.4): Did the agent correctly identify all five\
      \ equipment transactions\n   (txn-001 Dell Monitor $598.00, txn-002 Logitech\
      \ Keyboard $359.85, txn-004 Jabra Headset $719.60,\n   txn-005 Logitech Webcam\
      \ $374.95, txn-007 Ergotron Monitor Arm $259.90) and exclude non-equipment\n\
      \   transactions (txn-003 Rosewood Bistro meals $214.50, txn-006 CleanPro supplies\
      \ $87.30)?\n   Score 0.4 if all 5 included and 2 excluded correctly, 0.2 if\
      \ 3-4 equipment included, 0.0 if major errors.\n\n2. TOTAL AMOUNT ACCURACY (0.0-0.3):\
      \ Did the agent calculate and report the correct total of $2,312.30\n   (598.00\
      \ + 359.85 + 719.60 + 374.95 + 259.90)? Score 0.3 if exact, 0.15 if within $10,\
      \ 0.0 if wrong.\n\n3. WEB RESEARCH INTEGRATION (0.0-0.3): Did the agent reference\
      \ findings from the web search about\n   IRS guidance or business expense standards\
      \ for remote work equipment, and explain how this supports\n   the legitimacy\
      \ of the submitted expenses? Score 0.3 if clearly integrated, 0.15 if mentioned\
      \ briefly,\n   0.0 if absent.\n\nFinal score = sum of dimension scores (max\
      \ 1.0).\n"
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.25
