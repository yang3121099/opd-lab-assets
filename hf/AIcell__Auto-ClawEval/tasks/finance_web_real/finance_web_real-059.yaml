scoring_components:
- check:
    action: web_fetch
    service: web_real
    type: audit_action_exists
  name: fetched_gsa_perdiem_page
  weight: 0.15
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: used_finance_transactions
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: San Francisco Travel Expenses
  name: report_title_field
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-003
    - txn-006
    - per diem
    type: keywords_present
  name: key_transactions_mentioned
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s expense report summary on three dimensions:

      1. Per diem research (0–0.4): Did the agent successfully fetch the GSA per diem
      page and report a specific daily meal/incidental rate for San Francisco? A concrete
      dollar figure (e.g., around $79–$92 for meals) must be cited. Score 0.4 if a
      specific rate is cited with source, 0.2 if vague reference, 0.0 if no rate found.

      2. Expense analysis accuracy (0–0.4): Did the agent correctly identify which
      meal transactions are within or over the per diem limit? The client dinner (txn-003,
      $212.80) is clearly a multi-person expense and should be flagged for review;
      the Blue Bottle breakfast (txn-004, $18.40) is well within limits; the team
      lunch (txn-006, $143.60) should also be discussed. Score 0.4 if all three meal
      transactions are analyzed with clear reasoning, 0.2 if only one or two are addressed,
      0.0 if no meal analysis is provided.

      3. Report completeness (0–0.2): Did the agent include all travel-related transactions
      (txn-001 through txn-006, excluding txn-007 office supplies or with a clear
      rationale for inclusion/exclusion) in the submitted report and provide a coherent
      summary? Score 0.2 if the report is complete and well-organized, 0.1 if partially
      complete, 0.0 if the report is missing major transactions or lacks a summary.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: perdiem_analysis_quality
  weight: 0.4
