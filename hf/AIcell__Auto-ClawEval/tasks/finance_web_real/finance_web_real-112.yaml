  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Q3 Travel Expense Benchmark Review
  name: report_title_exact
  weight: 0.1
- check:
    keywords:
    - per diem
    - GSA
    - benchmark
    - industry
    type: keywords_present
  name: benchmark_sources_mentioned
  weight: 0.15
- check:
    keywords:
    - txn-004
    - Delta Airlines
    - Marriott
    type: keywords_present
  name: transactions_identified_in_output
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s benchmark analysis and expense report submission
      on three dimensions:

      1. RESEARCH QUALITY (0-1): Did the agent find and cite real, credible industry
      benchmarks for business travel (e.g., GSA per diem rates, GBTA data, or similar)?
      Score 1.0 if specific rates or sources are cited, 0.5 if general benchmarks
      are mentioned without specifics, 0.0 if no research is evident.

      2. ANALYSIS ACCURACY (0-1): Did the agent correctly identify which transactions
      appear unusually high relative to benchmarks? The NYC hotel (txn-005, $980 for
      2 nights = $490/night) and the Delta flight to New York (txn-004, $892) are
      strong candidates for flagging. Score 1.0 if at least two transactions are flagged
      with reasoning, 0.5 if one is flagged, 0.0 if none are flagged or analysis is
      absent.

      3. REPORT COMPLETENESS (0-1): Did the agent submit the report with all travel-category
      transactions (txn-001 through txn-007) included and provide a clear summary
      of findings? Score 1.0 if all travel transactions are included and findings
      are clearly summarized, 0.5 if partial, 0.0 if the report is missing or the
      summary is absent.

      Final score = average of the three dimensions.

      '
    type: llm_judge
  name: benchmark_analysis_quality
  weight: 0.3
