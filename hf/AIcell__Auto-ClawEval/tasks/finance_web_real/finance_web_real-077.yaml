- check:
    action: web_fetch
    service: web_real
    type: audit_action_exists
  name: fetched_gsa_rates
  weight: 0.2
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: retrieved_transactions
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.1
- check:
    keywords:
    - GSA
    - per diem
    - compliant
    - Washington
    - San Francisco
    type: keywords_present
  name: compliance_findings_mentioned
  weight: 0.2
- check:
    rubric: 'Evaluate the agent''s GSA per diem compliance analysis on three dimensions:

      1. RATE LOOKUP ACCURACY (0-1): Did the agent successfully fetch real GSA per
      diem rates for Washington DC, Chicago, San Francisco, and Austin? Did it correctly
      identify the lodging and M&IE (meals and incidental expenses) limits for each
      city?

      2. COMPLIANCE ANALYSIS (0-1): Did the agent correctly compare each transaction
      against the applicable GSA rate? The agent should flag transactions that exceed
      GSA limits. Washington DC lodging (txn-001 at $289) and San Francisco lodging
      (txn-005 at $312) are likely candidates for non-compliance depending on current
      GSA rates. The agent should clearly state which transactions are compliant vs.
      non-compliant with specific dollar comparisons.

      3. REPORT SUBMISSION QUALITY (0-1): Did the agent submit an expense report containing
      only the transactions it determined to be compliant, with a correct total amount
      that matches the sum of included transactions? Did the report title reflect
      the compliance audit purpose?

      Score 1.0 if all three dimensions are fully addressed with specific amounts
      and transaction IDs cited. Score 0.7 if two dimensions are well-addressed. Score
      0.4 if only one dimension is addressed or analysis is vague. Score 0.0 if no
      meaningful compliance analysis is performed.

      '
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.4
