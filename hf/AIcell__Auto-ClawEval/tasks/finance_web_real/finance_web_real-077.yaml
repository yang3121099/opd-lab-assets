prompt: 'Our finance team needs to verify whether recent travel expenses comply with
  GSA (General Services Administration) per diem rates. Look up the current GSA per
  diem rates for the cities where our employees traveled, then review our travel transactions
  from the past month and identify any expenses that exceed federal guidelines. Summarize
  your findings and submit an expense report containing only the compliant transactions.

  '
reference_solution: "1. Call list_transactions with start_date 2024-11-01 and end_date\
  \ 2024-11-30 to retrieve\n   all seven travel transactions (txn-001 through txn-007).\n\
  \n2. Use web_fetch to retrieve the official GSA per diem rates page at\n   https://www.gsa.gov/travel/plan-book/per-diem-rates\
  \ for Washington DC, Chicago,\n   San Francisco, and Austin. Note the lodging and\
  \ M&IE limits for each city and month.\n\n3. Compare each transaction against the\
  \ applicable GSA rate:\n   - txn-001 (DC lodging $289): Compare against GSA DC lodging\
  \ rate\n   - txn-002 (DC meals $68): Compare against GSA DC M&IE rate\n   - txn-003\
  \ (Chicago lodging $195): Compare against GSA Chicago lodging rate\n   - txn-004\
  \ (Chicago meals $74): Compare against GSA Chicago M&IE rate\n   - txn-005 (SF lodging\
  \ $312): Compare against GSA SF lodging rate\n   - txn-006 (SF meals $79): Compare\
  \ against GSA SF M&IE rate\n   - txn-007 (Austin lodging $148): Compare against\
  \ GSA Austin lodging rate\n\n4. Identify which transactions are within GSA limits\
  \ (compliant) and which exceed them\n   (non-compliant). Summarize findings with\
  \ specific dollar amounts and rate comparisons.\n\n5. Call submit_report with a\
  \ title such as \"GSA Compliant Travel Expenses - November 2024\",\n   including\
  \ only the transaction IDs that are within GSA limits, and a total_amount equal\n\
  \   to the sum of those compliant transactions.\n\n6. Present a clear written summary\
  \ identifying compliant vs. non-compliant transactions,\n   the GSA rates used for\
  \ comparison, and the total amount of the submitted compliant report."
