- check:
    rubric: 'Evaluate the agent''s expense reconciliation output on three dimensions:

      1. ACCURACY OF TRANSACTION SELECTION (0.0–0.4): Did the agent correctly identify
      all five client_entertainment transactions (txn-1001: $342.50 at The Capital
      Grille, txn-1002: $187.00 at Nobu, txn-1004: $415.75 at STK Steakhouse, txn-1005:
      $64.20 at Blue Bottle Coffee, txn-1007: $278.90 at Bern''s Steak House) and
      exclude non-entertainment transactions (txn-1003 internal meals, txn-1006 office
      supplies)? Score 0.4 if all five included and non-entertainment excluded, 0.2
      if partial, 0.0 if major errors.

      2. TOTAL AMOUNT CORRECTNESS (0.0–0.3): Does the agent correctly compute or report
      the total of the five client entertainment transactions ($1,288.35)? Score 0.3
      if exact or within $1, 0.15 if close but off, 0.0 if missing or significantly
      wrong.

      3. IRS COMPLIANCE CONTEXT AND REPORT SUBMISSION (0.0–0.3): Did the agent reference
      the 50% IRS meal deductibility rule from a web source and confirm the report
      was submitted with the title "Q3 Client Entertainment Expenses"? Score 0.3 if
      both present with clear explanation, 0.15 if only one element present, 0.0 if
      neither addressed.

      '
    type: llm_judge
  name: report_quality
  weight: 0.35
