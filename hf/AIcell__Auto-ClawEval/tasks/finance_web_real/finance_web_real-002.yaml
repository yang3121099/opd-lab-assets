prompt: 'Our finance team needs to reconcile last quarter''s client entertainment
  expenses. Please look up each transaction individually to get the full details,
  then research the current IRS standard meal deductibility rate for business entertainment
  (50%) to confirm compliance, and finally submit a consolidated expense report titled
  "Q3 Client Entertainment Expenses" covering all client entertainment transactions.
  Include a summary of your findings in your response.

  '
reference_solution:
- Call list_transactions with start_date 2024-07-01 and end_date 2024-09-30 to get
  all Q3 transactions.
- Call get_transaction for each transaction ID (txn-1001 through txn-1007) to retrieve
  full details.
- Identify the five transactions with category client_entertainment: txn-1001, txn-1002,
    txn-1004, txn-1005, txn-1007.
- Compute the total amount for client entertainment transactions: 342.50 + 187.00
    + 415.75 + 64.20 + 278.90 = 1288.35.
- Use web_search to look up the IRS business meal deductibility rate and confirm the
  50% rule applies.
- Call submit_report with title "Q3 Client Entertainment Expenses", the five transaction
  IDs, and total_amount 1288.35.
- Summarize findings in the response, noting which transactions were included, the
  total, and the IRS 50% deductibility context.
