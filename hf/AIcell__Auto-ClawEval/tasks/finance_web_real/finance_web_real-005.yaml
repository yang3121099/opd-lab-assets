category: finance
claw_eval_id: T53_finance_us_steel_merger
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 299.0
      category: Software
      date: '2024-10-03'
      description: Monthly SaaS subscription
      id: txn-001
      status: approved
      vendor: Notion Labs
    - amount: 149.5
      category: Cloud Services
      date: '2024-10-07'
      description: Cloud storage plan
      id: txn-002
      status: approved
      vendor: Backblaze
    - amount: 312.0
      category: Meals
      date: '2024-10-11'
      description: Team lunch catering
      id: txn-003
      status: approved
      vendor: Panera Bread
    - amount: 55.0
      category: Software
      date: '2024-10-15'
      description: Design tool license
      id: txn-004
      status: approved
      vendor: Figma
    - amount: 430.75
      category: Cloud Services
      date: '2024-10-19'
      description: Compute instances
      id: txn-005
      status: approved
      vendor: Vultr
    - amount: 87.4
      category: Office Supplies
      date: '2024-10-22'
      description: Office supplies restock
      id: txn-006
      status: approved
      vendor: Staples
    - amount: 21.0
