  weight: 0.15
- check:
    action: web_notify
    field: channel
    service: web_real
    type: audit_field_equals
    value: finance-alerts
  name: notification_channel_correct
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-004
    - txn-007
    - travel
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.15
- check:
    keywords:
    - '2469.90'
    type: keywords_present
  name: correct_total_amount
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s overall performance on this task across three dimensions:

      1. TRANSACTION IDENTIFICATION (0.0–0.4): Did the agent correctly identify all
      6 travel transactions (txn-001: United Airlines $487.50, txn-002: Marriott $312.00,
      txn-004: Delta Airlines $623.00, txn-005: Uber $78.40, txn-007: American Airlines
      $541.00, txn-008: Hilton Hotels $428.00)? Score 0.4 if all 6 identified, 0.2
      if 4-5 identified, 0.1 if 2-3 identified, 0.0 if fewer than 2. Non-travel transactions
      (txn-003 meals, txn-006 supplies) should NOT be included.

      2. REPORT SUBMISSION (0.0–0.3): Was an expense report submitted with the correct
      total of $2,469.90 and a meaningful title referencing Q3 travel? Score 0.3 if
      title and total are correct, 0.15 if report was submitted but total or title
      is slightly off, 0.0 if no report submitted.

      3. NOTIFICATION QUALITY (0.0–0.3): Was the finance-alerts channel notified with
      a clear, informative summary that includes the report title, total amount ($2,469.90),
      and number of transactions (6)? Score 0.3 if all three elements present, 0.15
      if two elements present, 0.0 if notification missing or lacks key details.

      Final score = sum of dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.3
