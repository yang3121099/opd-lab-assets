scoring_components:
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: transactions_listed
  weight: 0.1
- check:
    action: web_search
    service: web_real
    type: audit_action_exists
  name: irs_mileage_researched
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: report_submitted
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Q4 Annual Conference Travel Expenses
  name: report_title_exact
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-002
    - txn-003
    - txn-005
    - txn-007
    type: keywords_present
  name: qualifying_transactions_identified
  weight: 0.2
- check:
    rubric: 'Evaluate the agent''s expense reconciliation output on three dimensions:

      1. CORRECT TRANSACTION SELECTION (0–0.4): The qualifying conference travel and
      lodging transactions are txn-001 (flight $487.50), txn-002 (taxi $42.00), txn-003
      (hotel $654.00), txn-005 (return flight $512.00), and txn-007 (Uber $38.50).
      The total of these five is $1,734.00. Non-qualifying transactions are txn-004
      (meals/entertainment), txn-006 (office supplies), and txn-008 (software). Score
      0.4 if all five qualifying transactions are correctly included and non-qualifying
      ones excluded, 0.2 if 3–4 are correct, 0.0 if fewer than 3.

      2. TOTAL AMOUNT ACCURACY (0–0.3): Score 0.3 if the submitted total is $1,734.00,
      0.15 if within $50 of correct, 0.0 if more than $50 off.

      3. IRS MILEAGE CONTEXT (0–0.3): Score 0.3 if the agent found and mentioned the
      2024 IRS standard mileage rate (67 cents per mile for 2024) and included it
      as relevant context in the report or output. Score 0.15 if the agent searched
      but only mentioned a rate without citing the year or source. Score 0.0 if no
      mileage rate was found or mentioned.

      '
    type: llm_judge
  name: correct_total_and_quality
  weight: 0.4
