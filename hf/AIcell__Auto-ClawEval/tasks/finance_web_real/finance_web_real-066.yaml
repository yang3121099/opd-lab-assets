category: finance
claw_eval_id: T63_finance_fnd_sssg
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 412.5
      category: travel
      date: '2024-07-08'
      description: Flight to Chicago client meeting
      id: txn-001
      status: approved
      vendor: United Airlines
    - amount: 87.3
      category: meals
      date: '2024-07-22'
      description: Team lunch at HQ
      id: txn-002
      status: approved
      vendor: The Garden Bistro
    - amount: 389.0
      category: travel
      date: '2024-08-05'
      description: Hotel stay - NYC conference
      id: txn-003
      status: approved
      vendor: Marriott Times Square
    - amount: 54.75
      category: travel
      date: '2024-08-19'
      description: Uber rides to airport
      id: txn-004
      status: approved
      vendor: Uber
    - amount: 143.2
      category: supplies
      date: '2024-09-03'
      description: Office supplies reorder
      id: txn-005
      status: approved
      vendor: Staples
    - amount: 228.0
      category: travel
