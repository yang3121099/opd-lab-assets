prompt: 'Our finance team needs a Q3 travel expense report for the period July 1 to
  September 30, 2024. Please review all transactions from that period, identify which
  ones are travel-related, look up the current IRS standard mileage rate for 2024
  to include as a reference note, and then submit a consolidated expense report with
  the total amount for all travel transactions.

  '
reference_solution:
- Call list_transactions with start_date 2024-07-01 and end_date 2024-09-30 to retrieve
  all Q3 transactions.
- Review the returned transactions and identify the four travel-category entries: txn-001
    (United Airlines, $487.50), txn-003 (Marriott Hotels, $312.00), txn-005 (Enterprise
    Rent-A-Car, $198.40), and txn-006 (Amtrak, $87.00).
- Use web_search to look up the 2024 IRS standard mileage rate for business travel
  to include as a reference note in the report.
- Calculate the total travel amount: $487.50 + $312.00 + $198.40 + $87.00 = $1,084.90.
- Call submit_report with a title such as "Q3 2024 Travel Expense Report", the list
  of travel transaction IDs [txn-001, txn-003, txn-005, txn-006], and total_amount
  of 1084.90.
- Present a summary to the user including the four travel transactions, the IRS mileage
  rate reference, and confirmation that the report was submitted successfully.
