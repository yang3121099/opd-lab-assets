- check:
    rubric: "Evaluate the agent's expense report output on three dimensions:\n1. ACCURACY\
      \ (0.0-0.4): Did the agent correctly identify all four travel transactions\n\
      \   (txn-001: United Airlines $487.50, txn-003: Marriott Hotels $312.00,\n \
      \  txn-005: Enterprise Rent-A-Car $198.40, txn-006: Amtrak $87.00) and exclude\n\
      \   non-travel transactions (txn-002 office supplies, txn-004 meals, txn-007\
      \ software)?\n   Award 0.4 if all four travel transactions are correctly included\
      \ and non-travel excluded,\n   0.2 if partially correct, 0.0 if major errors.\n\
      \n2. IRS MILEAGE REFERENCE (0.0-0.3): Did the agent successfully look up and\
      \ include a\n   reference to the 2024 IRS standard mileage rate in the report\
      \ or output?\n   Award 0.3 if a specific rate is cited with source context,\
      \ 0.15 if mentioned vaguely,\n   0.0 if absent.\n\n3. REPORT CLARITY (0.0-0.3):\
      \ Is the submitted report well-structured with a clear title\n   referencing\
      \ Q3 2024 travel, correct total of $1,084.90, and a professional summary?\n\
      \   Award 0.3 if all elements are present and clearly communicated, 0.15 if\
      \ partially,\n   0.0 if poorly structured or missing key elements.\n\nFinal\
      \ score = sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.25
