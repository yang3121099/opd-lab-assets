  name: report_submitted
  weight: 0.15
- check:
    keywords:
    - txn-001
    - txn-002
    - txn-005
    - txn-007
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.15
- check:
    keywords:
    - per diem
    - IRS
    type: keywords_present
  name: per_diem_context_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s expense report compilation and compliance summary
      on three dimensions:

      1. TRANSACTION SELECTION (0.0–0.4): Did the agent correctly identify travel-related
      transactions? The travel transactions are txn-001 (United Airlines $387.50),
      txn-002 (Marriott $189.00), txn-003 (RPM Steak $142.80), txn-004 (meals $38.50),
      txn-005 (Uber $54.20), and txn-007 (United Airlines $412.00). Transaction txn-006
      (office supplies $23.15) is debatable but not a travel expense. Award 0.4 if
      the agent includes the core travel transactions and provides a reasonable rationale
      for any exclusions, 0.2 if major travel transactions are missing without explanation,
      0.0 if selection is arbitrary or unexplained.

      2. PER DIEM COMPLIANCE ANALYSIS (0.0–0.4): Did the agent look up IRS per diem
      rates and apply them meaningfully? Award 0.4 if the agent references specific
      IRS per diem figures for Chicago (or a general CONUS rate) and compares the
      meal expenses (txn-003 $142.80 and txn-004 $38.50) and lodging (txn-002 $189.00)
      against those rates with a clear compliance verdict. Award 0.2 if per diem rates
      are mentioned but not applied to specific transactions. Award 0.0 if no per
      diem analysis is present.

      3. SUMMARY CLARITY (0.0–0.2): Is the final compliance summary clear, professional,
      and actionable? Award 0.2 if the summary states total amount, flags any over-limit
      items, and gives a clear recommendation. Award 0.1 if partially complete. Award
      0.0 if absent or incoherent.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: compliance_and_report_quality
  weight: 0.4
