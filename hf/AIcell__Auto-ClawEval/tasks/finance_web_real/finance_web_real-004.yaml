prompt: 'I need you to review my recent travel-related transactions from the past
  month and compile an expense report for our finance team. Before submitting, look
  up the current IRS per diem rates for business travel to verify whether my meal
  and lodging expenses are within acceptable limits, then submit the report with all
  qualifying travel transactions and provide a brief compliance summary.

  '
reference_solution: "1. Call list_transactions with start_date 2024-11-01 and end_date\
  \ 2024-11-30 to retrieve all\n   transactions for the period.\n2. Review the returned\
  \ transactions and identify travel-related ones: txn-001 (flight $387.50),\n   txn-002\
  \ (hotel $189.00), txn-003 (client dinner $142.80), txn-004 (meals $38.50),\n  \
  \ txn-005 (Uber $54.20), txn-007 (return flight $412.00). Note txn-006 is office\
  \ supplies,\n   not a travel expense.\n3. Use web_search to look up current IRS\
  \ per diem rates for Chicago, Illinois business travel,\n   searching for terms\
  \ like \"IRS per diem rates 2024 Chicago\" or \"GSA per diem Chicago\".\n4. Optionally\
  \ use web_fetch to retrieve the GSA or IRS per diem page for exact figures. 5. Compare\
  \ meal expenses (txn-003 $142.80 for a client dinner and txn-004 $38.50) and lodging\n\
  \   (txn-002 $189.00) against the retrieved per diem rates. Note whether any items\
  \ exceed limits\n   and whether the client dinner may require additional justification.\n\
  6. Calculate the total for the selected travel transactions (approximately $1,224.00\
  \ excluding\n   txn-006).\n7. Call submit_report with a descriptive title such as\
  \ \"Chicago Business Travel - November 2024\",\n   the list of qualifying transaction\
  \ IDs, and the computed total amount.\n8. Provide a written compliance summary noting\
  \ which expenses are within per diem limits, which\n   may exceed them (e.g., the\
  \ client dinner), and any recommended documentation."
