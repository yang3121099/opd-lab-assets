  name: submit_report
  service: finance
- description: Search the web for information
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Send a notification to a channel with a message and recipients
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web_real
