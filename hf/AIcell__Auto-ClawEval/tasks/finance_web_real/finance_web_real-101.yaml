    field: title
    service: finance
    type: audit_field_equals
    value: January 2025 Travel Reimbursements
  name: correct_report_title
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-002
    - txn-004
    - txn-006
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.15
- check:
