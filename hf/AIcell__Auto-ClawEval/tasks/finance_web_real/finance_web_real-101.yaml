    - '330.05'
    type: keywords_present
  name: correct_total_amount
  weight: 0.1
- check:
    keywords:
    - mileage
    - cents
    type: keywords_present
  name: irs_mileage_rate_mentioned
  weight: 0.1
- check:
    rubric: "Evaluate the agent's expense report submission and summary on the following\
      \ dimensions:\n1. IRS Mileage Rate Research (0.0–1.0): Did the agent successfully\
      \ fetch content from irs.gov\n   or an authoritative source and report a specific\
      \ IRS standard mileage rate (e.g., 70 cents\n   per mile for 2025 or the most\
      \ current published rate)? Score 1.0 if a specific rate with\n   units is cited,\
      \ 0.5 if mileage is mentioned without a specific rate, 0.0 if absent.\n\n2.\
      \ Correct Transaction Selection (0.0–1.0): Did the agent include ONLY the four\
      \ Travel-category\n   transactions (txn-001: $87.50, txn-002: $134.20, txn-004:\
      \ $62.75, txn-006: $45.60) and\n   exclude non-travel transactions (txn-003\
      \ Meals, txn-005 Office Supplies, txn-007 Software)?\n   Score 1.0 if all four\
      \ included and none excluded incorrectly, 0.5 if partially correct,\n   0.0\
      \ if wrong transactions selected.\n\n3. Total Amount Accuracy (0.0–1.0): Is\
      \ the reported total $330.05 (87.50 + 134.20 + 62.75 + 45.60)?\n   Score 1.0\
      \ if correct, 0.0 if wrong.\n\n4. Summary Clarity (0.0–1.0): Is the agent's\
      \ output clear, professional, and does it connect\n   the IRS mileage rate context\
      \ to the reimbursement transactions? Score 1.0 for clear and\n   well-structured,\
      \ 0.5 for adequate, 0.0 for confusing or incomplete.\n\nFinal score: average\
      \ of the four dimensions.\n"
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.2
task_id: finance_web_real-101
