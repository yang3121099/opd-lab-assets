scoring_components:
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: transactions_retrieved
  weight: 0.1
- check:
    action: web_search
    service: web_real
    type: audit_action_exists
  name: irs_per_diem_researched
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: report_submitted
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Chicago Conference Travel - October 2024
  name: report_title_exact
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-002
    - txn-003
    - txn-006
    - txn-008
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.2
- check:
    keywords:
    - txn-004
    - txn-007
    type: keywords_present
  name: non_travel_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s expense reconciliation report on three dimensions:

      1. TRANSACTION CLASSIFICATION (0.0-0.4): Did the agent correctly identify travel-related
      transactions (txn-001 lodging $289.00, txn-002 meals $187.50, txn-003 transportation
      $52.00, txn-006 transportation $96.00, txn-008 meals $41.75) and correctly exclude
      non-travel items (txn-004 conference registration $450.00 may be debatable,
      txn-007 office supplies $63.40 should definitely be excluded)? Award 0.4 if
      lodging/transport/meals are correctly separated from office supplies; 0.2 if
      partial; 0.0 if no classification attempted.

      2. PER DIEM ANALYSIS (0.0-0.4): Did the agent look up the IRS per diem rate
      for Chicago and apply it to evaluate meal expenses? The team dinner at Gibsons
      (txn-002, $187.50) is notably high and likely exceeds per diem limits. Award
      0.4 if the agent cites a specific per diem figure, compares it to actual meal
      expenses, and flags txn-002 as a potential policy concern; 0.2 if per diem is
      mentioned but not applied to specific transactions; 0.0 if no per diem analysis
      is present.

      3. REPORT SUMMARY QUALITY (0.0-0.2): Is the final summary clear, professional,
      and actionable? Does it include the total amount submitted, identify policy
      concerns, and provide a recommendation? Award 0.2 for a complete professional
      summary; 0.1 for partial; 0.0 for missing.

      Total score = sum of three dimensions (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_analysis
  weight: 0.3
task_id: finance_web_real-049
