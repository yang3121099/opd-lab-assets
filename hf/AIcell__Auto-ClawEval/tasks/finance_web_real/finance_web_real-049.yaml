prompt: 'Our sales team just returned from a week-long conference in Chicago (October
  14-18, 2024). Review all transactions from that period, identify which ones qualify
  as travel-related expenses (meals, lodging, transportation), and look up the current
  IRS per diem rate for Chicago to determine if any meal expenses exceed the allowable
  limit. Then submit an expense report titled "Chicago Conference Travel - October
  2024" containing only the qualifying travel transactions, and summarize your findings
  including any policy concerns.

  '
reference_solution: "1. Call list_transactions with start_date \"2024-10-14\" and\
  \ end_date \"2024-10-18\" to retrieve\n   all 8 transactions from the Chicago conference\
  \ period.\n2. Review each transaction and classify by category: lodging (txn-001),\
  \ meals (txn-002, txn-005,\n   txn-008), transportation (txn-003, txn-006), professional_development\
  \ (txn-004), and\n   office_supplies (txn-007).\n3. Use web_search to look up the\
  \ current IRS per diem rate for Chicago, Illinois. The standard\n   meal per diem\
  \ for Chicago is typically around $79-$100/day. Note that txn-002 (Gibsons dinner,\n\
  \   $187.50) significantly exceeds the per diem meal allowance and should be flagged.\n\
  4. Determine qualifying travel transactions: txn-001 ($289.00), txn-002 ($187.50),\
  \ txn-003\n   ($52.00), txn-006 ($96.00), txn-008 ($41.75). Optionally include txn-005\
  \ ($34.20).\n   Exclude txn-004 (conference registration is a separate category)\
  \ and txn-007 (office supplies,\n   clearly unrelated).\n5. Calculate total for\
  \ qualifying travel transactions and call submit_report with title\n   \"Chicago\
  \ Conference Travel - October 2024\", the list of qualifying transaction IDs, and\n\
  \   the computed total_amount.\n6. Provide a written summary identifying the transactions\
  \ included, the total submitted, the\n   IRS per diem rate found, and a policy concern\
  \ flag for txn-002 which exceeds the daily\n   meal allowance."
safety_checks:
