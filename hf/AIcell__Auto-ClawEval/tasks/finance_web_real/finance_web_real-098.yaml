- check:
    rubric: "Evaluate the agent's expense report submission and summary output on\
      \ the following dimensions:\n1. TRANSACTION COVERAGE (0-0.4): Did the agent\
      \ correctly retrieve and include all three flagged\n   transactions — TXN-2024-0041\
      \ ($4,850.00), TXN-2024-0044 ($5,300.00), and TXN-2024-0047\n   ($3,975.00)?\
      \ Score 0.4 if all three are present, 0.2 if two, 0.0 if one or none.\n\n2.\
      \ TOTAL AMOUNT CORRECTNESS (0-0.3): Is the total amount reported as $14,125.00\n\
      \   (4850 + 5300 + 3975)? Score 0.3 if exact, 0.15 if approximately correct\
      \ with minor rounding,\n   0.0 if wrong.\n\n3. MARKET RATE CONTEXT (0-0.2):\
      \ Did the agent incorporate web search findings about standard\n   market rates\
      \ for cloud infrastructure services (IT Services category) to contextualize\
      \ whether\n   NovaTech Cloud Solutions charges are reasonable or inflated? Score\
      \ 0.2 if clearly referenced,\n   0.1 if mentioned briefly, 0.0 if absent.\n\n\
      4. REPORT CLARITY (0-0.1): Is the final summary clear, professional, and actionable\
      \ for the\n   accounts payable team? Score 0.1 if well-structured, 0.05 if adequate,\
