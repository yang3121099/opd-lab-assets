prompt: 'Our accounts payable team has flagged three specific transactions for a vendor
  dispute review: TXN-2024-0041, TXN-2024-0044, and TXN-2024-0047. Please retrieve
  the details of each transaction, then search the web to verify the current standard
  market rate for the vendor category involved, and finally compile and submit a formal
  expense report titled "Vendor Dispute Review Q4-2024" summarizing only these three
  transactions with their total combined amount.

  '
reference_solution: "1. Call get_transaction with transaction_id \"TXN-2024-0041\"\
  \ to retrieve details:\n   vendor NovaTech Cloud Solutions, $4,850.00, IT Services,\
  \ flagged.\n2. Call get_transaction with transaction_id \"TXN-2024-0044\" to retrieve\
  \ details:\n   vendor NovaTech Cloud Solutions, $5,300.00, IT Services, flagged.\n\
  3. Call get_transaction with transaction_id \"TXN-2024-0047\" to retrieve details:\n\
  \   vendor NovaTech Cloud Solutions, $3,975.00, IT Services, flagged.\n4. Call web_search\
  \ with a query such as \"average cloud infrastructure services monthly cost small\n\
  \   business 2024\" to find market rate benchmarks for IT/cloud services.\n5. Optionally\
  \ call web_fetch on a relevant result URL for more detailed pricing data. 6. Calculate\
  \ the total: 4850.00 + 5300.00 + 3975.00 = 14125.00. 7. Call submit_report with\
  \ title \"Vendor Dispute Review Q4-2024\", transactions\n   [\"TXN-2024-0041\",\
  \ \"TXN-2024-0044\", \"TXN-2024-0047\"], and total_amount 14125.00.\n8. Provide\
  \ a written summary to the user noting the three flagged transactions, the total\
  \ of $14,125.00,\n   the vendor NovaTech Cloud Solutions, and how the charges compare\
  \ to market rates found via web search."
