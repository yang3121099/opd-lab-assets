prompt: 'Our Q3 travel expenses need to be wrapped up. Please review all transactions
  from July 1 to September 30, 2024, identify the travel-related ones, and submit
  a consolidated expense report titled "Q3 Travel Expenses 2024" with the correct
  total. Once the report is submitted, notify the #finance-team channel with a summary
  message so the team knows the report is ready for review — include the report title
  and total amount in the notification.

  '
reference_solution: "1. Call list_transactions with start_date=\"2024-07-01\" and\
  \ end_date=\"2024-09-30\" to retrieve all Q3 transactions. 2. Review the returned\
  \ transactions and filter for category=travel: txn-001 ($487.50), txn-002 ($612.00),\n\
  \   txn-004 ($319.00), txn-005 ($87.40), txn-007 ($274.00), txn-008 ($398.00). Exclude\
  \ txn-003 (meals)\n   and txn-006 (supplies).\n3. Calculate the total: $487.50 +\
  \ $612.00 + $319.00 + $87.40 + $274.00 + $398.00 = $2,177.90. 4. Call submit_report\
  \ with title=\"Q3 Travel Expenses 2024\", transactions=[txn-001, txn-002, txn-004,\n\
  \   txn-005, txn-007, txn-008], and total_amount=2177.90.\n5. Call web_notify with\
  \ channel=\"#finance-team\", message summarizing that the Q3 Travel Expenses 2024\n\
  \   report totaling $2,177.90 has been submitted and is ready for review, and appropriate\
  \ recipients.\n6. Report back to the user confirming the report was submitted and\
  \ the team was notified, including\n   the report title, total amount, and the transactions\
  \ included."
