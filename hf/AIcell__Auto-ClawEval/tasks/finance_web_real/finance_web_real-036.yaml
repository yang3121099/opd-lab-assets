- check:
    rubric: 'Evaluate the agent''s output on three dimensions:

      1. TRANSACTION IDENTIFICATION (0.0–0.4): Did the agent correctly identify all
      6 travel transactions (txn-001: $487.50, txn-002: $612.00, txn-004: $319.00,
      txn-005: $87.40, txn-007: $274.00, txn-008: $398.00) and exclude non-travel
      transactions (txn-003 meals $134.75, txn-006 supplies $56.20)? Score 0.4 if
      all 6 included and non-travel excluded, 0.2 if minor errors, 0.0 if major omissions.

      2. TOTAL ACCURACY (0.0–0.3): Is the reported total $2,177.90 (sum of the 6 travel
      transactions)? Score 0.3 if exact or within $0.01, 0.15 if within $10, 0.0 if
      significantly wrong.

      3. NOTIFICATION QUALITY (0.0–0.3): Does the agent''s summary confirm the notification
      was sent to #finance-team with the report title "Q3 Travel Expenses 2024" and
      the total amount clearly stated? Score 0.3 if both title and amount are present
      in the notification summary, 0.15 if only one, 0.0 if neither.

      Final score: sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.2
