  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with selected transactions and total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
- description: Search the web for information
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Fetch a web page by URL
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web_real
