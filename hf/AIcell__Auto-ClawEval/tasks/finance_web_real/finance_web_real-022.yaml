- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. Per Diem Research (0.0–1.0): Did the agent successfully look up IRS per diem
      rates for San Francisco and report a specific rate? The current GSA/IRS per
      diem for San Francisco is notably high (lodging typically $200–$300+/night,
      M&IE $79–$100+/day). Score 1.0 if a specific dollar figure is cited with source
      context, 0.5 if rates are mentioned vaguely without figures, 0.0 if no per diem
      research is reported.

      2. Expense Categorization Accuracy (0.0–1.0): Did the agent correctly include
      travel-related transactions (txn-001 United Airlines $487.50, txn-002 Marriott
      $892.00, txn-003 Uber $54.30, txn-004 Bix Restaurant $213.75, txn-006 meals
      $48.90, txn-007 Uber $61.20) and correctly EXCLUDE non-travel items (txn-005
      Staples office supplies $67.40, txn-008 Amazon personal $129.99)? Score 1.0
      if all 6 travel transactions included and 2 non-travel excluded, 0.5 if minor
      errors, 0.0 if major misclassification.

      3. Report Completeness and Reasoning (0.0–1.0): Does the agent explain the per
      diem comparison (e.g., noting whether the Marriott rate or meal expenses are
      within policy), state the correct total for travel transactions ($1,757.65),
      and provide a clear summary suitable for a finance team? Score 1.0 for complete
      explanation with total and policy commentary, 0.5 for partial explanation, 0.0
      for minimal output.

      Final score = average of the three dimension scores.

      '
    type: llm_judge
  name: per_diem_and_report_quality
  weight: 0.35
