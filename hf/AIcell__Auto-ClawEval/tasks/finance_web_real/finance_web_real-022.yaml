prompt: 'I just returned from a business trip to San Francisco and need to submit
  an expense report for reimbursement. Please look up the current IRS per diem rates
  for San Francisco so we can verify my meal and lodging expenses are within policy,
  then review my recent transactions from the past two weeks, identify which ones
  are travel-related, and submit a properly titled expense report with those transactions
  and the correct total.

  '
reference_solution: "1. Use web_search to look up \"IRS GSA per diem rates San Francisco\
  \ 2024\" to find current\n   lodging and M&IE (meals and incidental expenses) per\
  \ diem rates for San Francisco, CA.\n2. Optionally use web_fetch to retrieve the\
  \ official GSA per diem page for detailed rate breakdowns. 3. Use list_transactions\
  \ with start_date \"2024-10-25\" and end_date \"2024-11-08\" (or similar\n   two-week\
  \ window) to retrieve all recent transactions.\n4. Review the returned transactions\
  \ and identify the 6 travel-related ones:\n   txn-001 (United Airlines, $487.50),\
  \ txn-002 (Marriott, $892.00), txn-003 (Uber to hotel, $54.30),\n   txn-004 (Bix\
  \ Restaurant dinner, $213.75), txn-006 (meals day 2, $48.90), txn-007 (Uber to SFO,\
  \ $61.20).\n5. Exclude txn-005 (Staples office supplies, $67.40) and txn-008 (Amazon\
  \ personal, $129.99)\n   as non-travel expenses.\n6. Calculate the total: $487.50\
  \ + $892.00 + $54.30 + $213.75 + $48.90 + $61.20 = $1,757.65. 7. Compare lodging\
  \ ($892 / 3 nights = ~$297/night) and meal expenses against the per diem rates\n\
  \   found in step 1, noting whether they are within or exceed policy limits.\n8.\
  \ Use submit_report with title \"San Francisco Business Trip - November 2024\",\
  \ the 6 travel\n   transaction IDs, and total_amount 1757.65.\n9. Report back to\
  \ the user with the per diem rates found, the list of included/excluded transactions,\n\
  \   the policy compliance assessment, and confirmation that the report was submitted."
