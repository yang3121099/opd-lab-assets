- check:
    rubric: 'Evaluate the agent''s overall performance on this expense reporting and
      notification task. Score across three dimensions:

      1. CORRECT TRANSACTION SELECTION (0.0–0.4): Did the agent correctly identify
      the four transactions over $500 — txn-001 ($1,240.00, AWS), txn-003 ($840.00,
      Figma), txn-005 ($1,500.00, FinTech Summit), txn-006 ($2,200.00, Bright UX Studio)
      — and exclude the three under $500 (txn-002, txn-004, txn-007)? Award 0.4 if
      all four are correctly included and none of the sub-$500 transactions are included.
      Award 0.2 if three of four are correct. Award 0.0 if fewer than three are correct.

      2. REPORT SUBMISSION ACCURACY (0.0–0.3): Was the expense report submitted with
      the correct total of $5,780.00 and a meaningful title referencing Q3 2024? Award
      0.3 if both total and title are correct, 0.15 if only one is correct, 0.0 if
      neither.

      3. NOTIFICATION QUALITY (0.0–0.3): Was the finance-team channel notification
      informative and professional? It should include the report title or reference
      to Q3, the total amount ($5,780.00), and the count of transactions (4). Award
      0.3 if all three elements are present, 0.15 if two are present, 0.0 if fewer
      than two are present.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_notification_completeness
  weight: 0.2
