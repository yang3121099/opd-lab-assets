prompt: 'Our Q3 expense review is wrapping up. Please pull together all transactions
  from July through September 2024, identify any that are over $500, and submit an
  expense report for those high-value items. Once the report is submitted, notify
  the finance-team channel with a summary of the report including the total amount
  and the number of transactions included. Look up the correct internal Slack channel
  format for expense report notifications if you''re unsure of the standard message
  structure.

  '
reference_solution: "1. Call list_transactions with start_date=2024-07-01 and end_date=2024-09-30\
  \ to retrieve all Q3 transactions. 2. Review the results and identify transactions\
  \ with amount > 500: txn-001 ($1,240.00), txn-003 ($840.00),\n   txn-005 ($1,500.00),\
  \ txn-006 ($2,200.00). Calculate the total: $5,780.00.\n3. Use web_search to look\
  \ up standard expense report notification formats or Slack channel naming conventions\n\
  \   for finance teams to determine appropriate message structure.\n4. Call submit_report\
  \ with a title like \"Q3 2024 High-Value Expense Report\", the four transaction\
  \ IDs,\n   and total_amount=5780.00.\n5. Call web_notify targeting the \"finance-team\"\
  \ channel with a message summarizing the submitted report:\n   title, total amount\
  \ ($5,780.00), number of transactions (4), and a brief description of the categories\n\
  \   covered. Include relevant finance team members as recipients.\n6. Provide a\
  \ text summary to the user confirming the report was submitted and the notification\
  \ was sent,\n   listing the included transactions and total."
