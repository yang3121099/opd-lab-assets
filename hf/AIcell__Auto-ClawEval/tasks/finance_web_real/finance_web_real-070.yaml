category: finance
claw_eval_id: T63_finance_fnd_sssg
difficulty: medium
fixtures:
  finance:
    transactions:
    - amount: 487.5
      category: travel
      date: '2024-10-14'
      description: United Airlines SFO flight
      id: txn-1041
      status: approved
      vendor: United Airlines
    - amount: 289.0
      category: lodging
      date: '2024-10-14'
      description: Hotel Nikko San Francisco - check-in
      id: txn-1042
      status: approved
      vendor: Hotel Nikko San Francisco
    - amount: 143.75
      category: meals
      date: '2024-10-15'
      description: Client dinner at Bix Restaurant
      id: txn-1043
      status: pending
      vendor: Bix Restaurant
    - amount: 289.0
      category: lodging
      date: '2024-10-15'
      description: Hotel Nikko San Francisco - night 2
      id: txn-1044
      status: approved
      vendor: Hotel Nikko San Francisco
    - amount: 67.2
      category: meals
      date: '2024-10-16'
      description: Breakfast and lunch - Salesforce conference
      id: txn-1045
      status: approved
      vendor: Salesforce Conference Center
    - amount: 289.0
      category: lodging
      date: '2024-10-17'
      description: Hotel Nikko San Francisco - night 3
      id: txn-1046
      status: approved
      vendor: Hotel Nikko San Francisco
    - amount: 412.0
