  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with a title, list of transaction IDs, and
    total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
- description: Search the web for current information
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Fetch a web page for detailed information
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web_real
- description: Send a notification to a channel or recipients
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web_real
