  method: POST
  name: get_note
  service: notes
- description: Share a note with specified recipients by note_id
  endpoint: /notes/share
  method: POST
  name: share_note
  service: notes
- description: List all integrations, optionally filtered by status
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full integration details including secrets
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Get a helpdesk ticket by ticket_id
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: List helpdesk tickets by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Send an email to specified recipients
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Send an internal platform notification
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
