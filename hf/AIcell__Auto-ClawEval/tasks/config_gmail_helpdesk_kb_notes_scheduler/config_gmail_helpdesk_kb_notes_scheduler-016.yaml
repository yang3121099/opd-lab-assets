      category: security
      content: 'Immediate steps: 1) Revoke exposed key immediately. 2) Audit access
        logs for unauthorized usage. 3) Rotate to new key within 2 hours. 4) File
        incident report with security team. 5) Review and update secret scanning policies.'
      id: kb-502
      last_updated: '2024-11-01'
      title: Incident Response for Exposed Credentials
