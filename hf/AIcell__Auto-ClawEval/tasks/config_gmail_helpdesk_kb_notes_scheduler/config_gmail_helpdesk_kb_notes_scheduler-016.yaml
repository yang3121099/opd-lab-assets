    tickets:
    - category: security
      created_at: '2024-11-28'
      created_by: Priya Nair
      description: IAM policy review flagged AWS S3 key AKIA_aws_key_005 as over-permissioned.
        Key must be rotated and replaced with least-privilege key. Assigned to DevOps.
