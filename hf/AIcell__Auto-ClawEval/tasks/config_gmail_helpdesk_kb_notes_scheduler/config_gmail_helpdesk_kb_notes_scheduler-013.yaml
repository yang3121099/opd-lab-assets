  method: POST
  name: get_kb_article
  service: kb
- description: List integrations from the config store, optionally filtered by status
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full integration details including API keys and secrets
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Update an integration's status or notes
  endpoint: /config/integrations/update
  method: POST
  name: update_integration
  service: config
- description: Send a notification via the config service
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
- description: List helpdesk tickets filtered by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get details of a specific helpdesk ticket
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: List emails in the Gmail inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
