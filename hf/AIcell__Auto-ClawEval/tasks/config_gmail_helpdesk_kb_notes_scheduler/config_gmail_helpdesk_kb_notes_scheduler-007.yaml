tools:
- description: List all integrations, optionally filtered by status
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full details of an integration including API key and secret
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: List helpdesk tickets, optionally filtered by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get details of a specific helpdesk ticket
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Search knowledge base articles by query or category
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Get the full content of a knowledge base article
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Send an email notification
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Update a helpdesk ticket's priority, tags, or category
  endpoint: /helpdesk/tickets/update
  method: POST
  name: update_ticket
  service: helpdesk
