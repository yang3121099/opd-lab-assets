prompt: 'A security alert came in about suspicious activity on our Stripe payment
  integration. Check the helpdesk for the relevant ticket, review the Stripe integration
  details, disable the integration and add a security note to it, then notify the
  security team via email. Finally, search the knowledge base for our incident response
  procedure and share the relevant KB article link in your summary report.

  '
reference_solution:
- action: Call list_inbox or get_message to review the WAF alert emails (msg-801,
    msg-802) confirming the Stripe compromise.
  step: 1
- action: Call list_tickets or get_ticket with ticket_id tkt-201 to read the full
    security incident description including the unauthorized IP addresses and time
    window.
  step: 2
- action: Call list_integrations to identify the Stripe integration, then call get_integration
    with integration_id intg-001 to confirm its current active status.
  step: 3
- action: Call update_integration with integration_id intg-001, status inactive, and
    notes documenting the reason (e.g., disabled due to suspected key compromise per
    tkt-201, unauthorized access detected 2024-06-10 02:00-04:00 UTC).
  step: 4
- action: Call search_articles with query 'integration security incident response'
    and category 'security' to find kb-501, then call get_kb_article with article_id
    kb-501 to retrieve the full procedure.
  step: 5
- action: Call send_email to security@company.com with a subject and body summarizing
    the incident, the action taken (Stripe integration disabled), and recommending
    key rotation per kb-501.
  step: 6
- action: Optionally call list_jobs and update_job to disable the Stripe Reconciliation
    Report job (job-301) while the integration is inactive.
  step: 7
- action: 'Produce a written summary report covering: incident details from tkt-201,
    the disabling of intg-001, the security notification sent, the KB procedure referenced
    (kb-501), and recommended next steps (rotate Stripe API keys, re-enable after
    confirmation).'
  step: 8
