- check:
    rubric: 'Evaluate the agent''s final summary report on four dimensions:

      1. INCIDENT IDENTIFICATION (0-0.25): Does the agent correctly identify the security
      incident from ticket tkt-201 (Stripe API key compromise, unauthorized IPs, 02:00-04:00
      UTC 2024-06-10) and link it to integration intg-001?

      2. REMEDIATION ACTION (0-0.25): Does the agent confirm that integration intg-001
      (Stripe Payment Gateway) was set to inactive/disabled, and that a security note
      was added documenting the reason (referencing tkt-201 or the unauthorized IP
      activity)?

      3. NOTIFICATION AND PROCEDURE (0-0.25): Does the agent confirm an email was
      sent to the security team, and reference the KB article kb-501 (Integration
      Security Incident Response Procedure) or its key steps (disable, rotate keys,
      notify security)?

      4. COMPLETENESS AND CLARITY (0-0.25): Is the summary clear, actionable, and
      free of hallucinated details? Does it recommend next steps such as key rotation
      via the Stripe dashboard?

      Score 1.0 if all four dimensions are fully addressed, 0.75 if three, 0.5 if
      two, 0.25 if one, 0.0 if none.

      '
    type: llm_judge
  name: summary_quality
  weight: 0.25
