  method: POST
  name: list_jobs
  service: scheduler
- description: Get full details of a specific scheduled job by ID
  endpoint: /scheduler/jobs/get
  method: POST
  name: get_job
  service: scheduler
- description: List all integrations and their current status
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full details of an integration including API key and secret
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Update an integration's status or notes
  endpoint: /config/integrations/update
  method: POST
  name: update_integration
  service: config
- description: Send a notification via the config notification system
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
- description: List helpdesk tickets by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get details of a specific helpdesk ticket
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Send an email message
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
