- check:
    rubric: 'Evaluate the agent''s overall performance on this cross-service task.
      Score on four dimensions:

      1. KB Article Update (0-0.25): Did the agent update article kb-101 ("Stripe
      Integration Setup Guide") with meaningful content reflecting the credential
      rotation event (e.g., updated date 2024-01-15, reference to rotation, current
      endpoint https://api.stripe.com/v1)? Full credit if content is substantively
      improved and accurate; partial if updated but vague.

      2. Email Notification (0-0.25): Did the agent send an email to eng-lead@company.com
      summarizing what was updated (KB article kb-101), why (Stripe key rotation per
      security team on 2024-01-15), and referencing ticket tkt-301? Full credit if
      all three elements present; partial if one or two missing.

      3. Helpdesk Ticket Handling (0-0.25): Did the agent find ticket tkt-301 ("Stripe
      API Key Rotation - January 2024") and take appropriate action (update or close
      it with a resolution confirming KB update)? Full credit if ticket tkt-301 is
      specifically identified and acted upon; partial if only listed without action.

      4. Summary Quality (0-0.25): Is the agent''s final text output clear, professional,
      and complete — summarizing all actions taken across config, KB, email, and helpdesk
      services? Full credit for a well-structured summary covering all four services;
      partial for incomplete coverage.

      Total score = sum of four dimension scores (0.0 to 1.0).

      '
    type: llm_judge
  name: quality_and_completeness
  weight: 0.3
