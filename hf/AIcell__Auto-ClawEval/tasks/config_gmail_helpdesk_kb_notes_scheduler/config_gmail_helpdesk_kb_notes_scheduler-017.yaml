  name: consulted_kb_rotation_procedure
  weight: 0.1
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  name: sent_email_to_security_lead
  weight: 0.1
- check:
    action: create_job
    service: scheduler
    type: audit_action_exists
  name: created_scheduler_job
  weight: 0.1
- check:
    keywords:
    - stripe-payments
    - sendgrid-email
    type: keywords_present
  name: flagged_integrations_identified
  weight: 0.15
- check:
    keywords:
    - rotation
    - 48 hours
    type: keywords_present
  name: rotation_steps_included
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s final output on the following dimensions: 1. COMPLETENESS
      (0-0.4): Does the output identify both flagged integrations by name — stripe-payments
      (intg-003) and sendgrid-email (intg-005) — and mention that both are overdue
      for rotation? Does it include the rotation steps sourced from KB article kb-101
      (generate new key, update config store, test in staging, revoke old key within
      24 hours, update notes with date, notify security team)? 2. EMAIL ACCURACY (0-0.3):
      Does the output confirm an email was sent to security-lead@company.com containing
      the flagged integration names, their current statuses (both active), and the
      KB rotation procedure steps? 3. SCHEDULER JOB (0-0.2): Does the output confirm
      a weekly scheduler job was created (cron expression consistent with weekly frequency,
      e.g. "0 0 * * 0" or similar)? 4. CLARITY (0-0.1): Is the summary well-organized
      and actionable for the security team? Score 1.0 if all four dimensions are fully
      satisfied, 0.75 if three are satisfied, 0.5 if two, 0.25 if one, 0.0 if none.

      '
    type: llm_judge
  name: summary_quality
  weight: 0.25
