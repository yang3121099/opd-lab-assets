      content: 'Standard API Key Rotation Steps: 1. Generate a new API key in the
        provider''s dashboard. 2. Update the key in the config store using the update
        integration endpoint. 3. Test the new key in a staging environment before
        promoting to production. 4. Revoke the old key in the provider''s dashboard
        within 24 hours. 5. Update the integration notes field with the rotation date
        (format: YYYY-MM-DD). 6. Notify the security team upon completion. For high-risk
