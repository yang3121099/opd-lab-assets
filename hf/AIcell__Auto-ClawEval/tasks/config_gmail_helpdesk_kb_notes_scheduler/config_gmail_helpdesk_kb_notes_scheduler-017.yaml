prompt: 'A security review was recently completed and notes were taken during the
  meeting. Retrieve the security review meeting notes to identify which integrations
  were flagged for API key rotation. Then check the current status of those integrations
  in the config store, look up any relevant knowledge base articles about key rotation
  procedures, and send a summary email to the security team lead (security-lead@company.com)
  with the flagged integration names, their current statuses, and the recommended
  rotation steps from the KB. Finally, create a scheduler job to run the key rotation
  check weekly.

  '
reference_solution: '1. Call list_notes to discover available notes, then call get_note
  with note-001 (Q4 Security Review Meeting) to retrieve the flagged integration IDs:
  intg-003 (stripe-payments) and intg-005 (sendgrid-email). 2. Call get_integration
  for intg-003 and intg-005 to confirm their current status (both active) and review
  their notes indicating overdue rotation. 3. Call search_articles with query "API
  key rotation" or category "security", then call get_kb_article for kb-101 to retrieve
  the standard rotation procedure steps. 4. Call send_email to security-lead@company.com
  with a subject such as "API Key Rotation Required: stripe-payments and sendgrid-email"
  and a body summarizing the two flagged integrations, their statuses, and the 6-step
  rotation procedure from the KB article, noting the 48-hour deadline for high-risk
  integrations. 5. Call list_jobs to review existing scheduler jobs, then call create_job
  with a weekly cron expression (e.g., "0 0 * * 0"), a descriptive name like "Weekly
  API Key Rotation Check", and appropriate tags such as ["security", "api-keys"].
  6. Provide a final text summary confirming all actions taken, the flagged integrations,
  the email recipient, and the new scheduler job details.'
