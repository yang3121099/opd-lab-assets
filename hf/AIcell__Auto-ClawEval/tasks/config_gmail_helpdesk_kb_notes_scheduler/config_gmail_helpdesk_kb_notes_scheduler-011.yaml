prompt: 'A developer has filed a helpdesk ticket reporting that an API key for one
  of our third-party integrations may have been accidentally committed to a public
  GitHub repository. Investigate the incident: find the relevant helpdesk ticket,
  identify which integration is affected by checking the config store, update the
  helpdesk ticket with high priority and the ''security'' category to reflect the
  severity, then notify the security team via the internal notification system with
  the integration name and the exposed key details. Summarize your findings and actions
  taken.

  '
reference_solution: "1. Call list_tickets (helpdesk) to retrieve open tickets and\
  \ identify ticket-081 as the\n   API key leak report filed by dev.marcus@company.com.\n\
  2. Call get_ticket with ticket_id=ticket-081 to read the full description confirming\
  \ the\n   Stripe integration is mentioned.\n3. Call list_integrations (config) to\
  \ find the Stripe integration (intg-stripe-001). 4. Call get_integration with integration_id=intg-stripe-001\
  \ to retrieve the live API key\n   (sk_live_FAKE_0024_xxxxxx_xxxxxxx) and webhook\
  \ secret (whsec_8TgHnMkLpQrVwXyZaBcDeFgH).\n5. Call update_ticket with ticket_id=ticket-081,\
  \ priority=high, category=security to\n   escalate the incident appropriately.\n\
  6. Call config_notify to alert the security team, including the integration name,\
  \ the\n   exposed key value, and an urgent request to rotate credentials immediately.\n\
  7. Summarize findings: ticket-081 escalated to high/security; Stripe integration\n\
  \   intg-stripe-001 has a potentially exposed live key; security team notified."
