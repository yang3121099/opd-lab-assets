- check:
    rubric: "Evaluate the agent's response on the following dimensions:\n1. CORRECT\
      \ TICKET IDENTIFIED (0–0.25): Did the agent correctly identify ticket-081\n\
      \   (\"Possible API key leak in public GitHub repo\") as the relevant incident,\
      \ and not\n   confuse it with other tickets like ticket-082 or ticket-083?\n\
      \n2. CORRECT INTEGRATION IDENTIFIED (0–0.25): Did the agent correctly identify\n\
      \   intg-stripe-001 (Stripe Payment Gateway) as the affected integration, and\
      \ retrieve\n   its API key (sk_live_FAKE_0024_xxxxxx_xxxxxxx) and webhook secret?\n\
      \n3. TICKET ESCALATION QUALITY (0–0.25): Did the agent update ticket-081 to\
      \ high priority\n   and security category, and explain why this escalation was\
      \ appropriate given the\n   severity of a live key exposure?\n\n4. NOTIFICATION\
      \ COMPLETENESS (0–0.25): Did the agent send a notification to the security\n\
      \   team that includes the integration name (Stripe Payment Gateway), the exposed\
      \ key\n   reference, and a clear call to action (e.g., rotate the key immediately)?\n\
      \nScore 1.0 if all four dimensions are fully satisfied, 0.75 if three, 0.5 if\
      \ two, 0.25 if one, 0.0 if none.\n"
    type: llm_judge
  name: overall_quality
  weight: 0.25
