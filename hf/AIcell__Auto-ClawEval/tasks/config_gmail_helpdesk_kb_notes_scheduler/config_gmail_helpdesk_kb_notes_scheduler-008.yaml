- check:
    rubric: "Evaluate the quality and completeness of the agent's draft notification\
      \ emails and summary. Score on these dimensions:\n1. COVERAGE (0–0.3): Did the\
      \ agent draft emails for all four active flagged integrations\n   (intg-001\
      \ Salesforce/marcus.chen, intg-002 Stripe/priya.sharma, intg-004 Twilio/dev-team,\n\
      \   intg-005 Datadog/sre-team)? Full credit if all four owners are addressed;\
      \ partial if 2–3.\n\n2. CONTENT QUALITY (0–0.3): Do the drafts include: the\
      \ urgency of rotation, reference to\n   ticket tkt-441, reference to KB article\
      \ kb-201 policy steps (generate key, update config\n   store, verify health,\
      \ confirm in ticket), and the 5-business-day deadline?\n\n3. INACTIVE INTEGRATION\
      \ HANDLING (0–0.2): Does the agent correctly exclude intg-003\n   (SendGrid,\
      \ inactive/decommissioned) from the rotation notifications and explain why?\n\
      \n4. SUMMARY CLARITY (0–0.2): Is the agent's final summary clear, organized,\
      \ and actionable —\n   listing which drafts were created, for whom, and what\
      \ next steps are?\n\nScore 1.0 for excellent coverage of all four dimensions.\
      \ Score 0.7 if minor gaps. Score 0.4 if only 2 integrations covered or policy\
      \ details missing. Score 0.1 if drafts are superficial or key owners/ticket\
      \ references are absent.\n"
    type: llm_judge
  name: draft_quality_and_completeness
  weight: 0.2
