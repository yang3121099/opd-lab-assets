prompt: 'Our security team has flagged that several integrations are using API keys
  that need to be rotated urgently. Review the current integrations to identify which
  ones are active and have secrets configured, then check if there are any related
  helpdesk tickets or knowledge base articles about our key rotation policy. Finally,
  draft notification emails to the integration owners informing them of the required
  key rotation, referencing the relevant policy details and ticket numbers. Summarize
  your findings and the drafts you''ve prepared.

  '
reference_solution:
- action: Call list_integrations to retrieve all integrations and identify active
    ones.
  step: 1
- action: Call get_integration for each active integration (intg-001, intg-002, intg-004,
    intg-005) to retrieve owner details from the notes field. Note that intg-003 is
    inactive/decommissioned and should be excluded.
  step: 2
- action: Call list_tickets and then get_ticket for tkt-441 to understand the security
    finding — which integrations are flagged and the rotation deadline.
  step: 3
- action: Call search_articles with a query like 'API key rotation policy' and then
    get_kb_article for kb-201 to retrieve the official rotation procedure steps and
    the 5-business-day deadline.
  step: 4
- action: Call list_inbox and get_message for msg-901 to read the security team's
    coordination email, confirming the instruction to reference tkt-441 and kb-201
    in communications.
  step: 5
- action: 'Call create_draft four times — one for each active flagged integration
    owner (marcus.chen@company.com, priya.sharma@company.com, dev-team@company.com,
    sre-team@company.com). Each draft should: state the urgency, name their specific
    integration, reference ticket tkt-441, summarize the kb-201 rotation steps, and
    include the 5-business-day deadline. Use reply_to_message_id referencing msg-901
    where appropriate.'
  step: 6
- action: 'Provide a text summary listing: the four active integrations flagged, why
    intg-003 was excluded, the four drafts created with recipient addresses, and the
    key policy requirements referenced. Do NOT send emails directly — only save drafts
    for review.'
  step: 7
