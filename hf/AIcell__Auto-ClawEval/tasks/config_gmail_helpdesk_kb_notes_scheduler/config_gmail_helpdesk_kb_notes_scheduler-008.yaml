  name: list_integrations
  service: config
- description: Get full details of an integration including API key and secret
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: List helpdesk tickets, optionally filtered by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get full details of a helpdesk ticket
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Search knowledge base articles by query or category
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Get a specific knowledge base article by ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: List emails in the Gmail inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Get a single email message by ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Save a draft email (to, subject, body, reply_to_message_id)
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
- description: Send an email immediately (to, subject, body)
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
