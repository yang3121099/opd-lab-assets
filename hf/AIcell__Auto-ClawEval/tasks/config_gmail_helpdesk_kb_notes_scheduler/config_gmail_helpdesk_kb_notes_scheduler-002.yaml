tools:
- description: List all integrations, optionally filtered by status.
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full integration details including API key and secret for a specific
    integration.
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Update an integration's status or notes.
  endpoint: /config/integrations/update
  method: POST
  name: update_integration
  service: config
- description: Send a notification email via the config service.
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
- description: List helpdesk tickets, optionally filtered by status.
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get full details of a specific helpdesk ticket by ID.
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Search knowledge base articles by query or category.
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
