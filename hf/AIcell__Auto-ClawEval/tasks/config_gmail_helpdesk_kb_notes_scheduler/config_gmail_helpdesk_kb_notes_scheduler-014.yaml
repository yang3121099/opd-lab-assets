- check:
    rubric: 'Evaluate the agent''s final summary and notification on the following
      dimensions:

      1. COMPLETENESS (0-0.4): Does the output identify all three overdue integrations
      — Stripe Payment Gateway (intg-001, last rotated 2022-11-01), SendGrid Email
      Service (intg-002, last rotated 2023-03-15), and Datadog Monitoring (intg-005,
      last rotated 2022-08-20)? Does it note that Twilio (intg-003) was disabled due
      to a suspected key leak? Does it correctly identify Salesforce CRM (intg-004)
      as within policy?

      2. POLICY ALIGNMENT (0-0.3): Does the agent correctly apply the KB article kb-501
      rotation policy (12-month minimum, 18-month critical threshold)? Does it flag
      Stripe and Datadog as critically overdue (over 18 months) and SendGrid as overdue?

      3. TICKET CORRELATION (0-0.2): Does the agent connect open tickets tkt-101 (Stripe
      401 errors) and tkt-102 (Datadog alerts silent) to the corresponding overdue
      integrations?

      4. ACTIONABILITY (0-0.1): Does the output include clear recommended next steps
      such as immediate key rotation for critically overdue integrations and contacting
      security@company.com?

      Score 1.0 if all four dimensions are fully addressed, 0.75 if three are well-covered,
      0.5 if two are covered, 0.25 if only one is addressed, 0.0 if the output is
      missing or irrelevant.

      '
    type: llm_judge
  name: summary_quality
  weight: 0.25
