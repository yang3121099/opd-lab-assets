- description: List all integration configurations with optional status filter
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full integration details including API keys and secrets
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Search knowledge base articles by query and category
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Get a specific knowledge base article by ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Send a notification via the config service (to, subject, body)
