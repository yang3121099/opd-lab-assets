- check:
    rubric: "Evaluate the agent's final summary and notification on the following\
      \ dimensions:\n1. TICKET ACCURACY (0-0.25): Did the agent correctly identify\
      \ TKT-2041 as the source ticket,\n   noting that INT-101 (stripe-prod) and INT-102\
      \ (sendgrid-main) are flagged for stale API keys?\n\n2. INTEGRATION DETAILS\
      \ (0-0.25): Did the agent report relevant details about both flagged integrations,\n\
      \   including that stripe-prod was last rotated 2023-11-15 and sendgrid-main\
      \ on 2023-12-01,\n   and that both exceed the 180-day critical threshold?\n\n\
      3. POLICY ALIGNMENT (0-0.25): Did the agent reference the KB-501 rotation policy\
      \ (90-day requirement,\n   immediate action for 180+ day keys) and include actionable\
      \ next steps such as generating new keys,\n   updating config, verifying connectivity,\
      \ and revoking old keys?\n\n4. NOTIFICATION COMPLETENESS (0.25): Did the agent\
      \ send a notification to the security team\n   (security@company.com or similar)\
      \ with a clear, professional summary of findings and urgency?\n\nScore 1.0 if\
      \ all four dimensions are well-addressed, 0.75 if three, 0.5 if two, 0.25 if\
      \ one, 0.0 if none.\n"
    type: llm_judge
  name: summary_quality
  weight: 0.3
