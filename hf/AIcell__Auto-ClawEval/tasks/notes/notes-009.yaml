- check:
    keywords:
    - note-002 shared
    - note-004 shared
    - note-006 shared
    - shared note-002
    - shared note-004
    - shared note-006
    type: keywords_absent
  name: non_merger_notes_excluded
  weight: 0.1
- check:
    rubric: "Evaluate the agent's response on three dimensions:\n1. CORRECT NOTE IDENTIFICATION\
      \ (0–0.4): Did the agent correctly identify all three merger-related notes?\n\
      \   The correct notes are: note-001 (\"Post-Merger Integration Kickoff\"), note-003\
      \ (\"Finance Systems Integration Planning\"),\n   and note-005 (\"Legal Due\
      \ Diligence Review — Merger\"). Score 0.4 if all three identified, 0.2 if two,\
      \ 0.1 if one, 0.0 if none.\n   Non-merger notes (note-002, note-004, note-006)\
      \ should NOT have been shared.\n\n2. CORRECT RECIPIENTS PER NOTE (0–0.4): Did\
      \ the agent share each note with the correct attendees?\n   - note-001 recipients:\
      \ diana.chen@acmecorp.com, raj.patel@acmecorp.com, sofia.moreau@acmecorp.com,\
      \ tom.nguyen@acmecorp.com\n   - note-003 recipients: raj.patel@acmecorp.com,\
      \ diana.chen@acmecorp.com, helen.brooks@acmecorp.com, carlos.vega@acmecorp.com\n\
      \   - note-005 recipients: sofia.moreau@acmecorp.com, diana.chen@acmecorp.com,\
      \ tom.nguyen@acmecorp.com, anita.ross@acmecorp.com\n   Score 0.4 if all three\
      \ notes shared with complete and correct recipient lists, 0.25 if mostly correct\
      \ with minor omissions,\n   0.1 if significant omissions or wrong recipients\
      \ included, 0.0 if recipients are largely incorrect.\n\n3. SUMMARY CLARITY (0–0.2):\
      \ Is the agent's summary clear, well-organized, and informative?\n   Does it\
      \ explicitly state which notes were shared, with whom, and confirm the sharing\
      \ was completed?\n   Score 0.2 for a clear structured summary, 0.1 for a partial\
      \ or disorganized summary, 0.0 for no meaningful summary.\n\nFinal score = dimension\
      \ 1 + dimension 2 + dimension 3 (max 1.0).\n"
    type: llm_judge
  name: sharing_quality_and_completeness
  weight: 0.35
task_id: notes-009
task_name: Share Post-Merger Integration Meeting Notes with Stakeholders
tools:
- description: List available notes, optionally limiting the number of results returned.
  endpoint: /notes/list
  method: POST
  name: list_notes
  parameters:
  - name: max_results
    required: false
    type: integer
  service: notes
- description: Retrieve the full content and metadata of a specific note by its ID.
  endpoint: /notes/get
  method: POST
  name: get_note
  parameters:
  - name: note_id
    required: true
    type: string
  service: notes
- description: Share a note with one or more recipients by email address.
  endpoint: /notes/share
  method: POST
  name: share_note
  parameters:
  - name: note_id
    required: true
    type: string
  - items: string
    name: recipients
    required: true
    type: array
  service: notes
