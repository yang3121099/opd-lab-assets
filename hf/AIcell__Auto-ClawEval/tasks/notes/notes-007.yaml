category: productivity
claw_eval_id: T13zh_meeting_notes
difficulty: medium
fixtures:
  notes:
  - attendees:
    - alice.chen@company.com
    - bob.martinez@company.com
    - carol.white@company.com
    content: 'Team discussed velocity drop in Sprint 14. Action items: (1) Reduce
      WIP limit to 3 per developer, (2) Schedule daily 10-min sync for blockers. Decision:
      adopt pair programming for complex tickets. Attendees agreed to revisit in Sprint
      15 review.

      '
    date: '2024-11-04'
    id: note-001
    tags:
    - retrospective
    - sprint-14
    - action-items
    title: Sprint 14 Retrospective
  - attendees:
    - alice.chen@company.com
    - carol.white@company.com
    - evan.park@company.com
    content: 'Positive feedback on new CI/CD pipeline. Minor concern about test coverage.
      Decision: set minimum 80% coverage threshold enforced in pipeline. Action item:
      Bob to update pipeline config by Nov 1.

      '
    date: '2024-10-21'
    id: note-002
    tags:
    - retrospective
    - sprint-13
    - action-items
    title: Sprint 13 Retrospective
  - attendees:
    - all-staff@company.com
    content: 'CEO presented Q3 revenue results. Product roadmap for Q4 shared. No
