    - Q4 Product Roadmap shared
    - Weekly Sales Pipeline shared
    type: keywords_absent
  name: non_merger_notes_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate whether the agent correctly identified all four post-merger
      integration notes (note-001 "Post-Merger Integration Kickoff", note-002 "Post-Merger
      Integration — Legal Due Diligence Review", note-003 "Post-Merger Integration
      — Finance Synergy Planning", note-006 "Post-Merger Integration — HR & Culture
      Alignment") and shared each one with exactly the attendees listed in that note''s
      fixture data.

      Specifically check: - note-001 shared with diana.chen@acme.com, raj.patel@acme.com,
      susan.ford@acme.com - note-002 shared with diana.chen@acme.com, marcus.lee@acme.com,
      priya.nair@acme.com - note-003 shared with raj.patel@acme.com, susan.ford@acme.com,
      tom.nguyen@acme.com - note-006 shared with susan.ford@acme.com, priya.nair@acme.com,
      james.okafor@acme.com

      Also evaluate whether the agent''s summary is clear, organized, and useful —
      does it tell the user which notes were shared, with whom, and confirm the action
      was completed?

      Scoring: - 1.0: All four merger notes shared with correct recipients; clear
      and complete summary provided - 0.75: Three of four notes correctly shared with
      correct recipients; summary is adequate - 0.5: Two notes correctly handled OR
      all four found but recipients partially wrong - 0.25: Only one note correctly
      shared or summary is very incomplete - 0.0: No merger notes correctly shared
      or agent shared wrong notes (e.g., note-004, note-005)

      '
    type: llm_judge
  name: sharing_completeness_and_accuracy
  weight: 0.35
task_id: notes-027
task_name: Share Post-Merger Integration Meeting Notes with Stakeholders
tools:
- description: List available notes, optionally limiting the number of results returned.
  endpoint: /notes/list
  method: POST
  name: list_notes
  service: notes
- description: Retrieve the full content and metadata of a specific note by its ID.
  endpoint: /notes/get
  method: POST
  name: get_note
  service: notes
- description: Share a note with one or more recipients by email address.
  endpoint: /notes/share
  method: POST
  name: share_note
  service: notes
