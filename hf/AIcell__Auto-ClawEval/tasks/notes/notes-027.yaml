prompt: 'Our legal and finance teams just wrapped up a series of post-merger integration
  planning sessions and the notes need to be distributed to the right people before
  tomorrow''s board call. Find the meeting notes related to the post-merger integration,
  then share each one with all attendees listed in those notes so everyone is aligned
  going into the board meeting. Summarize what you shared and with whom.

  '
reference_solution: "1. Call POST /notes/list to retrieve available notes and identify\
  \ candidates. 2. Call POST /notes/get for each note that appears merger-related\
  \ based on title or tags\n   (note-001, note-002, note-003, note-006) to confirm\
  \ content and retrieve attendee lists.\n3. Call POST /notes/share for note-001 with\
  \ recipients [diana.chen@acme.com, raj.patel@acme.com, susan.ford@acme.com]. 4.\
  \ Call POST /notes/share for note-002 with recipients [diana.chen@acme.com, marcus.lee@acme.com,\
  \ priya.nair@acme.com]. 5. Call POST /notes/share for note-003 with recipients [raj.patel@acme.com,\
  \ susan.ford@acme.com, tom.nguyen@acme.com]. 6. Call POST /notes/share for note-006\
  \ with recipients [susan.ford@acme.com, priya.nair@acme.com, james.okafor@acme.com].\
  \ 7. Respond with a summary listing each note title, its ID, and the recipients\
  \ it was shared with,\n   confirming all four post-merger integration notes have\
  \ been distributed ahead of the board call."
