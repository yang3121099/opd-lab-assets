category: productivity
claw_eval_id: T13zh_meeting_notes
difficulty: medium
fixtures:
  notes:
  - attendees:
    - james.hartley@company.com
    - priya.nair@company.com
    - tom.walsh@company.com
    content: Discussed integration timeline, key milestones for Q1 and Q2, and assigned
