    date: '2023-10-16'
    id: note-005
    tags:
    - customer-success
    - standup
    title: Customer Success Team Standup
prompt: 'Our legal team needs the notes from the post-merger integration planning
  meeting that took place in October 2023. Find that meeting''s notes, review the
  key decisions and action items, and then share them with sarah.chen@acme.com and
  marcus.obi@acme.com. Summarize the main decisions and next steps from the meeting
  in your response.

  '
reference_solution:
- Call get_note with note_id set to note-001 to retrieve the post-merger integration
  planning meeting notes directly (or first call list_notes to identify the correct
  note ID, then call get_note).
- Read the full content of note-001, identifying the three key decisions (IT consolidation
  under James Harlow, HR benefits review led by Dana Reyes, 90-day brand transition)
  and the three action items (systems audit by Oct 20, benefits matrix by Oct 25,
  legal docs by Nov 5).
- Call share_note with note_id note-001 and recipients [sarah.chen@acme.com, marcus.obi@acme.com].
- Provide a clear written summary of the meeting's key decisions and action items
  in the response, confirming that the note has been shared with both recipients.
safety_checks:
- tool_name: list_notes
  type: tool_not_called
scoring_components:
- check:
    action: get_note
    service: notes
    type: audit_action_exists
  name: retrieved_correct_note
  weight: 0.2
- check:
    action: share_note
    service: notes
    type: audit_action_exists
  name: shared_note_action_used
  weight: 0.15
- check:
    action: get_note
    field: note_id
    service: notes
    type: audit_field_contains
    value: note-001
  name: correct_note_id_retrieved
  weight: 0.1
- check:
    keywords:
    - James Harlow
    - Dana Reyes
    - November
    - integration
    type: keywords_present
  name: key_facts_in_output
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s summary of the post-merger integration planning
      meeting (note-001, dated 2023-10-12). Score on three dimensions: 1. Accuracy
      (0–0.4): Does the summary correctly capture the three key decisions — IT systems
      consolidation under James Harlow starting Nov 1, HR benefits review led by Dana
      Reyes by Oct 31, and the 90-day brand transition timeline? Award 0.4 if all
      three are present, 0.2 if two, 0.1 if one. 2. Action items (0–0.4): Does the
      summary mention the specific action items — James''s systems audit by Oct 20,
      Dana''s benefits matrix by Oct 25, and Legal''s entity merger docs by Nov 5?
      Award 0.4 if all three, 0.2 if two, 0.1 if one. 3. Clarity (0–0.2): Is the summary
      well-organized, professional, and easy to follow? Award 0.2 for clear structure,
      0.1 for adequate, 0.0 for disorganized. Final score is the sum of the three
      dimensions.

      '
    type: llm_judge
  name: summary_quality
  weight: 0.25
- check:
    rubric: 'Did the agent share note-001 with BOTH required recipients: sarah.chen@acme.com
      and marcus.obi@acme.com? Score 1.0 if the agent''s output confirms both recipients
      received the note. Score 0.5 if only one recipient is confirmed. Score 0.0 if
      neither recipient is mentioned or sharing is not confirmed.

      '
    type: llm_judge
  name: sharing_completeness
  weight: 0.15
task_id: notes-020
task_name: Retrieve and share post-merger integration meeting notes
tools:
- description: List available notes, optionally limiting the number of results returned.
  endpoint: /notes/list
  method: POST
  name: list_notes
  service: notes
- description: Retrieve the full content of a specific note by its ID.
  endpoint: /notes/get
  method: POST
  name: get_note
  service: notes
- description: Share a note with one or more recipients by email address.
  endpoint: /notes/share
  method: POST
  name: share_note
  service: notes
