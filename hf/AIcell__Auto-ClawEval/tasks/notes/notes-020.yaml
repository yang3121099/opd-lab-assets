      strong at $6.1M. Action items: Tina to present Q4 strategy on Oct 18. Finance
      to update forecast model.

      '
    date: '2023-10-05'
    id: note-002
    tags:
    - sales
    - quarterly-review
    title: Q3 Sales Review
  - attendees:
    - Priya Nair
    - Leo Fontaine
    - Sandra Liu
    content: 'Engineering and product aligned on Q4 deliverables. Feature freeze set
