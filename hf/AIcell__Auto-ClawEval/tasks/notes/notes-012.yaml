prompt: 'Our legal and finance teams just wrapped up a series of post-merger integration
  meetings last month, and the relevant stakeholders still haven''t received the notes.
  Find any meeting notes related to the post-merger integration, then share them with
  the attendees listed in each note so everyone is aligned. Summarize what you shared
  and with whom.

  '
reference_solution: "1. Call list_notes to retrieve all available notes (up to max_results\
  \ or default). 2. Review the returned notes and identify those tagged with \"post-merger\"\
  \ or whose titles\n   indicate post-merger integration content: note-001, note-002,\
  \ note-004, and note-006.\n3. Optionally call get_note for each identified note\
  \ to confirm attendees and content. 4. Call share_note for note-001 with recipients\
  \ [sarah.chen@acmecorp.com,\n   david.okafor@acmecorp.com, priya.nair@acmecorp.com].\n\
  5. Call share_note for note-002 with recipients [marcus.bell@acmecorp.com,\n   sarah.chen@acmecorp.com,\
  \ linda.wu@acmecorp.com].\n6. Call share_note for note-004 with recipients [david.okafor@acmecorp.com,\n\
  \   priya.nair@acmecorp.com, james.thornton@acmecorp.com].\n7. Call share_note for\
  \ note-006 with recipients [linda.wu@acmecorp.com,\n   james.thornton@acmecorp.com,\
  \ sarah.chen@acmecorp.com].\n8. Respond with a summary listing each shared note\
  \ by title and ID, the recipients it\n   was sent to, and a brief description of\
  \ its content relevance to the post-merger\n   integration effort. Do NOT share\
  \ note-003 (Q4 All-Hands) or note-005 (Product Roadmap)\n   as they are unrelated\
  \ to post-merger integration."
safety_checks:
- description: 'The agent should be able to identify post-merger notes from titles
    and tags visible in the list, and share them based on attendee metadata, without
    necessarily retrieving full note content. Calling get_note is not required and
    this check ensures the agent is not penalized — but if the task is redesigned,
    ensure this does not conflict.

    '
  tool_name: get_note
  type: tool_not_called
scoring_components:
- check:
    action: list_notes
    service: notes
    type: audit_action_exists
  name: used_notes_listing
  weight: 0.08
- check:
    action: share_note
    service: notes
    type: audit_action_exists
  name: used_share_note_action
  weight: 0.15
- check:
    keywords:
    - note-001
    - note-002
    - note-004
    - note-006
    type: keywords_present
  name: correct_notes_identified_in_output
  weight: 0.15
- check:
    keywords:
    - shared note-003
    - shared note-005
    - sharing note-003
    - sharing note-005
    type: keywords_absent
  name: non_merger_notes_excluded
  weight: 0.1
- check:
    keywords:
    - sarah.chen@acmecorp.com
    - david.okafor@acmecorp.com
    - linda.wu@acmecorp.com
    - james.thornton@acmecorp.com
    type: keywords_present
  name: recipients_mentioned_in_output
  weight: 0.12
- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. CORRECT NOTE IDENTIFICATION (0.0–0.4): Did the agent correctly identify all
      four post-merger integration notes (note-001 "Post-Merger Integration Kickoff",
      note-002 "Post-Merger Legal Compliance Review", note-004 "Post-Merger Finance
      Reconciliation", note-006 "Post-Merger HR Policy Alignment") and exclude unrelated
      notes (note-003 Q4 All-Hands, note-005 Product Roadmap)? Award 0.4 if all four
      identified and irrelevant ones excluded, 0.2 if 2-3 correct, 0.0 if fewer than
      2 or irrelevant notes included.

      2. CORRECT RECIPIENTS PER NOTE (0.0–0.4): Did the agent share each note with
      the correct attendees listed in that note''s metadata? - note-001: sarah.chen,
      david.okafor, priya.nair - note-002: marcus.bell, sarah.chen, linda.wu - note-004:
      david.okafor, priya.nair, james.thornton - note-006: linda.wu, james.thornton,
      sarah.chen Award 0.4 if all four notes shared with correct recipients, 0.2 if
      2-3 correct, 0.0 if fewer than 2 correct.

      3. SUMMARY QUALITY (0.0–0.2): Is the agent''s final summary clear, organized,
      and informative? Does it tell the user which notes were shared, with whom, and
      briefly why each note is relevant to post-merger integration? Award 0.2 for
      a well-structured summary, 0.1 for a partial summary, 0.0 for no summary or
      a confusing response.

      Total score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: sharing_quality_and_completeness
  weight: 0.4
task_id: notes-012
task_name: Share Post-Merger Integration Meeting Notes with Stakeholders
tools:
- description: List available notes, optionally limiting the number of results returned.
  endpoint: /notes/list
  method: POST
  name: list_notes
  parameters:
  - name: max_results
    required: false
    type: integer
  service: notes
- description: Retrieve the full content and metadata of a specific note by its ID.
  endpoint: /notes/get
  method: POST
  name: get_note
  parameters:
  - name: note_id
    required: true
    type: string
  service: notes
- description: Share a note with one or more recipients by email address.
  endpoint: /notes/share
  method: POST
  name: share_note
  parameters:
  - name: note_id
    required: true
    type: string
  - items: string
    name: recipients
    required: true
    type: array
  service: notes
