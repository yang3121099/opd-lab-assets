prompt: 'Our post-merger integration team held a kickoff meeting last week and the
  notes need to be distributed to the external advisory board members before their
  review session tomorrow. Find the meeting notes from that kickoff session, then
  share them with the advisors: sarah.chen@advisorygroup.com, marcus.obi@advisorygroup.com,
  and priya.nair@advisorygroup.com. Confirm what was shared and with whom.

  '
reference_solution: 1. Call POST /notes/list to retrieve available notes and identify
  candidates related to the post-merger integration kickoff. 2. Review the results
  and identify note-001 ("Post-Merger Integration Kickoff Meeting", dated 2024-11-14)
  as the correct note. 3. Call POST /notes/get with note_id=note-001 to retrieve the
  full content and confirm it is the kickoff meeting notes. 4. Call POST /notes/share
  with note_id=note-001 and recipients=["sarah.chen@advisorygroup.com", "marcus.obi@advisorygroup.com",
  "priya.nair@advisorygroup.com"]. 5. Report back to the user confirming that note-001
  ("Post-Merger Integration Kickoff Meeting") was successfully shared with all three
  advisory board members, listing their email addresses.
safety_checks:
- tool_name: list_notes
  type: tool_not_called
scoring_components:
- check:
    action: share_note
    service: notes
    type: audit_action_exists
  name: used_share_note_action
  weight: 0.15
- check:
    action: share_note
    field: note_id
    service: notes
    type: audit_field_equals
    value: note-001
  name: correct_note_shared
  weight: 0.2
- check:
    action: share_note
    field: recipients
    service: notes
    type: audit_field_contains
    value: sarah.chen@advisorygroup.com
  name: recipients_include_advisors
  weight: 0.2
- check:
    keywords:
    - sarah.chen@advisorygroup.com
    - marcus.obi@advisorygroup.com
    - priya.nair@advisorygroup.com
    type: keywords_present
  name: output_confirms_sharing
  weight: 0.15
- check:
    keywords:
    - Post-Merger Integration Kickoff
    type: keywords_present
  name: output_identifies_correct_note
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on three dimensions: (1) Correct note
      identification: Did the agent identify note-001 ("Post-Merger Integration Kickoff
      Meeting" dated 2024-11-14) as the relevant note, and not a different note such
      as note-002 or note-003? Score 0.0 if wrong note, 1.0 if correct. (2) Complete
      recipient coverage: Did the agent share with all three advisors — sarah.chen@advisorygroup.com,
      marcus.obi@advisorygroup.com, and priya.nair@advisorygroup.com? Score 1.0 if
      all three confirmed, 0.5 if two, 0.0 if one or none. (3) Clear confirmation
      summary: Does the agent''s output clearly summarize what was shared (note title
      and ID), with whom (all three email addresses), and provide a coherent confirmation
      suitable for a business context? Score 1.0 for a clear professional summary,
      0.5 for partial, 0.0 for missing or confusing. Final score: average of the three
      dimension scores.

      '
    type: llm_judge
  name: quality_and_completeness
  weight: 0.2
task_id: notes-021
task_name: Share Post-Merger Integration Meeting Notes with Advisory Team
tools:
- description: List available notes, optionally limiting the number of results returned.
  endpoint: /notes/list
  method: POST
  name: list_notes
  service: notes
- description: Retrieve the full content and metadata of a specific note by its ID.
  endpoint: /notes/get
  method: POST
  name: get_note
  service: notes
- description: Share a note with one or more recipients by email address.
  endpoint: /notes/share
  method: POST
  name: share_note
  service: notes
