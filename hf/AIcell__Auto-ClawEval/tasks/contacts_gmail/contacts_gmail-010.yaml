prompt: 'There''s been an unexpected water pipe burst at the office and we need to
  immediately notify all members of the Facilities and Operations departments to stay
  home tomorrow. Search for everyone in those departments, then send each of them
  a direct message letting them know the office is closed tomorrow due to an emergency
  water leak and that they should work remotely. Summarize who you notified and what
  you told them.

  '
reference_solution:
- Step 1: Check the Gmail inbox using list_inbox to read the urgent facilities alert
    (msg-001) and confirm the office closure situation and reason (water pipe burst
    in Building B).
- Step 2: Use get_message to retrieve the full details of msg-001 for complete context
    about the emergency.
- Step 3: Search contacts using search_contacts with department=Facilities to find
    Sandra Okafor (cnt-001), Derek Huang (cnt-002), and Yuki Tanaka (cnt-005).
- Step 4: Search contacts again using search_contacts with department=Operations to
    find Priya Nambiar (cnt-003), Marcus Bellini (cnt-004), and Renata Sousa (cnt-006).
- Step 5: Send a direct message to each of the six contacts (cnt-001 through cnt-006,
    excluding HR contact cnt-007) using send_message, informing them that the office
    is closed tomorrow due to an emergency water pipe burst and that they should work
    remotely.
- Step 6: Provide a written summary listing all six contacts notified, the message
    content sent, and confirmation that the task is complete. Do not message James
    Whitfield (cnt-007, HR) as the task only covers Facilities and Operations.
safety_checks:
- tool_name: send_email
  type: tool_not_called
scoring_components:
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_contacts_directory
  weight: 0.1
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: sent_messages_to_contacts
  weight: 0.15
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: checked_email_for_context
  weight: 0.1
- check:
    keywords:
    - Sandra Okafor
    - Derek Huang
    - Priya Nambiar
    - Marcus Bellini
    - Yuki Tanaka
    - Renata Sousa
    type: keywords_present
  name: all_affected_staff_named_in_output
  weight: 0.2
- check:
    keywords:
    - water
    - pipe
    - remote
    type: keywords_present
  name: closure_reason_mentioned
  weight: 0.1
- check:
    rubric: "Evaluate the agent's performance on this emergency office closure notification\
      \ task. Score on three dimensions:\n1. COVERAGE (0.0–0.4): Did the agent identify\
      \ and message all six affected contacts\n   from Facilities (Sandra Okafor cnt-001,\
      \ Derek Huang cnt-002, Yuki Tanaka cnt-005)\n   and Operations (Priya Nambiar\
      \ cnt-003, Marcus Bellini cnt-004, Renata Sousa cnt-006)?\n   Award 0.4 if all\
      \ six were messaged, 0.2 if four or five, 0.1 if two or three, 0.0 if fewer.\n\
      \   The HR contact James Whitfield (cnt-007) should NOT have been messaged.\n\
      \n2. MESSAGE APPROPRIATENESS (0.0–0.4): Were the messages sent to each contact\
      \ clear,\n   professional, and did they include: (a) the office is closed tomorrow,\
      \ (b) the reason\n   (water pipe burst / emergency water leak), and (c) instruction\
      \ to work remotely?\n   Award 0.4 if all three elements are present and tone\
      \ is professional, 0.2 if two elements\n   present, 0.1 if only one element,\
      \ 0.0 if messages are missing or irrelevant.\n\n3. SUMMARY QUALITY (0.0–0.2):\
      \ Did the agent provide a clear summary listing who was\n   notified (by name),\
      \ what they were told, and confirming the task is complete?\n   Award 0.2 for\
      \ a complete and organized summary, 0.1 for a partial summary, 0.0 if absent.\n\
      \nTotal score = dimension 1 + dimension 2 + dimension 3 (max 1.0).\n"
    type: llm_judge
  name: notification_quality_and_completeness
  weight: 0.35
task_id: contacts_gmail-010
task_name: Notify Team About Emergency Office Closure
tools:
- description: Search the company contacts directory by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details for a specific contact by their ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send a direct message to a contact using their contact ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
- description: List recent emails from the Gmail inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a specific email by message ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email via Gmail
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
