prompt: 'A vendor named Marcus Webb sent you an urgent email recently. Read that email
  carefully, then find Marcus Webb in the company contacts directory and send him
  a direct message acknowledging that you''ve received his email and that someone
  will follow up with him within 24 hours. Include a brief reference to the subject
  of his email in your message.

  '
reference_solution:
- Call list_inbox to retrieve recent emails and identify the urgent message from Marcus
  Webb (msg-001).
- Call get_message with message_id msg-001 to read the full content of Marcus's email
  about the contract renewal deadline.
- Call search_contacts with query "Marcus Webb" to locate him in the contacts directory
  and obtain his contact ID (cnt-101).
- Optionally call get_contact with contact_id cnt-101 to confirm his details.
- Call send_message with contact_id cnt-101 and a message that acknowledges receipt
  of his urgent contract renewal email, references the Friday deadline, and commits
  to a follow-up within 24 hours.
- Report back confirming the message was sent, summarizing the email content and the
  response provided.
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: get_message
    service: gmail
    type: audit_action_exists
  name: read_marcus_email
  weight: 0.15
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_or_retrieved_contact
  weight: 0.1
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: message_sent_via_contacts
  weight: 0.15
- check:
    action: send_message
    field: contact_id
    service: contacts
    type: audit_field_contains
    value: cnt-101
  name: correct_contact_targeted
  weight: 0.15
- check:
    keywords:
    - contract renewal
    - deadline
    - Friday
    type: keywords_present
  name: email_subject_referenced
  weight: 0.15
- check:
    rubric: "Evaluate the message the agent sent to Marcus Webb (contact ID cnt-101)\
      \ via the contacts send_message tool. Score on three dimensions:\n1. Acknowledgment\
      \ (0–0.4): Does the message clearly confirm receipt of Marcus's\n   urgent email\
      \ about the contract renewal deadline? It should explicitly acknowledge\n  \
      \ the email was received.\n\n2. Subject reference (0–0.3): Does the message\
      \ reference the specific subject matter —\n   the contract renewal deadline\
      \ and/or the Friday deadline — rather than being generic?\n\n3. Follow-up commitment\
      \ (0–0.3): Does the message include a clear commitment to follow\n   up within\
      \ 24 hours, as instructed in the task?\n\nScore 1.0 if all three dimensions\
      \ are fully satisfied. Score 0.6–0.9 if two dimensions are well-covered. Score\
      \ 0.3–0.5 if only one dimension is addressed. Score 0.0–0.2 if the message is\
      \ missing, generic, or sent to the wrong person.\n"
    type: llm_judge
  name: acknowledgment_quality
  weight: 0.3
