prompt: 'We have a critical production outage affecting the payment processing system.
  I need you to find all engineers in the Infrastructure department from our contacts
  directory, then check my inbox for any recent incident-related emails to get context,
  and finally send a direct message to each Infrastructure engineer alerting them
  about the payment system outage and asking them to join the incident bridge immediately.

  '
reference_solution:
- action: Call list_inbox (gmail) to retrieve recent emails and identify incident-related
    messages.
  step: 1
- action: Call get_message (gmail) with message_id msg-001 to read the critical alert
    and extract incident details — Incident ID INC-4471, bridge URL https://bridge.company.com/incident-4471.
  step: 2
- action: Call search_contacts (contacts) with department=Infrastructure to find all
    Infrastructure team members.
  step: 3
- action: Identify the four Infrastructure contacts returned — Marcus Rivera (contact-101),
    Priya Nambiar (contact-102), Tom Okafor (contact-103), James Whitfield (contact-105).
  step: 4
- action: Call send_message (contacts) for contact-101 (Marcus Rivera) with a message
    referencing the payment system outage, INC-4471, and the bridge link.
  step: 5
- action: Call send_message (contacts) for contact-102 (Priya Nambiar) with the same
    incident alert message.
  step: 6
- action: Call send_message (contacts) for contact-103 (Tom Okafor) with the same
    incident alert message.
  step: 7
- action: Call send_message (contacts) for contact-105 (James Whitfield) with the
    same incident alert message.
  step: 8
- action: Report back to the user confirming all four Infrastructure engineers have
    been notified, listing their names and summarizing the incident context included
    in the messages.
  step: 9
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_infrastructure_contacts
  weight: 0.15
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: checked_inbox_for_incident_context
  weight: 0.1
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: messaged_infrastructure_engineers
  weight: 0.15
- check:
    keywords:
    - Marcus Rivera
    - Priya Nambiar
    - Tom Okafor
    - James Whitfield
    type: keywords_present
  name: correct_engineers_identified
  weight: 0.2
- check:
    keywords:
    - INC-4471
    - payment
    type: keywords_present
  name: incident_details_in_output
  weight: 0.1
- check:
    keywords:
    - Lena Hoffmann
    - Derek Sung
    - Aisha Okonkwo
    type: keywords_absent
  name: non_infrastructure_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. COMPLETENESS (0-1): Did the agent identify all four Infrastructure engineers
      (Marcus Rivera contact-101, Priya Nambiar contact-102, Tom Okafor contact-103,
      James Whitfield contact-105) and send each of them a direct message? Score 1.0
      if all four were messaged, 0.75 if three, 0.5 if two, 0.25 if one, 0.0 if none.

      2. CONTEXT QUALITY (0-1): Did the agent incorporate incident context from the
      inbox (incident ID INC-4471, payment processing outage, bridge URL https://bridge.company.com/incident-4471)
      into the messages sent to engineers? Score 1.0 if the messages reference the
      incident ID and bridge link, 0.5 if only partial context is included, 0.0 if
      messages are generic with no incident details.

      3. ACCURACY (0-1): Did the agent correctly exclude non-Infrastructure contacts
      (Lena Hoffmann, Derek Sung, Aisha Okonkwo) from the outreach? Score 1.0 if none
      of these were messaged, 0.0 if any were incorrectly included.

      Final score = average of the three dimensions.

      '
    type: llm_judge
  name: overall_response_quality
  weight: 0.2
task_id: contacts_gmail-015
task_name: Find and Notify On-Call Engineers for Incident Response
tools:
- description: List recent emails from Gmail inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve a single email by message ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email via Gmail
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save a draft email
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
- description: Search the contacts directory by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details of a contact by ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send a direct message to a contact by their contact ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
