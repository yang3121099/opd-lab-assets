prompt: 'A client named Thornfield Logistics has sent in an urgent complaint email
  about a billing discrepancy. Find the email from Thornfield Logistics in your inbox,
  identify the key issue they raised, then look up the account manager responsible
  for enterprise clients in the Sales department and send them a direct message summarizing
  the complaint so they can follow up immediately.

  '
reference_solution:
- action: Call list_inbox to retrieve recent emails and identify the message from
    Thornfield Logistics (msg-001).
  step: 1
- action: Call get_message with message_id=msg-001 to read the full content of the
    complaint email, noting the invoice number TL-8821, overcharge of $3,550, payment
    deadline November 30 2024, and contract reference CTR-2024-0047.
  step: 2
- action: Call search_contacts with department=Sales (or query="Enterprise Account
    Manager") to find the right person to escalate to.
  step: 3
- action: Review results and identify Sandra Okafor (contact-101) as the Enterprise
    Account Manager in Sales — the appropriate escalation contact.
  step: 4
- action: Call get_contact with contact_id=contact-101 to confirm Sandra Okafor's
    details if needed.
  step: 5
- action: Call send_message with contact_id=contact-101 and a message summarizing
    the Thornfield Logistics complaint — including invoice
  step: 6
- action: Report back to the user confirming the complaint details found and that
    Sandra Okafor has been notified.
  step: 7
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: get_message
    service: gmail
    type: audit_action_exists
  name: read_complaint_email
  weight: 0.15
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_or_retrieved_sales_contact
  weight: 0.1
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: message_sent_to_account_manager
  weight: 0.15
- check:
    keywords:
    - TL-8821
    - 3,550
    - Sandra Okafor
    - November 30
    type: keywords_present
  name: key_complaint_details_in_output
  weight: 0.2
- check:
    rubric: "Evaluate whether the agent correctly identified and summarized the Thornfield\
      \ Logistics complaint and escalated it to the right person. Score on these dimensions:\n\
      1. Email content accuracy (0–0.4): Did the agent correctly extract the key facts\
      \ from msg-001?\n   This includes: invoice #TL-8821, overcharge amount of $3,550\
      \ (charged $14,750 vs. contracted\n   $11,200), payment deadline of November\
      \ 30 2024, and contract reference CTR-2024-0047.\n   Full credit if all four\
      \ facts are present; partial if 2–3 are present; zero if fewer than 2.\n\n2.\
      \ Correct escalation target (0–0.3): Did the agent identify Sandra Okafor (contact-101),\n\
      \   the Enterprise Account Manager in Sales, as the correct person to notify?\
      \ Full credit if\n   Sandra Okafor is named and her role acknowledged; zero\
      \ if a different contact was chosen\n   without justification.\n\n3. Message\
      \ quality (0–0.3): Is the message sent to Sandra Okafor clear, professional,\
      \ and\n   actionable — does it convey urgency and include enough detail for\
      \ her to follow up with\n   the client? Full credit for a well-structured, complete\
      \ escalation message; partial for\n   vague or incomplete messages; zero if\
      \ no message was composed.\n\nOverall score: sum of the three dimension scores\
      \ (max 1.0).\n"
    type: llm_judge
  name: complaint_summary_quality
  weight: 0.25
- check:
    rubric: 'Does the agent''s final text response to the user provide a clear summary
      of what was done? Specifically: (1) Did it confirm which email was found and
      from whom (Thornfield Logistics, billing@thornfieldlogistics.com)? (2) Did it
      confirm who was contacted (Sandra Okafor, Enterprise Account Manager)? (3) Did
      it briefly state the nature of the complaint (billing overcharge on invoice
      TL-8821)? Score 1.0 if all three are present, 0.5 if two are present, 0.2 if
      only one, 0.0 if none.

      '
    type: llm_judge
  name: output_completeness
  weight: 0.15
task_id: contacts_gmail-019
task_name: Escalate Urgent Client Complaint to Account Manager
tools:
- description: List recent emails from the Gmail inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a specific email by message ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email to a recipient
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save an email as a draft
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
- description: Search the company contacts directory by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details of a contact by their contact ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send a direct message to a contact using their contact ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
