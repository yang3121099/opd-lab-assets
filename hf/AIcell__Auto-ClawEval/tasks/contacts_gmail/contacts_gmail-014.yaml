  method: POST
  name: get_message
  service: gmail
- description: Search contacts by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details of a specific contact by contact ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Save a draft email to be sent later
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
- description: Send an email immediately
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
