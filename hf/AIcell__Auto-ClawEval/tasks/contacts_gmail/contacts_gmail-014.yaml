- check:
    rubric: "Evaluate the agent's output on the following dimensions:\n1. COVERAGE\
      \ (0.0-0.4): Did the agent prepare draft apology emails for all four Engineering\
      \ department contacts —\n   Maya Patel (VP of Engineering, contact-101), Derek\
      \ Okonkwo (Senior Engineer, contact-102),\n   Lena Hoffmann (Engineering Manager,\
      \ contact-103), and James Whitfield (Junior Engineer, contact-106)?\n   Score\
      \ 0.4 if all four are addressed, 0.2 if two or three, 0.0 if fewer than two.\n\
      \n2. CONTENT QUALITY (0.0-0.4): Do the draft emails clearly acknowledge the\
      \ error in the Q3 budget report,\n   reference the incorrect Engineering figures\
      \ ($2.1M), and mention that a corrected report is forthcoming?\n   Score 0.4\
      \ if all three elements are present, 0.2 if two elements, 0.0 if one or none.\n\
      \n3. PROFESSIONALISM (0.0-0.2): Are the drafts appropriately professional in\
      \ tone, personalized to each recipient's\n   name and title, and suitable for\
      \ internal corporate communication?\n   Score 0.2 if professional and personalized,\
      \ 0.1 if professional but generic, 0.0 if unprofessional.\n\nFinal score = sum\
      \ of dimension scores (max 1.0).\n"
    type: llm_judge
  name: draft_quality_and_completeness
  weight: 0.35
