prompt: 'Our team just discovered that the quarterly budget report sent last week
  contained incorrect figures for the Engineering department. Please find the original
  email in my inbox about the budget report, then look up the contacts in the Engineering
  department, and prepare draft apology emails to each of them acknowledging the error
  and letting them know a corrected report is forthcoming.

  '
reference_solution:
- Step 1: Call list_inbox to retrieve recent emails and identify the Q3 Budget Report
    email (msg-001).
- Step 2: Call get_message with message_id msg-001 to read the full content and confirm
    it references Engineering figures.
- Step 3: Call search_contacts with department=Engineering to find all Engineering
    contacts.
- Step 4: Identify the four Engineering contacts — Maya Patel (contact-101), Derek
    Okonkwo (contact-102), Lena Hoffmann (contact-103), and James Whitfield (contact-106).
- Step 5: Optionally call get_contact for each contact to confirm their email addresses
    and titles.
- Step 6: Call create_draft four times, once for each Engineering contact, with a
    personalized apology email acknowledging the error in the Q3 budget report, referencing
    the incorrect $2.1M Engineering figure, and noting a corrected report will follow.
- Step 7: Report back to the user confirming that four draft apology emails have been
    saved, listing each recipient by name and title.
