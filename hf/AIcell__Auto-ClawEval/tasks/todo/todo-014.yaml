    due_date: '2024-08-22'
    id: task-005
    priority: medium
    status: todo
    tags:
    - auth
    - backend
    title: Auth middleware refactor
  - description: Achieve 80% test coverage on the billing calculation service.
    due_date: '2024-08-25'
