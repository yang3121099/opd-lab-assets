category: productivity
claw_eval_id: T08_todo_management
difficulty: medium
fixtures:
  tasks:
  - description: Revise the developer onboarding docs to reflect new CI/CD pipeline
      steps.
    due_date: '2024-08-15'
    id: task-001
    priority: low
    status: todo
    tags:
    - docs
    - onboarding
    title: Update onboarding documentation
  - description: Users report that page 2 of the analytics dashboard returns duplicate
      records.
    due_date: '2024-08-10'
    id: task-002
    priority: medium
    status: in_progress
    tags:
    - bug
    - frontend
    title: Fix pagination bug on dashboard
  - description: Add composite indexes to the orders and events tables to reduce query
      latency.
    due_date: '2024-08-20'
    id: task-003
    priority: low
    status: todo
    tags:
    - database
    - performance
    title: Database index optimization
  - description: Configure PagerDuty alerts for staging environment error rate thresholds.
    due_date: '2024-08-18'
    id: task-004
    priority: medium
    status: todo
    tags:
    - devops
    - monitoring
    title: Set up staging environment alerts
  - description: Refactor JWT validation middleware to support multi-tenant token
