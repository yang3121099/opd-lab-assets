  - description: Migrate legacy PostgreSQL 9.6 to PostgreSQL 15 with zero downtime
    due_date: '2024-12-20'
    id: task-002
    priority: high
    status: in_progress
    tags:
    - database
    - infrastructure
    - sprint-14
    title: Legacy Database Migration
  - description: Implement rate limiting middleware for public API endpoints
    due_date: '2025-01-10'
    id: task-003
    priority: medium
    status: pending
    tags:
    - backend
