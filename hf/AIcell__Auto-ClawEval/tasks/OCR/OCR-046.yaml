category: OCR
claw_eval_id: T57_deepseek_logo_identification
difficulty: medium
files:
- source: OCR-046/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the person's name, job title, company, phone number(s),
  email address, and any other details such as website or physical address that appear
  on the card.
reference_solution: '1. Open or read the image file at /workspace/image.jpg using
  an image viewer or OCR tool available in the shell (e.g., tesseract, pytesseract
  via Python, or another OCR utility).

  2. Run OCR on the image to extract all visible text from the business card.

  3. Parse the extracted text to identify structured fields: full name, job title,
  company/organization, phone number(s), email address, website URL, and physical
  address if present.

  4. Report each field clearly labeled in the output, noting any fields that could
  not be determined from the image.

  5. Double-check extracted values for common OCR errors (e.g., 0 vs O, 1 vs l) and
  correct where possible.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '@'
    type: keywords_present
  description: Agent output contains an email address extracted from the business
    card
  name: Agent output contains an email address e
  weight: 0.15
- check:
    keywords:
    - phone
    - tel
    - mobile
    - cell
    - +
    type: keywords_present
  description: Agent output references a phone or contact number from the card
  name: Agent output references a phone or conta
  weight: 0.15
- check:
    rubric: The agent correctly identifies and reports all visible contact information
      from the business card image, including the person's full name, job title or
      role, company or organization name, at least one phone number, email address,
      and any additional details such as a website URL or physical address. The response
      is well-organized, clearly presenting each field, and does not fabricate information
      not present in the image.
    type: llm_judge
  description: Quality and completeness of OCR extraction and reporting
  name: Quality and completeness of OCR extracti
  weight: 0.5
- check:
    keywords:
    - name
    - title
    - company
    - email
    type: keywords_present
  description: Agent output explicitly labels and reports key contact fields
  name: Agent output explicitly labels and repor
  weight: 0.2
task_id: OCR-046
task_name: Extract Contact Information from Business Card
tools: []
