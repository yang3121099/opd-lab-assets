category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-051/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the product specification sheet image at /workspace/image.jpg and
  extract all technical details, specifications, and product information visible in
  the document. Report the product name, model number, key technical specifications
  (such as dimensions, power ratings, operating conditions, materials, or performance
  metrics), and any other important details present on the sheet.
reference_solution: "1. Use a native OCR tool available in the shell environment such\
  \ as 'tesseract' to extract text from /workspace/image.jpg:\n   tesseract /workspace/image.jpg\
  \ stdout\n2. Alternatively, use Python with pytesseract or easyocr:\n   python3\
  \ -c \"import pytesseract; from PIL import Image; print(pytesseract.image_to_string(Image.open('/workspace/image.jpg')))\"\
  \n3. Review the raw OCR output and identify structured sections: product name, model\
  \ number, electrical specifications (voltage, current, power, frequency), mechanical\
  \ specifications (dimensions, weight, materials), environmental ratings (IP rating,\
  \ operating temperature range), and certifications or compliance marks.\n4. Organize\
  \ the extracted information into clearly labeled categories.\n5. Report all numerical\
  \ values with their units, noting any tolerances or ranges present in the specification\
  \ sheet.\n6. Include any part numbers, manufacturer details, revision numbers, or\
  \ dates visible on the document."
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - W
    - mm
    - V
    - Hz
    - kg
    - °C
    - A
    - IP
    type: keywords_present
  description: Agent output must include technical units and specification values
    extracted from the product sheet
  name: Agent output must include technical unit
  weight: 0.4
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. Completeness: Did the agent extract all major sections of the specification
      sheet including product name/model, technical specifications, dimensions or
      ratings, and any compliance or certification marks?

      2. Accuracy: Are the extracted values and specifications presented clearly and
      correctly without obvious hallucinations or fabrications?

      3. Organization: Is the extracted information presented in a structured, readable
      format (e.g., grouped by category such as electrical specs, mechanical specs,
      environmental specs)?

      4. Detail: Did the agent capture numerical values with their units, tolerances,
      or ranges where present?

      5. Coverage: Did the agent note any warnings, certifications, part numbers,
      or manufacturer information visible on the sheet?

      Score 1.0 if all criteria are met thoroughly, 0.7 if most criteria are met with
      minor omissions, 0.4 if only partial extraction was achieved, 0.1 if the response
      is vague or mostly incorrect.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    path: /workspace/image.jpg
    type: file_exists
  description: Verify the source image file is present and was not accidentally deleted
  name: 'Verify the source image file is present '
  weight: 0.05
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    - I cannot see
    type: keywords_absent
  description: Agent must not claim the image is unreadable or empty without attempting
    OCR
  name: Agent must not claim the image is unread
  weight: 0.1
task_id: OCR-051
task_name: Extract Technical Details from Product Specification Sheet
tools: []
