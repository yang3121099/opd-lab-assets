category: OCR
claw_eval_id: T72_restaurant_menu_contact
difficulty: medium
files:
- source: OCR-070/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg using OCR and
  visual analysis. Identify and list all labeled components, text, arrows, and structural
  elements visible in the diagram, then provide a clear description of what the diagram
  represents and how the components relate to each other.
reference_solution: '1. Open a terminal and use an OCR tool such as tesseract, pytesseract,
  or a Python-based vision library to extract text from /workspace/image.jpg.

  2. Run: tesseract /workspace/image.jpg stdout or use Python with pytesseract.image_to_string()
  to get raw text output.

  3. Additionally, use image analysis (e.g., PIL/Pillow or OpenCV) to detect structural
  elements like boxes, arrows, and regions.

  4. Combine the OCR text output with visual structure analysis to identify all labeled
  components in the diagram.

  5. Organize the findings by listing each labeled component, its position or role
  in the diagram, and how it connects to other components via arrows or lines.

  6. Provide a summary interpretation of what the whiteboard diagram represents based
  on the extracted labels and structure.'
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - diagram
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - label
    - component
    - arrow
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    rubric: 'The agent should have successfully extracted text and labels from the
      whiteboard diagram in /workspace/image.jpg. Evaluate whether the agent: (1)
      identified and listed the specific labeled components visible in the diagram,
      (2) described the relationships or flow indicated by arrows or connecting lines,
      (3) provided a coherent interpretation of what the overall diagram represents,
      (4) accurately transcribed any text or annotations visible on the whiteboard.
      A high-quality response will enumerate specific component names or labels found
      in the image, describe the structure or layout of the diagram, and explain the
      meaning or purpose of the diagram based on its visual content. Penalize responses
      that are vague, miss major labeled elements, or fail to describe the relationships
      between components.'
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    path: /workspace/image.jpg
    type: file_exists
  name: file_exists
  weight: 0.15
task_id: OCR-070
task_name: Whiteboard Diagram OCR and Component Analysis
tools: []
