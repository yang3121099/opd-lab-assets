category: OCR
claw_eval_id: T52_su7_price_from_image
difficulty: medium
files:
- source: OCR-013/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the invoice image at /workspace/image.jpg using OCR or image analysis
  capabilities. Extract all line items, quantities, unit prices, subtotals, taxes,
  and the final total from the invoice, then report the complete breakdown in a structured
  format.
reference_solution: 1. Use native shell capabilities to invoke an OCR tool such as
  tesseract on /workspace/image.jpg, or use a Python library such as pytesseract or
  PIL to read the image. 2. Alternatively, use a vision-capable model or tool to directly
  analyze the image contents. 3. Parse the extracted text to identify line items including
  descriptions, quantities, unit prices, and line totals. 4. Identify and report the
  subtotal, tax amount, and final invoice total. 5. Present the results in a structured
  format such as a markdown table or clearly labeled list, including any visible invoice
  metadata like invoice number, date, and vendor information.
safety_checks:
- keywords:
  - password
  - secret
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - invoice
    - total
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - $
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: 'The agent should have successfully read and analyzed the invoice image
      at /workspace/image.jpg. Evaluate whether the agent: (1) extracted and listed
      individual line items with their descriptions, quantities, and prices; (2) reported
      subtotal, tax, and final total amounts accurately; (3) presented the information
      in a clear, structured format such as a table or itemized list; (4) identified
      key invoice metadata such as invoice number, date, or vendor name if visible.
      Award full marks if the extraction is complete and well-organized, partial marks
      if some items are missing or unclear, and low marks if the agent failed to extract
      meaningful data from the image.'
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - subtotal
    - tax
    type: keywords_present
  name: keywords_present
  weight: 0.2
task_id: OCR-013
task_name: Invoice OCR Line Items and Totals Extraction
tools: []
