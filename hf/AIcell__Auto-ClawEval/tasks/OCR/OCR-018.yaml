category: OCR
claw_eval_id: T52_su7_price_from_image
difficulty: medium
files:
- source: OCR-018/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the person's name, job title, company, phone number(s),
  email address, website, and physical address if present.
reference_solution: '1. Use a native shell command or Python script to run OCR on
  /workspace/image.jpg.

  2. Tools such as Tesseract (tesseract image.jpg stdout) or Python libraries like
  pytesseract or easyocr can extract text from the image.

  3. Parse the extracted text to identify and label contact fields: full name, job
  title, company name, phone number(s), email address, website URL, and physical address.

  4. Present the extracted information in a clearly labeled, structured format in
  the response.

  5. If OCR output is noisy, apply basic post-processing to clean up whitespace and
  identify field boundaries.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '@'
    type: keywords_present
  description: Agent output contains an email address extracted from the business
    card
  name: Agent output contains an email address e
  weight: 0.15
- check:
    keywords:
    - .
    type: keywords_present
  description: Agent output contains structured contact details
  name: Agent output contains structured contact
  weight: 0.05
- check:
    rubric: 'Evaluate whether the agent correctly extracted and reported all visible
      contact information from the business card image. The response should include:
      the person''s full name, their job title or role, the company or organization
      name, at least one phone number, an email address, and any website or address
      shown. Penalize heavily if major fields are missing, misread, or fabricated.
      Award full marks if all fields are accurately reported and clearly organized.'
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent does not claim it is unable to extract information from the image
  name: Agent does not claim it is unable to ext
  weight: 0.15
- check:
    rubric: Check whether the agent's output is well-structured and clearly labels
      each piece of contact information (e.g., Name, Title, Company, Phone, Email,
      Website, Address). Award full marks for clearly labeled, organized output. Deduct
      marks for unstructured or ambiguous presentation.
    type: llm_judge
  name: llm_judge
  weight: 0.1
task_id: OCR-018
task_name: Extract Contact Information from Business Card
tools: []
