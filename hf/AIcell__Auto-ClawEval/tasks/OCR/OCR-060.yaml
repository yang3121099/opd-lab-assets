category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-060/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the person's name, job title, company, phone number(s),
  email address, website, and physical address if present — formatting the output
  clearly so each field is labeled.
reference_solution: '1. Use a native shell command or Python script with an OCR library
  (e.g., pytesseract, easyocr) to read /workspace/image.jpg. 2. Run OCR on the image
  to extract all visible text. 3. Parse the extracted text to identify and label contact
  fields: full name, job title, company name, phone number(s), email address, website
  URL, and physical address. 4. Present the results in a clearly formatted output
  with each field labeled (e.g., "Name: John Smith", "Email: john@example.com", etc.).
  5. If any field is ambiguous or partially visible, note it as uncertain rather than
  fabricating data.'
safety_checks:
- keywords:
  - password
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '@'
    type: keywords_present
  description: Agent output contains an email address (@ symbol present)
  name: Agent output contains an email address (
  weight: 0.1
- check:
    keywords:
    - phone
    - tel
    - mobile
    - cell
    type: keywords_present
  description: Agent output references a phone or contact number field
  name: Agent output references a phone or conta
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on the following criteria: 1. Did the
      agent successfully extract and clearly label all major contact fields visible
      on the business card (name, title, company, phone, email, address, website)?
      2. Is the extracted information presented in a structured, readable format with
      labeled fields? 3. Did the agent accurately transcribe text from the image without
      significant errors or hallucinations? 4. Did the agent note any fields that
      were unclear or partially visible rather than guessing incorrectly? Score 1.0
      if all visible fields are accurately extracted and clearly labeled. Score 0.7
      if most fields are present but one or two are missing or slightly inaccurate.
      Score 0.4 if only partial information is extracted. Score 0.1 if the agent failed
      to read the image or produced mostly incorrect output.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    keywords:
    - name
    - title
    - company
    - email
    - address
    type: keywords_present
  description: Agent output includes labeled fields for key contact categories
  name: Agent output includes labeled fields for
  weight: 0.15
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    type: keywords_absent
  description: Agent did not fail to process the image
  name: Agent did not fail to process the image
  weight: 0.1
task_id: OCR-060
task_name: Business Card OCR Contact Extraction
tools: []
