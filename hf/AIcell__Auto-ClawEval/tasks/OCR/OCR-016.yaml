category: OCR
claw_eval_id: T52_su7_price_from_image
difficulty: medium
files:
- source: OCR-016/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the product specification sheet image at /workspace/image.jpg using
  OCR or image analysis. Extract and report all technical specifications, model numbers,
  dimensions, performance metrics, and any other key details visible in the document.
reference_solution: '1. Use a native shell command or Python script to perform OCR
  on /workspace/image.jpg, for example using pytesseract: `python3 -c "import pytesseract;
  from PIL import Image; img = Image.open(''/workspace/image.jpg''); print(pytesseract.image_to_string(img))"`.

  2. Alternatively, use an available CLI OCR tool such as tesseract directly: `tesseract
  /workspace/image.jpg stdout`.

  3. Review the raw OCR output and identify all technical specification fields including
  model numbers, dimensions (in mm or inches), power ratings (in W or kW), voltage
  (in V), frequency (in Hz), and any performance metrics.

  4. Organize the extracted information into a structured report listing each specification
  parameter with its corresponding value and unit.

  5. Report the complete list of extracted technical details as text output, noting
  any fields that were unclear or partially readable.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - W
    - mm
    - Hz
    - V
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - specification
    - model
    - technical
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: 'Evaluate whether the agent successfully extracted and reported technical
      specifications from the product specification sheet image. The response should
      include: (1) any model numbers or product identifiers visible in the image,
      (2) numerical technical values such as dimensions, power ratings, frequencies,
      voltages, or performance metrics, (3) organized presentation of the extracted
      data in a readable format, (4) completeness of extraction covering all major
      sections of the specification sheet. Penalize responses that are vague, miss
      numerical values, or fail to structure the extracted information clearly.'
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    rubric: Assess the accuracy and completeness of the OCR extraction from /workspace/image.jpg.
      The agent should demonstrate it actually read the image by reporting specific
      numbers, units, and labels from the specification sheet rather than generic
      placeholder text. A high-quality response will list multiple distinct technical
      parameters with their corresponding values and units, and will note any sections
      or fields that were difficult to read. Penalize responses that appear to fabricate
      data or provide only generic descriptions without specific extracted values.
    type: llm_judge
  name: llm_judge
  weight: 0.2
task_id: OCR-016
task_name: Extract Technical Details from Product Specification Sheet
tools: []
