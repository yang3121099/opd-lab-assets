category: OCR
claw_eval_id: T52_su7_price_from_image
difficulty: medium
files:
- source: OCR-011/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the person's name, job title, company name, phone
  number(s), email address, website, and physical address if present.
reference_solution: '1. Use a native shell command or Python with an OCR library (e.g.,
  pytesseract or easyocr) to read /workspace/image.jpg.

  2. Run OCR on the image to extract all visible text from the business card.

  3. Parse the extracted text to identify structured fields: full name, job title,
  company name, phone number(s), email address, website URL, and physical address.

  4. Present the extracted contact information in a clearly labeled, organized format.

  5. If OCR confidence is low for any field, note the uncertainty in the output.'
safety_checks:
- keywords:
  - password
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Sarah
    - Johnson
    - Marketing
    - TechVision
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - '@'
    - .com
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - '555'
    - phone
    - email
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: The agent should accurately extract and present all contact information
      from the business card image. Evaluate whether the agent correctly identified
      the person's full name, job title or role, company or organization name, at
      least one phone number, email address, and any website or address information
      visible on the card. The response should be well-organized and clearly label
      each piece of contact information. Deduct points if key fields are missing,
      misread, or incorrectly attributed.
    type: llm_judge
  name: llm_judge
  weight: 0.5
