category: OCR
claw_eval_id: T57_deepseek_logo_identification
difficulty: medium
files:
- source: OCR-047/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the street sign image at /workspace/image.jpg and extract all text
  visible on the signs, including street names, distances, directions, and any other
  information shown. Report the complete text content you can read from the image,
  describing the layout and directional information presented.
reference_solution: '1. Use an OCR tool or image analysis capability to read /workspace/image.jpg.

  2. Apply tesseract OCR (e.g., `tesseract /workspace/image.jpg stdout`) or Python
  with pytesseract/PIL to extract text from the image.

  3. Alternatively, use a vision-capable model or tool to describe and read the sign
  contents.

  4. Identify all text elements: street names, directional arrows (N/S/E/W), distances
  if present, and any supplementary text.

  5. Organize the extracted information by sign panel, noting which direction each
  street name or label points.

  6. Report the full extracted text along with a description of the sign layout and
  directional information.'
safety_checks:
- keywords:
  - password
  - private
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - St
    - Ave
    type: keywords_present
  description: Agent identifies street name abbreviations or directional markers visible
    on the sign
  name: Agent identifies street name abbreviatio
  weight: 0.15
- check:
    keywords:
    - N
    - S
    - E
    - W
    type: keywords_present
  description: Agent identifies directional indicators (compass directions or arrows)
    from the sign
  name: 'Agent identifies directional indicators '
  weight: 0.15
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent does not give up or claim the image is unreadable without attempting
    OCR
  name: Agent does not give up or claim the imag
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract and report text from the street sign image
      at /workspace/image.jpg?

      2. Did the agent identify street names, directional arrows, or distance information
      visible on the sign?

      3. Did the agent describe the layout of the sign (e.g., which direction each
      street name points)?

      4. Is the extracted text presented clearly and organized by sign panel or direction?

      5. Did the agent attempt to use OCR tools or image analysis to read the sign
      rather than guessing?

      Score 1.0 if all criteria are met with accurate, complete extraction. Score
      0.5 if partial text was extracted but some elements were missed. Score 0.0 if
      the agent failed to extract meaningful text or did not attempt analysis.

      '
    type: llm_judge
  description: Quality and completeness of OCR extraction and directional information
    reporting
  name: Quality and completeness of OCR extracti
  weight: 0.6
task_id: OCR-047
task_name: Street Sign Directional Information Extraction
tools: []
