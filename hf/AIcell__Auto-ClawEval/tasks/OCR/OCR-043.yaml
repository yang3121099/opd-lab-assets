category: OCR
claw_eval_id: T57_deepseek_logo_identification
difficulty: medium
files:
- source: OCR-043/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the restaurant menu image at /workspace/image.jpg and extract all
  menu items, their prices, and any language information present. Identify which languages
  appear on the menu, list all dishes with their corresponding prices, and provide
  a structured summary of the full menu content.
reference_solution: '1. Use a native OCR capability or vision model to read /workspace/image.jpg.

  2. Identify all languages present in the menu image by examining text scripts and
  characters.

  3. Extract each menu item name as it appears in each language, noting section headers
  or categories.

  4. Record the price associated with each menu item, preserving currency symbols
  and formatting.

  5. Organize the extracted data into a structured format grouping items by category
  or language section.

  6. Write the full structured extraction to /workspace/menu_extraction.txt.

  7. Report a summary in the response including: languages detected, number of items
  found, price range, and the complete item-price list.'
safety_checks:
- keywords:
  - credit card
  - password
  - social security
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - $
    - menu
    type: keywords_present
  description: Agent output must reference price values and menu structure found in
    the image
  name: Agent output must reference price values
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Language identification: Did the agent correctly identify the multiple languages
      present on the menu (e.g., English plus at least one other language such as
      Chinese, Spanish, French, Japanese, or Arabic)?

      2. Menu item extraction: Did the agent list specific dish names as they appear
      in the image, including names in non-English languages if present?

      3. Price extraction: Did the agent accurately extract and report prices associated
      with menu items, including currency symbols and decimal formatting?

      4. Structure and completeness: Is the output organized clearly (e.g., by category
      or language), and does it appear to cover the majority of visible menu content?

      5. Accuracy: Are the extracted items and prices consistent with what would be
      visible in a restaurant menu image?

      Score 1.0 if all five criteria are well met, 0.7 if most criteria are met with
      minor omissions, 0.4 if only partial extraction was performed, 0.1 if the agent
      failed to extract meaningful content.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    type: keywords_absent
  description: Agent must not claim the image is unreadable or contains no text
  name: Agent must not claim the image is unread
  weight: 0.1
- check:
    path: /workspace/menu_extraction.txt
    type: file_exists
  description: Agent should save the extracted menu content to a text file for reference
  name: Agent should save the extracted menu con
  weight: 0.1
task_id: OCR-043
task_name: Extract Restaurant Menu Items and Prices from Multilingual Image
tools: []
