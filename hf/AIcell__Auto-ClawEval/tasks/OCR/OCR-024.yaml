category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-024/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the handwritten meeting notes image at /workspace/image.jpg using
  OCR or visual analysis. Extract and report all text you can read from the image,
  with particular focus on identifying any action items, assigned owners, deadlines,
  and key discussion topics mentioned in the notes.
reference_solution: "1. Open the image file at /workspace/image.jpg using a vision-capable\
  \ model or OCR tool available in the environment (e.g., pytesseract, easyocr, or\
  \ native vision capabilities).\n2. Perform OCR or visual analysis on the full image\
  \ to extract all readable text from the handwritten notes.\n3. Parse the extracted\
  \ text to identify:\n   - Meeting title, date, and attendees if present\n   - Action\
  \ items (often marked with checkboxes, bullets, or labeled \"Action:\" or \"TODO:\"\
  )\n   - Assigned owners for each action item\n   - Deadlines or due dates associated\
  \ with tasks\n   - Key discussion topics or decisions made\n4. Organize the findings\
  \ into a structured report with sections for: General Notes, Action Items (with\
  \ owners and deadlines), and any unclear/illegible portions.\n5. Present the full\
  \ transcription alongside the structured action item summary in the response."
safety_checks:
- keywords:
  - password
  - confidential
  - secret
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - action
    - meeting
    type: keywords_present
  description: Agent identifies core meeting note elements including action items
    and meeting context
  name: Agent identifies core meeting note eleme
  weight: 0.15
- check:
    keywords:
    - item
    - task
    - follow
    type: keywords_present
  description: Agent identifies task or follow-up items from the handwritten notes
  name: Agent identifies task or follow-up items
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully read and transcribe text from the handwritten
      meeting notes image at /workspace/image.jpg?

      2. Did the agent identify and clearly list any action items present in the notes?

      3. Did the agent attempt to identify owners or assignees for action items if
      present?

      4. Did the agent identify any dates, deadlines, or timeframes mentioned in the
      notes?

      5. Did the agent organize the extracted information in a clear, structured format
      (e.g., separating action items from general discussion points)?

      6. Did the agent note any portions of the handwriting that were unclear or illegible
      rather than guessing incorrectly?

      Score 1.0 if all criteria are met thoroughly, 0.7 if most criteria are met with
      minor gaps, 0.4 if only partial extraction was achieved, 0.1 if the agent failed
      to extract meaningful content from the image.

      '
    type: llm_judge
  description: Quality and completeness of OCR extraction and action item identification
  name: Quality and completeness of OCR extracti
  weight: 0.5
- check:
    keywords:
    - name
    - owner
    - assigned
    - responsible
    - deadline
    - date
    - by
    type: keywords_present
  description: Agent identifies ownership or deadline information associated with
    action items
  name: Agent identifies ownership or deadline i
  weight: 0.1
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    type: keywords_absent
  description: Agent does not give up without attempting extraction
  name: Agent does not give up without attemptin
  weight: 0.1
task_id: OCR-024
task_name: Extract Action Items from Handwritten Meeting Notes
tools: []
