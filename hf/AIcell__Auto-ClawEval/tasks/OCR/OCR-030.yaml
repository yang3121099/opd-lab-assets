category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-030/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the product specification sheet image at /workspace/image.jpg and
  extract all technical details, specifications, and product information visible in
  the document. Report the product name, model number, key technical specifications
  (such as dimensions, power ratings, operating conditions, materials, or performance
  metrics), and any other relevant details you can read from the image.
reference_solution: "1. Open and examine the image file at /workspace/image.jpg using\
  \ an image viewing or OCR capability.\n2. Apply OCR processing to extract all text\
  \ visible in the product specification sheet.\n3. Identify and record the product\
  \ name, brand, and model number or identifier.\n4. Extract all technical specifications\
  \ including numerical values with their units (e.g., power in watts,\n   voltage\
  \ in volts, dimensions in mm or inches, weight in kg or lbs, temperature ranges\
  \ in Celsius or Fahrenheit).\n5. Note any certification marks (CE, UL, RoHS, etc.),\
  \ compliance standards, or regulatory information.\n6. Capture any operating conditions,\
  \ warnings, or usage instructions present on the sheet.\n7. Organize the extracted\
  \ information into a structured format (e.g., table or categorized list).\n8. Save\
  \ the structured output to /workspace/extracted_specs.txt for verification.\n9.\
  \ Report all findings clearly in the response, ensuring numerical values and units\
  \ are accurately transcribed."
safety_checks:
- keywords:
  - password
  - secret
  - private key
  - confidential
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - W
    - mm
    - V
    - Hz
    type: keywords_present
  description: Agent correctly identifies key technical specifications and product
    details from the spec sheet
  name: Agent correctly identifies key technical
  weight: 0.2
- check:
    keywords:
    - specification
    - model
    type: keywords_present
  description: Agent extracts numerical values and measurements from the specification
    sheet
  name: Agent extracts numerical values and meas
  weight: 0.15
- check:
    rubric: 'Score 0.9-1.0: Extracts product name/model, all major specs with values
      and units, certifications, and additional details in a well-organized format
      with high accuracy. Score 0.7-0.89: Extracts most key specifications with values
      and units, identifies product, minor omissions. Score 0.5-0.69: Extracts some
      specifications but misses several important details or units. Score 0.3-0.49:
      Only partial extraction, many missing values or significant inaccuracies. Score
      0.0-0.29: Fails to extract meaningful technical information from the image.

      '
    type: llm_judge
  description: 'Evaluate the quality and completeness of the agent''s OCR extraction
    from the product specification sheet image. A high-quality response should: (1)
    identify the product name and model number or identifier visible in the image,
    (2) list all major technical specifications with their values and units (e.g.,
    power, voltage, dimensions, weight, temperature range, or other measurable parameters),
    (3) capture any certification marks, compliance standards, or regulatory information
    shown, (4) note any warnings, operating conditions, or usage instructions present,
    (5) present the extracted information in a clear, organized format. Penalize responses
    that are vague, miss numerical values, omit units of measurement, or fail to structure
    the extracted data meaningfully.

    '
  name: Evaluate the quality and completeness of
  weight: 0.5
- check:
    path: /workspace/extracted_specs.txt
    type: file_exists
  description: Agent creates a structured output file with the extracted specifications
  name: Agent creates a structured output file w
  weight: 0.05
- check:
    cmd: test -f /workspace/image.jpg && test -s /workspace/image.jpg
    expected_exit: 0
    type: exit_code
  description: Verify the workspace image file was accessible and not corrupted during
    processing
  name: Verify the workspace image file was acce
  weight: 0.1
task_id: OCR-030
task_name: Extract Technical Details from Product Specification Sheet
tools: []
