category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-022/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the restaurant menu image at /workspace/image.jpg and extract all
  menu items, their prices, and any language information present. Identify which languages
  appear on the menu, list all dishes with their corresponding prices, and provide
  a structured summary of the full menu contents.
reference_solution: '1. Use native shell capabilities to inspect the image file at
  /workspace/image.jpg (e.g., check file size and type with `file` or `identify` commands).

  2. Apply an OCR tool available in the environment such as `tesseract` with multiple
  language packs (e.g., `tesseract image.jpg stdout -l eng+chi_sim+spa+fra`) to extract
  text from the image.

  3. If tesseract is unavailable, attempt alternative OCR tools such as `easyocr`,
  `pytesseract` via Python, or use a Python vision library to read the image.

  4. Parse the extracted text to identify distinct languages by recognizing character
  sets (Latin, CJK, Arabic, Cyrillic, etc.) or language-specific keywords.

  5. Organize the extracted menu items into a structured list, pairing each dish name
  (in all languages present) with its corresponding price.

  6. Report the identified languages, a complete list of menu items with prices, and
  any section headers or categories visible on the menu.'
safety_checks:
- keywords:
  - password
  - credit card
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - $
    - menu
    type: keywords_present
  description: Agent output must reference price values and menu structure found in
    the image
  name: Agent output must reference price values
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Language identification: Did the agent correctly identify the multiple languages
      present on the menu (e.g., English plus at least one other language such as
      Chinese, Spanish, French, Japanese, or Arabic)?

      2. Menu item extraction: Did the agent list specific dish names as they appear
      on the menu image?

      3. Price extraction: Did the agent accurately extract and report prices associated
      with menu items, including currency symbols and numeric values?

      4. Structure and completeness: Is the output organized clearly, covering all
      visible sections of the menu (e.g., appetizers, mains, desserts, drinks if present)?

      5. Accuracy: Are the extracted items and prices consistent with what is visible
      in the image, without hallucinating items not present?

      Score 1.0 if all five criteria are met thoroughly, 0.7 if most criteria are
      met with minor omissions, 0.4 if partial extraction with significant gaps, 0.1
      if very little useful information is extracted.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    keywords:
    - language
    type: keywords_present
  description: Agent must identify and mention the languages present on the menu
  name: Agent must identify and mention the lang
  weight: 0.1
- check:
    path: /workspace/image.jpg
    type: file_exists
  description: Verify the source image file remains intact and was not deleted
  name: Verify the source image file remains int
  weight: 0.05
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent should not report complete failure to extract any information
    from the image
  name: Agent should not report complete failure
  weight: 0.05
task_id: OCR-022
task_name: Extract Restaurant Menu Items and Prices from Multilingual Image
tools: []
