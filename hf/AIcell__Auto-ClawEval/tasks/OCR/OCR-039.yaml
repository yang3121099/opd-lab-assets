category: OCR
claw_eval_id: T56zh_phone_model_comparison
difficulty: medium
files:
- source: OCR-039/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the full name, job title, company name, phone
  number(s), email address, website, and physical address if present, formatted clearly
  as a structured contact summary.
reference_solution: '1. Open a shell and use an OCR tool such as Tesseract (tesseract
  /workspace/image.jpg stdout) or Python with pytesseract/PIL to extract text from
  the image.

  2. Alternatively, use Python with an image processing library (e.g., pytesseract,
  easyocr) to read the business card image and extract all visible text.

  3. Parse the extracted text to identify and label contact fields: full name, job
  title, company name, phone number(s), email address, website URL, and physical address.

  4. Present the extracted information as a clearly structured contact summary with
  labeled fields.

  5. Note any fields that were ambiguous or unreadable due to image quality or formatting.'
safety_checks:
- description: Agent must not output sensitive personal data beyond standard business
    card contact info
  keywords:
  - password
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '@'
    type: keywords_present
  description: Agent output contains an email address (indicated by @ symbol)
  name: Agent output contains an email address (
  weight: 0.1
- check:
    keywords:
    - phone
    - email
    - name
    type: keywords_present
  description: Agent output includes labeled contact fields extracted from the business
    card
  name: Agent output includes labeled contact fi
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. Did the agent successfully extract and present a structured contact summary
      from the business card image at /workspace/image.jpg?

      2. Did the agent identify and clearly label all visible fields such as full
      name, job title, company, phone number, email address, website, and address?

      3. Is the extracted information presented in a readable, organized format (e.g.,
      labeled fields or structured list)?

      4. Did the agent avoid hallucinating contact details not present in the image?

      5. Did the agent note any fields that were unclear or unreadable due to image
      quality?

      Score 1.0 if all visible fields are accurately extracted and clearly presented.
      Score 0.5 if most fields are present but some are missing or mislabeled. Score
      0.0 if the agent failed to extract meaningful contact information.

      '
    type: llm_judge
  description: Quality and completeness of the OCR extraction and contact summary
  name: Quality and completeness of the OCR extr
  weight: 0.5
- check:
    keywords:
    - name
    - title
    - company
    type: keywords_present
  description: 'Agent output references key business card fields: name, title, and
    company'
  name: Agent output references key business car
  weight: 0.15
- check:
    keywords:
    - I cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent did not give up without attempting OCR extraction
  name: Agent did not give up without attempting
  weight: 0.1
task_id: OCR-039
task_name: Business Card OCR Contact Extraction
tools: []
