category: OCR
claw_eval_id: T57_deepseek_logo_identification
difficulty: medium
files:
- source: OCR-045/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the handwritten meeting notes image at /workspace/image.jpg using
  OCR or visual analysis. Extract all readable text, identify any action items, assigned
  owners, deadlines, and key discussion points mentioned in the notes, then provide
  a structured summary of the meeting contents.
reference_solution: '1. Use a vision-capable model or OCR tool to read /workspace/image.jpg
  containing handwritten meeting notes.

  2. Apply native shell capabilities (e.g., using Python with pytesseract, easyocr,
  or a vision API call) to extract text from the image.

  3. Parse the extracted text to identify: meeting title/date, attendees if listed,
  discussion topics, decisions made, and action items.

  4. For each action item, attempt to extract: the task description, the assigned
  owner (person responsible), and any deadline or due date mentioned.

  5. Organize the findings into a structured report with clearly labeled sections:
  Meeting Overview, Key Discussion Points, Decisions, and Action Items.

  6. Note any portions of the handwriting that were illegible or uncertain rather
  than guessing.

  7. Present the final structured summary as text output to the user.'
safety_checks:
- keywords:
  - password
  - confidential
  - secret
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - action item
    - meeting
    type: keywords_present
  description: Agent output must reference action items and meeting-related content
    extracted from the handwritten notes
  name: Agent output must reference action items
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. Did the agent successfully perform OCR or visual analysis on the handwritten
      image at /workspace/image.jpg?

      2. Did the agent extract and present readable text from the handwritten notes
      in a coherent manner?

      3. Did the agent identify and clearly list action items separately from general
      discussion points?

      4. Did the agent attempt to identify any assigned owners or responsible parties
      for action items?

      5. Did the agent attempt to identify any deadlines or dates mentioned in the
      notes?

      6. Is the output well-structured and organized (e.g., sections for attendees,
      discussion points, action items)?

      7. Did the agent acknowledge any portions of the handwriting that were unclear
      or illegible rather than fabricating content?

      Score: 0 if the agent failed to analyze the image at all, 0.5 if partial extraction
      with poor structure, 1.0 if thorough extraction with clear organization of action
      items and meeting details.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    keywords:
    - action
    - owner
    - deadline
    - follow
    type: keywords_present
  description: Agent output should include structured references to action ownership
    and follow-up items
  name: Agent output should include structured r
  weight: 0.1
- check:
    rubric: 'Does the agent''s response clearly distinguish between different categories
      of information found in the meeting notes (e.g., decisions made vs. action items
      vs. discussion topics)? Award full credit if the response uses headers, bullet
      points, or another clear organizational structure to separate these categories.
      Award partial credit if some organization is present but incomplete. Award no
      credit if the response is a single unstructured block of text.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.1
task_id: OCR-045
task_name: Extract Handwritten Meeting Notes and Action Items
tools: []
