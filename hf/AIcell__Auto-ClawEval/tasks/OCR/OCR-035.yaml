category: OCR
claw_eval_id: T56zh_phone_model_comparison
difficulty: medium
files:
- source: OCR-035/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg and identify
  all labeled components, text, arrows, and structural elements visible in the diagram.
  Provide a detailed description of what the diagram shows, including all readable
  text labels, the relationships between components, and the overall purpose or topic
  of the diagram.
reference_solution: '1. Use native image reading capabilities or an OCR tool available
  in the shell environment (such as tesseract) to process /workspace/image.jpg. 2.
  If using tesseract, run a command like: tesseract /workspace/image.jpg stdout to
  extract raw text from the image. 3. Visually inspect or programmatically analyze
  the image to identify all labeled boxes, arrows, and connecting elements in the
  whiteboard diagram. 4. Compile a structured description listing all text labels
  found, the components they belong to, and the relationships indicated by arrows
  or lines. 5. Summarize the overall topic or system being depicted in the diagram
  based on the extracted content. 6. Report all findings as a clear textual output
  describing the diagram''s components and their relationships.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - diagram
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - label
    - component
    - arrow
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    rubric: 'The agent should provide a thorough OCR-based analysis of the whiteboard
      diagram in /workspace/image.jpg. Evaluate whether the agent: (1) successfully
      reads and reports all visible text labels and annotations from the whiteboard,
      (2) describes the structural layout and relationships between labeled components
      such as boxes, arrows, or connecting lines, (3) identifies the overall topic
      or purpose of the diagram based on the content, (4) organizes the extracted
      information in a clear and logical manner. Award full marks if the agent extracts
      all major text elements and accurately describes the diagram structure and component
      relationships. Deduct points for missing labels, misread text, or failure to
      describe how components relate to each other.'
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - text
    - box
    - connection
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  name: keywords_absent
  weight: 0.1
task_id: OCR-035
task_name: Whiteboard Diagram OCR and Component Analysis
tools: []
