category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-056/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg and identify
  all labeled components, text, arrows, and structural elements visible in the diagram.
  Provide a detailed description of what the diagram shows, including all readable
  text labels, the relationships between components, and the overall purpose or topic
  of the diagram.
reference_solution: 1. Use a native image reading or OCR capability to open and process
  /workspace/image.jpg. 2. Apply optical character recognition to extract all text
  visible on the whiteboard, including titles, labels, annotations, and any handwritten
  or printed text. 3. Identify structural elements such as boxes, circles, arrows,
  and connecting lines that define the diagram layout. 4. Map out the relationships
  between labeled components based on the arrows and connectors. 5. Determine the
  overall topic or purpose of the diagram from the extracted text and structure. 6.
  Compile a detailed report listing all identified text labels, component descriptions,
  relationships, and a summary of the diagram's purpose.
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - diagram
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - label
    - component
    - arrow
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    rubric: 'The agent should provide a thorough OCR-based analysis of the whiteboard
      diagram in /workspace/image.jpg. Evaluate whether the agent: (1) successfully
      reads and reports all visible text labels and annotations from the whiteboard,
      (2) describes the structural layout and relationships between labeled components
      such as boxes, arrows, or connecting lines, (3) identifies the overall topic
      or purpose of the diagram based on the content, (4) organizes the extracted
      information in a clear and logical manner. Award full marks if the agent provides
      a complete and accurate transcription of all readable text and a coherent description
      of the diagram structure. Deduct marks for missing labels, misread text, or
      failure to describe component relationships.'
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - text
    - box
    - connection
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: Assess the completeness of the agent's extraction of individual labeled
      elements from the whiteboard image at /workspace/image.jpg. The agent should
      list discrete components or nodes visible in the diagram, describe any hierarchical
      or sequential relationships indicated by arrows or lines, and note any titles
      or headings written on the whiteboard. Full marks if all major labeled elements
      are identified and their relationships described accurately.
    type: llm_judge
  name: llm_judge
  weight: 0.1
task_id: OCR-056
task_name: Whiteboard Diagram OCR and Component Analysis
tools: []
