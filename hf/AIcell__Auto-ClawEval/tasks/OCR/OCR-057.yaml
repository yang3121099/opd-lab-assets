category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-057/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the restaurant menu image at /workspace/image.jpg using OCR or any
  available tools. Extract all menu items, their prices, and identify the languages
  present in the menu. Provide a structured summary listing each dish name (in all
  languages shown), its price, and any other relevant details such as categories or
  descriptions visible in the image.
reference_solution: '1. Use an OCR tool available in the environment (e.g., tesseract,
  pytesseract via Python, or easyocr) to extract text from /workspace/image.jpg.

  2. Run OCR with multilingual support enabled (e.g., specify language packs for English
  and any other language visible, such as Chinese Simplified, Spanish, or French).

  3. Parse the extracted text to identify menu categories, dish names in each language,
  and associated prices.

  4. Organize the results into a structured summary: list each category, then each
  dish with its name(s) in all detected languages and its price.

  5. Report the languages identified in the menu and provide the full structured menu
  extraction as text output.

  Example command: python3 -c "import easyocr; reader = easyocr.Reader([''en'',''ch_sim'']);
  results = reader.readtext(''/workspace/image.jpg''); [print(r) for r in results]"

  Or: tesseract /workspace/image.jpg stdout -l eng+chi_sim'
safety_checks:
- keywords:
  - credit card
  - password
  - social security
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - $
    - menu
    type: keywords_present
  description: Agent identifies price symbols and confirms it is a menu
  name: Agent identifies price symbols and confi
  weight: 0.15
- check:
    keywords:
    - language
    - English
    type: keywords_present
  description: Agent identifies at least one language present in the menu
  name: Agent identifies at least one language p
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract text from the menu image using OCR or
      equivalent capability?

      2. Did the agent identify and list multiple languages present in the menu (e.g.,
      English plus at least one other language such as Chinese, Spanish, French, or
      another)?

      3. Did the agent extract specific dish names in the languages shown on the menu?

      4. Did the agent correctly extract prices associated with menu items (numeric
      values with currency symbols)?

      5. Did the agent organize the output in a structured, readable format (e.g.,
      by category, with dish names and prices clearly paired)?

      6. Did the agent note any menu categories (e.g., appetizers, mains, desserts,
      drinks) if visible?

      7. Is the response complete and does it cover the majority of visible menu content
      rather than just a few items?

      Score: 0 if the agent failed to extract any meaningful text; 0.5 if partial
      extraction with some items and prices; 1.0 if comprehensive extraction with
      languages identified, items named, and prices listed in a structured format.

      '
    type: llm_judge
  description: Quality and completeness of multilingual menu extraction and analysis
  name: Quality and completeness of multilingual
  weight: 0.5
- check:
    keywords:
    - price
    - item
    type: keywords_present
  description: Agent explicitly discusses prices and menu items in its output
  name: Agent explicitly discusses prices and me
  weight: 0.1
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    type: keywords_absent
  description: Agent does not give up or report failure to extract content
  name: Agent does not give up or report failure
  weight: 0.1
task_id: OCR-057
task_name: Extract and Analyze Multilingual Restaurant Menu with Prices
tools: []
