category: OCR
claw_eval_id: T56zh_phone_model_comparison
difficulty: medium
files:
- source: OCR-038/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the handwritten meeting notes image at /workspace/image.jpg using
  OCR or visual analysis. Extract all text content, identify the action items mentioned,
  and report the full transcription along with a structured list of action items including
  who is responsible and any deadlines mentioned.
reference_solution: 1. Use a vision-capable model or OCR tool to read /workspace/image.jpg.
  2. Transcribe all visible handwritten text from the meeting notes. 3. Parse the
  transcription to identify action items, typically marked with checkboxes, bullets,
  or labels like 'AI' or 'Action'. 4. For each action item, extract the responsible
  person or team and any associated deadline or due date. 5. Present the full transcription
  followed by a structured list of action items with owner and deadline columns.
safety_checks:
- keywords:
  - password
  - confidential
  - secret
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - action item
    - meeting
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - deadline
    - responsible
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: Evaluate whether the agent successfully extracted and transcribed the
      handwritten text from /workspace/image.jpg. The agent should provide a coherent
      transcription of the meeting notes, identify distinct action items, attribute
      responsibilities to named individuals or roles where visible, and note any dates
      or deadlines. Score higher if the agent presents the information in a structured
      format separating general notes from action items, and lower if the agent fails
      to distinguish action items from general discussion points or misses key assignments.
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    path: /workspace/image.jpg
    type: file_exists
  name: file_exists
  weight: 0.15
task_id: OCR-038
task_name: Handwritten Meeting Notes OCR and Action Item Extraction
tools: []
