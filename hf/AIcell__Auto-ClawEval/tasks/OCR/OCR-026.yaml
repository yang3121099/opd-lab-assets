category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-026/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the street sign image at /workspace/image.jpg and extract all text
  visible on the signs, including street names, directional arrows, distances, and
  any other information shown. Report the complete text content of every sign visible
  in the image, describing the layout and directional information provided.
reference_solution: '1. Open and examine /workspace/image.jpg using an image viewing
  or OCR tool available in the shell environment (e.g., tesseract, python with PIL/pytesseract,
  or similar).

  2. Run OCR on the image to extract all visible text from the street signs.

  3. Identify and list every piece of text visible, including street names, directional
  labels (N, S, E, W, or spelled out), and any distances or numbers.

  4. Describe the physical layout of the signs — how many signs are present, their
  colors, shapes, and relative positions.

  5. Interpret the directional arrows or indicators and explain what navigation information
  the signs convey.

  6. Report the complete findings in a clear, structured format covering all text,
  directions, and contextual details visible in the image.'
safety_checks:
- keywords:
  - password
  - private
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - STOP
    type: keywords_present
  description: Agent identifies key sign text visible in the image
  name: Agent identifies key sign text visible i
  weight: 0.1
- case_sensitive: false
  check:
    keywords:
    - street
    - ave
    - rd
    - blvd
    - lane
    - way
    - drive
    type: keywords_present
  description: Agent identifies road type designations from the sign
  name: 'Agent identifies road type designations '
  weight: 0.2
- case_sensitive: false
  check:
    keywords:
    - north
    - south
    - east
    - west
    - left
    - right
    - arrow
    - direction
    type: keywords_present
  description: Agent identifies directional information from the sign
  name: Agent identifies directional information
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract and report all visible text from the street
      sign image at /workspace/image.jpg?

      2. Did the agent accurately describe the directional information shown (arrows,
      compass directions, or turn indicators)?

      3. Did the agent describe the layout and arrangement of the signs (e.g., multiple
      signs stacked, colors, shapes)?

      4. Did the agent report any distances, numbers, or supplementary information
      visible on the signs?

      5. Is the response well-organized and clearly communicates what a driver would
      need to know from these signs?

      Score 1.0 if all visible text is accurately extracted and directional context
      is fully explained.

      Score 0.7 if most text is captured but minor details are missing.

      Score 0.4 if only partial text is extracted or directional information is vague.

      Score 0.1 if the agent fails to extract meaningful text or misidentifies the
      sign contents.

      '
    type: llm_judge
  description: Quality and completeness of OCR and directional information analysis
  name: Quality and completeness of OCR and dire
  weight: 0.55
task_id: OCR-026
task_name: Street Sign Directional Information Extraction
