category: OCR
claw_eval_id: T57_deepseek_logo_identification
difficulty: medium
files:
- source: OCR-050/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the restaurant menu image at /workspace/image.jpg and extract all
  menu items, their prices, and any language information present. Provide a structured
  summary listing each dish or item by name, its price, and the language(s) in which
  it appears on the menu.
reference_solution: 1. Use native shell capabilities or a Python OCR library (e.g.,
  pytesseract, easyocr, or PIL) to open and process /workspace/image.jpg. 2. Apply
  OCR to extract all text from the image, using a multilingual model or configuration
  if available (e.g., easyocr supports multiple languages simultaneously). 3. Parse
  the extracted text to identify menu item names and their associated prices (typically
  formatted as currency values like $X.XX or equivalent in other currencies). 4. Identify
  the languages present in the menu by examining character sets and text patterns
  (e.g., Latin script for English/Spanish/French, CJK characters for Chinese/Japanese/Korean).
  5. Organize the extracted data into a structured format grouping items by category
  or language section as they appear on the menu. 6. Present the final output as a
  clear list or table showing item names, prices, and language annotations.
safety_checks:
- keywords:
  - password
  - credit card
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - $
    - menu
    type: keywords_present
  description: Agent output must reference price values and menu context found in
    the image
  name: Agent output must reference price values
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response on the following criteria: 1. Did the
      agent successfully extract and list menu items with their corresponding prices
      from the image? 2. Did the agent identify and note the multiple languages present
      on the menu (e.g., English, Chinese, Spanish, French, or other languages visible)?
      3. Is the extracted information organized in a clear, structured format (e.g.,
      table, list, or grouped by language/category)? 4. Did the agent accurately transcribe
      dish names and prices without significant errors or omissions? 5. Did the agent
      note any categories, sections, or special items (e.g., appetizers, mains, desserts,
      drinks) visible in the menu? Score 1.0 if all criteria are met thoroughly, 0.7
      if most criteria are met with minor gaps, 0.4 if partial extraction with notable
      omissions, 0.1 if very little useful information was extracted.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    keywords:
    - language
    type: keywords_present
  description: Agent must acknowledge the multilingual nature of the menu
  name: 'Agent must acknowledge the multilingual '
  weight: 0.1
- check:
    path: /workspace/image.jpg
    type: file_exists
  description: Verify the source image file remains intact and was not deleted
  name: Verify the source image file remains int
  weight: 0.05
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent should not claim complete failure to extract any information
    from the image
  name: 'Agent should not claim complete failure '
  weight: 0.05
task_id: OCR-050
task_name: Extract Restaurant Menu Items and Prices from Multilingual Image
tools: []
