category: OCR
claw_eval_id: T51zh_su7_price_from_image
difficulty: medium
files:
- source: OCR-007/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg and identify
  all labeled components, text, arrows, and structural elements visible in the diagram.
  Provide a detailed description of what the diagram shows, including all readable
  text labels, the relationships between components, and the overall purpose or topic
  of the diagram.
reference_solution: '1. Use a native image viewing or OCR capability to open and read
  /workspace/image.jpg.

  2. Apply OCR or visual analysis to extract all text labels visible on the whiteboard.

  3. Identify structural elements such as boxes, circles, arrows, lines, and groupings.

  4. Map out the relationships between labeled components based on connecting arrows
  or lines.

  5. Describe the overall layout and infer the topic or purpose of the diagram.

  6. Report all findings as a structured text output, listing each identified component,
  its label, and its relationship to other components.'
safety_checks:
- keywords:
  - password
  - secret
  - private key
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - diagram
    type: keywords_present
  description: Agent identifies the image as a whiteboard diagram
  name: Agent identifies the image as a whiteboa
  weight: 0.15
- check:
    keywords:
    - component
    - label
    - arrow
    - box
    - node
    - block
    - element
    type: keywords_present
  description: Agent identifies structural elements such as boxes, arrows, nodes,
    or labeled components in the diagram
  name: Agent identifies structural elements suc
  weight: 0.2
- check:
    rubric: 'Evaluate whether the agent has thoroughly analyzed the whiteboard diagram
      image at /workspace/image.jpg. The agent should: (1) identify and list all readable
      text labels present on the whiteboard, (2) describe the relationships or connections
      shown between components (e.g., arrows, lines, groupings), (3) describe the
      overall structure or layout of the diagram, (4) infer or state the apparent
      topic or purpose of the diagram based on its content. A high-quality response
      will be specific, organized, and demonstrate that the agent actually read the
      image content rather than providing generic descriptions. Penalize vague or
      generic responses that do not reference specific text or visual elements from
      the image.'
    type: llm_judge
  description: Quality and completeness of the whiteboard diagram analysis
  name: Quality and completeness of the whiteboa
  weight: 0.5
- check:
    keywords:
    - cannot read
    - unable to analyze
    - no text visible
    - image is blank
    - cannot process
    type: keywords_absent
  description: Agent does not claim the image is unreadable or blank without attempting
    analysis
  name: Agent does not claim the image is unread
  weight: 0.15
task_id: OCR-007
task_name: Whiteboard Diagram OCR and Component Analysis
tools: []
