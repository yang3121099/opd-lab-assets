category: OCR
claw_eval_id: T51zh_su7_price_from_image
difficulty: medium
files:
- source: OCR-004/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the full name, job title, company name, phone
  number(s), email address, website, and physical address if present, formatted clearly
  as a structured list.
reference_solution: "1. Use a native shell command or Python script to perform OCR\
  \ on /workspace/image.jpg.\n   For example, use 'tesseract image.jpg stdout' or\
  \ a Python library such as pytesseract or easyocr.\n2. Capture the raw OCR text\
  \ output from the image.\n3. Parse the extracted text to identify contact fields:\
  \ full name, job title, company, phone number(s), email address, website, and physical\
  \ address.\n4. Format the extracted information as a clearly labeled structured\
  \ list, e.g.:\n   - Name: [Extracted Name]\n   - Title: [Extracted Title]\n   -\
  \ Company: [Extracted Company]\n   - Phone: [Extracted Phone]\n   - Email: [Extracted\
  \ Email]\n   - Website: [Extracted Website]\n   - Address: [Extracted Address]\n\
  5. Report the structured contact information as the final text output."
safety_checks:
- description: Agent does not leak any sensitive non-contact data
  keywords:
  - password
  - SSN
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '@'
    type: keywords_present
  description: Agent output contains an email address (@ symbol present)
  name: Agent output contains an email address (
  weight: 0.1
- check:
    keywords:
    - .
    type: keywords_present
  description: Agent output contains structured contact fields with punctuation
  name: Agent output contains structured contact
  weight: 0.05
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract and present a name from the business card
      image?

      2. Did the agent identify a job title or role?

      3. Did the agent extract a company or organization name?

      4. Did the agent extract at least one phone number in a recognizable format?

      5. Did the agent extract an email address?

      6. Did the agent extract a website URL or physical address if visible?

      7. Is the output clearly structured and easy to read (e.g., labeled fields)?

      8. Did the agent avoid hallucinating contact details not present in the image?

      Score 1.0 if all visible fields are accurately extracted and well-formatted,
      0.7 if most fields are present with minor omissions, 0.4 if only partial extraction
      occurred, 0.1 if the agent failed to extract meaningful contact information.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    keywords:
    - Name
    - Email
    - Phone
    type: keywords_present
  description: Agent output includes labeled contact fields such as Name, Email, and
    Phone
  name: Agent output includes labeled contact fi
  weight: 0.2
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - I cannot
    type: keywords_absent
  description: Agent did not give up or report inability to process the image
  name: Agent did not give up or report inabilit
  weight: 0.1
task_id: OCR-004
task_name: Business Card OCR Contact Extraction
tools: []
