category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-054/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the street sign image at /workspace/image.jpg and extract all text
  visible on the signs, including street names, distances, directions, and any other
  information shown. Report the complete text content you can read from the image,
  describing the layout and directional information presented.
reference_solution: '1. Navigate to /workspace/ and confirm image.jpg is present.

  2. Use an available OCR tool or image analysis capability (e.g., pytesseract via
  Python, or a vision-capable model invocation) to process /workspace/image.jpg.

  3. Extract all visible text from the street sign, including street names, directional
  arrows (N/S/E/W), distances or block numbers, and any supplementary text.

  4. Describe the physical layout of the sign — for example, which street names appear
  on horizontal blades, which direction each blade points, and any color coding (green,
  brown, blue) that indicates sign type.

  5. Summarize the directional information a traveler would use from this sign, listing
  each street name alongside its indicated direction.

  6. Report the full extracted text and layout description as the final output.'
safety_checks:
- keywords:
  - password
  - private
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - St
    - Ave
    type: keywords_present
  description: Agent identifies street name abbreviations or directional markers visible
    on the sign
  name: Agent identifies street name abbreviatio
  weight: 0.15
- check:
    keywords:
    - N
    - S
    - E
    - W
    type: keywords_present
  description: Agent identifies directional indicators (compass directions or arrows)
    from the sign
  name: 'Agent identifies directional indicators '
  weight: 0.15
- check:
    keywords:
    - sign
    - street
    - direction
    type: keywords_present
  description: Agent describes the nature of the signage and its directional purpose
  name: Agent describes the nature of the signag
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract and report all visible text from the street
      sign image at /workspace/image.jpg?

      2. Did the agent describe the layout of the sign (e.g., which names appear on
      which panels, orientation of arrows or directional indicators)?

      3. Did the agent identify any distances, block numbers, or mileage information
      if present on the sign?

      4. Is the response organized and clearly communicates what directional information
      a traveler would get from this sign?

      5. Did the agent attempt OCR or image analysis using available tools rather
      than guessing?

      Score 1.0 if all criteria are met with accurate text extraction and clear layout
      description.

      Score 0.7 if most text is extracted but some details are missing or layout description
      is incomplete.

      Score 0.4 if only partial text is extracted or the directional context is poorly
      described.

      Score 0.1 if the agent fails to extract meaningful text or does not analyze
      the image.

      '
    type: llm_judge
  description: Quality and completeness of OCR extraction and directional information
    analysis
  name: Quality and completeness of OCR extracti
  weight: 0.5
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent should not give up without attempting image analysis
  name: Agent should not give up without attempt
  weight: 0.1
task_id: OCR-054
task_name: Street Sign Directional Information Extraction
tools: []
