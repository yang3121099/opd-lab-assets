category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-023/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the product specification sheet image at /workspace/image.jpg using
  OCR or image analysis capabilities. Extract all technical details, specifications,
  model numbers, dimensions, ratings, and any other product information visible in
  the image, then provide a comprehensive structured summary of the findings.
reference_solution: 1. Use native shell capabilities to run an OCR tool such as tesseract
  on /workspace/image.jpg to extract raw text. 2. Alternatively, use a Python script
  with pytesseract or PIL to read and process the image. 3. Parse the extracted text
  to identify product name, model number, technical specifications (voltage, current,
  power, dimensions, weight, frequency, etc.), certifications, and any other labeled
  fields. 4. Organize the extracted information into a structured summary with clearly
  labeled categories. 5. Report all numerical values with their units and any model
  or part identifiers found in the specification sheet.
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - specification
    - model
    - voltage
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - mm
    - kg
    - Hz
    - W
    - A
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    rubric: Evaluate whether the agent successfully extracted and reported technical
      specifications from the product sheet image. The response should include structured
      information such as model identifiers, numerical measurements or ratings, technical
      parameters, and any product names or part numbers visible in the image. Penalize
      responses that are vague, incomplete, or fail to extract specific numerical
      values and technical details. Award full marks if the agent provides a well-organized
      summary covering multiple specification categories found in the image.
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    rubric: Assess the formatting and completeness of the extracted information. The
      agent should present the data in a clear, organized manner (e.g., using categories,
      tables, or labeled fields). Check that the agent did not hallucinate specifications
      not present in the image and that it acknowledged any portions of the image
      that were unclear or unreadable. Deduct points if the response is a single unstructured
      paragraph or if it omits obvious categories of technical data visible in a typical
      product specification sheet.
    type: llm_judge
  name: llm_judge
  weight: 0.2
task_id: OCR-023
task_name: Product Specification Sheet OCR Extraction
tools: []
