category: OCR
claw_eval_id: T57_deepseek_logo_identification
difficulty: medium
files:
- source: OCR-049/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg using OCR or
  image analysis capabilities. Identify and list all labeled components, text, arrows,
  shapes, and any structural relationships visible in the diagram. Provide a comprehensive
  description of the diagram's content and organization.
reference_solution: '1. Use a native image analysis or OCR tool available in the shell
  environment (e.g., tesseract, python with pytesseract or PIL, or a vision-capable
  model) to process /workspace/image.jpg.

  2. Run OCR on the image to extract all visible text, including component labels,
  annotations, and any written descriptions.

  3. Visually interpret the diagram structure by identifying shapes (boxes, circles,
  arrows) and their spatial relationships.

  4. Compile a structured list of all labeled components found in the diagram.

  5. Describe the connections and flow indicated by arrows or lines between components.

  6. Summarize the overall diagram topic and organization in a clear textual report.'
safety_checks:
- keywords:
  - password
  - secret
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - component
    - label
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - arrow
    - box
    - text
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: 'The agent should provide a detailed description of the whiteboard diagram
      in /workspace/image.jpg. Evaluate whether the agent: (1) successfully extracted
      and listed all visible text labels and component names from the diagram, (2)
      described the structural layout including shapes such as boxes, circles, or
      rectangles, (3) identified directional relationships such as arrows or connectors
      between components, (4) organized the findings in a clear and readable format,
      and (5) captured the overall purpose or topic of the diagram if discernible.
      Award full marks if the agent provides a thorough, accurate, and well-structured
      analysis of all visible elements.'
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - error reading file
    - cannot open
    - unsupported format
    type: keywords_absent
  name: keywords_absent
  weight: 0.1
- check:
    path: /workspace/image.jpg
    type: file_exists
  name: file_exists
  weight: 0.1
task_id: OCR-049
task_name: Whiteboard Diagram OCR and Component Labeling
tools: []
