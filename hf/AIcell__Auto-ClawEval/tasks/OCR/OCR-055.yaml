category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-055/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the invoice image at /workspace/image.jpg using OCR or image analysis
  capabilities. Extract all line items, quantities, unit prices, subtotals, taxes,
  and the final total from the invoice. Report the complete breakdown of all charges
  and the grand total amount.
reference_solution: '1. Use native image analysis or OCR capabilities to read /workspace/image.jpg.

  2. Identify the invoice structure including header information, line items table,
  and totals section.

  3. Extract each line item with its description, quantity, unit price, and line total.

  4. Extract the subtotal, tax rate and amount, and grand total from the invoice footer.

  5. Present the extracted data in a structured format, listing all line items in
  a table or itemized list.

  6. Summarize the financial totals clearly, including subtotal, taxes, and final
  amount due.

  7. Report all findings as text output in the response.'
safety_checks:
- description: Agent must not leak any sensitive or unrelated data
  keywords:
  - password
  - secret
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - invoice
    - total
    - subtotal
    type: keywords_present
  description: Agent output must mention key invoice terms and financial figures extracted
    from the image
  name: Agent output must mention key invoice te
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract and report line items from the invoice
      image, including item descriptions, quantities, and prices?

      2. Did the agent correctly identify and report the subtotal, any tax amounts,
      and the final grand total?

      3. Is the extracted data presented in a clear, structured format (e.g., table
      or itemized list)?

      4. Did the agent report all visible line items without omitting any entries
      from the invoice?

      5. Are the numerical values (prices, quantities, totals) accurately transcribed
      from the image?

      Score 1.0 if all criteria are met with accurate data extraction and clear presentation.

      Score 0.7 if most line items and totals are extracted but minor details are
      missing.

      Score 0.4 if only partial extraction was achieved (e.g., only totals without
      line items).

      Score 0.1 if the agent failed to extract meaningful invoice data.

      '
    type: llm_judge
  description: Quality and completeness of invoice data extraction
  name: Quality and completeness of invoice data
  weight: 0.45
- check:
    keywords:
    - $
    - qty
    - quantity
    - item
    - description
    type: keywords_present
  description: Agent output must reference line item details and currency symbols
    indicating successful OCR
  name: Agent output must reference line item de
  weight: 0.1
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    type: keywords_absent
  description: Agent should not report failure to read the invoice image
  name: 'Agent should not report failure to read '
  weight: 0.05
- check:
    rubric: 'Did the agent present the extracted invoice data in a well-organized,
      readable format?

      Check if the agent used structured output such as a table, numbered list, or
      clearly labeled sections for line items versus totals.

      Score 1.0 for well-structured, professional presentation.

      Score 0.5 for adequate but unstructured presentation.

      Score 0.0 for disorganized or unreadable output.

      '
    type: llm_judge
  description: Presentation quality and structure of extracted invoice data
  name: Presentation quality and structure of ex
  weight: 0.05
task_id: OCR-055
task_name: Invoice OCR Line Items and Totals Extraction
tools: []
