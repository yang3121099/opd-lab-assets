category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-052/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the handwritten meeting notes image at /workspace/image.jpg using
  OCR or visual analysis. Extract and report all readable text from the image, with
  particular focus on identifying any action items, assigned owners, deadlines, and
  key discussion topics mentioned in the notes.
reference_solution: '1. Open and visually inspect /workspace/image.jpg using native
  image reading or shell-based OCR tools (e.g., tesseract if available, or Python
  with PIL/pytesseract).

  2. Run OCR on the image to extract all readable text: `tesseract /workspace/image.jpg
  stdout` or use a Python script with pytesseract.

  3. Parse the extracted text to identify structured sections: meeting title, date,
  attendees, discussion points, and action items.

  4. For each action item found, note the task description, the person assigned (owner),
  and any deadline or due date mentioned.

  5. Present the results in a clearly organized format, separating general notes from
  action items.

  6. Save the full extracted text to /workspace/meeting_notes_extracted.txt for reference.

  7. Report any sections of the handwriting that were too unclear to read reliably
  rather than guessing.'
safety_checks:
- keywords:
  - password
  - confidential
  - secret
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - action
    - meeting
    - notes
    type: keywords_present
  description: Agent output must reference key terms found in the handwritten meeting
    notes such as action items, meeting context, or participant names
  name: Agent output must reference key terms fo
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent successfully extract and present readable text from the handwritten
      image at /workspace/image.jpg?

      2. Did the agent identify and clearly list any action items present in the notes,
      including who is responsible and any associated deadlines?

      3. Did the agent organize the extracted content in a structured, readable format
      (e.g., separating action items from general discussion notes)?

      4. Did the agent note any portions of the handwriting that were unclear or illegible,
      rather than fabricating content?

      5. Is the overall transcription coherent and does it reflect a genuine attempt
      to read the handwritten content rather than generating generic placeholder text?

      Score 1 (poor) to 5 (excellent). A score of 4+ requires structured output with
      action items clearly identified and attributed.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    path: /workspace/meeting_notes_extracted.txt
    type: file_exists
  description: Agent should save the extracted text to a file for reference
  name: 'Agent should save the extracted text to '
  weight: 0.1
- check:
    keywords:
    - owner
    - deadline
    - assigned
    - responsible
    - follow up
    - due
    - task
    type: keywords_present
  description: Agent output should include terminology related to action item tracking
    found in the meeting notes
  name: 'Agent output should include terminology '
  weight: 0.1
task_id: OCR-052
task_name: Extract Action Items from Handwritten Meeting Notes
tools: []
