category: OCR
claw_eval_id: T52_su7_price_from_image
difficulty: medium
files:
- source: OCR-014/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg using OCR and
  visual analysis. Identify and list all labeled components, text, arrows, and structural
  elements visible in the diagram, then provide a clear description of what the diagram
  represents and how the components relate to each other.
reference_solution: '1. Use a native shell command or Python script to load and process
  /workspace/image.jpg.

  2. Apply an OCR library such as pytesseract or easyocr to extract all text from
  the image.

  3. Optionally use PIL or OpenCV to preprocess the image (grayscale, contrast enhancement)
  for better OCR accuracy.

  4. Identify all labeled components, text blocks, arrows, and structural shapes in
  the diagram.

  5. Organize the extracted text and visual elements into a structured description.

  6. Report the list of labeled components, their relationships as indicated by arrows
  or connectors, and an overall interpretation of what the whiteboard diagram represents.

  7. Present findings clearly in the output, grouping related elements and explaining
  the diagram''s purpose or workflow.'
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - diagram
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - label
    - component
    - arrow
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    rubric: 'The agent should have successfully extracted and reported all visible
      text labels, component names, and structural elements from the whiteboard diagram
      in /workspace/image.jpg. Evaluate whether the agent: (1) identified and listed
      the specific labeled components visible in the diagram, (2) described the relationships
      or flow indicated by arrows or connecting lines, (3) provided a coherent interpretation
      of what the overall diagram represents, and (4) organized the findings in a
      clear and readable format. Award full marks if the agent provides a thorough,
      accurate description of the diagram contents including all major labeled elements
      and their relationships.'
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    rubric: Evaluate the completeness and accuracy of the OCR extraction from /workspace/image.jpg.
      The agent should have read all legible text from the whiteboard, including any
      titles, labels on boxes or shapes, text along arrows, and any annotations. Penalize
      responses that are vague, miss obvious text elements, or fail to describe the
      structural layout of the diagram. Award full marks if the agent demonstrates
      it thoroughly processed the image and extracted meaningful structured information.
    type: llm_judge
  name: llm_judge
  weight: 0.15
task_id: OCR-014
task_name: Whiteboard Diagram OCR and Component Analysis
tools: []
