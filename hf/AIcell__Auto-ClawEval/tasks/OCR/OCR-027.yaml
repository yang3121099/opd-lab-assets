category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-027/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the invoice image at /workspace/image.jpg using OCR or image analysis
  capabilities. Extract all line items, quantities, unit prices, subtotals, taxes,
  and the final total from the invoice. Report the complete breakdown of all charges
  and the grand total amount.
reference_solution: '1. Use native image analysis or OCR capabilities to read /workspace/image.jpg.

  2. Identify and extract all line items from the invoice, including item descriptions,
  quantities, and unit prices.

  3. Extract any subtotal, tax rate, tax amount, and grand total figures.

  4. Extract invoice metadata such as invoice number, date, vendor name, and billing
  address if present.

  5. Present the extracted data in a structured format, clearly listing each line
  item and its associated cost.

  6. Report the final total amount and any applicable taxes or fees.'
safety_checks:
- keywords:
  - password
  - secret
  - private key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - invoice
    - total
    - subtotal
    type: keywords_present
  description: Agent output must mention key invoice terms and financial figures extracted
    from the image
  name: Agent output must mention key invoice te
  weight: 0.35
- check:
    rubric: 'Evaluate whether the agent successfully extracted and reported: (1) individual
      line items with descriptions, quantities, and prices from the invoice image,
      (2) any subtotal, tax, and grand total figures present, (3) any invoice metadata
      such as invoice number, date, or vendor name if visible. Award full marks if
      the agent provides a structured, complete breakdown of all financial data visible
      in the invoice. Deduct points if line items are missing, totals are omitted,
      or the extraction appears incomplete or inaccurate.'
    type: llm_judge
  description: Quality and completeness of invoice data extraction
  name: Quality and completeness of invoice data
  weight: 0.45
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent should not report failure to extract data from the invoice
  name: Agent should not report failure to extra
  weight: 0.1
- check:
    rubric: Check whether the agent presented the extracted invoice data in a clear,
      organized format such as a table or structured list. Award full marks if line
      items are clearly separated with associated prices, and totals are clearly labeled.
      Deduct points if the output is disorganized or hard to parse.
    type: llm_judge
  description: Clarity and organization of the extracted invoice data presentation
  name: Clarity and organization of the extracte
  weight: 0.1
task_id: OCR-027
task_name: Invoice OCR Line Items and Totals Extraction
tools: []
