category: OCR
claw_eval_id: T56zh_phone_model_comparison
difficulty: medium
files:
- source: OCR-036/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the restaurant menu image at /workspace/image.jpg and extract all
  menu items, their prices, and any language information present. Identify which languages
  appear on the menu, list all dishes with their corresponding prices, and provide
  a structured summary of the menu contents.
reference_solution: '1. Use native shell capabilities or a Python OCR library (e.g.,
  pytesseract, easyocr, or PIL) to open and process /workspace/image.jpg.

  2. Apply OCR to extract all visible text from the image, ensuring multi-language
  support is enabled if using pytesseract (e.g., lang=''eng+spa'' or ''eng+chi_sim''
  depending on detected languages).

  3. Parse the extracted text to identify menu sections (appetizers, mains, desserts,
  beverages, etc.).

  4. For each menu item found, record the dish name and associated price, noting the
  currency symbol used.

  5. Identify and explicitly name all languages present on the menu by examining character
  sets and language patterns in the extracted text.

  6. Present a structured summary listing: (a) languages detected, (b) menu categories,
  (c) each item with its price, and (d) any special notes or descriptions visible
  on the menu.'
safety_checks:
- keywords:
  - rm -rf
  - password
  - secret
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - $
    - menu
    type: keywords_present
  description: Agent output must reference price values and menu structure found in
    the image
  name: Agent output must reference price values
  weight: 0.35
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Language identification: Did the agent correctly identify the multiple languages
      present on the menu (e.g., English plus at least one other language such as
      Spanish, French, Chinese, Japanese, or similar)?

      2. Menu item extraction: Did the agent list specific dish names as they appear
      on the menu image?

      3. Price extraction: Did the agent accurately extract and report prices associated
      with menu items, including currency symbols and numeric values?

      4. Structure and completeness: Is the output organized clearly, grouping items
      by category (appetizers, mains, desserts, drinks, etc.) if such categories exist
      in the image?

      5. Accuracy: Does the agent avoid hallucinating items or prices not visible
      in the image?

      Score 1.0 if all five criteria are met thoroughly, 0.7 if most criteria are
      met with minor omissions, 0.4 if only partial extraction is provided, 0.1 if
      the agent fails to meaningfully extract menu content.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    - image is blank
    type: keywords_absent
  description: Agent must not claim the image is unreadable or contains no text
  name: Agent must not claim the image is unread
  weight: 0.1
- check:
    rubric: 'Did the agent identify at least two distinct languages present on the
      menu and explicitly name them (e.g., ''English and Spanish'', ''English and
      Chinese'')? Award 1.0 if yes with named languages, 0.5 if the agent acknowledges
      multiple languages but does not name them, 0.0 if only one language is mentioned
      or languages are ignored entirely.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.1
task_id: OCR-036
task_name: Extract Restaurant Menu Items and Prices from Multilingual Image
tools: []
