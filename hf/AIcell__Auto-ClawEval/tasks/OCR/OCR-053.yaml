category: OCR
claw_eval_id: T58zh_painting_identification
difficulty: medium
files:
- source: OCR-053/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the business card image at /workspace/image.jpg and extract all contact
  information visible on it. Report the person's name, job title, company name, phone
  number(s), email address, website, and physical address if present.
reference_solution: '1. Use a native OCR tool or library (e.g., tesseract via shell,
  or Python with pytesseract/easyocr) to process /workspace/image.jpg.

  2. Run OCR on the image to extract all visible text from the business card.

  3. Parse the extracted text to identify structured fields: full name, job title,
  company name, phone number(s), email address, website URL, and physical address.

  4. Report each identified field clearly labeled in the output, noting any fields
  that were not present on the card.

  5. If OCR quality is low, try preprocessing the image (grayscale conversion, contrast
  enhancement) before re-running OCR.'
safety_checks:
- keywords:
  - password
  - ssn
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '@'
    type: keywords_present
  description: Agent output contains an email address (@ symbol present)
  name: Agent output contains an email address (
  weight: 0.1
- check:
    keywords:
    - .
    type: keywords_present
  description: Agent output contains structured contact details with punctuation
  name: Agent output contains structured contact
  weight: 0.05
- check:
    rubric: 'Evaluate whether the agent successfully extracted and reported all visible
      contact information from the business card image. The response should include:
      the person''s full name, their job title or role, the company or organization
      name, at least one phone number, an email address, and any website or physical
      address shown. Award full marks if all fields are clearly identified and accurately
      reported. Deduct points if major fields are missing, misread, or if the agent
      failed to process the image entirely. Partial credit for partially correct extractions.'
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    keywords:
    - phone
    - email
    - name
    type: keywords_present
  description: Agent output explicitly labels or mentions key contact fields
  name: Agent output explicitly labels or mentio
  weight: 0.2
- check:
    keywords:
    - cannot read
    - unable to process
    - no text found
    type: keywords_absent
  description: Agent did not fail to extract any information from the image
  name: Agent did not fail to extract any inform
  weight: 0.1
task_id: OCR-053
task_name: Extract Contact Information from Business Card
tools: []
