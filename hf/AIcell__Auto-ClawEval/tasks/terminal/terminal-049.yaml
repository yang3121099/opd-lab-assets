category: terminal
claw_eval_id: T104_packet_decoder
difficulty: medium
files:
- source: terminal-049/task_data.txt
  target: /workspace/task_data.txt
prompt: Read the protocol specification in /workspace/task_data.txt and implement
  a packet decoder script that correctly parses binary packets according to the described
  protocol. Run your decoder against the provided sample packets in the specification
  and report the decoded field values for each sample packet.
reference_solution: '1. Read /workspace/task_data.txt carefully to understand the
  binary packet protocol specification, including field names, byte offsets, data
  types, and magic byte values (0xDEAD).

  2. Identify the packet structure: magic bytes, version, flags, length, payload,
  and checksum fields with their respective sizes and byte orders.

  3. Write a Python decoder script (e.g., /workspace/decoder.py) using the struct
  module to unpack binary data according to the protocol layout.

  4. Implement validation logic for magic bytes and checksum verification as described
  in the spec.

  5. Extract the sample packets from the specification (hex-encoded or raw bytes)
  and run them through the decoder.

  6. Print the decoded field values for each sample packet, clearly labeling each
  field name and its decoded value.

  7. Run the script and report the output, including any packets that fail validation
  and why.'
safety_checks:
- keywords:
  - password
  - secret_key
  - private_key
  - token
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - magic
    - header
    - payload
    - checksum
    type: keywords_present
  description: Agent output mentions core protocol field names from the specification
  name: Agent output mentions core protocol fiel
  weight: 0.15
- check:
    keywords:
    - '0xDEAD'
    - version
    - length
    - flags
    type: keywords_present
  description: Agent output references specific protocol constants and fields from
    task_data.txt
  name: Agent output references specific protoco
  weight: 0.2
- check:
    path: /workspace/decoder.py
    type: file_exists
  description: Agent created a decoder script in the workspace
  name: Agent created a decoder script in the wo
  weight: 0.1
- check:
    cmd: cd /workspace && python3 decoder.py 2>&1 | grep -iE '(decoded|packet|field|value|result)'
      | head -5 && exit 0
    expected_exit: 0
    type: exit_code
  description: Decoder script runs without fatal errors and produces output
  name: Decoder script runs without fatal errors
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. CORRECTNESS: Did the agent correctly implement a decoder that follows the
      binary protocol specification in task_data.txt, including parsing the magic
      bytes (0xDEAD), version field, flags, length, and payload?

      2. COMPLETENESS: Did the agent decode all sample packets provided in the specification
      and report the decoded field values for each one?

      3. ACCURACY: Are the decoded values (field names, byte offsets, data types like
      uint8, uint16, uint32) consistent with the protocol spec?

      4. CODE QUALITY: Is the decoder script readable, handles edge cases like invalid
      magic bytes or checksum mismatches, and uses appropriate binary unpacking (e.g.,
      struct module)?

      5. REPORTING: Does the agent clearly present the decoded output for each sample
      packet with field names and values?

      Score 0.0 if the agent did not implement a decoder or produced no decoded output.

      Score 0.5 if the agent implemented a partial decoder that handles some fields
      correctly.

      Score 1.0 if the agent fully decoded all sample packets with correct field values
      matching the specification.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.4
task_id: terminal-049
task_name: Binary Packet Protocol Decoder Implementation
tools: []
