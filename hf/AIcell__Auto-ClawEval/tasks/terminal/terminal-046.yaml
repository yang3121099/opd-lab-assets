category: terminal
claw_eval_id: T104_packet_decoder
difficulty: medium
files:
- source: terminal-046/task_data.txt
  target: /workspace/task_data.txt
prompt: 'Read the task specification in /workspace/task_data.txt, then follow its
  instructions to recover a corrupted SQLite database using WAL journal techniques.
  The file describes a scenario with specific database files, corruption details,
  and recovery steps you must execute. Report your findings including the recovered
  record counts, any data integrity issues found, and the final state of the recovered
  database.

  '
reference_solution: "1. Read /workspace/task_data.txt to understand the full recovery\
  \ scenario, including which\n   database files are involved, the nature of the corruption,\
  \ and the expected recovery outcome.\n2. Identify the main database file and its\
  \ associated WAL (-wal) and shared memory (-shm) files\n   as described in the spec.\n\
  3. Use sqlite3 CLI or Python sqlite3 module to attempt opening the database; if\
  \ corrupted,\n   use PRAGMA wal_checkpoint or manually replay the WAL journal.\n\
  4. Run PRAGMA integrity_check on the recovered database to verify consistency. 5.\
  \ Query key tables to count recovered records and compare against expected counts\
  \ from the spec. 6. Save the recovered database to /workspace/recovered.db. 7. Report\
  \ the recovered record counts, any missing or corrupted rows, and confirm the database\n\
  \   passes integrity checks."
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  - DROP TABLE
  - rm -rf
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - sqlite-wal-recovery
    - WAL
    type: keywords_present
  description: Agent acknowledges the task ID and WAL journal context from the spec
    file
  name: Agent acknowledges the task ID and WAL j
  weight: 0.15
- check:
    keywords:
    - recovered
    - journal
    - checkpoint
    type: keywords_present
  description: Agent demonstrates understanding of WAL recovery terminology from the
    task spec
  name: 'Agent demonstrates understanding of WAL '
  weight: 0.2
- check:
    path: /workspace/recovered.db
    type: file_exists
  description: Agent created a recovered SQLite database file as instructed
  name: Agent created a recovered SQLite databas
  weight: 0.1
- check:
    cmd: test -f /workspace/recovered.db && sqlite3 /workspace/recovered.db 'PRAGMA
      integrity_check;' | grep -q 'ok'
    expected_exit: 0
    type: exit_code
  description: Recovered database passes SQLite integrity check
  name: Recovered database passes SQLite integri
  weight: 0.15
- check:
    rubric: 'The agent should have read /workspace/task_data.txt which describes a
      SQLite WAL recovery scenario (task id: sqlite-wal-recovery). Evaluate whether
      the agent: (1) correctly interpreted the recovery instructions from the spec
      file, (2) executed appropriate SQLite WAL recovery steps such as checkpointing
      or replaying the WAL journal, (3) reported specific outcomes including record
      counts or table names found in the recovered database, (4) identified any data
      integrity issues or missing records, and (5) provided a clear summary of the
      final database state. Penalize vague responses that do not reference specific
      details from the task_data.txt file or that skip recovery verification steps.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.4
task_id: terminal-046
task_name: SQLite Database Recovery from WAL Journal
tools: []
