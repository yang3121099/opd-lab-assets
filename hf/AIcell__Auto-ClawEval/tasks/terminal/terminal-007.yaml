category: terminal
claw_eval_id: T100_reverse_decoder
difficulty: medium
files:
- source: terminal-007/task_data.txt
  target: /workspace/task_data.txt
prompt: 'Read the migration specification in /workspace/task_data.txt, which describes
  a SQL schema migration for an e-commerce database. Analyze the migration requirements
  and produce a complete SQL migration script that transforms the old schema into
  the new schema, including all necessary ALTER TABLE, CREATE TABLE, DROP TABLE, and
  data transformation statements. Write the final migration script to /workspace/migration.sql
  and summarize the key changes made, including table modifications, new indexes,
  and any data migration steps required.

  '
reference_solution: "1. Read /workspace/task_data.txt using cat or a file-reading\
  \ tool to understand the full migration\n   specification, including the source\
  \ schema (v1) and target schema (v2).\n2. Identify all differences between the two\
  \ schema versions: new tables, dropped tables, added columns,\n   dropped columns,\
  \ renamed columns, changed data types, new indexes, and dropped indexes.\n3. Determine\
  \ the correct order of operations to avoid constraint violations (e.g., drop foreign\
  \ keys\n   before dropping referenced columns, add columns before creating indexes\
  \ on them).\n4. Write a SQL migration script that begins with a transaction (BEGIN;),\
  \ applies all DDL changes\n   (ALTER TABLE, CREATE TABLE, DROP TABLE, CREATE INDEX,\
  \ DROP INDEX), includes any required DML\n   data migration statements (INSERT INTO\
  \ ... SELECT, UPDATE), and ends with COMMIT;.\n5. Save the completed script to /workspace/migration.sql.\
  \ 6. Summarize the migration in the output, listing each table affected, the nature\
  \ of the change\n   (e.g., added column status VARCHAR(50) to orders, created index\
  \ idx_customer_email on customers),\n   and any data transformation logic applied."
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    path: /workspace/migration.sql
    type: file_exists
  name: file_exists
  weight: 0.08
- check:
    cmd: 'grep -iE ''(ALTER TABLE|CREATE TABLE|DROP TABLE|CREATE INDEX)'' /workspace/migration.sql
      | wc -l | awk ''{exit ($1 >= 3) ? 0 : 1}'''
    expected_exit: 0
    type: exit_code
  name: exit_code
  weight: 0.12
- check:
    keywords:
    - orders
    - customers
    - products
    - ALTER TABLE
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - migration
    - schema
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: "The agent should have read /workspace/task_data.txt and produced a valid\
      \ SQL migration script written to /workspace/migration.sql. Evaluate the following:\
      \ 1. Does the agent correctly identify and address all schema changes described\
      \ in the task file,\n   including table alterations, new columns, dropped columns,\
      \ renamed columns, and new or modified\n   indexes?\n2. Does the migration script\
      \ include appropriate transaction handling (BEGIN/COMMIT or equivalent)\n  \
      \ to ensure atomicity?\n3. Does the agent's summary accurately describe the\
      \ key migration steps, referencing specific\n   table names (such as orders,\
      \ customers, products) and column-level changes mentioned in the\n   task specification?\n\
      4. Are data migration or backfill statements included where the spec requires\
      \ transforming\n   existing data (e.g., populating new columns from old ones)?\n\
      5. Is the SQL syntactically valid and logically ordered (e.g., adding columns\
      \ before creating\n   indexes on them, dropping foreign keys before dropping\
      \ columns)?\nScore higher if all changes are addressed completely and accurately,\
      \ lower if steps are missing, incorrect, or the script would fail to execute\
      \ against the described schema.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: terminal-007
task_name: SQL Schema Migration Between Database Versions
tools: []
