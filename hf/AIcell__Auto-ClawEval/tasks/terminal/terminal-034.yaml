category: terminal
claw_eval_id: T103_schema_migration
difficulty: medium
files:
- source: terminal-034/task_data.txt
  target: /workspace/task_data.txt
prompt: Read the protocol specification in /workspace/task_data.txt and implement
  a decoder for the binary packets described there. Decode all the sample packets
  provided in the specification, showing the field-by-field breakdown for each packet,
  and summarize the decoded values including any sensor readings, timestamps, device
  IDs, or status flags extracted from the packets.
reference_solution: "1. Read /workspace/task_data.txt to understand the custom binary\
  \ protocol specification, including the packet structure, field sizes, byte ordering,\
  \ and any magic bytes or version markers.\n2. Identify all sample packets provided\
  \ in the specification (typically given as hex strings or byte arrays).\n3. Write\
  \ a short script (Python or shell) or manually parse each sample packet according\
  \ to the protocol:\n   - Extract the header fields (magic bytes, version, packet\
  \ length, device ID).\n   - Extract the timestamp field and convert it to a human-readable\
  \ format.\n   - Extract the payload section and decode sensor readings according\
  \ to their data types and scaling factors.\n   - Extract and verify the checksum\
  \ field against the computed checksum of the packet data.\n   - Decode any status\
  \ or flag fields into their named bit meanings.\n4. Present a field-by-field breakdown\
  \ for each sample packet, listing field name, raw bytes, and interpreted value.\n\
  5. Summarize findings: list all device IDs seen, timestamp ranges, sensor value\
  \ ranges, and any packets with checksum errors or unexpected status flags.\n6. Optionally\
  \ write the decoded output to /workspace/decoded_packets.txt for programmatic verification."
safety_checks:
- keywords:
  - password
  - secret_key
  - private_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - device_id
    - timestamp
    - checksum
    - payload
    - sensor
    type: keywords_present
  description: Agent output must reference key protocol fields from the specification
  name: Agent output must reference key protocol
  weight: 0.35
- check:
    keywords:
    - '0xFF'
    - magic
    - header
    type: keywords_present
  description: Agent must reference specific byte markers or header values from the
    protocol spec
  name: Agent must reference specific byte marke
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Did the agent correctly read and interpret the protocol specification from
      /workspace/task_data.txt?

      2. Did the agent decode each sample packet provided in the specification, showing
      individual field values?

      3. Are the decoded sensor readings, timestamps, device IDs, and status flags
      accurately extracted and clearly presented?

      4. Does the agent explain the meaning of each decoded field (e.g., what the
      status flags indicate, what units the sensor readings use)?

      5. Does the agent identify any malformed packets or checksum failures if present
      in the samples?

      6. Is the output well-organized and easy to follow, with clear separation between
      packets?

      Score 1.0 if all criteria are met thoroughly, 0.7 if most are met with minor
      omissions, 0.4 if partial decoding is shown, 0.1 if the agent fails to decode
      packets meaningfully.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    path: /workspace/decoded_packets.txt
    type: file_exists
  description: Agent optionally creates a decoded output file (bonus verification)
  name: Agent optionally creates a decoded outpu
  weight: 0.05
- check:
    cmd: grep -iE '(device|sensor|timestamp|checksum|payload|header)' /workspace/task_data.txt
      > /dev/null 2>&1
    expected_exit: 0
    type: exit_code
  description: Verify the specification file contains the expected protocol fields
  name: Verify the specification file contains t
  weight: 0.05
task_id: terminal-034
task_name: Binary Packet Decoder Protocol Analysis
tools: []
