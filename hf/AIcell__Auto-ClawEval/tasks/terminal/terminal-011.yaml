category: terminal
claw_eval_id: T101_wal_recovery
difficulty: medium
files:
- source: terminal-011/task_data.txt
  target: /workspace/task_data.txt
prompt: 'Read the task specification in /workspace/task_data.txt, then follow its
  instructions to recover a corrupted SQLite database from its WAL journal. Perform
  all required steps using your shell and file capabilities, report the recovered
  table names, row counts, and any data integrity findings as described in the task
  file.

  '
reference_solution: "1. Read /workspace/task_data.txt to understand the full task\
  \ specification, including which\n   database file and WAL journal are involved,\
  \ and what tables/data are expected.\n2. Locate the SQLite database file and its\
  \ associated -wal (and optionally -shm) journal files\n   in /workspace/ as specified\
  \ by the task file.\n3. Attempt to open the database with sqlite3 and run PRAGMA\
  \ integrity_check to assess corruption. 4. If the database is corrupted but the\
  \ WAL file exists, force a WAL checkpoint using\n   PRAGMA wal_checkpoint(TRUNCATE)\
  \ or by copying the WAL into a fresh database using\n   sqlite3 recovery techniques\
  \ (e.g., .recover command available in sqlite3 >= 3.29).\n5. Use the sqlite3 .recover\
  \ command or manual SQL dump (SELECT * from each table) to extract\n   all recoverable\
  \ data into a new clean database or SQL dump file.\n6. Run PRAGMA integrity_check\
  \ on the recovered database to confirm its health. 7. List all recovered tables\
  \ using .tables or SELECT name FROM sqlite_master WHERE type='table'. 8. Count rows\
  \ in each table and compare against expected counts from the task specification.\
  \ 9. Report recovered table names, row counts, any missing or corrupted rows, and\
  \ overall\n   recovery success rate in the output."
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - sqlite-wal-recovery
    - WAL
    - checkpoint
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - orders
    - customers
    - products
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - row
    - recovered
    - integrity
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: 'The agent should have read /workspace/task_data.txt and followed its
      instructions to recover a SQLite database from a WAL journal. Evaluate whether
      the agent: (1) correctly identified the WAL journal recovery process including
      checkpointing or manual WAL application, (2) reported specific table names and
      row counts from the recovered database, (3) described any data integrity issues
      found (missing rows, corruption, partial writes), (4) provided a clear summary
      of what data was successfully recovered versus lost, (5) used appropriate SQLite
      commands or tools (sqlite3 CLI, PRAGMA integrity_check, etc.). Penalize vague
      responses that do not include concrete numbers or table-level findings.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.4
- check:
    cmd: test -f /workspace/task_data.txt
    expected_exit: 0
    type: exit_code
  name: exit_code
  weight: 0.1
task_id: terminal-011
task_name: SQLite WAL Journal Database Recovery
tools: []
