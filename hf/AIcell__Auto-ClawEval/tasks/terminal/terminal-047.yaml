category: terminal
claw_eval_id: T104_packet_decoder
difficulty: medium
files:
- source: terminal-047/task_data.txt
  target: /workspace/task_data.txt
prompt: 'Read the migration specification in /workspace/task_data.txt, which describes
  a SQL schema migration for an e-commerce database. Analyze the migration requirements
  and produce a complete SQL migration script that transforms the old schema into
  the new schema, including all necessary ALTER TABLE, CREATE TABLE, DROP TABLE, and
  data migration statements. Write the final migration script to /workspace/migration.sql
  and summarize the key changes made, including table modifications, new columns added,
  indexes created, and any data transformations required.

  '
reference_solution: "1. Read /workspace/task_data.txt carefully to understand the\
  \ full migration specification,\n   including the source schema (old version) and\
  \ target schema (new version).\n2. Identify all differences between the two schemas:\
  \ new tables, dropped tables, added columns,\n   dropped columns, changed column\
  \ types, new indexes, and foreign key changes.\n3. Draft a SQL migration script\
  \ that:\n   a. Wraps all changes in a transaction (BEGIN; ... COMMIT;) for atomicity.\n\
  \   b. Uses ALTER TABLE ... ADD COLUMN for new columns, with appropriate data types\
  \ and defaults.\n   c. Uses ALTER TABLE ... DROP COLUMN for removed columns (if\
  \ any).\n   d. Uses CREATE TABLE for any entirely new tables introduced in the new\
  \ schema.\n   e. Uses CREATE INDEX or ALTER TABLE ... ADD CONSTRAINT for new indexes\
  \ or constraints.\n   f. Includes UPDATE or INSERT statements for any required data\
  \ backfills or transformations.\n   g. Handles nullable vs. NOT NULL constraints\
  \ and default values correctly.\n4. Write the completed migration script to /workspace/migration.sql.\
  \ 5. Output a plain-language summary listing: each table modified, each column added\
  \ or removed,\n   each index created, and any data migration logic applied, so a\
  \ reviewer can verify correctness\n   without reading raw SQL."
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    path: /workspace/migration.sql
    type: file_exists
  name: file_exists
  weight: 0.08
- check:
    cmd: 'grep -iE ''(ALTER TABLE|CREATE TABLE|CREATE INDEX|DROP COLUMN|ADD COLUMN)''
      /workspace/migration.sql | wc -l | awk ''{exit ($1 >= 3) ? 0 : 1}'''
    expected_exit: 0
    type: exit_code
  name: exit_code
  weight: 0.12
- check:
    keywords:
    - orders
    - customers
    - products
    - migration
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - ALTER TABLE
    - ADD COLUMN
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: "Evaluate the agent's SQL migration script and summary based on the following\
      \ criteria: 1. Correctness: Does the migration script correctly implement the\
      \ schema changes described in\n   the task specification (e.g., adding new columns\
      \ to orders or customers tables, creating\n   indexes, handling data transformations)?\n\
      2. Completeness: Does the agent address all migration steps mentioned in the\
      \ spec, including\n   DDL changes (ALTER TABLE, CREATE TABLE, DROP TABLE) and\
      \ any DML data migration statements?\n3. Safety: Does the script include transaction\
      \ handling (BEGIN/COMMIT or equivalent) or\n   rollback provisions to ensure\
      \ the migration is atomic and reversible?\n4. Summary quality: Does the agent\
      \ clearly summarize the key changes, listing specific table\n   names, column\
      \ names, and index names that were modified or created?\n5. SQL validity: Is\
      \ the SQL syntactically plausible and consistent with standard SQL or a\n  \
      \ named dialect (PostgreSQL, MySQL, etc.)?\nScore 0.0 if the agent produces\
      \ no migration script or summary. Score 0.5 if the script covers some but not\
      \ all required changes or lacks transaction safety. Score 1.0 if the script\
      \ is complete, safe, well-structured, and the summary clearly enumerates all\
      \ changes.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: terminal-047
task_name: SQL Schema Migration Between Database Versions
tools: []
