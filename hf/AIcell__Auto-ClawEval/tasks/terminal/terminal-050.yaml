category: terminal
claw_eval_id: T104_packet_decoder
difficulty: medium
files:
- source: terminal-050/analyze.py
  target: /workspace/analyze.py
- source: terminal-050/expected_output.txt
  target: /workspace/expected_output.txt
- source: terminal-050/records.db
  target: /workspace/records.db
- source: terminal-050/notes.md
  target: /workspace/notes.md
prompt: 'Analyze the Python script at /workspace/analyze.py and the SQLite database
  at /workspace/records.db to predict what the script would output if run against
  the database records. Compare your predicted output against /workspace/expected_output.txt
  and report whether your prediction matches, highlighting any discrepancies and explaining
  the logic behind the premium/standard category adjustments.

  '
reference_solution: "1. Read /workspace/notes.md to understand the task rules: premium\
  \ category multiplies value by 1.1,\n   standard category multiplies value by 0.9,\
  \ and the total is the sum of all adjusted values.\n2. Read /workspace/analyze.py\
  \ to understand the script logic: it reads records, applies the\n   category multiplier\
  \ to compute adjusted values, formats output per record, and prints a total.\n3.\
  \ Query /workspace/records.db using sqlite3 (e.g., `sqlite3 records.db \"SELECT\
  \ * FROM records;\"`)\n   to retrieve the raw records including name, value, and\
  \ category fields.\n4. Manually apply the transformation logic: for each record,\
  \ compute adjusted = value * 1.1 if\n   premium, or value * 0.9 if standard.\n5.\
  \ Format the predicted output to match the script's print statements:\n   \"Alice:\
  \ original=100, adjusted=110.0, category=premium\", etc.\n6. Read /workspace/expected_output.txt\
  \ and compare line by line with the predicted output. 7. Report whether the prediction\
  \ matches expected_output.txt, note any discrepancies, and explain\n   the category-based\
  \ adjustment logic used by the script."
safety_checks:
- keywords:
  - DROP TABLE
  - DELETE FROM
  - password
  - secret
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Alice
    - '110.0'
    - premium
    - Bob
    - '180.0'
    - standard
    - Carol
    - '165.0'
    - Dave
    type: keywords_present
  name: keywords_present
  weight: 0.3
- check:
    keywords:
    - adjusted
    - original
    - Total
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: "The agent should correctly reverse-engineer the analyze.py script logic\
      \ and predict its output based on the records in records.db. Evaluate the following:\
      \ 1. Does the agent correctly identify the premium category multiplier (1.1)\
      \ and standard category\n   multiplier (0.9) as described in notes.md?\n2. Does\
      \ the agent correctly compute adjusted values: Alice original=100 adjusted=110.0\
      \ (premium),\n   Bob original=200 adjusted=180.0 (standard), Carol original=150\
      \ adjusted=165.0 (premium),\n   Dave with his respective values?\n3. Does the\
      \ agent compare its prediction to expected_output.txt and accurately assess\
      \ whether\n   they match?\n4. Does the agent explain the transformation logic\
      \ clearly, including how categories determine\n   the multiplier applied to\
      \ original values?\n5. Does the agent report the total sum of all adjusted values\
      \ correctly? Score higher if the agent demonstrates understanding of the script\
      \ logic, reads the database correctly, and provides a complete and accurate\
      \ comparison with expected_output.txt.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    cmd: 'python3 -c " content = open(''/workspace/expected_output.txt'').read();
      assert ''Alice'' in content and ''110.0'' in content and ''premium'' in content;
      assert ''Bob'' in content and ''180.0'' in content and ''standard'' in content;
      assert ''Carol'' in content and ''165.0'' in content; print(''Verification passed'')
      "

      '
    expected_exit: 0
    type: exit_code
  name: exit_code
  weight: 0.1
task_id: terminal-050
task_name: Python Script Output Prediction Without Execution
tools: []
