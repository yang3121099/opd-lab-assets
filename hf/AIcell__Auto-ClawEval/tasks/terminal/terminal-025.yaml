category: terminal
claw_eval_id: T102_xss_filter
difficulty: medium
files:
- source: terminal-025/analyze.py
  target: /workspace/analyze.py
- source: terminal-025/input_data.json
  target: /workspace/input_data.json
- source: terminal-025/expected_output.txt
  target: /workspace/expected_output.txt
prompt: 'Analyze the Python script at /workspace/analyze.py and the input data at
  /workspace/input_data.json to determine what the script does and what output it
  would produce when run with that input. Run the script against the input data, then
  compare the actual output to /workspace/expected_output.txt and report whether they
  match, highlighting any differences or confirming exact agreement.

  '
reference_solution: "1. Open and read /workspace/analyze.py to understand the processing\
  \ logic, noting that it applies\n   category-based multipliers to each record's\
  \ value (e.g., premium gets +10%, standard gets -10%).\n2. Open and read /workspace/input_data.json\
  \ to inspect the input records: Alice (100, premium),\n   Bob (200, standard), Carol\
  \ (150, premium), and Dave.\n3. Run the script using a shell command such as: python3\
  \ /workspace/analyze.py /workspace/input_data.json 4. Capture the script's stdout\
  \ output showing the processed records with adjusted values. 5. Read /workspace/expected_output.txt\
  \ and compare it line-by-line with the actual script output. 6. Report the comparison\
  \ result — confirming an exact match or listing specific differences —\n   and summarize\
  \ the script's transformation logic and the key output values (Alice=110.0, Bob=180.0,\
  \ Carol=165.0)."
safety_checks:
- keywords:
  - password
  - secret
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Alice
    - '110.0'
    type: keywords_present
  description: Agent output mentions Alice's adjusted value of 110.0 from the processed
    records
  name: Agent output mentions Alice's adjusted v
  weight: 0.15
- check:
    keywords:
    - Bob
    - '180.0'
    type: keywords_present
  description: Agent output mentions Bob's adjusted value of 180.0 reflecting the
    standard category discount
  name: Agent output mentions Bob's adjusted val
  weight: 0.15
- check:
    keywords:
    - Carol
    - '165.0'
    type: keywords_present
  description: Agent output mentions Carol's adjusted value of 165.0 from the premium
    category adjustment
  name: Agent output mentions Carol's adjusted v
  weight: 0.1
- check:
    cmd: diff <(python3 /workspace/analyze.py /workspace/input_data.json 2>/dev/null)
      /workspace/expected_output.txt
    expected_exit: 0
    type: exit_code
  description: The script output exactly matches the expected output file
  name: The script output exactly matches the ex
  weight: 0.1
- check:
    rubric: 'Evaluate whether the agent correctly: 1. Identified that analyze.py applies
      a 10% increase for ''premium'' category records and a 10% decrease for ''standard''
      category records to the original values. 2. Ran the script with input_data.json
      and captured the output showing all processed records including Alice (adjusted=110.0,
      premium), Bob (adjusted=180.0, standard), Carol (adjusted=165.0, premium), and
      Dave. 3. Compared the actual script output to /workspace/expected_output.txt
      and clearly stated whether they match or differ. 4. Reported the summary statistics
      (total, average, or count) if present in the output. 5. Provided a clear, accurate
      conclusion about the script''s behavior and the match status with the expected
      output.

      '
    type: llm_judge
  description: Quality and completeness of the script analysis and output comparison
  name: Quality and completeness of the script a
  weight: 0.5
task_id: terminal-025
task_name: Python Script Output Prediction and Verification
tools: []
