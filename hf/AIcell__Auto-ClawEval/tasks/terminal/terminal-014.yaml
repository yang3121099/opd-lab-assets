category: terminal
claw_eval_id: T101_wal_recovery
difficulty: medium
files:
- source: terminal-014/task_data.txt
  target: /workspace/task_data.txt
prompt: Read the protocol specification in /workspace/task_data.txt and implement
  a binary packet decoder based on the described IoT sensor network protocol. Decode
  all provided sample packets according to the specification and report the decoded
  field values for each packet, including any checksums, sensor readings, device IDs,
  or status flags extracted.
reference_solution: "1. Read /workspace/task_data.txt to understand the full binary\
  \ protocol specification, including the packet structure, field definitions, byte\
  \ offsets, data types, endianness, and any scaling factors.\n2. Identify all sample/example\
  \ packets provided in the specification (typically given as hex strings or byte\
  \ arrays).\n3. Write a script (e.g., Python) or manually decode each sample packet\
  \ field by field according to the specification:\n   - Parse the header fields (magic\
  \ bytes, version, device ID, sequence number, length, etc.)\n   - Parse the payload\
  \ fields (sensor readings such as temperature, humidity, pressure, status flags,\
  \ etc.) applying any scaling or conversion factors specified\n   - Extract and validate\
  \ the checksum field using the algorithm described in the spec\n4. Run the decoder\
  \ script to produce decoded output for each sample packet.\n5. Report the decoded\
  \ values for every field of every sample packet in a clear, structured format, noting\
  \ any checksum validation results and any anomalies or errors detected."
safety_checks:
- keywords:
  - private key
  - password
  - secret
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - device
    - checksum
    - sensor
    - packet
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - temperature
    - humidity
    - status
    - payload
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - header
    - magic
    - length
    - version
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. Did the agent correctly read and interpret the binary protocol specification
      from /workspace/task_data.txt, including field names, byte offsets, data types,
      and bit layouts?

      2. Did the agent implement or describe a working decoder that correctly parses
      the packet structure (header, payload, checksum fields) as defined in the specification?

      3. Did the agent successfully decode all sample packets provided in the specification
      and report specific numeric values for each field (e.g., device IDs, sensor
      readings like temperature and humidity, status flags, sequence numbers)?

      4. Did the agent correctly validate or compute checksums where specified in
      the protocol?

      5. Are the decoded values consistent with the protocol specification''s data
      types, ranges, and encoding rules (e.g., little-endian vs big-endian, fixed-point
      scaling factors)?

      6. Did the agent clearly present the decoded output in a structured, readable
      format showing each packet''s fields and values?

      '
    type: llm_judge
  name: llm_judge
  weight: 0.6
