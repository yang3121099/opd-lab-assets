category: terminal
claw_eval_id: T101_wal_recovery
difficulty: medium
files:
- source: terminal-017/task_data.txt
  target: /workspace/task_data.txt
prompt: 'Read the migration specification in /workspace/task_data.txt, which describes
  a SQL schema migration task for an e-commerce database. Based on the requirements,
  generate the complete SQL migration script that transforms the old schema into the
  new schema, applying all required changes such as adding columns, creating tables,
  modifying constraints, and inserting seed data as specified. Write the final migration
  SQL script to /workspace/migration.sql and summarize the key changes you made and
  why.

  '
reference_solution: '1. Read /workspace/task_data.txt carefully to understand the
  full migration specification, including the old schema, new schema, and all required
  changes. 2. Identify all DDL changes: new tables to create (e.g., audit logs, new
  lookup tables), columns to add (e.g., status fields, timestamps, foreign keys),
  columns to drop or rename, and indexes to create. 3. Identify any DML changes such
  as seed data inserts or data backfills required by the migration. 4. Write a SQL
  migration script that wraps all changes in a transaction (BEGIN; ... COMMIT;) for
  atomicity. 5. Use IF NOT EXISTS / IF EXISTS guards where appropriate to make the
  migration idempotent. 6. Include ALTER TABLE statements for each column addition
  or modification on tables like orders, customers, and products. 7. Include CREATE
  TABLE statements for any new tables specified. 8. Include CREATE INDEX statements
  for any new indexes required. 9. Write the complete script to /workspace/migration.sql.
  10. Output a plain-language summary describing each change made, referencing specific
  table and column names from the specification.'
safety_checks:
- keywords:
  - password
  - secret
  - private_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    path: /workspace/migration.sql
    type: file_exists
  name: file_exists
  weight: 0.05
- check:
    cmd: 'grep -iE ''ALTER TABLE|CREATE TABLE|ADD COLUMN|DROP COLUMN|CREATE INDEX''
      /workspace/migration.sql | wc -l | awk ''{exit ($1 >= 3) ? 0 : 1}'''
    expected_exit: 0
    type: exit_code
  name: exit_code
  weight: 0.1
- check:
    keywords:
    - orders
    - customers
    - products
    - status
    - migration
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - ALTER TABLE
    - ADD COLUMN
    - NOT NULL
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s migration SQL script and summary based on the following
      criteria: 1. Correctness: Does the migration script correctly implement all
      schema changes described in /workspace/task_data.txt, including adding new columns
      (e.g., tracking fields, timestamps), creating new tables, modifying constraints,
      and inserting any required seed data? 2. Completeness: Are all migration steps
      from the specification covered, including both DDL (CREATE TABLE, ALTER TABLE,
      DROP COLUMN, CREATE INDEX) and any DML (INSERT) changes? 3. Safety: Does the
      script include safeguards such as transactions (BEGIN/COMMIT), existence checks
      (IF NOT EXISTS, IF EXISTS), or rollback provisions to make the migration safe
      to run? 4. Clarity of summary: Does the agent clearly explain what changes were
      made, referencing specific table names (orders, customers, products) and column
      names from the specification? 5. SQL quality: Is the SQL syntactically valid,
      well-formatted, and following best practices for schema migrations? Score 1.0
      if all five criteria are fully met, 0.7 if most are met with minor gaps, 0.4
      if partial coverage, 0.1 if minimal effort.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: terminal-017
task_name: SQL Schema Migration Between Database Versions
tools: []
