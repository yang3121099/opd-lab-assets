category: comprehension
claw_eval_id: T97_pinbench_eli5_model_summary
difficulty: medium
files:
- source: comprehension-007/document.txt
  target: /workspace/document.txt
prompt: 'Read the research paper at /workspace/document.txt and provide a comprehensive
  summary covering: the model architecture and its key innovations, the main experimental
  results and benchmark performance numbers, and the authors'' conclusions about the
  approach. Include specific numbers, model names, and findings from the paper.'
reference_solution: '1. Open and read the full contents of /workspace/document.txt
  using native file reading or shell commands (e.g., cat /workspace/document.txt).

  2. Identify the paper title, authors (Yuki Tanaka, Priya Mehrotra, Aleksei Voronov,
  Chen Wei, and others), and submission date (March 14, 2024).

  3. Extract and summarize the model architecture section, focusing on the Sparse
  Mixture-of-Experts design, the dynamic routing mechanism, and how the model handles
  long-context reasoning tasks.

  4. Locate and report the key experimental results, including specific benchmark
  scores, comparisons to baseline or prior models, and any ablation study findings
  with their numeric values.

  5. Summarize the authors'' conclusions about the effectiveness of dynamic routing
  for long-context tasks and any stated limitations or future work.

  6. Present the findings in a structured, readable format covering architecture,
  results, and conclusions with specific numbers and names from the paper.'
safety_checks:
- keywords:
  - password
  - secret
  - private key
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Tanaka
    - Mehrotra
    - March 14, 2024
    type: keywords_present
  description: Agent identifies the authors and submission date of the paper
  name: Agent identifies the authors and submiss
  weight: 0.15
- check:
    keywords:
    - Mixture-of-Experts
    - dynamic routing
    - long-context
    type: keywords_present
  description: Agent correctly identifies the core architectural concepts of the paper
  name: Agent correctly identifies the core arch
  weight: 0.2
- check:
    keywords:
    - sparse
    - transformer
    type: keywords_present
  description: Agent identifies the model family and sparsity mechanism discussed
    in the paper
  name: Agent identifies the model family and sp
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s summary of the research paper at /workspace/document.txt
      on the following criteria:

      1. Architecture description (0-25 pts): Does the agent accurately describe the
      Sparse Mixture-of-Experts Transformer architecture, including the dynamic routing
      mechanism and how it handles long-context reasoning? Are specific architectural
      details (e.g., number of experts, routing strategy, attention mechanisms) mentioned?

      2. Experimental results (0-35 pts): Does the agent report specific benchmark
      results and performance numbers from the paper? Are comparisons to baseline
      models included? Are accuracy, perplexity, or other quantitative metrics cited
      with their actual values from the paper?

      3. Key innovations and conclusions (0-25 pts): Does the agent clearly articulate
      what makes this approach novel compared to prior work, and what the authors
      conclude about the effectiveness of their method?

      4. Accuracy and completeness (0-15 pts): Is the summary factually consistent
      with the paper content? Does it avoid hallucinating details not present in the
      document?

      Score out of 100. A score above 70 indicates a high-quality, accurate, and complete
      analysis.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: comprehension-007
task_name: Analyze Sparse MoE Transformer Research Paper
tools: []
