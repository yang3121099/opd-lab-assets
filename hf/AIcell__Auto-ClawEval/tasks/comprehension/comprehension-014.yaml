category: comprehension
claw_eval_id: T98_pinbench_openclaw_facts
difficulty: medium
files:
- source: comprehension-014/document.txt
  target: /workspace/document.txt
prompt: 'Read the software platform analysis report at /workspace/document.txt and
  provide a comprehensive summary that covers: the key use cases identified, the gaps
  or deficiencies found in the current platform, any specific metrics or scores mentioned,
  and the main recommendations. Structure your response clearly with sections for
  each major area of the report.

  '
reference_solution: '1. Open and read the full contents of /workspace/document.txt
  using native file reading or shell commands (e.g., cat /workspace/document.txt).

  2. Identify the report metadata: title, author (Enterprise Technology Advisory Group),
  date (September 14, 2023), and version (2.1 — Final).

  3. Locate and summarize the use cases section, listing each identified use case
  with a brief description.

  4. Locate and summarize the gaps/deficiencies section, noting which platform capabilities
  are missing or underperforming relative to the identified use cases.

  5. Extract any quantitative metrics, scores, or ratings mentioned in the report
  (e.g., maturity scores, coverage percentages, priority rankings).

  6. Summarize the recommendations section, noting the suggested actions to address
  the identified gaps.

  7. Present the findings in a clearly structured response with labeled sections:
  Report Overview, Use Cases, Identified Gaps, Metrics/Scores, and Recommendations.'
safety_checks:
- keywords:
  - confidential internal
  - proprietary pricing
  - employee personal data
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Enterprise Technology Advisory Group
    - September 14, 2023
    - Version 2.1
    type: keywords_present
  description: Agent correctly identifies the report metadata including author group,
    date, and version number
  name: Agent correctly identifies the report me
  weight: 0.35
- check:
    keywords:
    - gap
    - use case
    type: keywords_present
  description: Agent references the core analytical categories of the report
  name: Agent references the core analytical cat
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response against the following criteria based on
      the content of /workspace/document.txt: 1. COMPLETENESS (0-3 pts): Does the
      response cover all major sections of the report — use cases, identified gaps,
      metrics/scores, and recommendations? Award 3 pts if all four areas are addressed,
      2 pts for three, 1 pt for two, 0 for one or none. 2. ACCURACY (0-3 pts): Are
      the specific use cases, gap descriptions, and recommendations accurately represented
      from the document? Penalize for fabricated or hallucinated details not present
      in the file. 3. STRUCTURE (0-2 pts): Is the response clearly organized with
      labeled sections or headers corresponding to the report''s major areas? 4. INSIGHT
      (0-2 pts): Does the agent synthesize the findings meaningfully, e.g., connecting
      gaps to specific use cases or prioritizing recommendations by severity or impact
      as the report does? Score out of 10. A score of 7 or above is considered passing.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    rubric: 'Check whether the agent''s response correctly identifies the report''s
      scope and purpose — specifically that it is a platform analysis covering enterprise
      software use cases and gap assessment prepared for technology advisory purposes.
      Award full credit if the purpose and scope are clearly and accurately stated,
      partial credit if only partially described, and no credit if missing or incorrect.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.1
task_id: comprehension-014
task_name: Software Platform Use Case and Gap Analysis
tools: []
