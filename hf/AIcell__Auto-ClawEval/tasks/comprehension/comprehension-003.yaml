category: comprehension
claw_eval_id: T97_pinbench_eli5_model_summary
difficulty: medium
files:
- source: comprehension-003/document.txt
  target: /workspace/document.txt
prompt: 'Read the research paper at /workspace/document.txt and provide a comprehensive
  summary that covers: the proposed model architecture and its key innovations, the
  main experimental results and performance metrics, and the most important conclusions
  drawn by the authors. Include specific numbers and comparisons where relevant.'
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities (e.g., cat, read_file, or open()).

  2. Identify the paper''s title, authors (Yuki Tanaka, Priya Mehrotra, Aleksandr
  Volkov, and others), and submission date (March 14, 2024).

  3. Extract and summarize the proposed model architecture: a Sparse Mixture-of-Experts
  Transformer with a dynamic routing mechanism designed for efficient long-context
  reasoning, noting key design choices such as the number of experts, gating functions,
  and attention modifications.

  4. Identify and report the main experimental results, including benchmark performance
  metrics, comparisons to dense transformer baselines, and any efficiency gains (e.g.,
  FLOPs reduction, memory savings, throughput improvements).

  5. Summarize the authors'' key conclusions, including the advantages of dynamic
  routing over static routing, scalability findings, and any noted limitations or
  directions for future work.

  6. Present the findings in a clear, structured format covering architecture, results,
  and conclusions with specific numbers and comparisons cited from the paper.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Mixture-of-Experts
    - dynamic routing
    - long-context
    type: keywords_present
  description: Agent identifies the core architectural concepts of the paper
  name: 'Agent identifies the core architectural '
  weight: 0.15
- check:
    keywords:
    - Tanaka
    - Mehrotra
    - Volkov
    - '2024'
    type: keywords_present
  description: Agent correctly identifies paper metadata including authors and date
  name: Agent correctly identifies paper metadat
  weight: 0.2
- check:
    keywords:
    - sparse
    - transformer
    - routing
    type: keywords_present
  description: Agent captures key technical terminology from the paper
  name: Agent captures key technical terminology
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s summary of the research paper at /workspace/document.txt
      on the following criteria:

      1. Architecture description (0-25 pts): Does the agent accurately describe the
      Sparse Mixture-of-Experts Transformer architecture, including the dynamic routing
      mechanism and how it enables efficient long-context reasoning? Are specific
      architectural details (e.g., number of experts, routing strategy, attention
      mechanisms) mentioned?

      2. Experimental results (0-25 pts): Does the agent report specific quantitative
      results from the paper, such as benchmark scores, perplexity values, throughput
      improvements, or comparisons against baseline models? Are the numbers accurate
      and in context?

      3. Key conclusions (0-25 pts): Does the agent accurately summarize the main
      findings and contributions claimed by the authors, including any limitations
      or future work discussed?

      4. Clarity and completeness (0-25 pts): Is the summary well-organized, coherent,
      and sufficiently detailed to demonstrate genuine comprehension of the paper
      rather than superficial skimming?

      Score out of 100, then normalize to 0.0-1.0.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: comprehension-003
task_name: Analyze Sparse MoE Transformer Research Paper
tools: []
