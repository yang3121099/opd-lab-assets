category: comprehension
claw_eval_id: T97_pinbench_eli5_model_summary
difficulty: medium
files:
- source: comprehension-005/document.txt
  target: /workspace/document.txt
prompt: 'Read the research paper at /workspace/document.txt and provide a comprehensive
  summary that covers: the proposed model architecture and its key innovations, the
  main experimental results and performance metrics, and the most important conclusions
  drawn by the authors. Include specific numbers and comparisons where relevant.'
reference_solution: '1. Open and read the file at /workspace/document.txt using native
  shell or file reading capabilities (e.g., cat /workspace/document.txt or equivalent).

  2. Identify the paper''s title, authors (Yuki Tanaka, Priya Mehrotra, et al.), publication
  venue (Transactions on Machine Learning Research, March 2024), and abstract.

  3. Extract the key architectural innovations: the Sparse Mixture-of-Experts design,
  the dynamic routing mechanism, and how these address long-context language modeling
  challenges.

  4. Locate and record specific experimental results: benchmark performance numbers,
  comparisons to baseline or competing models, efficiency metrics (e.g., FLOPs, memory
  usage, perplexity scores).

  5. Summarize the authors'' main conclusions about the model''s strengths, limitations,
  and contributions to the field.

  6. Compose a structured summary that includes all of the above elements with specific
  numbers and direct references to the paper''s findings.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Mixture-of-Experts
    - dynamic routing
    - long-context
    - Tanaka
    - Mehrotra
    - Transactions on Machine Learning Research
    - '2024'
    type: keywords_present
  description: Agent must mention key identifying facts from the paper including authors,
    venue, and core technical terms
  name: Agent must mention key identifying facts
  weight: 0.35
- check:
    keywords:
    - sparse
    - transformer
    type: keywords_present
  description: Agent must reference the core architectural components described in
    the paper
  name: Agent must reference the core architectu
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s summary of the research paper at /workspace/document.txt
      on the following criteria:

      1. Architecture description: Does the agent accurately describe the Sparse Mixture-of-Experts
      Transformer architecture, including the dynamic routing mechanism and how it
      handles long-context language modeling?

      2. Key results: Does the agent report specific experimental results, performance
      metrics, or benchmark comparisons mentioned in the paper (e.g., perplexity scores,
      accuracy numbers, efficiency gains, or comparisons to baseline models)?

      3. Main conclusions: Does the agent capture the authors'' primary conclusions
      about the model''s effectiveness, limitations, or contributions to the field?

      4. Accuracy: Are the facts, numbers, and claims in the summary consistent with
      what is actually stated in the paper?

      5. Completeness: Does the summary cover the major sections of the paper (motivation,
      method, experiments, conclusions) without omitting critical findings?

      Score 1 (poor) if the summary is vague, missing key technical details, or contains
      inaccurate information. Score 5 (excellent) if the summary is accurate, specific,
      well-organized, and covers all major aspects of the paper with concrete numbers
      and comparisons.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
- check:
    keywords:
    - I cannot read
    - I am unable to access
    - file not found
    - no such file
    type: keywords_absent
  description: Agent must successfully read and process the file without reporting
    access errors
  name: Agent must successfully read and process
  weight: 0.1
task_id: comprehension-005
task_name: Analyze Sparse MoE Transformer Research Paper
tools: []
