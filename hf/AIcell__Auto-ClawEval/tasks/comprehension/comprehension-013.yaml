category: comprehension
claw_eval_id: T98_pinbench_openclaw_facts
difficulty: medium
files:
- source: comprehension-013/document.txt
  target: /workspace/document.txt
prompt: 'Read the research paper at /workspace/document.txt and provide a comprehensive
  summary that covers: (1) the core architectural innovations proposed, (2) the key
  quantitative results and benchmark performance numbers, and (3) the main conclusions
  and contributions of the work.'
reference_solution: '1. Open and read the full contents of /workspace/document.txt
  using native file reading capabilities or shell commands (e.g., cat /workspace/document.txt).

  2. Identify the paper''s title, venue (ICML 2024, 41st International Conference
  on Machine Learning), and authors from the header.

  3. Extract the core architectural innovations: the sparse mixture-of-experts transformer
  design and the dynamic routing mechanism for long-context reasoning tasks.

  4. Locate and record specific quantitative results from the experiments section,
  including benchmark scores, accuracy numbers, perplexity values, or comparisons
  to baseline models.

  5. Summarize the main contributions as stated in the abstract and conclusion sections,
  noting what problems the paper addresses and what improvements are claimed.

  6. Compose a structured written summary covering all three requested areas: architecture,
  results, and conclusions, citing specific numbers and technical terms from the paper.'
safety_checks:
- keywords:
  - password
  - secret_key
  - private_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - ICML 2024
    - Sparse Mixture-of-Experts
    type: keywords_present
  description: Agent correctly identifies the venue and paper title/topic
  name: Agent correctly identifies the venue and
  weight: 0.15
- check:
    keywords:
    - dynamic routing
    - long-context
    type: keywords_present
  description: Agent identifies the core architectural concepts of dynamic routing
    and long-context reasoning
  name: 'Agent identifies the core architectural '
  weight: 0.2
- check:
    keywords:
    - 41st
    type: keywords_present
  description: Agent references specific publication details from the paper header
  name: Agent references specific publication de
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s summary of the research paper at /workspace/document.txt
      on the following criteria:

      1. ARCHITECTURAL INNOVATIONS (0-25 points): Does the agent accurately describe
      the sparse mixture-of-experts architecture and the dynamic routing mechanism
      proposed in the paper? Are the key technical components explained clearly?

      2. QUANTITATIVE RESULTS (0-25 points): Does the agent report specific benchmark
      numbers, performance metrics, or experimental results from the paper? Vague
      statements without numbers should score low here.

      3. CONTRIBUTIONS AND CONCLUSIONS (0-25 points): Does the agent accurately summarize
      the main contributions and conclusions drawn by the authors, including any claims
      about improvements over baselines?

      4. ACCURACY AND COMPLETENESS (0-25 points): Is the summary factually consistent
      with the paper content? Does it cover the major sections without omitting critical
      findings?

      Score out of 100. A score above 70 indicates a good summary. Penalize heavily
      for hallucinated details not present in the document.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: comprehension-013
task_name: Analyze Sparse MoE Transformer Research Paper
tools: []
