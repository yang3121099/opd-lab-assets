tools:
- description: List all available RSS feeds, optionally filtered by category
  endpoint: /rss/feeds
  method: POST
  name: list_feeds
  service: rss
- description: List articles from RSS feeds, optionally filtered by source or category
  endpoint: /rss/articles
  method: POST
  name: list_articles
  service: rss
- description: Get full details of a specific RSS article by ID
  endpoint: /rss/articles/get
  method: POST
  name: get_rss_article
  service: rss
- description: Search the real web for current information on a topic
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Publish a newsletter to a list of recipients
  endpoint: /rss/publish
  method: POST
  name: publish_newsletter
  service: rss
