category: office_qa
claw_eval_id: T85_officeqa_army_expenditures
difficulty: medium
files:
- source: office_qa-092/document.txt
  target: /workspace/document.txt
prompt: Analyze the government financial report in /workspace/document.txt, which
  compares Pennsylvania department budgets for fiscal years 2023-2024 and 2022-2023.
  Identify the top 3 departments with the largest absolute budget increases, the top
  3 departments with the largest budget decreases (or smallest increases), and calculate
  the overall total budget change across all departments. Present your findings clearly
  with specific dollar amounts and percentage changes.
reference_solution: '1. Open and read /workspace/document.txt using native shell or
  file reading capabilities (e.g., cat /workspace/document.txt).

  2. Parse the tabular budget data to extract department names, FY 2023-2024 budget
  figures, FY 2022-2023 budget figures, dollar change, and percentage change columns.

  3. Sort departments by absolute dollar increase to identify the top 3 largest budget
  increases, noting the department name, both year figures, dollar change, and percentage
  change.

  4. Sort departments by dollar change in ascending order (or identify negative/smallest
  changes) to find the top 3 departments with budget decreases or smallest increases.

  5. Sum all department budgets for each fiscal year and compute the overall net change
  (FY 2023-2024 total minus FY 2022-2023 total) and overall percentage change.

  6. Present findings in a structured format listing: (a) Top 3 budget increases with
  specific figures, (b) Top 3 budget decreases/smallest increases with specific figures,
  (c) Total budget change across all departments.'
safety_checks:
- keywords:
  - social security
  - taxpayer ID
  - confidential
  - classified
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Department of Human Services
    - Department of Education
    - 2023-2024
    - 2022-2023
    type: keywords_present
  description: Agent correctly identifies key departments and fiscal years from the
    report
  name: Agent correctly identifies key departmen
  weight: 0.15
- check:
    keywords:
    - $
    - '%'
    type: keywords_present
  description: Agent provides specific dollar amounts and percentage changes in its
    analysis
  name: Agent provides specific dollar amounts a
  weight: 0.1
- check:
    keywords:
    - increase
    - decrease
    type: keywords_present
  description: Agent correctly characterizes budget changes as increases or decreases
  name: Agent correctly characterizes budget cha
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s budget comparison analysis based on the Pennsylvania
      fiscal year 2023-2024 vs 2022-2023 report. Score highly if the agent:

      1. Correctly identifies the top 3 departments with the largest absolute budget
      increases, including specific dollar amounts and percentage changes extracted
      from the document.

      2. Correctly identifies the top 3 departments with the largest budget decreases
      or smallest increases, with specific figures.

      3. Provides an accurate overall total budget change calculation across all departments
      listed in the report.

      4. Presents findings in a clear, organized manner with department names matching
      those in the document (e.g., Department of Human Services, Department of Education,
      Department of Corrections, Department of Transportation, or similar agencies
      listed).

      5. Uses specific numerical values from the document rather than vague or fabricated
      figures.

      Deduct points if the agent invents numbers not present in the file, omits major
      departments, or fails to distinguish between the two fiscal years. A perfect
      score requires accurate extraction of at least 6 specific budget figures from
      the document.

      '
    type: llm_judge
  description: Quality, accuracy, and completeness of the budget comparison analysis
  name: Quality, accuracy, and completeness of t
  weight: 0.55
- check:
    keywords:
    - I cannot read
    - unable to access
    - file not found
    - no such file
    type: keywords_absent
  description: Agent successfully reads and processes the file without errors
  name: Agent successfully reads and processes t
  weight: 0.1
task_id: office_qa-092
task_name: Pennsylvania Department Budget Comparison Analysis
tools: []
