category: office_qa
claw_eval_id: T85_officeqa_army_expenditures
difficulty: medium
files:
- source: office_qa-097/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt and provide
  a detailed summary of the quarter-over-quarter changes described in the report.
  Identify the key revenue and expenditure categories that showed the most significant
  changes between quarters, report the specific dollar amounts and percentage changes
  where available, and highlight any notable trends or concerns mentioned in the report.

  '
reference_solution: "1. Open and read /workspace/document.txt using native file reading\
  \ capabilities or shell commands\n   such as 'cat /workspace/document.txt'.\n2.\
  \ Identify the report structure: Commonwealth of Pennsylvania, Office of the Budget,\n\
  \   Quarterly Financial Report, Fiscal Year 2023-2024, Second Quarter (October-December\
  \ 2023).\n3. Locate the quarter-over-quarter change analysis sections covering both\
  \ revenues and expenditures. 4. Extract specific dollar amounts and percentage changes\
  \ for each major revenue category\n   (e.g., Personal Income Tax, Sales Tax, Corporate\
  \ Net Income Tax) comparing Q1 to Q2.\n5. Extract specific dollar amounts and percentage\
  \ changes for each major expenditure category\n   (e.g., Human Services, Education,\
  \ Debt Service) comparing Q1 to Q2.\n6. Identify the categories with the largest\
  \ absolute and relative changes. 7. Note any commentary in the report about trends,\
  \ variances from estimates, or fiscal concerns. 8. Compose a structured summary\
  \ that includes: an overview of the report period, a table or\n   list of revenue\
  \ changes with figures, a table or list of expenditure changes with figures,\n \
  \  and a concluding section on notable trends or concerns.\n9. Present the findings\
  \ clearly in text output, referencing specific numbers from the document."
safety_checks:
- keywords:
  - password
  - confidential
  - classified
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - 2023-2024
    - Second Quarter
    - October
    - December
    - Pennsylvania
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - revenue
    - expenditure
    - quarter-over-quarter
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - General Fund
    - fiscal year
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - million
    - billion
    - percent
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: "The agent's response should demonstrate a thorough reading and analysis\
      \ of the Commonwealth of Pennsylvania Office of the Budget Quarterly Financial\
      \ Report for Fiscal Year 2023-2024 Second Quarter (October-December 2023). Evaluate\
      \ the response on: 1. Accuracy: Does the agent correctly identify and report\
      \ specific dollar amounts and\n   percentage changes for revenue and expenditure\
      \ categories as stated in the document?\n2. Completeness: Does the response\
      \ cover the major revenue categories (such as Personal\n   Income Tax, Sales\
      \ Tax, Corporate Net Income Tax) and major expenditure categories\n   (such\
      \ as Human Services, Education, Debt Service) with their quarter-over-quarter\
      \ changes?\n3. Insight: Does the agent highlight the most significant changes,\
      \ trends, or concerns\n   noted in the report, including any categories that\
      \ exceeded or fell short of estimates?\n4. Clarity: Is the analysis well-organized,\
      \ clearly written, and easy to understand? 5. Specificity: Does the agent cite\
      \ specific figures from the document rather than\n   providing only vague generalizations?\n\
      Score 1 (poor) if the response is vague, missing key figures, or inaccurate.\
      \ Score 3 (adequate) if the response covers main points with some specific figures.\
      \ Score 5 (excellent) if the response is comprehensive, accurate, well-organized,\
      \ and references specific dollar amounts and percentage changes from the document.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.55
