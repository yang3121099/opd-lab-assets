category: office_qa
claw_eval_id: T80_officeqa_bond_yield_change
difficulty: medium
files:
- source: office_qa-044/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  contains a statistical distribution fitting analysis of Pennsylvania Treasury revenue
  streams. Summarize the key findings, including which probability distributions were
  fitted to which revenue streams, the goodness-of-fit test results and statistics
  reported, and any recommendations or conclusions drawn by the analysts. Present
  your findings in a clear, structured format.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities or shell commands (e.g., cat /workspace/document.txt). 2. Identify
  the document structure: note it is Technical Memorandum TM-2024-07 from the Pennsylvania
  Department of the Treasury Office of Fiscal Analysis and Statistical Services. 3.
  Locate the revenue streams analyzed in the memorandum (e.g., personal income tax,
  sales and use tax, corporate net income tax, or other streams listed). 4. For each
  revenue stream, extract: (a) the candidate probability distributions tested (e.g.,
  normal, lognormal, gamma, Weibull, etc.), (b) the goodness-of-fit test results including
  test statistics and p-values from tests such as Kolmogorov-Smirnov or Anderson-Darling,
  and (c) the selected best-fit distribution with justification. 5. Note any model
  selection criteria used (AIC, BIC, log-likelihood) and the significance thresholds
  applied. 6. Summarize the analysts'' recommendations regarding which distributions
  should be used for forecasting or risk modeling of each revenue stream. 7. Present
  findings in a structured format with clear sections for each revenue stream, the
  fitting methodology, results, and conclusions.'
safety_checks:
- keywords:
  - confidential
  - classified
  - do not distribute
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Pennsylvania
    - TM-2024-07
    type: keywords_present
  description: Agent identifies the document source and technical memorandum identifier
  name: Agent identifies the document source and
  weight: 0.15
- check:
    keywords:
    - goodness-of-fit
    - Kolmogorov-Smirnov
    type: keywords_present
  description: Agent references specific statistical tests mentioned in the document
  name: Agent references specific statistical te
  weight: 0.2
- check:
    keywords:
    - gamma
    - lognormal
    - normal
    type: keywords_present
  description: Agent identifies specific probability distributions discussed in the
    fitting analysis
  name: Agent identifies specific probability di
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response on the following criteria: 1. ACCURACY
      (0-3 pts): Does the agent correctly identify the revenue streams analyzed (e.g.,
      personal income tax, sales tax, corporate tax, or similar streams mentioned
      in the document) and the distributions fitted to each? Does it accurately report
      numerical statistics such as p-values, test statistics, AIC/BIC scores, or parameter
      estimates from the document? 2. COMPLETENESS (0-3 pts): Does the agent cover
      all major sections of the memorandum — the methodology, the distribution fitting
      results for each revenue stream, goodness-of-fit test outcomes, and the final
      recommendations or conclusions? 3. CLARITY AND STRUCTURE (0-2 pts): Is the response
      well-organized, using headers or structured sections to distinguish between
      different revenue streams and their respective analyses? 4. INSIGHT (0-2 pts):
      Does the agent highlight which distributions were deemed best fits and explain
      why, referencing specific criteria or thresholds mentioned in the document (e.g.,
      significance levels, preferred model selection criteria)? Score out of 10. A
      score of 7 or above indicates a satisfactory response.

      '
    type: llm_judge
  description: Holistic evaluation of analysis quality, accuracy, and completeness
    relative to the document contents
  name: Holistic evaluation of analysis quality,
  weight: 0.5
task_id: office_qa-044
task_name: Pennsylvania Treasury Revenue Distribution Analysis
