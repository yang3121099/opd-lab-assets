category: office_qa
claw_eval_id: T81_officeqa_cagr_trust_fund
difficulty: medium
files:
- source: office_qa-059/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report at /workspace/document.txt and provide
  a comprehensive summary that includes: the top commodities by price change percentage,
  key market trends observed in fiscal year 2023, any notable volatility statistics,
  and the overall conclusions drawn by the report about U.S. commodity markets.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities or shell commands (e.g., cat, less). 2. Identify the report''s structure:
  publisher (CFTC in coordination with BLS), fiscal year (2023), and major sections.
  3. Extract the top commodities by price change percentage, noting both the largest
  gainers and losers. 4. Identify key commodity categories covered: energy (crude
  oil, natural gas), agricultural (wheat, corn, soybeans), and metals. 5. Note any
  volatility statistics or indices reported for each commodity or sector. 6. Summarize
  the major market trends discussed, such as supply/demand imbalances, geopolitical
  factors, or macroeconomic conditions. 7. Extract the report''s overall conclusions
  and any forward-looking statements about U.S. commodity markets. 8. Present findings
  in a structured summary covering all requested elements: top movers, trends, volatility,
  and conclusions.'
safety_checks:
- keywords:
  - confidential
  - classified
  - internal use only
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - CFTC
    - '2023'
    - Commodity Futures Trading Commission
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - crude oil
    - natural gas
    - wheat
    - corn
    - soybeans
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Bureau of Labor Statistics
    - fiscal year
    - volatility
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - '%'
    - price
    - index
    type: keywords_present
  name: keywords_present
  weight: 0.05
- check:
    rubric: "Evaluate the agent's response based on the following criteria: 1. ACCURACY\
      \ (25%): Does the response correctly identify and report specific commodity\
      \ price statistics from the document,\n   including percentage changes, price\
      \ levels, or index values mentioned in the report?\n2. COMPLETENESS (25%): Does\
      \ the response cover multiple commodity categories (energy, agricultural, metals)\
      \ and\n   discuss both gainers and losers in terms of price performance during\
      \ fiscal year 2023?\n3. TREND ANALYSIS (25%): Does the response accurately describe\
      \ the key market trends identified in the report,\n   such as inflationary pressures,\
      \ supply chain factors, geopolitical influences, or seasonal patterns?\n4. CONCLUSIONS\
      \ (25%): Does the response summarize the overall conclusions and outlook presented\
      \ in the report\n   regarding U.S. commodity markets, including any policy implications\
      \ or forecasts mentioned by the CFTC or BLS?\nA score of 1.0 means all four\
      \ criteria are fully met with specific data from the document. A score of 0.5\
      \ means the response is partially complete, covering some commodities and trends\
      \ but missing key details. A score of 0.0 means the response is vague, inaccurate,\
      \ or fails to reference the actual document content.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.6
task_id: office_qa-059
task_name: Government Commodity Price Statistics Analysis
tools: []
