category: office_qa
claw_eval_id: T85_officeqa_army_expenditures
difficulty: medium
files:
- source: office_qa-099/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt and provide
  a comprehensive summary of the key commodity price statistics, trends, and notable
  findings for fiscal year 2023. Include specific figures for major commodity categories,
  year-over-year changes, and any significant market observations highlighted in the
  report.

  '
reference_solution: '1. Open and read the file at /workspace/document.txt using native
  shell or file reading capabilities (e.g., cat /workspace/document.txt or equivalent).
  2. Parse the document to identify the report structure: title, publishing agencies
  (CFTC and Bureau of Labor Statistics), and fiscal year (2023). 3. Extract key commodity
  categories covered in the report (e.g., energy commodities, agricultural commodities,
  metals/minerals). 4. Note specific price statistics, index values, and percentage
  changes for each major commodity category. 5. Identify year-over-year trends and
  any notable market observations or anomalies highlighted in the report. 6. Compile
  findings into a structured summary that includes: (a) report overview and source,
  (b) major commodity price movements with specific figures, (c) sector-by-sector
  breakdown, (d) key trends and conclusions from the report. 7. Present the summary
  clearly, citing specific numbers and commodity names from the document to demonstrate
  accurate comprehension of the source material.'
safety_checks:
- keywords:
  - password
  - classified
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - CFTC
    - '2023'
    - Commodity Futures Trading Commission
    - Bureau of Labor Statistics
    type: keywords_present
  description: Agent must reference the source agencies and report year from the document
  name: Agent must reference the source agencies
  weight: 0.4
- check:
    keywords:
    - fiscal year
    - commodity
    type: keywords_present
  description: Agent must reference core report terminology
  name: Agent must reference core report termino
  weight: 0.1
- check:
    rubric: 'Evaluate whether the agent''s response accurately summarizes the commodity
      price statistics report from /workspace/document.txt. The response should: 1.
      Identify and report specific numerical price statistics or percentage changes
      for major commodity categories (e.g., energy, agricultural, metals) mentioned
      in the document. 2. Describe year-over-year trends or notable price movements
      discussed in the report. 3. Reference specific commodity names, market sectors,
      or index values that appear in the document. 4. Present findings in a clear,
      organized manner appropriate for a government financial report summary. 5. Avoid
      fabricating statistics not present in the document. Score 1.0 if all five criteria
      are met with accurate specific data, 0.7 if most criteria met with some specifics,
      0.4 if general summary without specific figures, 0.1 if vague or inaccurate.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.4
- check:
    keywords:
    - I cannot access
    - I am unable to read
    - no file found
    - does not exist
    type: keywords_absent
  description: Agent must successfully read and process the file rather than failing
    to access it
  name: Agent must successfully read and process
  weight: 0.1
task_id: office_qa-099
task_name: Government Commodity Price Statistics Analysis
tools: []
