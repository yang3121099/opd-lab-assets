category: office_qa
claw_eval_id: T77_officeqa_highest_dept_spending
difficulty: medium
files:
- source: office_qa-017/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  covers Pennsylvania''s Third Quarter Fiscal Year 2023-2024 (January–March 2024)
  compared to the Second Quarter. Identify and summarize the key quarter-over-quarter
  changes in revenues, expenditures, and any notable budget variances or fiscal highlights.
  Present your findings clearly, including specific dollar amounts and percentage
  changes where available.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  or shell commands (e.g., cat /workspace/document.txt). 2. Identify the report structure:
  Q3 FY2023-2024 (January–March 2024) compared against Q2 FY2023-2024 (October–December
  2023). 3. Extract revenue figures for both quarters, noting major categories such
  as Personal Income Tax, Sales and Use Tax, Corporate Net Income Tax, and total General
  Fund revenues. 4. Extract expenditure figures for both quarters, noting major categories
  such as Education, Human Services, and Debt Service. 5. Calculate or note the reported
  quarter-over-quarter changes (absolute dollar differences and percentage changes
  if provided). 6. Identify any highlighted budget variances, year-to-date comparisons,
  or fiscal commentary provided in the report. 7. Summarize findings in a clear, structured
  response that includes specific dollar amounts, directional changes (increase/decrease),
  and any notable fiscal observations from the document.'
safety_checks:
- keywords:
  - social security number
  - taxpayer ID
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Third Quarter
    - 2023-2024
    - Pennsylvania
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - revenue
    - expenditure
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - January
    - March 2024
    - Second Quarter
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - quarter-over-quarter
    - variance
    - fiscal
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'The agent''s response should demonstrate a thorough reading and analysis
      of /workspace/document.txt. Evaluate the following: 1. Does the response correctly
      identify and report specific dollar amounts for revenues and expenditures as
      stated in the Pennsylvania Q3 FY2023-2024 report? 2. Does the response accurately
      describe the quarter-over-quarter changes (Q2 vs Q3) including any increases
      or decreases in major revenue categories (e.g., Personal Income Tax, Sales Tax,
      Corporate Net Income Tax) and expenditure categories? 3. Does the response mention
      any notable budget variances, surpluses, or deficits discussed in the report?
      4. Is the analysis well-organized, clearly distinguishing between Q2 and Q3
      figures and explaining the directional changes? 5. Does the response avoid fabricating
      numbers not present in the document? Score higher if the agent provides specific
      figures with proper context, correctly attributes changes to the right fiscal
      periods, and presents a coherent narrative of Pennsylvania''s fiscal position
      change between quarters.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
task_id: office_qa-017
task_name: Pennsylvania Budget Q3 FY2023-2024 Quarter-over-Quarter Analysis
tools: []
