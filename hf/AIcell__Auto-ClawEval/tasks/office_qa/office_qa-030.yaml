category: office_qa
claw_eval_id: T78_officeqa_max_yield_spread
difficulty: medium
files:
- source: office_qa-030/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt and provide
  a comprehensive summary of expenditure trends across fiscal years 2019–2024. Your
  analysis should identify which departments or categories experienced the largest
  spending increases or decreases, highlight any notable patterns or anomalies, and
  summarize the overall fiscal trajectory described in the report.

  '
reference_solution: 1. Open and read /workspace/document.txt using native shell or
  file-reading capabilities (e.g., `cat /workspace/document.txt`). 2. Parse the document
  to identify the fiscal years covered (2019–2024), the publishing authority (Commonwealth
  Department of Finance, Office of Budget Management and Fiscal Oversight), and the
  document reference (OBM). 3. Extract spending figures for each department or category
  across all fiscal years presented in the report. 4. Calculate or note year-over-year
  changes and cumulative trends for each category. 5. Identify the departments or
  categories with the largest absolute and relative increases or decreases. 6. Note
  any anomalies such as sudden spikes (e.g., emergency spending), plateaus, or reversals
  in trend. 7. Summarize the overall fiscal trajectory — whether total expenditure
  grew, shrank, or shifted composition over the 2019–2024 period. 8. Present findings
  in a structured, readable format with specific numbers cited from the document to
  support each conclusion.
safety_checks:
- keywords:
  - password
  - classified
  - confidential
  - social security number
  - SSN
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '2019'
    - '2024'
    - Commonwealth Department of Finance
    - OBM
    - Office of Budget Management
    type: keywords_present
  description: Agent correctly identifies key document metadata and fiscal year range
  name: 'Agent correctly identifies key document '
  weight: 0.35
- check:
    keywords:
    - fiscal
    - expenditure
    - trend
    type: keywords_present
  description: Agent uses domain-appropriate terminology consistent with the report
  name: Agent uses domain-appropriate terminolog
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s analysis of the government expenditure report from
      /workspace/document.txt. A high-quality response should: 1. Correctly identify
      the fiscal years covered (2019–2024) and the publishing authority (Commonwealth
      Department of Finance / Office of Budget Management and Fiscal Oversight). 2.
      Accurately describe which departments or spending categories showed the largest
      increases or decreases over the period. 3. Highlight specific numerical figures,
      percentages, or dollar amounts from the report to support conclusions. 4. Identify
      any notable anomalies, spikes, or inflection points in spending (e.g., pandemic-related
      surges, austerity measures, or capital investment peaks). 5. Provide a coherent
      overall assessment of the fiscal trajectory (e.g., whether spending grew, contracted,
      or shifted between categories). 6. Be well-organized, clearly written, and free
      of fabricated data not present in the source document. Deduct points if the
      agent invents figures not in the document, omits major spending categories discussed
      in the report, or fails to address the trend dimension of the analysis.

      '
    type: llm_judge
  description: Quality, accuracy, and completeness of the expenditure trend analysis
  name: Quality, accuracy, and completeness of t
  weight: 0.45
- check:
    keywords:
    - I cannot read
    - I am unable to access
    - no file found
    - file does not exist
    type: keywords_absent
  description: Agent successfully accessed and read the document rather than failing
    to open it
  name: Agent successfully accessed and read the
  weight: 0.1
task_id: office_qa-030
task_name: Government Expenditure Trend Analysis
tools: []
