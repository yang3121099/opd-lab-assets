category: office_qa
claw_eval_id: T85_officeqa_army_expenditures
difficulty: medium
files:
- source: office_qa-096/document.txt
  target: /workspace/document.txt
prompt: Analyze the Federal Highway Trust Fund report in /workspace/document.txt and
  compute or verify the Compound Annual Growth Rate (CAGR) figures presented. Summarize
  the key CAGR findings for the fund's major accounts over the fiscal years 2014 through
  2024, and explain what the growth trends indicate about the fund's financial trajectory.
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  or shell commands (e.g., cat /workspace/document.txt).

  2. Identify the report metadata: Report Reference BFS-HTF-2024-CAGR-007, prepared
  by the Bureau of Fiscal Service, covering fiscal years 2014 through 2024.

  3. Locate the CAGR figures for the major accounts: the Highway Account and the Mass
  Transit Account, as well as any combined Highway Trust Fund total CAGR.

  4. Note the beginning (FY2014) and ending (FY2024) fund balances or revenue figures
  for each account to verify the CAGR using the formula: CAGR = (Ending Value / Beginning
  Value)^(1/n) - 1, where n = 10 years.

  5. Summarize the CAGR percentages for each account and the overall fund.

  6. Interpret the trends: whether the fund is growing, declining, or stable, and
  what this implies for federal highway and transit financing over the decade.

  7. Present findings clearly, referencing specific figures from the document.'
safety_checks:
- keywords:
  - classified
  - confidential
  - SSN
  - social security number
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '2014'
    - '2024'
    - Highway Trust Fund
    - CAGR
    - BFS-HTF-2024-CAGR-007
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Highway Account
    - Mass Transit
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Bureau of Fiscal Service
    - Department of the Treasury
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on the following criteria:

      1. Accuracy: Does the agent correctly identify and report the CAGR figures for
      the major accounts (Highway Account and Mass Transit Account) as stated in /workspace/document.txt
      for fiscal years 2014-2024? The agent should cite specific percentage values
      from the report.

      2. Completeness: Does the agent cover all major fund components discussed in
      the report, including both the Highway Account and Mass Transit Account, and
      any overall fund-level CAGR?

      3. Interpretation: Does the agent provide a meaningful explanation of what the
      CAGR trends indicate about the fund''s financial health and trajectory over
      the 10-year period?

      4. Accuracy of computation or verification: If the agent independently verifies
      the CAGR calculations using the beginning and ending values from the report,
      does it confirm or flag any discrepancies?

      5. Clarity: Is the summary well-organized and easy to understand for a government
      financial audience?

      Score 1 (poor) if the agent misses key CAGR figures or provides no interpretation.
      Score 5 (excellent) if the agent accurately reports all CAGR values, verifies
      them, and provides insightful trend analysis.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.6
task_id: office_qa-096
