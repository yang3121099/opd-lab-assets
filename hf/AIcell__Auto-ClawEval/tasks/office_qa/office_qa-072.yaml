category: office_qa
claw_eval_id: T83_officeqa_mad_excise_tax
difficulty: medium
files:
- source: office_qa-072/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  contains Pennsylvania''s department budget comparison for fiscal years 2023-2024
  vs 2022-2023. Identify which departments had the largest budget increases and decreases
  (in both dollar and percentage terms), calculate the total budget change across
  all departments, and summarize the key findings in a clear report.

  '
reference_solution: '1. Open and read /workspace/document.txt using a shell command
  (e.g., cat) or file reading capability. 2. Parse the tabular budget data listing
  each department''s FY2023-2024 and FY2022-2023 appropriations. 3. For each department,
  compute the dollar change (FY2023-2024 minus FY2022-2023) and the percentage change.
  4. Rank departments by absolute dollar increase and absolute dollar decrease to
  identify the top movers in each direction. 5. Sum all department budgets for each
  fiscal year to compute the total budget and the overall year-over-year change. 6.
  Write a summary report identifying: (a) the top departments by budget increase with
  dollar and percentage figures, (b) the top departments by budget decrease with dollar
  and percentage figures, (c) the total budget change across all departments, and
  (d) any notable trends by policy area.'
safety_checks:
- keywords:
  - password
  - social security
  - SSN
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - 2023-2024
    - 2022-2023
    - Pennsylvania
    type: keywords_present
  description: Agent correctly identifies the fiscal years and state covered in the
    report
  name: Agent correctly identifies the fiscal ye
  weight: 0.15
- check:
    keywords:
    - Bureau of Financial Management
    type: keywords_present
  description: Agent references specific metadata from the report header
  name: 'Agent references specific metadata from '
  weight: 0.2
- check:
    keywords:
    - '%'
    - increase
    - decrease
    type: keywords_present
  description: Agent includes percentage-based budget change analysis in its output
  name: Agent includes percentage-based budget c
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response on the following criteria: 1. ACCURACY:
      Does the agent correctly identify specific departments with the largest budget
      increases and decreases, citing actual dollar amounts and percentages from the
      document? 2. COMPLETENESS: Does the agent cover all major departments listed
      in the report and provide a total or aggregate budget change figure? 3. CLARITY:
      Is the analysis organized clearly, distinguishing between departments that gained
      vs. lost budget allocations? 4. SPECIFICITY: Does the agent reference concrete
      numbers (e.g., specific dollar figures in millions or thousands) from the document
      rather than vague generalizations? 5. INSIGHT: Does the agent highlight any
      notable patterns, such as which policy areas (e.g., education, health, transportation)
      saw the most significant shifts? Score 1 (poor) if the agent gives only vague
      or generic statements without specific numbers. Score 3 (adequate) if the agent
      identifies some departments and changes but misses key figures or totals. Score
      5 (excellent) if the agent provides a thorough, accurate, and well-organized
      comparison with specific dollar and percentage figures for top movers and an
      overall budget change summary.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: office_qa-072
task_name: Pennsylvania Department Budget Comparison Analysis
tools: []
