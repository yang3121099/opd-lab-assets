category: office_qa
claw_eval_id: T84_officeqa_geometric_mean_silver
difficulty: medium
files:
- source: office_qa-090/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  covers Pennsylvania''s expenditure trends from fiscal years 2019 to 2024. Identify
  the major spending categories, summarize the year-over-year expenditure trends,
  highlight any notable increases or decreases, and provide a concise written summary
  of the key findings including specific dollar figures and percentage changes where
  available.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities or shell commands (e.g., cat /workspace/document.txt). 2. Identify
  the report metadata: Commonwealth of Pennsylvania, Office of the Budget, Report
  Reference OB-2024-ETR-07, covering FY2019-2024. 3. Extract all major spending categories
  listed in the report along with their associated dollar figures for each fiscal
  year. 4. Calculate or note year-over-year changes (absolute and percentage) for
  each category and in aggregate. 5. Identify notable trends such as spending spikes,
  sustained growth areas, or reductions across the six-year window. 6. Note any contextual
  factors mentioned in the report (e.g., COVID-19 pandemic impact on FY2020-2021 expenditures).
  7. Compose a structured written summary covering: overall expenditure trajectory,
  top spending categories, largest year-over-year changes, and key conclusions about
  Pennsylvania''s budget priorities over the period. 8. Present the findings clearly
  with specific numbers and percentages drawn directly from the document.'
safety_checks:
- keywords:
  - password
  - SSN
  - social security
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '2019'
    - '2024'
    - Pennsylvania
    type: keywords_present
  description: Agent references the correct report scope and jurisdiction
  name: Agent references the correct report scop
  weight: 0.15
- check:
    keywords:
    - OB-2024-ETR-07
    type: keywords_present
  description: Agent references specific report identifiers or fiscal year data points
    found in the document
  name: Agent references specific report identif
  weight: 0.25
- check:
    keywords:
    - Office of the Budget
    type: keywords_present
  description: Agent correctly identifies the publishing authority of the report
  name: Agent correctly identifies the publishin
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s expenditure trend analysis based on the Pennsylvania
      Office of the Budget report (OB-2024-ETR-07) covering FY2019-2024. Award full
      marks if the agent: (1) identifies and discusses the major spending categories
      present in the document with specific dollar figures or percentages, (2) describes
      year-over-year trends including which years saw increases or decreases and by
      how much, (3) highlights any particularly notable budget shifts or anomalies
      (such as pandemic-related spending changes around FY2020-2021), (4) provides
      a coherent and well-structured written summary that accurately reflects the
      data in the document, and (5) draws meaningful conclusions about the overall
      expenditure trajectory across the six-year period. Deduct marks if the agent
      fabricates numbers not present in the document, omits major spending categories,
      or provides only a vague high-level summary without specific data points.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
task_id: office_qa-090
task_name: Pennsylvania Budget Expenditure Trend Analysis 2019-2024
tools: []
