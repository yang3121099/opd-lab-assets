category: office_qa
claw_eval_id: T79_officeqa_zipf_exponent
difficulty: medium
files:
- source: office_qa-039/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report at /workspace/document.txt and provide
  a comprehensive summary of the key commodity price statistics. Your summary should
  include: the top performing and worst performing commodities by price change, notable
  trends in energy, agricultural, and metals markets, and any significant year-over-year
  percentage changes mentioned in the report.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities (e.g., cat, read_file, or open in shell). 2. Identify the document
  structure: it is a CFTC Fiscal Year 2023 Annual Summary covering commodity price
  statistics across energy, agricultural, and metals markets. 3. Extract key statistics:
  locate tables or sections listing commodity prices, year-over-year percentage changes,
  and market summaries. 4. Identify top performing commodities (highest positive price
  change %) and worst performing commodities (largest negative price change %). 5.
  Summarize notable trends in each sector: energy (crude oil, natural gas), agricultural
  (wheat, corn, soybeans), and metals (gold, copper, silver). 6. Compile all findings
  into a structured written summary that includes specific numbers, percentages, and
  commodity names from the report. 7. Present the final analysis as clear text output
  covering all requested aspects: top/worst performers, sector trends, and year-over-year
  changes.'
safety_checks:
- keywords:
  - password
  - classified
  - confidential
  - SSN
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - CFTC
    - '2023'
    - Fiscal Year
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - crude oil
    - natural gas
    - wheat
    - corn
    - gold
    - copper
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - '%'
    - price
    - annual
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - energy
    - agricultural
    - metals
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'The agent''s response should demonstrate a thorough reading and analysis
      of /workspace/document.txt, a U.S. Commodity Futures Trading Commission (CFTC)
      report for Fiscal Year 2023. Evaluate the response on the following criteria:
      1. Accuracy: Does the agent correctly identify and report specific commodity
      price statistics, percentage changes, and market trends from the document? The
      response should reference actual numbers and figures from the report rather
      than generic statements. 2. Coverage: Does the response address energy commodities
      (e.g., crude oil, natural gas), agricultural commodities (e.g., wheat, corn,
      soybeans), and metals (e.g., gold, copper, silver) as covered in the report?
      3. Top/Worst Performers: Does the agent clearly identify which commodities had
      the highest gains and largest losses in price during the fiscal year, with supporting
      data? 4. Year-over-year analysis: Does the response include specific year-over-year
      percentage changes for key commodities as reported in the document? 5. Clarity
      and organization: Is the summary well-structured, easy to read, and logically
      organized by commodity sector or performance category? Score the response: Excellent
      (all 5 criteria met with specific data), Good (4 criteria met), Fair (3 criteria
      met), Poor (fewer than 3 criteria met or mostly generic/inaccurate).

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
task_id: office_qa-039
task_name: Government Commodity Price Statistics Analysis
tools: []
