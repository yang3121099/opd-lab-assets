category: office_qa
claw_eval_id: T80_officeqa_bond_yield_change
difficulty: medium
files:
- source: office_qa-046/document.txt
  target: /workspace/document.txt
prompt: Analyze the document at /workspace/document.txt, which contains a U.S. Treasury
  report on the Federal Highway Trust Fund. Extract the key financial figures, compute
  or verify the Compound Annual Growth Rate (CAGR) values discussed in the report,
  and summarize your findings including the time periods analyzed, starting and ending
  fund balances, and the resulting CAGR percentages.
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  or shell commands (e.g., cat).

  2. Identify the report structure: locate the Federal Highway Trust Fund financial
  tables showing fund balances across fiscal years.

  3. Extract the starting balance (earliest fiscal year) and ending balance (most
  recent fiscal year) from the document.

  4. Identify the number of years (n) spanning the analysis period.

  5. Apply the CAGR formula: CAGR = (Ending Value / Beginning Value)^(1/n) - 1, expressed
  as a percentage.

  6. Cross-check computed CAGR against any stated CAGR figures in the document.

  7. Note any sub-fund breakdowns (e.g., Highway Account vs. Mass Transit Account)
  and compute or verify CAGR for each if applicable.

  8. Summarize findings: time period, starting balance, ending balance, CAGR percentage(s),
  and any notable trends or observations.'
safety_checks:
- keywords:
  - social security number
  - SSN
  - password
  - classified
  - top secret
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Highway Trust Fund
    - CAGR
    - compound annual growth rate
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - Federal Highway
    - Treasury
    - trust fund
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - '%'
    - billion
    - annual
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - fiscal year
    - balance
    - growth
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. Did the agent correctly identify and extract the starting and ending fund
      balance figures from the document (specific dollar amounts in billions or millions)?

      2. Did the agent correctly identify the time period(s) over which CAGR was computed
      (specific fiscal years mentioned in the report)?

      3. Did the agent accurately report or verify the CAGR percentage(s) stated or
      derivable from the document, showing understanding of the formula (ending value
      / beginning value)^(1/n) - 1?

      4. Did the agent provide a clear, well-organized summary that distinguishes
      between different sub-funds or time periods if multiple are present in the document?

      5. Did the agent flag any anomalies, declining periods, or notable observations
      about the fund''s financial trajectory?

      Score 1.0 if all five criteria are met with specific numbers from the document.
      Score 0.7 if criteria 1-3 are met but analysis lacks depth. Score 0.4 if the
      agent identifies the topic but misses key figures or CAGR values. Score 0.1
      if the response is vague or largely incorrect.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.6
task_id: office_qa-046
task_name: Federal Highway Trust Fund CAGR Analysis
tools: []
