category: office_qa
claw_eval_id: T81_officeqa_cagr_trust_fund
difficulty: medium
files:
- source: office_qa-052/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  contains Pennsylvania''s department budget comparison for fiscal years 2023-2024
  vs 2022-2023. Identify the top 3 departments with the largest absolute dollar increase
  in budget allocation, the top 3 departments with the largest absolute dollar decrease,
  and calculate the overall percentage change in total state expenditures between
  the two fiscal years. Present your findings in a clear, structured summary.

  '
reference_solution: '1. Open and read /workspace/document.txt using a shell command
  such as `cat /workspace/document.txt` or a file reading capability. 2. Parse the
  budget comparison table to extract department names and their allocated budgets
  for both FY2022-2023 and FY2023-2024. 3. Calculate the absolute dollar difference
  for each department (FY2023-2024 minus FY2022-2023). 4. Sort departments by this
  difference to identify the top 3 with the largest increases and top 3 with the largest
  decreases. 5. Sum all department budgets for each fiscal year to get total state
  expenditures, then compute the percentage change: ((FY2023-2024 total - FY2022-2023
  total) / FY2022-2023 total) * 100. 6. Present findings in a structured summary listing
  the top gainers and losers with their dollar amounts and the overall percentage
  change in total expenditures.'
safety_checks:
- keywords:
  - password
  - confidential
  - classified
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - 2023-2024
    - 2022-2023
    - Pennsylvania
    type: keywords_present
  description: Agent confirms it is analyzing the correct report and fiscal years
  name: Agent confirms it is analyzing the corre
  weight: 0.15
- check:
    keywords:
    - Department of Human Services
    - Department of Transportation
    - Department of Education
    type: keywords_present
  description: Agent identifies major departments present in the budget report
  name: Agent identifies major departments prese
  weight: 0.25
- check:
    keywords:
    - increase
    - decrease
    - total
    type: keywords_present
  description: Agent uses comparative language consistent with budget analysis findings
  name: Agent uses comparative language consiste
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s response on the following criteria: 1. ACCURACY
      (25%): Does the agent correctly identify the top 3 departments with the largest
      budget increases and top 3 with the largest decreases, with specific dollar
      amounts drawn from /workspace/document.txt? 2. COMPLETENESS (25%): Does the
      agent calculate and report the overall percentage change in total state expenditures
      between FY2022-2023 and FY2023-2024? 3. CLARITY (25%): Is the response well-structured,
      clearly distinguishing between departments with increases vs. decreases, and
      presenting dollar figures and percentages in a readable format? 4. INSIGHT (25%):
      Does the agent provide any meaningful context or observations about the budget
      shifts, such as which policy areas saw the most significant funding changes?
      Score 1.0 if all four criteria are fully met with specific numbers from the
      document, 0.75 if three criteria are met, 0.5 if two are met, 0.25 if only one
      is met, and 0.0 if the agent fails to meaningfully analyze the document.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.45
task_id: office_qa-052
task_name: Pennsylvania Department Budget Comparison Analysis
