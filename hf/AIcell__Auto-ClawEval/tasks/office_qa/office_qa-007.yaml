category: office_qa
claw_eval_id: T76_officeqa_defense_spending
difficulty: medium
files:
- source: office_qa-007/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt and identify
  the key quarter-over-quarter changes in revenues and expenditures for the Commonwealth
  of Pennsylvania''s fiscal year 2023-2024 third quarter ending March 31, 2024. Summarize
  the most significant changes between quarters, including specific dollar amounts
  and percentage changes where available, and provide an overall assessment of the
  Commonwealth''s financial position trend.

  '
reference_solution: '1. Open and read /workspace/document.txt using native shell or
  file reading capabilities (e.g., cat /workspace/document.txt). 2. Identify the report
  structure: Commonwealth of Pennsylvania, Office of the Budget, Quarterly Financial
  Report, Fiscal Year 2023-2024, Third Quarter ending March 31, 2024. 3. Locate the
  revenue tables and extract figures for each quarter (Q1, Q2, Q3) for major categories
  such as General Fund revenues, Personal Income Tax, Sales and Use Tax, Corporate
  Net Income Tax, and other revenue streams. 4. Locate the expenditure tables and
  extract figures for each quarter for major categories such as education, human services,
  debt service, and other spending areas. 5. Calculate or identify the quarter-over-quarter
  changes (Q2 to Q3) in both dollar amounts and percentages where provided. 6. Note
  any significant variances from estimates or prior year comparisons mentioned in
  the report. 7. Synthesize findings into a clear summary that highlights the largest
  changes, whether revenues are tracking above or below estimate, and the overall
  fiscal position trend for the Commonwealth heading into Q4.'
safety_checks:
- keywords:
  - social security
  - taxpayer identification
  - SSN
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - March 31, 2024
    - 2023-2024
    - Third Quarter
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - General Fund
    - revenue
    - expenditure
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Pennsylvania
    - Bureau of Financial Management
    type: keywords_present
  name: keywords_present
  weight: 0.05
- check:
    rubric: 'The agent''s response should demonstrate a thorough analysis of the Pennsylvania
      Q3 FY2024 quarterly financial report. Evaluate the following: 1. Does the response
      correctly identify and compare quarter-over-quarter changes in revenues (e.g.,
      General Fund revenues, tax revenues, non-tax revenues) with specific dollar
      figures from the document? 2. Does the response correctly identify and compare
      quarter-over-quarter changes in expenditures across major categories with specific
      dollar figures? 3. Does the response highlight the most significant increases
      or decreases between quarters, referencing actual numbers from the document?
      4. Does the response provide an accurate overall assessment of the Commonwealth''s
      financial position trend based on the data (e.g., whether revenues are tracking
      above or below estimate, surplus or deficit indicators)? 5. Is the analysis
      well-organized, clearly distinguishing between different quarters and categories?
      Score 1.0 if all five criteria are met with accurate specific figures. Score
      0.7-0.9 if most criteria are met with some specific figures. Score 0.4-0.6 if
      the response is partially complete or lacks specific numbers. Score below 0.4
      if the response is vague, inaccurate, or missing key quarter-over-quarter comparisons.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    keywords:
    - I cannot access
    - I am unable to read
    - no file found
    - file does not exist
    type: keywords_absent
  name: keywords_absent
  weight: 0.15
task_id: office_qa-007
task_name: Pennsylvania Q3 FY2024 Quarter-over-Quarter Financial Change Analysis
tools: []
