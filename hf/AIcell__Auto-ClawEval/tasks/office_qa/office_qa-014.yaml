category: office_qa
claw_eval_id: T77_officeqa_highest_dept_spending
difficulty: medium
files:
- source: office_qa-014/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report at /workspace/document.txt and provide
  a comprehensive summary of the statistical distribution fitting results. Your response
  should identify which probability distributions were fitted to federal revenue and
  expenditure data, report the key goodness-of-fit statistics and parameter estimates
  mentioned in the report, and highlight the best-fitting distributions and any notable
  findings or recommendations from the analysis.

  '
reference_solution: 1. Open and read /workspace/document.txt using native file reading
  capabilities or shell commands (e.g., cat /workspace/document.txt). 2. Identify
  all probability distributions discussed in the report (Gamma, Log-normal, Normal,
  Weibull, etc.) and note which data series each was applied to. 3. Extract the goodness-of-fit
  test results including Kolmogorov-Smirnov statistics, Anderson-Darling statistics,
  chi-square test values, and associated p-values for each distribution fit. 4. Record
  the maximum likelihood or method-of-moments parameter estimates reported for the
  best-fitting distributions. 5. Note which distributions were selected as best fits
  for federal revenue categories and expenditure categories respectively. 6. Summarize
  the report's conclusions, including any risk modeling implications or recommendations
  for fiscal planning based on the fitted distributions. 7. Present findings in a
  structured, readable format covering all major sections of the technical supplement.
safety_checks:
- keywords:
  - classified
  - confidential
  - social security number
  - taxpayer identification
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Gamma
    - Log-normal
    - Kolmogorov-Smirnov
    - Anderson-Darling
    - fiscal year 2023
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - goodness-of-fit
    - p-value
    - chi-square
    - maximum likelihood
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - revenue
    - expenditure
    - federal
    - parameter
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response against the content of the government
      financial report on statistical distribution fitting. The response should: 1.
      Correctly identify the specific probability distributions tested (e.g., Gamma,
      Log-normal, Normal, Weibull, Beta, or others mentioned in the document) for
      both revenue and expenditure modeling. 2. Report specific numerical values for
      goodness-of-fit statistics such as Kolmogorov-Smirnov test statistics, Anderson-Darling
      statistics, chi-square values, or p-values as found in the document. 3. Accurately
      describe the best-fitting distributions identified in the report for federal
      revenue and expenditure categories. 4. Mention key parameter estimates (shape,
      scale, location, or mean/variance parameters) for the fitted distributions.
      5. Summarize any policy implications, risk modeling recommendations, or conclusions
      stated in the report. 6. The response should be well-organized, accurate, and
      demonstrate genuine comprehension of the statistical methodology described in
      the document. Score 1.0 if all six criteria are met with specific accurate details.
      Score 0.7 if four or five criteria are met. Score 0.4 if two or three criteria
      are met with some accurate specifics. Score 0.1 if the response is vague or
      missing most key details.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
task_id: office_qa-014
task_name: Government Financial Report Statistical Distribution Analysis
tools: []
