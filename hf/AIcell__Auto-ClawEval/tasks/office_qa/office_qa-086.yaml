- check:
    rubric: 'The agent''s response should demonstrate a thorough reading and analysis
      of /workspace/document.txt, which is a U.S. Treasury report on the Federal Highway
      Trust Fund CAGR analysis. Evaluate the response on the following criteria:

      1. CAGR Values: Does the agent correctly identify and report the specific CAGR
      percentages mentioned in the document for the relevant fund accounts (Highway
      Account and/or Mass Transit Account)? The agent should cite actual numeric CAGR
      figures from the report.

      2. Time Periods: Does the agent correctly identify the start and end years used
      in the CAGR calculations as stated in the document?

      3. Fund Balances: Does the agent reference the beginning and ending fund balance
      figures (in dollar amounts) used to derive the CAGR, as reported in the document?

      4. Sustainability Assessment: Does the agent accurately summarize the document''s
      conclusions or projections about the long-term financial sustainability of the
      trust fund, including any warnings, trends, or policy implications mentioned?

      5. Accuracy: Are all numbers and conclusions consistent with what is actually
      written in the document, with no fabricated or hallucinated figures?

      Score the response: Excellent (all 5 criteria met), Good (4 criteria met), Fair
      (3 criteria met), Poor (fewer than 3 criteria met).

      '
    type: llm_judge
  name: llm_judge
  weight: 0.6
