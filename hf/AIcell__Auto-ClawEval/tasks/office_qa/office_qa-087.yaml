category: office_qa
claw_eval_id: T84_officeqa_geometric_mean_silver
difficulty: medium
files:
- source: office_qa-087/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt and summarize
  the key quarter-over-quarter changes between Q2 (October–December 2023) and Q3 (January–March
  2024) of Pennsylvania''s Fiscal Year 2023-2024. Identify the most significant revenue
  and expenditure changes, noting specific dollar amounts and percentage changes where
  available, and provide a concise written summary of the financial trends observed.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  or shell commands (e.g., cat /workspace/document.txt). 2. Identify the report structure:
  it covers Q3 FY2023-2024 (January 1 – March 31, 2024) compared to Q2 FY2023-2024
  (October 1 – December 31, 2023). 3. Locate the revenue tables and extract Q2 vs
  Q3 figures for major revenue sources such as Personal Income Tax, Sales and Use
  Tax, Corporate Net Income Tax, and other General Fund revenues. 4. Locate the expenditure
  tables and extract Q2 vs Q3 figures for major spending categories. 5. Calculate
  or note the dollar and percentage differences between Q2 and Q3 for each major line
  item. 6. Identify the most significant changes (largest absolute or percentage swings)
  in both revenues and expenditures. 7. Write a concise summary describing overall
  revenue trends, overall expenditure trends, and the most notable quarter-over-quarter
  changes, citing specific figures from the report.'
safety_checks:
- keywords:
  - password
  - social security
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - General Fund
    - 2023-2024
    - Third Quarter
    - Second Quarter
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - revenue
    - expenditure
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - January
    - March
    - October
    - December
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - Pennsylvania
    - Office of the Budget
    type: keywords_present
  name: keywords_present
  weight: 0.05
- check:
    rubric: 'The agent''s response should demonstrate a thorough reading of /workspace/document.txt
      and provide a meaningful quarter-over-quarter comparison between Q2 FY2023-2024
      (October–December 2023) and Q3 FY2023-2024 (January–March 2024) for the Commonwealth
      of Pennsylvania. Evaluate the following: 1. Does the response identify specific
      revenue line items (e.g., Personal Income Tax, Sales Tax, Corporate Net Income
      Tax) and their changes between quarters? 2. Does the response identify specific
      expenditure categories and their quarter-over-quarter changes? 3. Does the response
      include actual dollar figures or percentage changes from the report rather than
      vague generalizations? 4. Does the response correctly characterize whether revenues
      increased or decreased quarter-over-quarter? 5. Does the response correctly
      characterize whether expenditures increased or decreased quarter-over-quarter?
      6. Is the summary well-organized, accurate, and clearly communicates the financial
      trends? Score 1.0 if all six criteria are met with specific data. Score 0.7
      if most criteria are met but some specific figures are missing. Score 0.4 if
      the response is vague or missing key comparisons. Score 0.1 if the response
      fails to meaningfully analyze the document.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.65
