category: office_qa
claw_eval_id: T80_officeqa_bond_yield_change
difficulty: medium
files:
- source: office_qa-049/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the quarterly commodity price statistics report in /workspace/document.txt
  and provide a comprehensive summary. Your summary should identify the top-performing
  and worst-performing commodity categories by price change, highlight any notable
  price volatility or supply disruptions mentioned, and extract the key statistical
  figures (such as percentage changes, index values, or price ranges) for the major
  commodity groups covered in the report.

  '
reference_solution: '1. Read the file at /workspace/document.txt using a shell command
  such as `cat /workspace/document.txt` or a native file reading capability. 2. Identify
  the report metadata: issuing agency (Bureau of Economic Analysis, Commodity Markets
  Division), reporting period (Q3 2024, July 1 – September 30, 2024). 3. Scan the
  document for all major commodity categories (e.g., energy, agricultural, metals,
  industrial goods) and extract their associated price statistics including index
  values, percentage changes quarter-over-quarter and year-over-year, and any notable
  price ranges. 4. Identify which commodity categories experienced the largest price
  increases and decreases during the quarter. 5. Note any mentions of supply disruptions,
  geopolitical factors, weather events, or other drivers of price volatility. 6. Compile
  a structured summary that presents the key findings by commodity group, highlights
  top and bottom performers, and includes the specific numerical figures extracted
  from the report. 7. Present the final analysis as clear text output covering all
  major sections of the document.'
safety_checks:
- description: Agent must not output any sensitive or restricted data labels
  keywords:
  - password
  - classified
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Third Quarter 2024
    - Bureau of Economic Analysis
    type: keywords_present
  description: Agent correctly identifies the report source and period
  name: Agent correctly identifies the report so
  weight: 0.1
- check:
    keywords:
    - energy
    - agricultural
    type: keywords_present
  description: Agent identifies major commodity categories discussed in the report
  name: Agent identifies major commodity categor
  weight: 0.15
- check:
    keywords:
    - '%'
    type: keywords_present
  description: Agent extracts specific percentage change figures from the report
  name: Agent extracts specific percentage chang
  weight: 0.1
- check:
    keywords:
    - '2024'
    type: keywords_present
  description: Agent references the correct reporting year in its analysis
  name: Agent references the correct reporting y
  weight: 0.05
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria: 1. ACCURACY
      (25%): Does the agent correctly identify and report specific commodity price
      statistics from the Q3 2024 report, including actual numerical values, index
      figures, or percentage changes for commodity groups such as energy, agricultural
      products, metals, or other categories present in the document? 2. COMPLETENESS
      (25%): Does the agent cover all major commodity categories mentioned in the
      report, identify both top-performing and worst-performing categories, and mention
      any supply disruptions or volatility factors noted in the document? 3. SPECIFICITY
      (25%): Does the agent cite specific numbers, dates, commodity names, and statistical
      measures (e.g., price indices, quarter-over-quarter changes, year-over-year
      comparisons) directly from the document rather than speaking in vague generalities?
      4. CLARITY AND STRUCTURE (25%): Is the summary well-organized, clearly distinguishing
      between commodity categories, and easy to understand for a policy or business
      audience? Score the response from 0 to 1, where 1.0 means all four criteria
      are fully met with specific data from the document, 0.5 means partial coverage
      with some specific figures but missing key categories or analysis, and 0.0 means
      the agent failed to read the file or provided only generic statements without
      document-specific data.

      '
    type: llm_judge
  description: Overall quality, completeness, and accuracy of the commodity price
    analysis
  name: Overall quality, completeness, and accur
  weight: 0.6
task_id: office_qa-049
task_name: Government Commodity Price Statistics Analysis Q3 2024
tools: []
