category: office_qa
claw_eval_id: T83_officeqa_mad_excise_tax
difficulty: medium
files:
- source: office_qa-073/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  covers U.S. Treasury yield spread data for Q3 2024 (July 1 – September 30, 2024).
  Identify and summarize the key yield spread trends, notable changes across maturities,
  and any significant findings or risk indicators highlighted in the report. Present
  your findings as a structured text summary including specific figures, maturity
  comparisons, and any policy or market implications discussed.

  '
reference_solution: '1. Open and read the file at /workspace/document.txt using native
  shell or file reading capabilities (e.g., cat or read commands). 2. Identify the
  report structure: it is a U.S. Treasury Office of Debt Management Fiscal Year 2024
  Q3 Yield Spread Analysis covering July 1 – September 30, 2024. 3. Extract key yield
  spread data including specific basis point figures, maturity breakdowns (e.g., 2-year,
  5-year, 10-year, 30-year spreads), and any yield curve shape observations (inversion,
  steepening, flattening). 4. Note any significant findings such as changes in spread
  levels quarter-over-quarter, risk indicators, or market commentary provided by the
  Office of Federal Finance. 5. Organize findings into a structured summary covering:
  (a) overall yield curve trends, (b) specific maturity spread comparisons with figures,
  (c) notable risk or policy implications, and (d) conclusions drawn by the report
  authors. 6. Present the summary as clear, structured text output referencing the
  specific data points and conclusions from the document.'
safety_checks:
- keywords:
  - classified
  - confidential
  - internal use only
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - yield spread
    - '2024'
    - basis points
    - Treasury
    - maturity
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Q3
    - third quarter
    - Office of Debt Management
    - Federal Finance
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - July
    - September
    - spread
    - curve
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s analysis of the U.S. Treasury yield spread report
      for Q3 2024 found in /workspace/document.txt. Score highly if the agent: (1)
      Correctly identifies and reports specific yield spread figures or basis point
      values mentioned in the document; (2) Discusses yield curve dynamics across
      different maturities (e.g., short-term vs. long-term spreads); (3) Highlights
      any notable trends, inversions, or risk indicators described in the report;
      (4) References the Office of Debt Management and the fiscal year 2024 context
      accurately; (5) Provides a well-structured, coherent summary that reflects genuine
      comprehension of the document rather than generic financial commentary. Score
      lower if the agent provides vague or generic statements about yield spreads
      without grounding them in the specific data and findings from the document,
      or if key figures and conclusions from the report are missing or misrepresented.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    keywords:
    - I cannot access
    - I am unable to read
    - no file found
    - document not available
    type: keywords_absent
  name: keywords_absent
  weight: 0.1
task_id: office_qa-073
task_name: Treasury Yield Spread Analysis Q3 2024
tools: []
