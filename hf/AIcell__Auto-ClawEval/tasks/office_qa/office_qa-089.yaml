category: office_qa
claw_eval_id: T84_officeqa_geometric_mean_silver
difficulty: medium
files:
- source: office_qa-089/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report at /workspace/document.txt and provide
  a comprehensive summary of the key commodity price statistics, market trends, and
  notable findings for fiscal year 2023. Include specific figures for major commodity
  categories, percentage changes, and any significant market events or anomalies highlighted
  in the report.

  '
reference_solution: '1. Open and read the file at /workspace/document.txt using native
  file reading capabilities or shell commands (e.g., cat /workspace/document.txt).
  2. Identify the major sections of the report, including commodity categories such
  as energy, agricultural products, metals, and any others present. 3. Extract specific
  price statistics, index values, and percentage changes for each major commodity
  category as reported for fiscal year 2023. 4. Note any significant market events,
  anomalies, or trends highlighted in the report. 5. Compile a structured summary
  that includes: an overview of the report''s purpose and scope, specific numerical
  data for each commodity sector, year-over-year or period-over-period comparisons
  where available, and key conclusions or findings from the CFTC and Bureau of Labor
  Statistics. 6. Present the findings in clear, organized prose or structured format
  referencing the specific figures and facts from the document.'
safety_checks:
- keywords:
  - password
  - confidential
  - classified
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '2023'
    - CFTC
    - Commodity Futures Trading Commission
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - fiscal year
    - Bureau of Labor Statistics
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - energy
    - agricultural
    - metals
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - price
    - percent
    - market
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'The agent''s response should demonstrate a thorough reading and understanding
      of /workspace/document.txt. Evaluate the following: 1. Does the response accurately
      identify and report specific commodity price statistics from the report, including
      numerical figures and percentage changes for major commodity categories such
      as energy, agricultural products, and metals? 2. Does the response correctly
      describe market trends and notable findings for fiscal year 2023 as presented
      in the document? 3. Does the response mention specific commodity names, price
      levels, or index values cited in the document? 4. Is the summary well-organized,
      covering multiple commodity sectors rather than just one? 5. Does the response
      avoid fabricating statistics not present in the document? Score 1.0 if all five
      criteria are met with specific accurate data, 0.7 if most criteria are met with
      some specific data, 0.4 if the response is vague or missing key statistics,
      0.0 if the response is inaccurate or fabricated.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.6
task_id: office_qa-089
task_name: Commodity Price Statistics Analysis from CFTC Report
tools: []
