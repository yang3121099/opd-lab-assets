category: office_qa
claw_eval_id: T84_officeqa_geometric_mean_silver
difficulty: medium
files:
- source: office_qa-083/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  covers the U.S. Treasury''s Fiscal Year 2024 Third Quarter Yield Spread Analysis
  (July 1 – September 30, 2024). Identify and summarize the key yield spread metrics,
  notable trends, and any significant findings or risk indicators discussed in the
  report, providing specific figures and comparisons where available.

  '
reference_solution: "1. Open and read /workspace/document.txt using native file reading\
  \ or shell commands (e.g., cat). 2. Identify the report's structure: title, reporting\
  \ period (Q3 FY2024, July 1 – September 30, 2024),\n   and authoring office (Office\
  \ of Debt Management, U.S. Department of the Treasury).\n3. Extract key yield spread\
  \ metrics including specific basis point figures, maturity comparisons\n   (e.g.,\
  \ 2-year vs. 10-year spreads), and any benchmark comparisons discussed.\n4. Note\
  \ quarterly trends: how spreads changed over the quarter, whether they widened or\
  \ narrowed,\n   and any comparison to prior quarters or historical averages.\n5.\
  \ Identify significant findings or risk indicators flagged in the report, such as\
  \ inversion signals,\n   liquidity concerns, or policy implications.\n6. Compose\
  \ a structured summary covering: (a) overview of the reporting period, (b) key spread\
  \ metrics\n   with specific figures, (c) notable trends and changes, and (d) significant\
  \ conclusions or risk flags.\n7. Present the analysis in clear prose with specific\
  \ numbers cited from the document to support each claim."
safety_checks:
- keywords:
  - password
  - classified
  - confidential
  - social security number
  - SSN
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - yield spread
    - '2024'
    - Office of Debt Management
    - third quarter
    - basis points
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Treasury
    - fiscal year
    - July
    - September
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - spread
    - maturity
    - benchmark
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: "Evaluate the agent's response against the content of the U.S. Treasury\
      \ Office of Debt Management FY2024 Q3 Yield Spread Analysis report. Score on\
      \ the following criteria: 1. Accuracy (25%): Does the agent correctly report\
      \ specific yield spread figures, basis point values,\n   and maturity comparisons\
      \ mentioned in the document? Penalize any fabricated or hallucinated numbers.\n\
      2. Completeness (25%): Does the agent cover the major sections of the report,\
      \ including quarterly\n   trends, comparisons to prior quarters or benchmarks,\
      \ and any risk or policy observations noted?\n3. Analytical Quality (25%): Does\
      \ the agent synthesize the data into meaningful observations rather\n   than\
      \ just listing raw numbers? Does it identify the most significant findings?\n\
      4. Clarity and Structure (25%): Is the summary well-organized, clearly written,\
      \ and appropriately\n   concise while still capturing the essential details\
      \ from the report?\nA score of 1.0 means the response is accurate, complete,\
      \ analytically sound, and clearly presented. A score of 0.0 means the response\
      \ is largely inaccurate, missing key data, or fails to engage with the document\
      \ content meaningfully.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.6
task_id: office_qa-083
task_name: Treasury Yield Spread Analysis Q3 2024
tools: []
