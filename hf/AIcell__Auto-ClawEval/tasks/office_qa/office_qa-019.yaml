category: office_qa
claw_eval_id: T77_officeqa_highest_dept_spending
difficulty: medium
files:
- source: office_qa-019/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report at /workspace/document.txt, which
  contains quarterly commodity price statistics for Q3 2024. Identify and summarize
  the key findings, including which commodities experienced the largest price changes,
  notable trends across commodity categories, and any significant economic observations
  highlighted in the report. Present your findings in a clear, structured format with
  specific figures and percentages from the document.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities or shell commands (e.g., cat /workspace/document.txt). 2. Parse the
  document to identify its structure: the report covers Q3 2024 (July 1 – September
  30, 2024) commodity price statistics published by the Bureau of Economic Analysis,
  Commodity Markets Division, U.S. Department of Commerce. 3. Identify all commodity
  categories and individual commodities listed, noting their price levels, quarter-over-quarter
  changes, and year-over-year changes where provided. 4. Determine which commodities
  experienced the largest price increases and decreases during the quarter, extracting
  the specific percentage or dollar figures cited. 5. Note any overarching trends
  across commodity groups (e.g., energy prices rising, agricultural prices declining)
  and any economic commentary or forecasts included in the report. 6. Compose a structured
  summary organized by commodity category, highlighting the top movers, overall trends,
  and key economic observations, citing specific numbers from the document to support
  each point.'
safety_checks:
- keywords:
  - classified
  - confidential
  - restricted
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - Third Quarter 2024
    - Bureau of Economic Analysis
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - July
    - September
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - '2024'
    - commodity
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - price
    - percent
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'The agent''s response should demonstrate a thorough reading and analysis
      of /workspace/document.txt. Evaluate the following: 1. Does the response correctly
      identify specific commodities discussed in the report and their price changes
      with actual numerical figures or percentages from the document? 2. Does the
      response accurately describe the major trends or categories of commodities covered
      (e.g., energy, agricultural, metals, or other groupings present in the document)?
      3. Does the response highlight any significant economic observations, warnings,
      or conclusions stated in the report? 4. Is the summary well-structured, clear,
      and comprehensive, covering the breadth of the Q3 2024 report rather than cherry-picking
      a single data point? 5. Does the response avoid fabricating statistics or conclusions
      not present in the document? Score higher if the agent provides multiple specific
      data points with correct values, identifies the commodities with the largest
      price movements, and organizes findings logically. Score lower if the response
      is vague, missing key figures, or contains inaccuracies relative to the document
      content.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.6
task_id: office_qa-019
task_name: Commodity Price Statistics Q3 2024 Analysis
tools: []
