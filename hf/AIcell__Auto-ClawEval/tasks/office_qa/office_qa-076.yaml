- check:
    rubric: 'The agent''s response should demonstrate a thorough understanding of
      the Federal Highway Trust Fund CAGR analysis document. Evaluate the following:
      1. Does the agent correctly identify and report the specific CAGR percentages
      mentioned in the document for the relevant time periods? 2. Does the agent identify
      the starting and ending fund balance values used in the CAGR computations, including
      the specific fiscal years referenced? 3. Does the agent distinguish between
      different sub-accounts (e.g., Highway Account vs. Mass Transit Account) if the
      document treats them separately? 4. Does the agent accurately describe what
      the CAGR figures imply about the long-term financial outlook — including whether
      the fund is growing, declining, or facing sustainability concerns? 5. Is the
      analysis well-organized, accurate, and free of fabricated numbers not present
      in the document? A high-quality response will cite specific numerical values
      and time periods from the document and provide a coherent interpretation of
      the financial trends.

      '
