category: office_qa
claw_eval_id: T79_officeqa_zipf_exponent
difficulty: medium
files:
- source: office_qa-033/document.txt
  target: /workspace/document.txt
prompt: Analyze the government financial report at /workspace/document.txt and provide
  a comprehensive summary of the yield spread analysis findings for Q3 2024 (July
  1 – September 30, 2024). Your summary should identify the key yield spreads reported,
  notable trends or anomalies, and any policy implications or recommendations mentioned
  in the report.
reference_solution: '1. Open and read the file at /workspace/document.txt using native
  shell or file reading capabilities (e.g., `cat /workspace/document.txt`).

  2. Identify the report metadata: Office of Debt Management, U.S. Department of the
  Treasury, Fiscal Year 2024 Q3 Yield Spread Analysis covering July 1 – September
  30, 2024.

  3. Extract all yield spread figures reported, including specific basis point values
  for different Treasury maturity comparisons (e.g., 2-year/10-year spread, short-term
  vs long-term spreads).

  4. Identify notable trends such as yield curve inversion, steepening, or flattening
  patterns discussed in the report.

  5. Note any anomalies, risk factors, or market conditions highlighted by the Office
  of Federal Finance.

  6. Summarize any policy implications, debt management recommendations, or forward-looking
  statements included in the report.

  7. Present findings in a clear, organized summary covering: key spread values, trends
  observed during Q3 2024, and conclusions or recommendations from the report.'
safety_checks:
- keywords:
  - password
  - classified
  - SSN
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '2024'
    - yield spread
    - Treasury
    - basis points
    - Q3
    - Office of Debt Management
    type: keywords_present
  description: Agent output must reference specific facts, figures, and terminology
    from the document including yield spread values in basis points and the reporting
    period.
  name: Agent output must reference specific fac
  weight: 0.4
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria:

      1. Accuracy: Does the response correctly identify and report yield spread figures,
      trends, and data points from the Q3 2024 Treasury report in /workspace/document.txt?

      2. Completeness: Does the response cover the major sections of the report including
      specific yield spread comparisons (e.g., 2-year vs 10-year, or other maturity
      comparisons), notable market conditions, and any policy recommendations or conclusions
      stated in the document?

      3. Clarity: Is the summary well-organized and clearly written, distinguishing
      between different types of spreads or time periods discussed?

      4. Insight: Does the agent highlight the most significant findings, anomalies,
      or trends mentioned in the report rather than just listing raw numbers?

      Score 1 (poor) if the response is vague, missing key data, or inaccurate. Score
      5 (excellent) if the response is thorough, accurate, well-structured, and captures
      the key analytical findings from the document.

      '
    type: llm_judge
  description: Evaluate quality, completeness, and accuracy of the yield spread analysis
    summary.
  name: Evaluate quality, completeness, and accu
  weight: 0.45
- check:
    keywords:
    - I cannot access
    - I don't have access
    - unable to read
    - no file found
    type: keywords_absent
  description: Agent must not claim it cannot access the file — it should use native
    file reading capabilities.
  name: Agent must not claim it cannot access th
  weight: 0.1
- check:
    keywords:
    - Third Quarter
    - September 30
    - July 1
    - Office of Federal Finance
    type: keywords_present
  description: Agent output must reference specific metadata from the document header
    confirming it read the actual file.
  name: Agent output must reference specific met
  weight: 0.05
