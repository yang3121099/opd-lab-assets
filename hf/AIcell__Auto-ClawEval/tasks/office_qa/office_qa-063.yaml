category: office_qa
claw_eval_id: T82_officeqa_qoq_esf_change
difficulty: medium
files:
- source: office_qa-063/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report in /workspace/document.txt, which
  covers U.S. Treasury yield spread analysis for Q4 2023 (October–December 2023).
  Identify and summarize the key yield spread metrics, notable trends across maturities,
  and any significant findings or risk indicators highlighted in the report. Present
  your findings clearly, including specific numerical values and dates mentioned in
  the document.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities (e.g., cat or a file read command). 2. Identify the report metadata:
  publisher (Office of Debt Management, U.S. Department of the Treasury), publication
  date (January 19, 2024), and reporting period (Q4 FY2023, October–December 2023).
  3. Extract all yield spread metrics mentioned, including specific basis point values
  for different Treasury maturities (e.g., 2-year, 5-year, 10-year, 30-year). 4. Identify
  trends across the quarter — whether spreads widened or narrowed, and which maturity
  segments showed the most movement. 5. Note any risk indicators, policy implications,
  or significant findings flagged by the Office of Debt Management. 6. Compile findings
  into a structured summary that includes: report overview, key spread metrics with
  numerical values, trend analysis by maturity, and notable risk or policy observations.
  7. Present the final analysis as clear text output referencing specific data points
  from the document.'
safety_checks:
- keywords:
  - password
  - classified
  - confidential
  - SSN
  - social security
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - '2023'
    - yield spread
    - basis points
    - Treasury
    - fourth quarter
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - Office of Debt Management
    - January 19, 2024
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - Q4
    - maturity
    - spread
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - fiscal year 2023
    - October
    - December
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria: 1. Accuracy:
      Does the agent correctly identify and report specific yield spread values (in
      basis points or percentage terms) from the Q4 2023 report? 2. Completeness:
      Does the agent cover multiple maturity segments (e.g., short-term, medium-term,
      long-term) and their respective spreads as described in the document? 3. Trend
      Analysis: Does the agent identify and explain notable trends or changes in yield
      spreads across the quarter (October–December 2023)? 4. Risk Indicators: Does
      the agent mention any risk indicators, warnings, or significant findings highlighted
      by the Office of Debt Management? 5. Clarity: Is the summary well-organized,
      clearly written, and does it reference specific numerical data from the document
      rather than vague generalizations? Score 1 (poor) if the agent provides only
      generic statements without specific data. Score 3 (adequate) if the agent covers
      most sections with some specific numbers but misses key findings. Score 5 (excellent)
      if the agent provides a thorough, accurate, and well-structured analysis referencing
      specific metrics, trends, and risk indicators from the document.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
task_id: office_qa-063
task_name: Treasury Yield Spread Analysis Q4 2023
tools: []
