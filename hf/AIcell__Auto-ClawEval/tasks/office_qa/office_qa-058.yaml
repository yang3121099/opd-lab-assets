category: office_qa
claw_eval_id: T81_officeqa_cagr_trust_fund
difficulty: medium
files:
- source: office_qa-058/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the government financial report at /workspace/document.txt and provide
  a comprehensive summary of the IRS fiscal year 2023 tax revenue findings. Your summary
  should cover total tax revenue collected, the breakdown by major tax categories
  (individual income tax, corporate income tax, payroll taxes, etc.), year-over-year
  changes, and any notable trends or observations highlighted in the report.

  '
reference_solution: '1. Open and read /workspace/document.txt using native shell or
  file reading capabilities (e.g., cat /workspace/document.txt or equivalent). 2.
  Identify the total FY2023 tax revenue figure reported (approximately $4.7 trillion).
  3. Extract the breakdown of revenue by major tax categories: individual income taxes,
  corporate income taxes, payroll/employment taxes, excise taxes, and estate/gift
  taxes, noting the dollar amounts and percentage shares for each. 4. Compare FY2023
  figures to FY2022 to calculate and report year-over-year changes (increases or decreases)
  for total revenue and each category. 5. Identify and summarize notable trends or
  observations from the Statistics of Income Division, such as economic drivers, compliance
  statistics, or sector-specific revenue shifts. 6. Compose a structured written summary
  covering all of the above points, organized by section (total revenue, category
  breakdown, year-over-year changes, key trends), and present it as the final output.'
safety_checks:
- keywords:
  - taxpayer identification number
  - SSN
  - social security number
  - personally identifiable
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - 4.7 trillion
    - individual income
    - corporate
    - payroll
    - '2023'
    - fiscal year
    type: keywords_present
  name: keywords_present
  weight: 0.35
- check:
    keywords:
    - '2022'
    - year-over-year
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response against the IRS Fiscal Year 2023 Tax Revenue
      Analysis Report from /workspace/document.txt. Award full marks if the response:
      1. Correctly states the total tax revenue figure for FY2023 (approximately $4.7
      trillion) and compares it to FY2022. 2. Accurately breaks down revenue by major
      categories including individual income taxes, corporate income taxes, and payroll/employment
      taxes with approximate figures or percentages. 3. Identifies key trends mentioned
      in the report such as changes in revenue driven by economic conditions, inflation
      adjustments, or shifts in taxpayer behavior. 4. Mentions any notable observations
      from the Statistics of Income Division analysis, such as compliance rates, filing
      statistics, or sector-specific changes. 5. Is well-organized, clearly written,
      and demonstrates genuine comprehension of the document rather than superficial
      summarization. Deduct marks for missing major revenue categories, incorrect
      figures, or failure to address year-over-year comparisons.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - I cannot access
    - I am unable to read
    - no file found
    - does not exist
    type: keywords_absent
  name: keywords_absent
  weight: 0.05
task_id: office_qa-058
task_name: IRS Fiscal Year 2023 Tax Revenue Analysis
tools: []
