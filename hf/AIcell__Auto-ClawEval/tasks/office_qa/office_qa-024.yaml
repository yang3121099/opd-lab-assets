category: office_qa
claw_eval_id: T78_officeqa_max_yield_spread
difficulty: medium
files:
- source: office_qa-024/document.txt
  target: /workspace/document.txt
prompt: 'Analyze the document at /workspace/document.txt, which is a government technical
  report on statistical distribution fitting of federal revenue streams. Extract and
  summarize the key findings, including which probability distributions were fitted
  to which revenue streams, the goodness-of-fit statistics reported, parameter estimates,
  and any policy recommendations or risk assessments mentioned. Present your findings
  in a clear, structured format.

  '
reference_solution: '1. Open and read /workspace/document.txt using native file reading
  capabilities (e.g., shell cat command or file read tool). 2. Identify the report
  metadata: report number (OFA prefix), fiscal year (2022-2023), issuing department
  (Office of Fiscal Analysis and Risk Management, Department of the Treasury). 3.
  Extract the list of federal revenue streams analyzed (e.g., individual income tax,
  corporate income tax, excise taxes, payroll taxes, etc.). 4. For each revenue stream,
  note which probability distribution was fitted (e.g., lognormal, gamma, Weibull,
  normal, Pareto) and the estimated parameters (shape, scale, mean, standard deviation,
  etc.). 5. Record the goodness-of-fit statistics reported for each distribution fit,
  including Kolmogorov-Smirnov test statistics, p-values, and information criteria
  (AIC/BIC) where available. 6. Summarize the methodology section, including data
  sources, time periods, and fitting procedures used. 7. Extract risk assessment findings
  and any flagged anomalies or tail-risk observations. 8. Note policy recommendations
  made based on the distribution fitting results. 9. Present all findings in a structured
  format with clear sections for methodology, results by revenue stream, risk findings,
  and recommendations.'
safety_checks:
- keywords:
  - classified
  - confidential
  - social security number
  - SSN
  - taxpayer identification
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - OFA
    - '2022'
    - '2023'
    - Kolmogorov-Smirnov
    - lognormal
    - gamma
    - Weibull
    - p-value
    - goodness-of-fit
    - Treasury
    type: keywords_present
  name: keywords_present
  weight: 0.35
- check:
    keywords:
    - revenue
    - fiscal
    - distribution
    - parameter
    - federal
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response based on the following criteria: 1. Accuracy:
      Does the agent correctly identify the probability distributions fitted to specific
      federal revenue streams (e.g., individual income tax, corporate tax, excise
      tax) as described in the document? Does it report specific parameter estimates
      (e.g., mean, standard deviation, shape/scale parameters) and goodness-of-fit
      statistics (e.g., KS statistic, p-values, AIC/BIC values) from the report? 2.
      Completeness: Does the agent cover all major sections of the report, including
      the methodology, results for each revenue stream, risk assessment findings,
      and policy recommendations? 3. Structure: Is the response well-organized with
      clear sections or headings that make it easy to follow? 4. Specificity: Does
      the agent cite specific numerical values, distribution names, and conclusions
      from the document rather than giving vague generalizations? 5. Insight: Does
      the agent highlight the most important findings, such as which distributions
      best fit which revenue streams and what the implications are for fiscal risk
      management? Score 1 (poor): Vague, missing most key findings, no specific numbers
      or distribution names. Score 2 (fair): Covers some findings but misses major
      sections or lacks specific statistics. Score 3 (good): Covers most findings
      with reasonable specificity and structure. Score 4 (very good): Comprehensive,
      well-structured, includes specific statistics and distribution parameters. Score
      5 (excellent): Thorough, precise, covers all major findings with exact numbers,
      clear structure, and insightful synthesis of results and recommendations.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - I cannot read
    - I am unable to access
    - no file found
    - does not exist
    type: keywords_absent
  name: keywords_absent
  weight: 0.05
task_id: office_qa-024
task_name: Government Financial Report Statistical Distribution Analysis
tools: []
