- check:
    rubric: 'Evaluate the agent''s response based on the following criteria: 1. ACCURACY:
      Does the agent correctly extract and report the specific CAGR percentage values
      for the Highway Account and Mass Transit Account as stated in the document?
      The agent should cite actual numeric CAGR results (e.g., specific percentage
      values) rather than vague descriptions. 2. TIME PERIODS: Does the agent correctly
      identify the fiscal years or time periods over which the CAGR was computed (e.g.,
      the start year and end year of the analysis period)? 3. FUND BALANCES: Does
      the agent report the beginning and ending fund balance figures (in dollar amounts)
      used in the CAGR calculations for each account? 4. METHODOLOGY: Does the agent
      describe or reference the CAGR formula or methodology as presented in the report
      (e.g., the standard CAGR formula involving beginning value, ending value, and
      number of years)? 5. CONCLUSIONS: Does the agent summarize any analytical conclusions,
      trends, or policy observations noted in the report regarding the growth or decline
      of the trust fund? 6. COMPLETENESS: Does the response cover both the Highway
      Account and the Mass Transit Account separately, rather than treating the fund
      as a single entity? Score the response: Excellent (all 6 criteria met), Good
      (4-5 criteria met), Fair (2-3 criteria met), Poor (0-1 criteria met).

      '
