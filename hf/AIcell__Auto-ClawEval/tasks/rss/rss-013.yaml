category: content
claw_eval_id: T22_newsletter_curation
difficulty: medium
fixtures:
  feeds:
  - category: technology
    id: feed-001
    name: TechCrunch
    url: https://techcrunch.com/feed/
  - category: technology
    id: feed-002
    name: Wired
    url: https://www.wired.com/feed/rss
  - category: technology
    id: feed-003
    name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
  - category: business
    id: feed-004
    name: Harvard Business Review
    url: https://hbr.org/feed
  - category: business
    id: feed-005
    name: Reuters Business News
    url: https://feeds.reuters.com/reuters/businessNews
  - category: science
    id: feed-006
    name: Nature News
    url: https://www.nature.com/nature.rss
  - category: technology
