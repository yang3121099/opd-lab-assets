category: content
claw_eval_id: T22_newsletter_curation
difficulty: medium
fixtures:
  articles:
  - category: technology
    date: '2024-11-12'
    id: art-201
    source: TechCrunch AI
    summary: 'Notion has released a major update to its AI suite, introducing autonomous
      agents that can manage projects, draft documents, and coordinate team workflows
      without manual prompting. Early enterprise customers report 30% reduction in
      meeting overhead.

      '
    title: Notion AI 2.0 Launches with Autonomous Task Agents
  - category: technology
    date: '2024-11-10'
    id: art-202
    source: The Verge Tech
    summary: 'Microsoft announced that Copilot will now offer deep formula generation,
      data summarization, and email triage directly inside Excel and Outlook. The
