claw_eval_id: T87_pinbench_market_news_brief
difficulty: medium
fixtures:
  articles:
  - category: ai
    date: '2024-11-10'
    id: art-001
    source: TechCrunch AI
    summary: OpenAI has released GPT-5, featuring advanced multimodal reasoning that
      can process text, images, and audio simultaneously. Early benchmarks show a
      40% improvement over GPT-4 on complex reasoning tasks, with enterprise pricing
      starting at $0.03 per 1K tokens.
    title: OpenAI Launches GPT-5 with Multimodal Reasoning Capabilities
  - category: ai
    date: '2024-11-08'
    id: art-002
    source: MIT Technology Review
    summary: DeepMind has announced 12 new pharmaceutical partnerships leveraging
      AlphaFold 3 for protein structure prediction in drug discovery. The partnerships
      span oncology, rare diseases, and neurodegenerative conditions, with projected
      time-to-candidate reductions of 30%.
    title: Google DeepMind's AlphaFold 3 Expands to Drug Discovery Partnerships
  - category: technology
    date: '2024-11-09'
    id: art-003
    source: The Verge Tech
    summary: The European Commission has moved up enforcement of the EU AI Act's high-risk
      provisions to Q1 2025, six months earlier than originally planned. Companies
      deploying AI in hiring, credit scoring, and healthcare must now complete compliance
      audits by March 2025.
    title: EU AI Act Enforcement Timeline Accelerated to Q1 2025
  - category: ai
    date: '2024-11-07'
    id: art-004
    source: VentureBeat AI
    summary: Microsoft has rolled out real-time collaboration tools in Azure AI Studio,
      allowing multiple developers to co-edit prompts, fine-tune models, and review
      outputs simultaneously. The update also includes a new cost-tracking dashboard
      showing per-experiment token spend.
    title: Microsoft Azure AI Studio Adds Real-Time Collaboration Features
  - category: technology
    date: '2024-11-06'
    id: art-005
    source: MIT Technology Review
    summary: Analysts at Gartner predict a sustained AI chip shortage through 2026,
      driven by hyperscaler GPU demand for LLM training. NVIDIA H100 lead times have
      extended to 52 weeks, pushing enterprises toward AMD MI300X and custom silicon
      alternatives.
    title: 'Semiconductor Shortage 2.0: AI Chip Demand Outpaces Supply Through 2026'
  - category: ai
    date: '2024-11-05'
    id: art-006
    source: TechCrunch AI
    summary: Anthropic's Claude 3.5 Sonnet now supports a 200K token context window,
      enabling analysis of entire codebases or lengthy legal documents in a single
      prompt. The model scores highest among peers on the MMLU benchmark for professional
      knowledge domains.
    title: Anthropic Releases Claude 3.5 Sonnet with 200K Context Window
  - category: technology
    date: '2024-11-04'
    id: art-007
    source: The Verge Tech
    summary: Enterprise adoption of edge AI infrastructure grew 67% year-over-year
      in Q3 2024, driven by data sovereignty regulations in the EU and APAC. Vendors
      like Qualcomm and Intel are reporting record orders for on-device inference
      chips.
    title: Edge AI Deployments Surge as Enterprises Seek Data Sovereignty
