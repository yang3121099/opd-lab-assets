category: content
claw_eval_id: T22_newsletter_curation
difficulty: medium
fixtures:
  articles:
  - category: fintech
    date: '2024-11-18'
    id: art-101
    source: FinTech Futures
    summary: Seven central banks in Southeast Asia have announced coordinated digital
      currency pilot programs, with live trials expected to begin in Q1 next year.
      The initiative aims to streamline cross-border payments and reduce transaction
