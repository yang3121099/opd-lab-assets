    type: audit_action_exists
  name: used_list_feeds
  weight: 0.15
- check:
    keywords:
    - Technology
    - Business
    - Science
    type: keywords_present
  name: categories_identified
  weight: 0.2
- check:
    keywords:
    - '3'
    - Technology
    type: keywords_present
  name: feed_counts_correct
  weight: 0.2
- check:
    keywords:
    - Technology
    type: keywords_present
  name: dominant_category_named
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s feed landscape report on three dimensions:

      1. ACCURACY (0–0.4): Does the report correctly identify all three categories
      (Technology, Business, Science)? Does it correctly count feeds per category
      — Technology: 4 feeds (TechCrunch feed-001, Wired feed-002, MIT Technology Review
      feed-003, The Verge feed-007), Business: 2 feeds (Harvard Business Review feed-004,
      Fast Company feed-005), Science: 1 feed (Nature News feed-006)? Does it correctly
      identify Technology as the dominant category with 4 feeds? Award 0.4 if all
      counts and category names are correct, 0.2 if minor errors, 0.0 if counts are
      wrong.

      2. COMPLETENESS (0–0.3): Does the report mention specific feed names from the
      fixture data (e.g., TechCrunch, Wired, Harvard Business Review, Nature News)?
      Does it cover all 7 feeds total? Award 0.3 if comprehensive, 0.15 if partial,
      0.0 if vague.

      3. ACTIONABILITY (0–0.3): Does the report provide a clear recommendation or
      insight the content strategy team can act on — e.g., noting Technology dominance,
      suggesting diversification, or highlighting underrepresented categories like
      Science with only 1 feed? Award 0.3 if actionable and specific, 0.15 if generic,
      0.0 if absent.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality
  weight: 0.35
