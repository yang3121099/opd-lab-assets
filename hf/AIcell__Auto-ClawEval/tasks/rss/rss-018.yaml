  feeds:
  - category: Payments & Banking
    id: feed-001
    name: Fintech Futures
    url: https://www.fintechfutures.com/feed/
  - category: Payments & Banking
    id: feed-002
    name: The Financial Brand
    url: https://thefinancialbrand.com/feed/
  - category: Fintech General
    id: feed-003
    name: Crowdfund Insider
    url: https://www.crowdfundinsider.com/feed/
  - category: Payments & Banking
    id: feed-004
    name: Banking Dive
    url: https://www.bankingdive.com/feeds/news/
prompt: 'Our internal fintech team sends out a weekly newsletter every Friday. This
  week''s edition should focus on "Payments & Banking" articles published in the last
  two weeks. Please review the available articles in that category, select the most
  relevant and insightful ones, and publish a newsletter titled "Fintech Weekly: Payments
  & Banking Digest" addressed to the recipients list: fintech-team@company.com. Write
  a compelling newsletter body that summarizes the key stories and why they matter
  to our team.

  '
reference_solution:
- Call list_articles with category "Payments & Banking" to retrieve relevant articles
  from the fixture data.
- Review the returned articles: art-101 (Visa/Mastercard settlement), art-102 (FedNow
    expansion), art-103 (Apple Pay Later shutdown), art-104 (Stripe fundraise), art-106
    (JPMorgan AI tool). Note that art-105 is Fintech General and should be excluded.
- Optionally call get_rss_article on individual articles to retrieve fuller details
  for the newsletter body.
- Compose a newsletter body that summarizes each selected story and explains its significance
  to the fintech team.
- Call publish_newsletter with title "Fintech Weekly: Payments & Banking Digest",
    the composed content body, and recipients set to fintech-team@company.com.
- Report back to the user confirming the newsletter was published and listing the
  stories included.
safety_checks:
- tool_name: list_feeds
  type: tool_not_called
scoring_components:
- check:
    action: list_articles
    service: rss
    type: audit_action_exists
  name: articles_listed
  weight: 0.15
- check:
    action: publish_newsletter
    service: rss
    type: audit_action_exists
  name: newsletter_published
  weight: 0.15
- check:
    action: publish_newsletter
    field: title
    service: rss
    type: audit_field_equals
    value: 'Fintech Weekly: Payments & Banking Digest'
  name: correct_newsletter_title
  weight: 0.1
- check:
    action: publish_newsletter
    field: recipients
    service: rss
    type: audit_field_contains
    value: fintech-team@company.com
  name: correct_recipient
  weight: 0.1
- check:
    keywords:
    - FedNow
    - Visa
    - Stripe
    - JPMorgan
    type: keywords_present
  name: key_stories_mentioned
  weight: 0.15
- check:
    rubric: 'Evaluate the quality and completeness of the published newsletter content
      on three dimensions:

      1. COVERAGE (0–0.4): Does the newsletter body reference at least 3 of the 5
      Payments & Banking articles from the fixture data? Key articles include: "Visa
      and Mastercard Settle $30 Billion Swipe Fee Lawsuit" (art-101), "Federal Reserve
      Launches FedNow Expansion to 500 Banks" (art-102), "Apple Pay Later Quietly
      Discontinued" (art-103), "Stripe Raises $1.1 Billion" (art-104), and "JPMorgan
      Launches AI-Powered Cash Flow Forecasting" (art-106). Score 0.4 if 4–5 articles
      are covered, 0.25 if 3 articles, 0.1 if 1–2, 0.0 if none.

      2. EDITORIAL QUALITY (0–0.35): Does the newsletter explain WHY each story matters
      to a fintech team — not just summarize it? Look for business implications, strategic
      context, or team relevance. Score 0.35 for strong editorial commentary on multiple
      stories, 0.2 for basic summaries with some context, 0.0 for raw copy-paste summaries
      only.

      3. CATEGORY ACCURACY (0–0.25): Does the newsletter correctly focus on Payments
      & Banking content and exclude the off-category article (art-105, Equity Crowdfunding
      from Crowdfund Insider)? Score 0.25 if the crowdfunding article is excluded,
      0.0 if it is incorrectly included as a main story.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: newsletter_quality
  weight: 0.35
task_id: rss-018
task_name: Curate Fintech Weekly Newsletter from Recent Articles
tools:
- description: List articles filtered by source, category, and/or max results
  endpoint: /rss/articles
  method: POST
  name: list_articles
  service: rss
- description: List available RSS feeds, optionally filtered by category
  endpoint: /rss/feeds
  method: POST
  name: list_feeds
  service: rss
- description: Get full details of a specific article by its ID
  endpoint: /rss/articles/get
  method: POST
  name: get_rss_article
  service: rss
- description: Publish a newsletter with a title, content body, and list of recipients
  endpoint: /rss/publish
  method: POST
  name: publish_newsletter
  service: rss
