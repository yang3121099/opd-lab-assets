category: content
claw_eval_id: T22_newsletter_curation
difficulty: medium
fixtures:
  articles:
  - category: Payments & Banking
    date: '2025-06-10'
    id: art-101
    source: Fintech Futures
    summary: A landmark settlement between Visa, Mastercard, and U.S. merchants caps
      interchange fees and allows merchants to surcharge card payments, reshaping
