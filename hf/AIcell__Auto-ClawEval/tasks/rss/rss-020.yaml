category: content
claw_eval_id: T22_newsletter_curation
difficulty: medium
fixtures:
  articles:
  - category: wellness
    date: '2024-11-18'
    id: art-101
    source: Mindful Living Today
    summary: Researchers at Stanford found that people who follow a consistent morning
      routine report 34% lower stress levels and improved focus throughout the day.
      Key habits include hydration, light movement, and avoiding screens for the first
      30 minutes.
    title: 'The Science of Morning Routines: Why the First Hour Matters'
  - category: wellness
    date: '2024-11-17'
    id: art-102
    source: Nutrition Science Weekly
    summary: A meta-analysis of 22 clinical trials confirms that daily omega-3 supplementation
      (1–2g EPA/DHA) is associated with a 20% reduction in cognitive decline risk
      among adults over 50. Fatty fish, walnuts, and flaxseed remain top dietary sources.
    title: 'Omega-3s and Brain Health: What the Latest Studies Say'
  - category: wellness
    date: '2024-11-16'
    id: art-103
    source: Mindful Living Today
    summary: Clinical psychologist Dr. Amara Osei shares three evidence-based breathing
      techniques — box breathing, 4-7-8, and diaphragmatic breathing — that can measurably
      lower cortisol within minutes. Ideal for workplace stress relief.
    title: Five-Minute Breathing Exercises That Actually Reduce Anxiety
  - category: wellness
    date: '2024-11-15'
    id: art-104
    source: Healthy Habits Hub
    summary: 'A landmark JAMA study tracking 2,100 adults over 10 years found that
      walking 7,000 steps daily reduces all-cause mortality by 50–70% compared to
      sedentary lifestyles. The good news: steps don''t need to be consecutive.'
    title: 'Walking 7,000 Steps a Day: The New Research on Longevity'
  - category: wellness
    date: '2024-11-14'
    id: art-105
    source: Yoga & Movement Journal
    summary: Yin yoga's slow, floor-based poses held for 3–5 minutes target connective
      tissue and activate the parasympathetic nervous system. Certified instructor
      Priya Nair outlines a 20-minute sequence suitable for complete beginners.
    title: 'Yin Yoga for Stress Recovery: A Beginner''s Guide'
  - category: technology
    date: '2024-11-18'
    id: art-106
    source: Tech Crunch
    summary: NVIDIA posted $18.1B in quarterly revenue driven by data center GPU demand.
      Competitors AMD and Intel are accelerating their own AI accelerator roadmaps.
    title: AI Chips Race Heats Up as NVIDIA Reports Record Quarter
