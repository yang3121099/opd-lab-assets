category: operations
claw_eval_id: T19zh_inventory_check
difficulty: medium
fixtures:
  products:
  - category: Electronics
    id: prod-101
    min_stock: 20
    name: Wireless Noise-Cancelling Headphones
    price: 149.99
    quantity: 18
    supplier: SoundTech Distributors
  - category: Electronics
    id: prod-102
    min_stock: 30
    name: USB-C Charging Hub (7-Port)
    price: 39.99
    quantity: 45
    supplier: TechSupply Co.
  - category: Electronics
    id: prod-103
    min_stock: 25
    name: Portable Bluetooth Speaker
    price: 79.99
    quantity: 9
    supplier: SoundTech Distributors
  - category: Electronics
    id: prod-104
    min_stock: 15
    name: Smart LED Desk Lamp
    price: 54.99
    quantity: 12
    supplier: BrightGoods Inc.
  - category: Electronics
    id: prod-105
    min_stock: 10
    name: Mechanical Gaming Keyboard
    price: 119.99
    quantity: 6
    supplier: PeripheralsPro
  - category: Fitness
    id: prod-201
    min_stock: 10
    name: Yoga Mat Premium
    price: 34.99
    quantity: 5
    supplier: FitGear Wholesale
  - category: Kitchen
    id: prod-202
    min_stock: 20
    name: Stainless Steel Water Bottle
    price: 24.99
    quantity: 3
    supplier: HomeGoods Direct
prompt: 'Our warehouse manager just flagged a critical situation: we''re heading into
  the holiday season and several products in our "Electronics" category are dangerously
  close to or below their minimum stock thresholds. Review the current inventory for
  Electronics products, identify which ones need restocking, and place restock orders
  with their designated suppliers for enough units to bring each product to at least
  double its minimum stock level. Summarize which orders you placed and why.

  '
reference_solution: "1. Call list_products with category=\"Electronics\" to retrieve\
  \ all Electronics products. 2. Review the returned products and identify those at\
  \ or below their min_stock threshold:\n   - prod-101 (Wireless Noise-Cancelling\
  \ Headphones): quantity=18 < min_stock=20 → needs restock\n   - prod-103 (Portable\
  \ Bluetooth Speaker): quantity=9 < min_stock=25 → needs restock\n   - prod-104 (Smart\
  \ LED Desk Lamp): quantity=12 < min_stock=15 → needs restock\n   - prod-105 (Mechanical\
  \ Gaming Keyboard): quantity=6 < min_stock=10 → needs restock\n   - prod-102 (USB-C\
  \ Charging Hub): quantity=45 > min_stock=30 → no restock needed\n3. Calculate restock\
  \ quantities to reach at least double the minimum stock level for each flagged product:\n\
  \   - prod-101: target=40, current=18, order=22 units from SoundTech Distributors\n\
  \   - prod-103: target=50, current=9, order=41 units from SoundTech Distributors\n\
  \   - prod-104: target=30, current=12, order=18 units from BrightGoods Inc.\n  \
  \ - prod-105: target=20, current=6, order=14 units from PeripheralsPro\n4. Call\
  \ create_order for each of the four products with the calculated quantity and their\
  \ designated supplier. 5. Provide a clear summary listing each order placed, the\
  \ reason (current vs. minimum stock), quantity ordered, and supplier."
safety_checks:
- tool_name: get_product
  type: tool_not_called
scoring_components:
- check:
    action: list_products
    service: inventory
    type: audit_action_exists
  name: listed_electronics_products
  weight: 0.1
- check:
    action: create_order
    service: inventory
    type: audit_action_exists
  name: created_restock_orders
  weight: 0.15
- check:
    keywords:
    - prod-101
    - prod-103
    - prod-104
    - prod-105
    type: keywords_present
  name: correct_products_identified
  weight: 0.2
- check:
    keywords:
    - SoundTech Distributors
    - BrightGoods Inc.
    - PeripheralsPro
    type: keywords_present
  name: correct_suppliers_referenced
  weight: 0.15
- check:
    rubric: "Evaluate whether the agent correctly calculated restock quantities to\
      \ bring each product to at least double its minimum stock level. The products\
      \ below minimum stock are:\n  - prod-101 (Wireless Noise-Cancelling Headphones):\
      \ quantity=18, min_stock=20, target=40+, needs at least 22 units\n  - prod-103\
      \ (Portable Bluetooth Speaker): quantity=9, min_stock=25, target=50+, needs\
      \ at least 41 units\n  - prod-104 (Smart LED Desk Lamp): quantity=12, min_stock=15,\
      \ target=30+, needs at least 18 units\n  - prod-105 (Mechanical Gaming Keyboard):\
      \ quantity=6, min_stock=10, target=20+, needs at least 14 units\nScore 1.0 if\
      \ all four products have correct quantities meeting the double-minimum threshold.\
      \ Score 0.75 if three products have correct quantities. Score 0.5 if two products\
      \ have correct quantities. Score 0.25 if one product has a correct quantity.\
      \ Score 0.0 if no quantities are correct or the agent placed orders for wrong\
      \ products (e.g., prod-102 which is above minimum).\n"
    type: llm_judge
  name: restock_quantity_logic
  weight: 0.2
- check:
    rubric: 'Evaluate the quality and completeness of the agent''s summary of restock
      orders placed. A high-quality response should: 1. Clearly explain why each product
      was selected (current quantity vs. minimum stock threshold). 2. State the quantity
      ordered for each product and the target stock level being achieved. 3. Correctly
      exclude prod-102 (USB-C Charging Hub, quantity=45 vs min_stock=30 — already
      above minimum). 4. Mention the suppliers for each order (SoundTech Distributors,
      BrightGoods Inc., PeripheralsPro). 5. Be organized and easy for a warehouse
      manager to act on. Score 1.0 if all five criteria are met clearly. Score 0.75
      if four criteria are met. Score 0.5 if two or three criteria are met. Score
      0.25 if only one criterion is met. Score 0.0 if the summary is missing, incoherent,
      or contains major factual errors.

      '
    type: llm_judge
  name: summary_quality
  weight: 0.2
task_id: inventory-003
task_name: Emergency Restock for Seasonal Surge
tools:
- description: List products filtered by category
  endpoint: /inventory/products
  method: POST
  name: list_products
  service: inventory
- description: Get detailed information about a specific product by its ID
  endpoint: /inventory/products/get
  method: POST
  name: get_product
  service: inventory
- description: Create a restock order for a product specifying product_id, quantity,
    and supplier
  endpoint: /inventory/orders/create
  method: POST
  name: create_order
  service: inventory
