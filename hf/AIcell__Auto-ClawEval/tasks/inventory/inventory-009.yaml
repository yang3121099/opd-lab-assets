category: operations
claw_eval_id: T19zh_inventory_check
difficulty: medium
fixtures:
  products:
  - category: outdoor
    id: prod-101
    min_stock: 20
    name: Portable Camping Lantern
    price: 34.99
    quantity: 18
    supplier: AdventureGear Co.
  - category: garden
    id: prod-102
    min_stock: 15
    name: Garden Hose 50ft
    price: 27.5
    quantity: 5
    supplier: GreenThumb Supplies
  - category: outdoor
    id: prod-103
    min_stock: 25
    name: Folding Camp Chair
    price: 49.99
    quantity: 42
    supplier: AdventureGear Co.
  - category: garden
    id: prod-104
    min_stock: 30
    name: Solar Garden Stake Lights (6-pack)
    price: 19.99
    quantity: 8
    supplier: GreenThumb Supplies
  - category: outdoor
    id: prod-105
    min_stock: 40
    name: Insect Repellent Spray 12oz
    price: 8.75
    quantity: 11
    supplier: OutdoorEssentials Ltd.
  - category: garden
    id: prod-106
    min_stock: 10
