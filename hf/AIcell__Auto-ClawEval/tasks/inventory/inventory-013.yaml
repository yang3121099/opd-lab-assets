  - category: electronics
    id: prod-001
    min_stock: 10
    name: Wireless Noise-Cancelling Headphones
    price: 149.99
    quantity: 4
    supplier: SoundTech Distributors
  - category: kitchen
    id: prod-002
    min_stock: 15
    name: Stainless Steel Water Bottle
    price: 24.99
    quantity: 22
    supplier: EcoGoods Supply Co.
  - category: electronics
    id: prod-003
    min_stock: 8
    name: Portable Bluetooth Speaker
    price: 59.99
    quantity: 3
    supplier: SoundTech Distributors
  - category: fitness
    id: prod-004
    min_stock: 12
    name: Yoga Mat Premium
    price: 39.99
    quantity: 7
    supplier: ActiveLife Wholesale
  - category: home_decor
    id: prod-005
