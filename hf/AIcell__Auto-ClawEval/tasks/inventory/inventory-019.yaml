category: operations
claw_eval_id: T20_inventory_check
difficulty: medium
fixtures:
  products:
  - category: electronics
    id: prod-001
    min_stock: 10
    name: Wireless Noise-Cancelling Headphones
    price: 149.99
    quantity: 4
    supplier: TechSource Distributors
  - category: accessories
    id: prod-002
    min_stock: 15
    name: Stainless Steel Water Bottle
    price: 24.99
    quantity: 22
    supplier: GreenGoods Supply Co.
  - category: electronics
    id: prod-003
    min_stock: 8
    name: Portable Bluetooth Speaker
    price: 79.99
    quantity: 3
    supplier: TechSource Distributors
  - category: home_decor
    id: prod-004
    min_stock: 12
    name: Scented Soy Candle Set
    price: 34.99
    quantity: 6
    supplier: Artisan Home Goods
  - category: accessories
    id: prod-005
    min_stock: 10
    name: Leather Passport Wallet
    price: 44.99
    quantity: 18
    supplier: GreenGoods Supply Co.
  - category: kitchen
    id: prod-006
    min_stock: 6
