category: operations
claw_eval_id: T19zh_inventory_check
difficulty: medium
fixtures:
  products:
  - category: kitchenware
    id: PRD-101
    min_stock: 50
    name: Stainless Steel Mixing Bowl Set
    price: 34.99
    quantity: 42
    supplier: Nordic Kitchen Co.
  - category: kitchenware
    id: PRD-103
    min_stock: 30
    name: Cast Iron Skillet 12-inch
    price: 54.99
    quantity: 18
    supplier: Ironforge Supplies
  - category: kitchenware
    id: PRD-105
    min_stock: 40
    name: Bamboo Cutting Board Large
    price: 22.5
    quantity: 75
    supplier: EcoWood Traders
  - category: kitchenware
    id: PRD-107
    min_stock: 25
    name: Silicone Spatula Set (6-piece)
    price: 18.75
    quantity: 11
    supplier: Nordic Kitchen Co.
  - category: kitchenware
    id: PRD-109
    min_stock: 20
    name: Copper Measuring Cup Set
    price: 41.0
    quantity: 60
    supplier: Ironforge Supplies
  - category: storage
    id: PRD-111
    min_stock: 35
    name: Glass Food Storage Containers
    price: 29.99
    quantity: 90
    supplier: ClearPack Ltd.
  - category: bakeware
    id: PRD-113
