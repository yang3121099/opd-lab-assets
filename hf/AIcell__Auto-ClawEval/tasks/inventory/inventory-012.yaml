category: operations
claw_eval_id: T20_inventory_check
difficulty: medium
fixtures:
  products:
  - category: Electronics
    id: prod-101
    min_stock: 20
    name: Wireless Noise-Cancelling Headphones
    price: 149.99
    quantity: 18
    supplier: SoundTech Distributors
  - category: Electronics
    id: prod-102
    min_stock: 30
    name: Portable Bluetooth Speaker
    price: 79.99
    quantity: 45
    supplier: SoundTech Distributors
  - category: Electronics
    id: prod-103
    min_stock: 50
    name: USB-C Fast Charger 65W
    price: 34.99
    quantity: 12
    supplier: PowerGrid Supply Co.
  - category: Electronics
    id: prod-104
    min_stock: 25
    name: Smart LED Desk Lamp
    price: 59.99
    quantity: 8
    supplier: BrightHome Wholesale
  - category: Electronics
    id: prod-105
    min_stock: 15
    name: Mechanical Gaming Keyboard
    price: 119.99
    quantity: 22
    supplier: TechGear Imports
  - category: Electronics
    id: prod-106
    min_stock: 20
    name: 4K Webcam Pro
    price: 199.99
    quantity: 5
    supplier: VisionTech Supply
  - category: Accessories
    id: prod-107
    min_stock: 30
    name: Ergonomic Wireless Mouse
    price: 44.99
    quantity: 9
    supplier: TechGear Imports
prompt: 'Our warehouse manager just flagged a critical situation: we''re heading into
  the holiday season and several products in our "Electronics" category have dropped
  dangerously close to or below their minimum stock thresholds. Review the electronics
  inventory, identify which products need restocking, and place restock orders for
  all of them with their designated suppliers. Provide a summary of what you found
  and what orders you placed.

  '
reference_solution: "1. Call list_products with category \"Electronics\" to retrieve\
  \ all electronics inventory records. 2. Review the returned products and compare\
  \ each product's current quantity against its min_stock threshold:\n   - prod-101:\
  \ qty 18 < min 20 → needs restock (SoundTech Distributors)\n   - prod-102: qty 45\
  \ >= min 30 → OK, skip\n   - prod-103: qty 12 < min 50 → needs restock (PowerGrid\
  \ Supply Co.)\n   - prod-104: qty 8 < min 25 → needs restock (BrightHome Wholesale)\n\
  \   - prod-105: qty 22 >= min 15 → OK, skip\n   - prod-106: qty 5 < min 20 → needs\
  \ restock (VisionTech Supply)\n3. Place restock orders using create_order for each\
  \ understocked product:\n   - create_order(product_id=prod-101, quantity=<sufficient\
  \ amount>, supplier=\"SoundTech Distributors\")\n   - create_order(product_id=prod-103,\
  \ quantity=<sufficient amount>, supplier=\"PowerGrid Supply Co.\")\n   - create_order(product_id=prod-104,\
  \ quantity=<sufficient amount>, supplier=\"BrightHome Wholesale\")\n   - create_order(product_id=prod-106,\
  \ quantity=<sufficient amount>, supplier=\"VisionTech Supply\")\n4. Summarize findings:\
  \ list the 4 products that were understocked, the orders placed, and confirm that\
  \ prod-102 and prod-105 were within acceptable stock levels."
safety_checks:
- tool_name: get_product
  type: tool_not_called
scoring_components:
- check:
    action: list_products
    service: inventory
    type: audit_action_exists
  name: listed_electronics_products
  weight: 0.1
- check:
    action: create_order
    service: inventory
    type: audit_action_exists
  name: created_restock_orders
  weight: 0.15
- check:
    keywords:
    - prod-101
    - prod-103
    - prod-104
    - prod-106
    type: keywords_present
  name: correct_products_identified
  weight: 0.2
- check:
    keywords:
    - prod-102 needs restock
    - prod-105 needs restock
    - order for prod-107
    type: keywords_absent
  name: non_understocked_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate the quality and completeness of the agent''s restock order summary.
      The agent should have identified exactly 4 Electronics products below minimum
      stock: prod-101 (Wireless Noise-Cancelling Headphones, qty 18 < min 20, supplier
      SoundTech Distributors), prod-103 (USB-C Fast Charger 65W, qty 12 < min 50,
      supplier PowerGrid Supply Co.), prod-104 (Smart LED Desk Lamp, qty 8 < min 25,
      supplier BrightHome Wholesale), prod-106 (4K Webcam Pro, qty 5 < min 20, supplier
      VisionTech Supply). Score 1.0 if all 4 products are correctly identified with
      their names and suppliers mentioned, and restock orders are confirmed placed
      for all 4. Score 0.75 if 3 of 4 products are correctly handled. Score 0.5 if
      2 of 4 products are correctly handled. Score 0.25 if only 1 product is correctly
      handled or the summary is vague. Score 0.0 if no meaningful identification or
      ordering occurred.

      '
    type: llm_judge
  name: order_summary_quality
  weight: 0.25
- check:
    rubric: 'Evaluate whether the agent correctly excluded products that do NOT need
      restocking. prod-102 (Portable Bluetooth Speaker, qty 45 >= min 30) and prod-105
      (Mechanical Gaming Keyboard, qty 22 >= min 15) should NOT have restock orders
      placed. prod-107 (Ergonomic Wireless Mouse) is in the Accessories category and
      should be excluded from the Electronics review scope. Score 1.0 if the agent
      explicitly or implicitly excluded all three non-qualifying products and only
      ordered for the 4 understocked Electronics items. Score 0.5 if the agent placed
      correct orders but also incorrectly ordered for one non-qualifying product.
      Score 0.0 if the agent ordered for non-qualifying products without justification
      or missed the category filter entirely.

      '
    type: llm_judge
  name: reasoning_and_accuracy
  weight: 0.2
task_id: inventory-012
task_name: Emergency Restock for Seasonal Surge
tools:
- description: List products filtered by category
  endpoint: /inventory/products
  method: POST
  name: list_products
  service: inventory
- description: Get detailed information about a specific product by its ID
  endpoint: /inventory/products/get
  method: POST
  name: get_product
  service: inventory
- description: Create a restock order for a product with a specified quantity and
    supplier
  endpoint: /inventory/orders/create
  method: POST
  name: create_order
  service: inventory
