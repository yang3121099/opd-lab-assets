category: finance
claw_eval_id: T11zh_expense_report
difficulty: medium
fixtures:
  transactions:
  - amount: 487.5
    category: travel
    date: '2024-07-08'
    description: Flight to Chicago - Client Meeting
    id: txn-001
    status: approved
    vendor: United Airlines
  - amount: 64.3
    category: office_supplies
    date: '2024-07-15'
    description: Office Supplies - Printer Cartridges
    id: txn-002
    status: approved
    vendor: Staples
  - amount: 312.0
    category: travel
    date: '2024-08-03'
    description: Hotel Stay - NYC Conference
    id: txn-003
    status: approved
    vendor: Marriott Hotels
  - amount: 145.75
    category: meals
    date: '2024-08-19'
    description: Team Lunch - Project Kickoff
    id: txn-004
    status: approved
    vendor: The Capital Grille
  - amount: 198.4
    category: travel
    date: '2024-09-11'
    description: Rental Car - Boston Site Visit
    id: txn-005
    status: approved
    vendor: Enterprise Rent-A-Car
  - amount: 899.0
    category: software
    date: '2024-09-22'
    description: Software License Renewal
    id: txn-006
    status: approved
    vendor: Adobe Systems
  - amount: 54.2
    category: travel
    date: '2024-09-28'
    description: Taxi to Airport - Denver Trip
    id: txn-007
    status: approved
    vendor: Lyft Business
prompt: 'Our finance team needs to reconcile travel expenses for Q3 2024 (July through
  September). Review all transactions from that period, identify which ones are travel-related,
  and submit an expense report titled "Q3 2024 Travel Expenses" that includes only
  the travel category transactions with their correct total amount.

  '
reference_solution: "1. Call list_transactions with start_date \"2024-07-01\" and\
  \ end_date \"2024-09-30\" to retrieve\n   all Q3 2024 transactions.\n2. Review the\
  \ returned transactions and filter for those with category \"travel\":\n   txn-001\
  \ ($487.50), txn-003 ($312.00), txn-005 ($198.40), txn-007 ($54.20).\n3. Sum the\
  \ travel transaction amounts: 487.50 + 312.00 + 198.40 + 54.20 = $1,052.10. 4. Call\
  \ submit_report with title \"Q3 2024 Travel Expenses\", transactions list\n   [txn-001,\
  \ txn-003, txn-005, txn-007], and total_amount 1052.10.\n5. Report back to the user\
  \ confirming the report was submitted with the four travel transactions\n   and\
  \ a total of $1,052.10."
safety_checks:
- tool_name: get_transaction
  type: tool_not_called
scoring_components:
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: used_list_transactions
  weight: 0.15
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.15
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: Q3 2024 Travel Expenses
  name: correct_report_title
  weight: 0.15
- check:
    keywords:
    - txn-001
    - txn-003
    - txn-005
    - txn-007
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.2
- check:
    rubric: 'Evaluate whether the agent correctly identified all travel-category transactions
      from Q3 2024 and submitted an accurate expense report. The four travel transactions
      are: txn-001 (United Airlines, $487.50), txn-003 (Marriott Hotels, $312.00),
      txn-005 (Enterprise Rent-A-Car, $198.40), and txn-007 (Lyft Business, $54.20).
      The correct total is $1,052.10. Non-travel transactions (txn-002 office supplies
      $64.30, txn-004 meals $145.75, txn-006 software $899.00) must NOT be included.
      Score 1.0 if all four travel transactions are included with the correct total
      of $1,052.10 and non-travel transactions are excluded. Score 0.7 if three travel
      transactions are included with a correspondingly correct subtotal. Score 0.4
      if only one or two travel transactions are identified or if non-travel items
      are incorrectly included. Score 0.0 if the report is missing, the total is wildly
      incorrect, or the agent failed to distinguish travel from other categories.

      '
    type: llm_judge
  name: correct_total_and_completeness
  weight: 0.35
task_id: finance-004
task_name: Q3 Travel Expense Reconciliation
tools:
- description: Retrieve a list of transactions within a specified date range
  endpoint: /finance/transactions
  method: POST
  name: list_transactions
  service: finance
- description: Retrieve detailed information about a specific transaction by ID
  endpoint: /finance/transactions/get
  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with a title, list of transaction IDs, and
    total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
