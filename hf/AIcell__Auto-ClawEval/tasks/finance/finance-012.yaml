category: finance
claw_eval_id: T12_expense_report
difficulty: medium
fixtures:
  transactions:
  - amount: 429.99
    category: equipment
    date: '2024-07-08'
    description: Dell 27-inch Monitor purchase
    id: txn-1001
    status: approved
    vendor: Dell Technologies
  - amount: 187.5
    category: meals
    date: '2024-07-15'
    description: Team lunch at Olive Garden
    id: txn-1002
    status: approved
    vendor: Olive Garden
  - amount: 219.99
    category: equipment
    date: '2024-08-02'
    description: Logitech MX Keys keyboard and mouse combo
    id: txn-1003
    status: approved
    vendor: Logitech
  - amount: 149.95
    category: equipment
    date: '2024-08-19'
    description: USB-C docking station for laptop
    id: txn-1004
    status: approved
    vendor: Anker
  - amount: 312.0
    category: travel
    date: '2024-09-03'
    description: Flight to Chicago sales conference
    id: txn-1005
    status: approved
    vendor: United Airlines
  - amount: 389.0
    category: equipment
    date: '2024-09-11'
    description: Ergonomic desk chair for home office
    id: txn-1006
    status: approved
    vendor: Herman Miller
  - amount: 89.99
    category: equipment
    date: '2024-09-22'
    description: Webcam HD 1080p for video conferencing
    id: txn-1007
    status: approved
    vendor: Logitech
prompt: 'Our team lead Sarah Chen submitted several equipment purchases last quarter
  for the remote work setup program. Please review all available transactions, identify
  the ones related to remote work equipment (computers, monitors, peripherals, and
  accessories), and submit a consolidated expense report titled "Remote Work Equipment
  Q3 Reimbursement" with the total amount of all qualifying transactions. Summarize
  which transactions were included and why.

  '
reference_solution: "1. Call list_transactions with start_date \"2024-07-01\" and\
  \ end_date \"2024-09-30\" to retrieve all Q3 transactions. 2. Review the returned\
  \ transactions and identify those in the \"equipment\" category related to remote\
  \ work:\n   txn-1001 (Dell Monitor, $429.99), txn-1003 (Logitech keyboard/mouse,\
  \ $219.99),\n   txn-1004 (USB-C docking station, $149.95), txn-1006 (ergonomic chair,\
  \ $389.00),\n   txn-1007 (webcam, $89.99).\n3. Exclude txn-1002 (team lunch — meals\
  \ category) and txn-1005 (airline flight — travel category)\n   as they are not\
  \ remote work equipment.\n4. Calculate the total: 429.99 + 219.99 + 149.95 + 389.00\
  \ + 89.99 = $1,278.92. 5. Call submit_report with title \"Remote Work Equipment\
  \ Q3 Reimbursement\",\n   transactions list [txn-1001, txn-1003, txn-1004, txn-1006,\
  \ txn-1007], and total_amount 1278.92.\n6. Report back to the user with a summary\
  \ of included transactions, excluded transactions with reasons,\n   and the final\
  \ submitted total."
safety_checks:
- tool_name: get_transaction
  type: tool_not_called
scoring_components:
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: used_transaction_listing
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.15
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Remote Work Equipment Q3 Reimbursement
  name: correct_report_title
  weight: 0.15
- check:
    keywords:
    - txn-1001
    - txn-1003
    - txn-1004
    - txn-1006
    - txn-1007
    type: keywords_present
  name: correct_transactions_identified
  weight: 0.25
- check:
    keywords:
    - txn-1002
    - txn-1005
    type: keywords_absent
  name: excluded_non_equipment
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s expense report submission and summary on three
      dimensions:

      1. CORRECT TRANSACTION SELECTION (0.0–0.4): Did the agent correctly include
      only the five remote work equipment transactions (txn-1001: Dell Monitor $429.99,
      txn-1003: Logitech keyboard/mouse $219.99, txn-1004: USB-C docking station $149.95,
      txn-1006: ergonomic chair $389.00, txn-1007: webcam $89.99) and exclude the
      non-qualifying ones (txn-1002: team lunch, txn-1005: airline travel)? Score
      0.4 if all correct, 0.2 if one error, 0.0 if multiple errors.

      2. CORRECT TOTAL AMOUNT (0.0–0.3): Did the agent calculate and report the correct
      total of $1,278.92 (429.99 + 219.99 + 149.95 + 389.00 + 89.99)? Score 0.3 if
      exact or within $0.01, 0.1 if close but slightly off, 0.0 if significantly wrong.

      3. EXPLANATION QUALITY (0.0–0.3): Did the agent clearly explain why each transaction
      was included or excluded, referencing vendor names, categories, and relevance
      to remote work equipment? Score 0.3 for thorough justification of all decisions,
      0.15 for partial explanation, 0.0 for no reasoning.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_reasoning
  weight: 0.25
task_id: finance-012
task_name: Remote Work Equipment Reimbursement Report
tools:
- description: List transactions within a date range
  endpoint: /finance/transactions
  method: POST
  name: list_transactions
  service: finance
- description: Get details of a specific transaction by ID
  endpoint: /finance/transactions/get
  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with a title, list of transaction IDs, and
    total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
