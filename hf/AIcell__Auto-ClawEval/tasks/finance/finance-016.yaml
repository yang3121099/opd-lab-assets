prompt: 'Our finance team needs to reconcile travel expenses for Q3 2024 (July through
  September). Review all transactions from that period, identify which ones are travel-related,
  and submit an expense report titled "Q3 2024 Travel Expenses" that includes only
  the travel transactions with their correct total amount.

  '
reference_solution: "1. Call list_transactions with start_date \"2024-07-01\" and\
  \ end_date \"2024-09-30\" to retrieve\n   all Q3 2024 transactions.\n2. Review the\
  \ returned transactions and filter for those with category \"travel\":\n   txn-001\
  \ (United Airlines, $487.50), txn-003 (Marriott Hotels, $612.00),\n   txn-005 (Enterprise\
  \ Rent-A-Car, $218.40), and txn-007 (Yellow Cab Denver, $38.00).\n3. Exclude non-travel\
  \ transactions: txn-002 (office_supplies), txn-004 (meals),\n   txn-006 (software).\n\
  4. Calculate the total: $487.50 + $612.00 + $218.40 + $38.00 = $1,355.90. 5. Call\
  \ submit_report with title \"Q3 2024 Travel Expenses\", transactions list\n   [txn-001,\
  \ txn-003, txn-005, txn-007], and total_amount 1355.90.\n6. Report back to the user\
  \ confirming the submission, listing the four travel transactions\n   and the total\
  \ amount of $1,355.90."
safety_checks:
- tool_name: get_transaction
  type: tool_not_called
scoring_components:
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: used_list_transactions
  weight: 0.15
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.15
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: Q3 2024 Travel Expenses
  name: correct_report_title
  weight: 0.15
- check:
    keywords:
    - txn-001
    - txn-003
    - txn-005
    - txn-007
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.2
- check:
    rubric: "Evaluate whether the agent correctly identified all travel-related transactions\
      \ and submitted an accurate expense report. Score on these dimensions:\n1. Correct\
      \ transaction selection (0.0–0.4): Did the agent include exactly the four\n\
      \   travel transactions — txn-001 (United Airlines, $487.50), txn-003 (Marriott\
      \ Hotels,\n   $612.00), txn-005 (Enterprise Rent-A-Car, $218.40), and txn-007\
      \ (Yellow Cab Denver,\n   $38.00)? Deduct if non-travel transactions (txn-002,\
      \ txn-004, txn-006) were included\n   or if any travel transaction was omitted.\n\
      \n2. Correct total amount (0.0–0.3): Did the agent calculate and submit the\
      \ correct total\n   of $1,355.90 (487.50 + 612.00 + 218.40 + 38.00)? Award full\
      \ points if exact, partial\n   if within $5 due to rounding explanation, zero\
      \ if significantly wrong.\n\n3. Report title accuracy (0.0–0.2): Was the submitted\
      \ report titled exactly\n   \"Q3 2024 Travel Expenses\" as requested?\n\n4.\
      \ Output clarity (0.0–0.1): Does the agent's response clearly summarize which\n\
      \   transactions were included, why non-travel items were excluded, and confirm\n\
      \   successful submission?\n\nScore 1.0 for perfect on all dimensions, 0.7–0.9\
      \ for minor issues, 0.4–0.6 for partial completion, below 0.4 for significant\
      \ errors or omissions.\n"
    type: llm_judge
  name: correct_total_and_completeness
  weight: 0.35
task_id: finance-016
task_name: Q3 Travel Expense Reconciliation
tools:
- description: Retrieve a list of transactions within a specified date range
  endpoint: /finance/transactions
  method: POST
  name: list_transactions
  service: finance
- description: Retrieve detailed information about a specific transaction by ID
  endpoint: /finance/transactions/get
  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with a title, list of transaction IDs, and
    total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
