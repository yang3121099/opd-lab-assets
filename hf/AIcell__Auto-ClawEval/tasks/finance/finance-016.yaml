    id: txn-002
    status: approved
    vendor: Staples
  - amount: 612.0
    category: travel
    date: '2024-08-14'
    description: Hotel Stay - Chicago Marriott (3 nights)
    id: txn-003
    status: approved
    vendor: Marriott Hotels
  - amount: 143.75
    category: meals
    date: '2024-08-15'
