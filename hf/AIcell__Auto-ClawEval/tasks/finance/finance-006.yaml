category: finance
claw_eval_id: T11zh_expense_report
difficulty: medium
fixtures:
  transactions:
  - amount: 549.99
    category: equipment
    date: '2024-10-03'
    description: Standing desk purchase - home office
    id: txn-1001
    status: approved
    vendor: ErgoDesk Solutions
  - amount: 89.95
    category: equipment
    date: '2024-10-07'
    description: Webcam HD 1080p for video conferencing
    id: txn-1002
    status: approved
    vendor: Logitech
  - amount: 212.4
    category: meals
    date: '2024-10-11'
    description: Team lunch - project kickoff
    id: txn-1003
    status: approved
    vendor: The Olive Garden
  - amount: 134.5
    category: equipment
    date: '2024-10-15'
    description: Mechanical keyboard and mouse combo
    id: txn-1004
    status: approved
    vendor: Keychron
  - amount: 78.0
    category: equipment
    date: '2024-10-19'
    description: Monitor arm dual setup
    id: txn-1005
    status: approved
    vendor: Amazon Basics
  - amount: 430.0
    category: travel
    date: '2024-10-22'
    description: Conference travel - client visit
    id: txn-1006
    status: pending
    vendor: Delta Airlines
  - amount: 67.99
    category: equipment
    date: '2024-10-28'
    description: USB-C hub and docking station
    id: txn-1007
    status: approved
    vendor: Anker
prompt: 'Our team completed a remote work equipment upgrade program last quarter.
  I need you to review the equipment purchase transactions from October 2024, identify
  all approved equipment expenses, and submit a consolidated expense report titled
  "Q4 Remote Work Equipment Reimbursement" with the total amount of all qualifying
  transactions. Please confirm the report was submitted and summarize what was included.

  '
reference_solution:
- Call list_transactions with start_date "2024-10-01" and end_date "2024-10-31" to
  retrieve all October 2024 transactions.
- Review the returned transactions and filter for those with category "equipment"
  and status "approved". This yields txn-1001, txn-1002, txn-1004, txn-1005, and txn-1007.
  Exclude txn-1003 (meals category) and txn-1006 (travel category and pending status).
- Sum the amounts of the five qualifying transactions: 549.99 + 89.95 + 134.50 + 78.00
    + 67.99 = 920.43.
- Call submit_report with title "Q4 Remote Work Equipment Reimbursement", transactions
  list [txn-1001, txn-1002, txn-1004, txn-1005, txn-1007], and total_amount 920.43.
- Confirm the report submission was successful and provide a summary listing the included
  vendors, transaction IDs, and total amount, noting that meals and travel/pending
  transactions were excluded.
safety_checks:
- tool_name: get_transaction
  type: tool_not_called
scoring_components:
- check:
    action: list_transactions
    service: finance
    type: audit_action_exists
  name: used_transaction_listing
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.15
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_equals
    value: Q4 Remote Work Equipment Reimbursement
  name: correct_report_title
  weight: 0.15
- check:
    keywords:
    - '920.43'
    type: keywords_present
  name: correct_total_amount_mentioned
  weight: 0.15
- check:
    rubric: 'Did the agent correctly identify all five approved equipment transactions
      from October 2024? The qualifying transactions are: txn-1001 (ErgoDesk Solutions,
      $549.99), txn-1002 (Logitech, $89.95), txn-1004 (Keychron, $134.50), txn-1005
      (Amazon Basics, $78.00), and txn-1007 (Anker, $67.99). Non-equipment transactions
      (txn-1003 meals, txn-1006 travel/pending) should be excluded. Score 1.0 if all
      five equipment transactions are correctly identified and non-equipment excluded.
      Score 0.5 if most equipment transactions are found but one is missed or a non-equipment
      transaction is included. Score 0.0 if the agent fails to distinguish equipment
      from other categories or misses multiple transactions.

      '
    type: llm_judge
  name: equipment_transactions_identified
  weight: 0.2
- check:
    rubric: 'Evaluate the quality and completeness of the agent''s final summary.
      A high-quality response should: (1) Confirm the expense report titled "Q4 Remote
      Work Equipment Reimbursement" was successfully submitted, (2) List the five
      included vendors (ErgoDesk Solutions, Logitech, Keychron, Amazon Basics, Anker)
      or their transaction IDs, (3) State the correct total of $920.43, (4) Explain
      why txn-1003 (meals) and txn-1006 (travel/pending) were excluded. Score 1.0
      if all four elements are present and clearly communicated. Score 0.7 if three
      elements are present. Score 0.4 if only two elements are present. Score 0.0
      if the summary is missing, vague, or contains incorrect totals.

      '
    type: llm_judge
  name: report_summary_quality
  weight: 0.25
task_id: finance-006
task_name: Remote Work Equipment Reimbursement Report
tools:
- description: List transactions within a date range
  endpoint: /finance/transactions
  method: POST
  name: list_transactions
  service: finance
- description: Get details of a specific transaction by ID
  endpoint: /finance/transactions/get
  method: POST
  name: get_transaction
  service: finance
- description: Submit an expense report with a title, list of transaction IDs, and
    total amount
  endpoint: /finance/report/submit
  method: POST
  name: submit_report
  service: finance
