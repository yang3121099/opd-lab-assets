category: finance
claw_eval_id: T12_expense_report
difficulty: medium
fixtures:
  transactions:
  - amount: 847.5
    category: Office Supplies
    date: '2024-09-12'
    description: Office supplies bulk order
    id: TXN-2024-0441
    status: approved
    vendor: Pinnacle Office Solutions
  - amount: 847.5
    category: Office Supplies
    date: '2024-09-12'
    description: Office supplies bulk order
    id: TXN-2024-0442
    status: approved
    vendor: Pinnacle Office Solutions
  - amount: 312.0
    category: Office Supplies
    date: '2024-09-19'
    description: Office supplies restock — Q3 supplemental
    id: TXN-2024-0889
    status: approved
    vendor: Pinnacle Office Solutions
  - amount: 1250.0
    category: Meals & Entertainment
    date: '2024-08-05'
    description: Team catering — product launch event
    id: TXN-2024-0310
