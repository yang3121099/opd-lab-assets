  transactions:
  - amount: 412.5
    category: travel
    date: '2024-07-08'
    description: Flight to Chicago for client meeting
    id: txn-001
    status: approved
    vendor: United Airlines
  - amount: 87.3
    category: supplies
    date: '2024-07-15'
    description: Office supplies restock
    id: txn-002
    status: approved
    vendor: Staples
  - amount: 389.0
    category: travel
    date: '2024-08-03'
    description: Hotel stay - NYC conference
    id: txn-003
    status: approved
    vendor: Marriott Hotels
  - amount: 145.6
    category: meals
    date: '2024-08-21'
    description: Team lunch - project kickoff
    id: txn-004
    status: approved
