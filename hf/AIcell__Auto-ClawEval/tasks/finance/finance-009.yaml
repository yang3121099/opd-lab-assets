category: finance
claw_eval_id: T11zh_expense_report
difficulty: medium
fixtures:
  transactions:
  - amount: 349.99
    category: office_equipment
    date: '2024-11-04'
    description: Standing desk purchase for home office
    id: txn-001
    status: approved
    vendor: Uplift Desk Co
  - amount: 127.5
    category: meals
    date: '2024-11-07'
    description: Team lunch at downtown bistro
    id: txn-002
    status: approved
    vendor: The Bistro Downtown
  - amount: 189.0
    category: office_equipment
    date: '2024-11-12'
    description: Mechanical keyboard and mouse combo
    id: txn-003
    status: approved
    vendor: Best Buy
  - amount: 214.95
    category: office_equipment
    date: '2024-11-15'
    description: 4K webcam for video conferencing
    id: txn-004
    status: approved
    vendor: B&H Photo Video
  - amount: 412.0
    category: travel
    date: '2024-11-19'
    description: Flight to Chicago for client meeting
    id: txn-005
    status: approved
    vendor: United Airlines
  - amount: 67.49
    category: office_equipment
    date: '2024-11-22'
    description: USB-C hub and monitor cables
    id: txn-006
