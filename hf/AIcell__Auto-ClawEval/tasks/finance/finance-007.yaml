    id: txn-003
    status: approved
    vendor: The Capital Grille
  - amount: 623.0
    category: Travel
    date: '2024-08-19'
    description: Flight to New York — Partner Summit
    id: txn-004
    status: approved
    vendor: Delta Air Lines
  - amount: 198.4
