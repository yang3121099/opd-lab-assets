tools:
- description: List calendar events for a given date range.
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Get details of a specific calendar event by ID.
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: Search knowledge base articles by query or category.
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve a specific knowledge base article by ID.
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Update the content of a knowledge base article.
  endpoint: /kb/articles/update
  method: POST
  name: update_article
  service: kb
- description: List to-do tasks, optionally filtered by status.
  endpoint: /todo/tasks
  method: POST
  name: list_tasks
  service: todo
- description: Search contacts by name, email, or department.
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
