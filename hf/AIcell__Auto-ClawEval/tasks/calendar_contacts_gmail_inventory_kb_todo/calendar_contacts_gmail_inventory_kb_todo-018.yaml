prompt: 'After our quarterly product review meeting yesterday, I need you to do the
  following: 1. Check the calendar for the "Q3 Product Review" meeting and find out
  who attended and what the meeting details were. 2. Look up the knowledge base article
  titled "Q3 Product Roadmap" and update it to reflect the decisions made in the meeting
  — specifically, add a summary of attendees and note that the roadmap has been reviewed
  and approved for Q3 execution. 3. Check if there are any open to-do tasks related
  to the product roadmap, and include their titles in the KB article update so stakeholders
  know what''s still pending. Please summarize what you updated and confirm the changes.

  '
reference_solution: '1. Call list_events or get_event to retrieve the "Q3 Product
  Review" meeting (evt-101) and note its attendees: sarah.chen@company.com, marcus.obi@company.com,
  priya.nair@company.com, tom.walsh@company.com. 2. Call search_articles with query
  "Q3 Product Roadmap" (or category "product") to locate article kb-055, then call
  get_kb_article with article_id "kb-055" to retrieve its current content. 3. Call
  list_tasks to retrieve open tasks; identify task-301 ("Finalize API v2 documentation"),
  task-302 ("Design mockups for mobile app redesign"), and task-303 ("Analytics dashboard
  — data model review") as open roadmap-related tasks. 4. Call update_article with
  article_id "kb-055" and updated content that includes: (a) a meeting review summary
  with all four attendees named, (b) a statement that the Q3 roadmap has been reviewed
  and approved for execution, and (c) a list of the three pending open tasks with
  their titles. 5. Summarize the changes made in the output, confirming the article
  was updated and listing the key additions.'
