- check:
    rubric: 'Evaluate the agent''s response on three dimensions: 1. ACCURACY (0–0.4):
      Did the agent correctly identify the Q3 Product Review meeting (evt-101), its
      attendees (sarah.chen, marcus.obi, priya.nair, tom.walsh), and update the correct
      KB article (kb-055, "Q3 Product Roadmap")? Award 0.4 if all details are correct,
      0.2 if partially correct, 0.0 if wrong article or wrong meeting. 2. COMPLETENESS
      (0–0.4): Does the updated KB article content (as described in the agent''s summary)
      include: (a) a list of meeting attendees, (b) a note that the roadmap is reviewed
      and approved for Q3 execution, and (c) the three open pending tasks — "Finalize
      API v2 documentation" (task-301), "Design mockups for mobile app redesign" (task-302),
      and "Analytics dashboard — data model review" (task-303)? Award 0.4 if all three
      elements are present, 0.2 if two, 0.1 if one, 0.0 if none. 3. CLARITY (0–0.2):
      Is the agent''s summary clear, well-organized, and actionable for a stakeholder
      reading it? Award 0.2 if excellent, 0.1 if adequate, 0.0 if confusing or incomplete.
      Total score = sum of the three dimensions (max 1.0).

      '
    type: llm_judge
  name: quality_and_completeness
  weight: 0.2
