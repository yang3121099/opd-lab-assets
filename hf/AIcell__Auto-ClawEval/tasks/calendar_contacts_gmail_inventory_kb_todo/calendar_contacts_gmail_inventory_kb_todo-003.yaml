- check:
    rubric: 'Evaluate the agent''s final summary on these dimensions: 1. Did the agent
      correctly identify Sarah Chen (contact-001, sarah.chen@company.com, Senior Product
      Manager) from the contacts service? 2. Did the agent check existing calendar
      events on 2025-02-03 and note the conflicts (evt-001 standup at 9 AM, evt-002
      budget review at 2 PM)? 3. Was the kickoff meeting created for 2025-02-03 at
      10:00 AM–11:30 AM in Conference Room C with Sarah Chen as an attendee? 4. Did
      the agent reference the KB meeting room policy (kb-001) and note any relevant
      constraints (e.g., 24-hour advance booking, room capacity)? 5. Was a confirmation
      email sent to sarah.chen@company.com with meeting details? 6. Was a to-do task
      created to prepare the kickoff agenda? Scoring: 1.0 = all 6 dimensions addressed
      clearly; 0.7 = 4-5 dimensions; 0.4 = 2-3 dimensions; 0.1 = only 1 dimension;
      0.0 = none addressed.

      '
    type: llm_judge
  name: output_summary_quality
  weight: 0.25
