prompt: 'We''re launching a new product next quarter and need to coordinate a kickoff
  meeting. Look up the product manager "Sarah Chen" in contacts to get her email,
  check what events are already scheduled for next Monday (2025-02-03), search the
  knowledge base for our standard meeting room booking policy, and then create a kickoff
  meeting event for that day at 10:00 AM to 11:30 AM in Conference Room C with Sarah
  and any other relevant stakeholders you find. After creating the event, send Sarah
  an email confirming the meeting details and create a to-do task to prepare the kickoff
  agenda. Summarize everything you did.

  '
reference_solution: '1. Call search_contacts with query "Sarah Chen" to find her contact
  record (contact-001) and retrieve her email sarah.chen@company.com. 2. Call get_contact
  with contact_id "contact-001" to confirm her full details including title and department.
  3. Call list_events with date "2025-02-03" and days 1 to check existing calendar
  entries for that Monday; note evt-001 (standup 9–9:30 AM) and evt-002 (budget review
  2–3 PM), confirming 10 AM–11:30 AM is free. 4. Call search_articles with query "meeting
  room booking policy" to find kb-001; call get_kb_article for kb-001 to read the
  policy (24-hour advance notice, Conference Room C capacity 12). 5. Call create_event
  with title "Product Launch Kickoff Meeting", start_time "2025-02-03T10:00:00", end_time
  "2025-02-03T11:30:00", attendees ["sarah.chen@company.com", "marcus.webb@company.com",
  "priya.nair@company.com"], location "Conference Room C". 6. Call send_email with
  to "sarah.chen@company.com", subject "Product Launch Kickoff Meeting — Feb 3 at
  10 AM", and a body confirming the event details, location, and attendees. 7. Call
  create_task with title "Prepare Product Launch Kickoff Agenda", priority "high",
  due_date "2025-02-02" (day before the meeting). 8. Summarize all actions taken:
  contact found, calendar checked, KB policy reviewed, event created in Conference
  Room C, email sent to Sarah, and agenda task created.'
