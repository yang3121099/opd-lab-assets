prompt: 'I''ve been getting complaints that our weekly All-Hands meeting keeps getting
  double-booked with other events. Check my inbox for any recent emails about scheduling
  conflicts, look up the relevant attendees involved, and then review the calendar
  to identify any overlapping events next week. Summarize the conflicts you find,
  suggest which event should be rescheduled based on attendee count and priority,
  and create a follow-up task to track the resolution.

  '
reference_solution:
- action: Call list_inbox to retrieve recent emails (days_back=7) and identify unread
    high-priority messages about scheduling conflicts.
  step: 1
- action: Call get_message for msg-001, msg-002, and msg-005 to read the full content
    of the conflict-related emails from Priya Sharma and Tom Nguyen.
  step: 2
- action: Call list_events for date=2024-11-26 and days=1 to retrieve all calendar
    events on the conflicted Tuesday.
  step: 3
- action: Call get_event for evt-001, evt-002, and evt-003 to get full attendee and
    timing details for the three overlapping Conference Room A events.
  step: 4
- action: Call search_contacts with query='Priya Sharma' and query='Tom Nguyen' to
    retrieve their contact details and roles.
  step: 5
- action: 'Analyze the conflicts: evt-001 (All-Hands 2:00-3:30pm), evt-002 (Product
    Roadmap 2:00-4:00pm), and evt-003 (Client Demo 3:00-4:30pm) all overlap in Conference
    Room A. External stakeholders in evt-002 and evt-003 make those harder to reschedule.
    Recommend moving the All-Hands to a different room or time slot.'
  step: 6
- action: Call create_task with title='Resolve Conference Room A double-booking on
    Nov 26', priority='high', and a description summarizing the three conflicting
    events and recommended action.
  step: 7
- action: Provide a written summary to the user listing all three conflicts, the key
    stakeholders involved (Priya Sharma - Product, Tom Nguyen - Sales), the rescheduling
    recommendation with rationale, and confirmation that a follow-up task has been
    created.
  step: 8
