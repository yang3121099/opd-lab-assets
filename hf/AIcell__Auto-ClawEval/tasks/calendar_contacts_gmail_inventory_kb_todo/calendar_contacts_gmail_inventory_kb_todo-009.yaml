  name: key_people_mentioned
  weight: 0.1
- check:
    rubric: "Evaluate the agent's conflict resolution summary on the following dimensions:\n\
      1. CONFLICT IDENTIFICATION (0-0.3): Did the agent correctly identify all three\
      \ overlapping events on Tuesday 2024-11-26 in Conference Room A?\n   - evt-001\
      \ (All-Hands, 2:00-3:30pm, 45 staff)\n   - evt-002 (Product Roadmap Review,\
      \ 2:00-4:00pm, 6 external stakeholders)\n   - evt-003 (Client Demo - Acme Corp,\
      \ 3:00-4:30pm, external client)\n   Score 0.3 if all three named, 0.2 if two\
      \ named, 0.1 if one named.\n\n2. RESCHEDULING RECOMMENDATION (0-0.3): Did the\
      \ agent provide a reasoned recommendation about which event to reschedule?\n\
      \   A strong answer should note that the Product Roadmap Review and Client Demo\
      \ involve external parties who are harder to reschedule, and suggest moving\
      \ the All-Hands (internal, 45 staff can adapt) or finding an alternate room.\
      \ Partial credit if recommendation is made but reasoning is thin.\n\n3. EMAIL\
      \ CONTEXT USED (0-2): Did the agent incorporate information from the inbox emails\
      \ — specifically Priya's note about out-of-town stakeholders (msg-005), Tom's\
      \ client demo overlap (msg-002), and the HR mandatory attendance reminder (msg-003)?\n\
      \   Score 0.2 if all three emails referenced, 0.1 if one or two referenced.\n\
      \n4. FOLLOW-UP TASK (0-0.2): Did the agent confirm creation of a follow-up task\
      \ to track the scheduling conflict resolution? Score 0.2 if confirmed with relevant\
      \ title/description, 0.1 if mentioned but vague.\nTotal score: sum of all dimensions\
      \ (max 1.0). Deduct 0.1 if the output is disorganized or missing a clear summary.\n"
    type: llm_judge
  name: conflict_analysis_quality
  weight: 0.35
