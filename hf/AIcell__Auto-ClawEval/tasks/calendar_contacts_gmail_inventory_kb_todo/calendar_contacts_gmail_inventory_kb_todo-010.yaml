- check:
    rubric: 'Evaluate the agent''s conflict analysis on three dimensions:

      1. ACCURACY (0–0.4): Does the agent correctly identify both conflicting events
      — evt-101 "Product Roadmap Review" (organizer: Patricia Nguyen, Product team)
      and evt-102 "Q1 Sales Kickoff" (organizer: Derek Walsh, Sales team) — both in
      Conference Room A on March 18, 2:00–4:00 PM? Does it correctly note that both
      events have external attendees (external.stakeholder@partnerco.com and Apex
      Corp clients)?

      2. POLICY APPLICATION (0–0.3): Does the agent reference the KB article kb-301
      "Conference Room Booking Policy" and correctly apply the rule that priority
      goes to meetings with external clients/stakeholders? Does it note that both
      meetings have external attendees, making this a genuine escalation scenario?

      3. RESOLUTION RECOMMENDATION (0–0.3): Does the agent provide a concrete, actionable
      recommendation — such as escalating to the Office Manager, contacting both Patricia
      Nguyen (555-0142) and Derek Walsh (555-0187), and suggesting one party move
      to an alternative room? Is the recommendation specific rather than vague?

      Score 1.0 if all three dimensions are fully addressed, 0.7 if two are strong,
      0.4 if only one is addressed, 0.0 if the analysis is missing or incorrect.

      '
    type: llm_judge
  name: conflict_analysis_quality
  weight: 0.25
- check:
    rubric: 'Does the agent''s output provide a complete, actionable summary that
      an office administrator could act on immediately? Specifically: - Are both event
      organizers named (Patricia Nguyen and Derek Walsh) with their roles (Product
      Manager, Sales Director)? - Is the specific conflict clearly stated (same room,
      same time, same date)? - Is there a recommended next step (e.g., contact both
      parties, escalate to Office Manager, find alternative room)? - Is the tone professional
      and the information organized clearly?

      Score 1.0 if all four elements are present, 0.75 if three, 0.5 if two, 0.25
      if one, 0.0 if none.

      '
    type: llm_judge
  name: resolution_completeness
  weight: 0.1
