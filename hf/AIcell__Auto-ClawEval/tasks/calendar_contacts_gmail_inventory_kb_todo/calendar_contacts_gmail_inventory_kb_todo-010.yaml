prompt: 'I received a complaint email about a conference room double-booking situation
  happening next week. Please read the complaint email, find the conflicting calendar
  events, look up the attendees involved, and give me a full summary of the conflict
  including who is affected, what the events are, and a recommended resolution. Also
  check if there''s a knowledge base article about our room booking policy that I
  should reference.

  '
reference_solution: '1. Call list_inbox to see recent emails and identify the complaint
  from Patricia Nguyen (msg-001) about a double-booking in Conference Room A on March
  18. 2. Call get_message with message_id=msg-001 to read the full complaint details,
  and optionally get_message with msg-002 to read Derek Walsh''s confirmation email.
  3. Call list_events for date=2025-03-18 to retrieve all events on that day. 4. Call
  get_event for evt-101 ("Product Roadmap Review") and evt-102 ("Q1 Sales Kickoff")
  to confirm both are in Conference Room A from 2:00–4:00 PM and identify all attendees.
  5. Call search_contacts to look up Patricia Nguyen and Derek Walsh, then get_contact
  for their full details including phone numbers. 6. Call search_articles with query="conference
  room booking policy" or category="facilities" to find the relevant KB article. 7.
  Call get_kb_article for kb-301 to read the full booking policy, noting the rule
  that external-client meetings take priority and disputes escalate to the Office
  Manager. 8. Synthesize a full written summary covering: the two conflicting events
  (evt-101 and evt-102), the organizers and their contact info, the fact that both
  have external attendees making priority determination complex, the applicable policy
  from kb-301, and a recommended resolution (escalate to Office Manager, notify both
  Patricia Nguyen and Derek Walsh, identify an alternative room for the lower-priority
  meeting).'
