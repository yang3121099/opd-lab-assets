  name: created_replacement_events
  weight: 0.15
- check:
    action: create_task
    service: todo
    type: audit_action_exists
  name: created_followup_task
  weight: 0.1
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: notified_coverage_person
  weight: 0.1
- check:
    keywords:
    - Sarah Chen
    - Marcus Reed
    - Sprint Planning
    - Architecture Review
    type: keywords_present
  name: key_facts_in_summary
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s handoff summary on three dimensions:

      1. COMPLETENESS (0-1): Did the agent identify all 5 of Sarah Chen''s events
      (evt-001 Sprint Planning, evt-002 Architecture Review: Payment Service, evt-003
      1:1 with Director, evt-004 Team Standup, evt-005 Vendor Demo: CI/CD Tooling)?
      Did it identify a suitable Engineering colleague (ideally Marcus Reed contact-002
      or Dana Kowalski contact-005) as coverage? Did it create replacement events
      and a follow-up task for Sarah''s return?

      2. ACCURACY (0-1): Are the coverage assignments logical (e.g., Marcus Reed is
      already an attendee on evt-002 and evt-005, making him a natural choice)? Did
      the agent correctly retrieve Sarah''s contact details (email: sarah.chen@company.com,
      phone: +1-555-0142, title: Team Lead Backend Engineering)?

      3. COMMUNICATION (0-1): Did the agent notify the coverage person via message
      or email? Is the summary clear and actionable for a manager to confirm the handoff?

      Score: 1.0 if all three dimensions are fully satisfied, 0.7 if two are fully
      satisfied, 0.4 if only one is fully satisfied, 0.1 if the summary is incomplete
      or inaccurate across all dimensions.

      '
    type: llm_judge
  name: handoff_summary_quality
  weight: 0.3
