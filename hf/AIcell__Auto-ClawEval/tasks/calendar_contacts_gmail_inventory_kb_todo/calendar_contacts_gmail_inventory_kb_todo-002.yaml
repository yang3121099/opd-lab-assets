    - Annual Technology Strategy Summit
    - conflict
    - '2024-12-10'
    type: keywords_present
  name: identified_conflict_on_december_10
  weight: 0.15
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: notified_conflicting_event_attendees
  weight: 0.15
- check:
    action: search_articles
    service: kb
    type: audit_action_exists
  name: kb_policy_consulted
  weight: 0.1
- check:
    action: create_task
    service: todo
    type: audit_action_exists
  name: followup_task_created
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s conflict resolution report on these dimensions:

      1. CONFLICT IDENTIFICATION (0-0.3): Did the agent correctly identify that evt-001
      (Q4 Board Presentation, 10:00-12:00) and evt-002 (Annual Technology Strategy
      Summit, 09:00-13:00) both occur on 2024-12-10 and overlap? Did it note that
      Sarah Chen appears in both events?

      2. STAKEHOLDER NOTIFICATION (0-0.3): Did the agent contact Marcus Riley (con-002)
      and/or Priya Nair (con-003), who are the non-Sarah attendees of the conflicting
      Technology Strategy Summit (evt-002)? Did the message clearly explain the conflict
      and reference the board presentation priority?

      3. KB POLICY REFERENCE (0-0.2): Did the agent find and reference the "Meeting
      Conflict Resolution Policy" (kb-001) or "Executive Calendar Management Guidelines"
      (kb-002)? Did it apply the policy guidance (board presentations take priority,
      48-hour notice requirement)?

      4. FOLLOW-UP TASK (0-0.2): Did the agent create a meaningful to-do task for
      rescheduling the Technology Strategy Summit, with appropriate priority and description?

      Score 1.0 if all four dimensions are fully addressed with specific event/contact
      names. Score 0.7 if three dimensions are well addressed. Score 0.4 if two dimensions
      are addressed. Score 0.1 if only one dimension is addressed or the output is
      vague.

      '
    type: llm_judge
  name: conflict_resolution_quality
  weight: 0.35
task_id: calendar_contacts_gmail_inventory_kb_todo-002
