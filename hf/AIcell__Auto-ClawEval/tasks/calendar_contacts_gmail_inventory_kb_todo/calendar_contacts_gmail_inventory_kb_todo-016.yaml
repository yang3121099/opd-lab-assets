prompt: 'A new employee, Marcus Webb, is joining the Engineering department next Monday.
  Please look up our onboarding policy articles to find the required onboarding sessions
  he must attend, then check which of those sessions are already scheduled on the
  calendar for next Monday (2025-02-03). For any required session that is missing
  from the calendar, create it as a new event from 9:00 AM to 10:00 AM on 2025-02-03
  with Marcus Webb (contact ID: contact-007) as an attendee. Finally, send Marcus
  an email summarizing the onboarding schedule and any sessions that were newly created
  for him.

  '
reference_solution:
- Search the knowledge base using search_articles with query 'onboarding Engineering'
  or category 'HR Policy' to find relevant articles.
- 'Retrieve article kb-101 (''New Employee Onboarding Policy — Engineering'') using
  get_kb_article to read the four required sessions: IT Setup & Security Briefing,
  Benefits & HR Orientation, Engineering Codebase Walkthrough, Company Culture & Values
  Overview.'
- Call list_events for date 2025-02-03 to retrieve all calendar events scheduled for
  that Monday.
- 'Compare the four required sessions against the calendar results: evt-001 covers
  IT Setup & Security Briefing and evt-004 covers Benefits & HR Orientation — both
  already exist. Engineering Codebase Walkthrough and Company Culture & Values Overview
  are missing.'
- Retrieve Marcus Webb's contact details using get_contact with contact_id 'contact-007'
  to obtain his email (marcus.webb@company.com).
- Create a new calendar event for 'Engineering Codebase Walkthrough' on 2025-02-03
  from 09:00 to 10:00 with marcus.webb@company.com as an attendee using create_event.
- Create a new calendar event for 'Company Culture & Values Overview' on 2025-02-03
  from 09:00 to 10:00 with marcus.webb@company.com as an attendee using create_event.
- Send an email to marcus.webb@company.com using send_email summarizing all four required
  onboarding sessions, noting which were pre-existing and which were newly scheduled
  for him.
