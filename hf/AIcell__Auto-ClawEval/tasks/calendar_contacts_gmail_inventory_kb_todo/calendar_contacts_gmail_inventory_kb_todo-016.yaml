- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. POLICY LOOKUP (0–0.33): Did the agent correctly identify all four required
      onboarding sessions from article kb-101 (IT Setup & Security Briefing, Benefits
      & HR Orientation, Engineering Codebase Walkthrough, Company Culture & Values
      Overview)?

      2. CALENDAR RECONCILIATION (0–0.33): Did the agent correctly determine that
      IT Setup & Security Briefing (evt-001) and Benefits & HR Orientation (evt-004)
      already exist on 2025-02-03, and that Engineering Codebase Walkthrough and Company
      Culture & Values Overview are MISSING and need to be created? Were both missing
      events created as new calendar events with Marcus Webb as an attendee?

      3. COMMUNICATION (0–0.34): Did the agent send Marcus Webb (marcus.webb@company.com)
      a clear, complete email summarizing all four required sessions, distinguishing
      which were pre-existing and which were newly created for him?

      Score 1.0 if all three dimensions are fully satisfied, 0.67 if two are fully
      satisfied, 0.33 if only one is fully satisfied, 0.0 if none are adequately addressed.

      '
    type: llm_judge
  name: quality_and_completeness
  weight: 0.25
