  method: POST
  name: search_articles
  service: kb
- description: Retrieve the full content of a knowledge base article by its ID.
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: List calendar events for a given date and number of days.
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Get details of a specific calendar event by event ID.
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: Create a new calendar event with title, start/end time, attendees,
    and location.
  endpoint: /calendar/events/create
  method: POST
  name: create_event
  service: calendar
- description: Retrieve contact details by contact ID.
