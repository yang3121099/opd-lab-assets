prompt: 'We''re planning a product launch event for our new flagship item. Check the
  details of product "PRD-004" from inventory, then look up the calendar to see what''s
  already scheduled for next week (starting 2025-02-10), and find the contact for
  our events coordinator "Sarah Chen" to get her email. Finally, schedule a 2-hour
  product launch event on 2025-02-12 at 10:00 AM in the "Main Conference Hall" with
  Sarah Chen and the product manager "David Park" as attendees, and create a follow-up
  task to prepare the product demo materials. Summarize everything you''ve done including
  the product details and the new event information.

  '
reference_solution: '1. Call GET /inventory/products/get with product_id "PRD-004"
  to retrieve SmartDesk Hub Pro details (price $349.99, supplier WorkSpace Innovations,
  quantity 34). 2. Call POST /calendar/events with date "2025-02-10" and days 7 to
  list all events for the week and identify any conflicts on 2025-02-12. 3. Call POST
  /contacts/search with query "Sarah Chen" to find her contact record (CON-001, sarah.chen@company.com).
  4. Call POST /contacts/search with query "David Park" to find his contact record
  (CON-002, david.park@company.com). 5. Call POST /calendar/events/create with title
  "SmartDesk Hub Pro Product Launch", start_time "2025-02-12T10:00:00", end_time "2025-02-12T12:00:00",
  attendees ["sarah.chen@company.com", "david.park@company.com"], location "Main Conference
  Hall". 6. Call POST /todo/tasks/create with title "Prepare product demo materials
  for SmartDesk Hub Pro launch", priority "high", and due_date "2025-02-11". 7. Summarize
  all actions taken: product details retrieved, existing calendar reviewed, contacts
  found, launch event created, and follow-up task created.'
