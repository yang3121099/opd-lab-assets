- check:
    rubric: 'Evaluate the agent''s final summary on the following dimensions:

      1. PRODUCT DETAILS (0-0.25): Does the output correctly report the SmartDesk
      Hub Pro (PRD-004) details — price $349.99, supplier WorkSpace Innovations, category
      workspace, quantity 34?

      2. CALENDAR AWARENESS (0-0.25): Does the output mention existing events found
      for the week of 2025-02-10, such as "Weekly Team Standup" or "Engineering Sprint
      Planning", showing the agent checked the schedule before booking?

      3. EVENT CREATION (0-0.25): Does the output confirm a product launch event was
      created on 2025-02-12 at 10:00 AM in "Main Conference Hall" with both Sarah
      Chen (sarah.chen@company.com) and David Park (david.park@company.com) as attendees?

      4. TASK CREATION (0-0.25): Does the output confirm a follow-up task was created
      related to preparing product demo materials, with a reasonable due date and
      priority?

      Score 1.0 if all four dimensions are fully addressed, 0.75 if three are addressed,
      0.5 if two, 0.25 if one, 0.0 if none.

      '
    type: llm_judge
  name: summary_quality
  weight: 0.2
