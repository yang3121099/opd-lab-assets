- check:
    rubric: "Evaluate the agent's output on the following dimensions:\n1. CONFLICT\
      \ IDENTIFICATION (0-1): Did the agent correctly identify BOTH overlapping event\
      \ pairs?\n   - Conflict 1 (June 11, 10:00-11:30 vs 10:30-12:00): evt-001 \"\
      Q3 Budget Review\" and evt-002 \"Product Roadmap Sync\" overlap for David Chen\
      \ (contact-101) and Priya Nair (contact-102).\n   - Conflict 2 (June 12, 09:00-09:30\
      \ vs 09:15-10:15): evt-003 \"Engineering Stand-up\" and evt-004 \"Investor Briefing\
      \ Prep\" overlap for Priya Nair (contact-102).\n   Score 1.0 if both conflicts\
      \ identified, 0.5 if only one, 0.0 if neither.\n\n2. DRAFT COVERAGE (0-1): Were\
      \ draft emails prepared for all affected attendees?\n   - David Chen (david.chen@company.com)\
      \ — affected by Conflict 1\n   - Priya Nair (priya.nair@company.com) — affected\
      \ by both Conflict 1 and Conflict 2\n   Score 1.0 if drafts for both David and\
      \ Priya, 0.5 if only one, 0.0 if none.\n\n3. DRAFT CONTENT QUALITY (0-1): Do\
      \ the drafts include an apology for the scheduling conflict, name the specific\
      \ conflicting meetings (e.g., \"Q3 Budget Review\" and \"Product Roadmap Sync\"\
      ), and ask the recipient to confirm which meeting they can attend? Score 1.0\
      \ if all three elements present, 0.5 if two, 0.0 if one or none.\n4. KB INTEGRATION\
      \ (0-1): Did the agent reference or incorporate guidance from the knowledge\
      \ base (e.g., kb-301 \"Meeting Scheduling Best Practices\" or kb-302 \"Email\
      \ Communication Standards\") in the drafts or summary? Score 1.0 if referenced\
      \ meaningfully, 0.5 if mentioned but not applied, 0.0 if ignored.\n5. CLARITY\
      \ AND PROFESSIONALISM (0-1): Are the draft emails professional, concise, and\
      \ actionable with a clear call to action (e.g., requesting a response within\
      \ 24 hours)?\nFinal score = average of all five dimensions.\n"
    type: llm_judge
  name: draft_quality_and_completeness
  weight: 0.35
