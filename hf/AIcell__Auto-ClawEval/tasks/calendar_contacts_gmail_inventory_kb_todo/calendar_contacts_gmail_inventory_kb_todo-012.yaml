prompt: 'Our team has a recurring problem with double-booked meetings. Please check
  the calendar for the next 7 days starting 2024-06-10, identify any attendees who
  appear in overlapping events, look up their contact details, and prepare draft emails
  to each affected attendee apologizing for the scheduling conflict and asking them
  to confirm which meeting they can attend. Also check if there are any knowledge
  base articles about scheduling best practices that you can reference in the drafts.

  '
reference_solution: "1. Call list_events with date=2024-06-10 and days=7 to retrieve\
  \ all events in the window. 2. Analyze the returned events to find overlapping time\
  \ slots:\n   - evt-001 (June 11, 10:00-11:30) and evt-002 (June 11, 10:30-12:00)\
  \ overlap; shared attendees are david.chen@company.com and priya.nair@company.com.\n\
  \   - evt-003 (June 12, 09:00-09:30) and evt-004 (June 12, 09:15-10:15) overlap;\
  \ shared attendee is priya.nair@company.com.\n3. Call search_contacts (or get_contact)\
  \ to retrieve full contact details for David Chen (contact-101) and Priya Nair (contact-102).\
  \ 4. Call search_articles with query=\"scheduling best practices\" to find kb-301\
  \ and kb-302; call get_kb_article to read their content. 5. Call create_draft for\
  \ David Chen (david.chen@company.com) with a subject like \"Scheduling Conflict\
  \ on June 11 — Action Required\", apologizing for the overlap between \"Q3 Budget\
  \ Review\" and \"Product Roadmap Sync\" and asking him to confirm attendance. 6.\
  \ Call create_draft for Priya Nair (priya.nair@company.com) covering both conflicts\
  \ (June 11 and June 12), referencing the relevant meetings and requesting confirmation.\
  \ 7. Incorporate KB guidance (e.g., offer alternative slots, request response within\
  \ 24 hours) into the draft content. 8. Summarize the conflicts found, the contacts\
  \ affected, and the drafts prepared in the final text output."
