- check:
    rubric: 'Evaluate the agent''s final summary on three dimensions:

      1. PRODUCT IDENTIFICATION (0–0.33): Did the agent correctly identify Electronics
      products from inventory? The fixture contains 4 Electronics items: UltraSound
      Wireless Headphones (prod-001), SmartDesk Charging Pad (prod-002), ErgoFlex
      Laptop Stand (prod-003), and Portable LED Desk Lamp (prod-004). Score 0.33 if
      at least 3 are mentioned, 0.17 if 1–2 are mentioned, 0.0 if none.

      2. SCHEDULING AWARENESS (0–0.33): Did the agent note the existing calendar events
      (especially evt-003 "Product Roadmap Sync" on 2025-02-14 09:00–09:45 which is
      close to the launch event time of 10:00–11:30) and confirm the launch event
      was created on 2025-02-14 at 10:00–11:30? Score 0.33 if both the conflict check
      and event creation are clearly described, 0.17 if only one is addressed, 0.0
      if neither.

      3. STAKEHOLDER COORDINATION (0–0.34): Did the agent correctly identify Marketing
      department contacts (Rachel Torres, James Whitfield, Priya Nair) and confirm
      a confirmation email was sent to at least one of them (most likely Rachel Torres
      at rachel.torres@company.com as the first result)? Score 0.34 if all three contacts
      are named and email confirmation is described, 0.17 if contacts are partially
      identified or email is missing, 0.0 if neither.

      Final score = sum of three dimension scores (max 1.0).

      '
    type: llm_judge
  name: summary_quality
  weight: 0.25
