prompt: 'We''re planning a product launch event for our new inventory items and need
  everything coordinated. First, check what products we currently have in the Electronics
  category to identify launch candidates. Then look at the calendar for the next 7
  days starting from 2025-02-10 to find any scheduling conflicts. Finally, search
  our contacts for the "Marketing" department to find the right people to invite,
  create a launch event on 2025-02-14 from 10:00 to 11:30 with the marketing team
  as attendees, and send a confirmation email to the first marketing contact you find.
  Summarize everything you''ve done and who was invited.

  '
reference_solution:
- 'Call POST /inventory/products with category=''Electronics'' to retrieve the 4 Electronics
  products: UltraSound Wireless Headphones, SmartDesk Charging Pad, ErgoFlex Laptop
  Stand, Portable LED Desk Lamp.'
- Call POST /calendar/events with date='2025-02-10' and days=7 to list existing events
  and identify any conflicts on or near 2025-02-14 (note evt-003 Product Roadmap Sync
  ends at 09:45 on 2025-02-14, leaving 10:00 free).
- Call POST /contacts/search with department='Marketing' to retrieve Rachel Torres
  (con-001), James Whitfield (con-002), and Priya Nair (con-003).
- Call POST /calendar/events/create with title='Electronics Product Launch', start_time='2025-02-14T10:00:00',
  end_time='2025-02-14T11:30:00', attendees=['rachel.torres@company.com','james.whitfield@company.com','priya.nair@company.com'],
  location='Conference Room A' (or similar).
- Call POST /gmail/send to rachel.torres@company.com (first marketing contact) with
  a confirmation email about the launch event details.
- 'Summarize: list the 4 Electronics products identified, note the existing calendar
  events checked, confirm the launch event was created on 2025-02-14 10:00–11:30,
  list the 3 marketing attendees, and confirm the confirmation email was sent to Rachel
  Torres.'
