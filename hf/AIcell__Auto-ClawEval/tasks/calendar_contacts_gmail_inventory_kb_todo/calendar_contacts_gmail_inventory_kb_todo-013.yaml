  name: list_products
  service: inventory
- description: List calendar events starting from a date for a given number of days
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Create a new calendar event with title, start/end time, attendees,
    and location
  endpoint: /calendar/events/create
  method: POST
  name: create_event
  service: calendar
- description: Search contacts by name or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Get full details of a contact by contact_id
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send an email to a recipient with subject and body
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Get details of a specific calendar event by event_id
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
