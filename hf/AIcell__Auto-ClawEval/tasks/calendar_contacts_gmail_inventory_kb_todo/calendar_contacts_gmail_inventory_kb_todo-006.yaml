prompt: 'Our product team is planning a cross-functional alignment meeting for next
  week. I need you to find all contacts in the Product department, check their calendar
  availability on 2025-02-10, and then create a 1-hour team sync meeting on 2025-02-10
  from 10:00 to 11:00 AM that includes all of them as attendees. Also check if there
  are any existing calendar events that day that might conflict, and summarize your
  findings and what you scheduled.

  '
reference_solution: "1. Call POST /contacts/search with department=\"Product\" to\
  \ find all Product team members.\n   Result: Priya Nair (contact-101), Marcus Webb\
  \ (contact-102), Lena Hoffmann (contact-103), James Thornton (contact-106).\n\n\
  2. Call POST /calendar/events with date=\"2025-02-10\" and days=1 to list all existing\
  \ events on that day.\n   Identify: Engineering Standup (09:00-09:30), Marketing\
  \ Strategy Review (11:00-12:00),\n   Product Roadmap Retrospective (14:00-15:00,\
  \ involves Priya and Marcus),\n   All Hands Meeting (16:00-17:00, company-wide).\n\
  \   Confirm 10:00-11:00 AM is free.\n\n3. Optionally call POST /calendar/user_events\
  \ for individual Product team members to verify their personal availability at 10:00\
  \ AM.\n4. Call POST /calendar/events/create with:\n   title=\"Product Team Sync\"\
  , start_time=\"2025-02-10T10:00:00\", end_time=\"2025-02-10T11:00:00\",\n   attendees=[\"\
  priya.nair@company.com\", \"marcus.webb@company.com\", \"lena.hoffmann@company.com\"\
  , \"james.thornton@company.com\"],\n   location=\"Conference Room A\" (or similar).\n\
  \n5. Summarize: Found 4 Product department contacts, confirmed 10:00-11:00 AM is\
  \ conflict-free,\n   noted later conflicts (Roadmap Retrospective at 14:00, All\
  \ Hands at 16:00),\n   and successfully created the team sync meeting with all four\
  \ attendees."
