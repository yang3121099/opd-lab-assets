- check:
    rubric: 'Evaluate the agent''s response on the following dimensions:

      1. CONTACT DISCOVERY (0-0.3): Did the agent correctly identify all four Product
      department contacts — Priya Nair (contact-101), Marcus Webb (contact-102), Lena
      Hoffmann (contact-103), and James Thornton (contact-106)? Did it correctly exclude
      Derek Osei (Engineering) and Sofia Reyes (Marketing)?

      2. CONFLICT ANALYSIS (0-0.3): Did the agent identify existing events on 2025-02-10
      that are relevant? Specifically, did it note the "Product Roadmap Retrospective"
      (event-503, 14:00-15:00) involving Priya Nair and Marcus Webb, and the "All
      Hands Meeting" (event-504, 16:00-17:00)? Did it confirm the 10:00-11:00 AM slot
      is free of conflicts?

      3. EVENT CREATION (0-2): Did the agent create a meeting on 2025-02-10 from 10:00
      to 11:00 AM that includes all four Product department members as attendees?

      4. SUMMARY QUALITY (0-0.1): Is the final summary clear, organized, and actionable
      — covering who was invited, what conflicts exist later in the day, and confirmation
      of the scheduled meeting?

      Scoring: - 1.0: All four dimensions fully satisfied, all correct contacts included,
      conflicts noted, event created correctly - 0.75: Three dimensions satisfied,
      minor omission (e.g., one contact missing or one conflict not mentioned) - 0.5:
      Two dimensions satisfied, event created but with incomplete attendee list or
      no conflict analysis - 0.25: Only contact search or calendar check done, no
      event created - 0.0: Agent failed to search contacts or create any event

      '
    type: llm_judge
  name: meeting_quality_and_completeness
  weight: 0.3
