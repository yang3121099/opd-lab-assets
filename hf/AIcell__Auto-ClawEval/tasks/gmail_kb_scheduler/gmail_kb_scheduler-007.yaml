category: ops
claw_eval_id: T41zh_scheduled_task_management
difficulty: medium
fixtures:
  gmail:
    inbox:
    - body: 'Hi team, Thornfield & Co. (account #TH-8821) has escalated to VP level.
        Their primary complaint is SLA breach on ticket #55902 — response time exceeded
