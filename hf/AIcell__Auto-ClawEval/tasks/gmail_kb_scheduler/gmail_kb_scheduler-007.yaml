      from: sarah.kim@acme.com
      id: msg-101
      priority: high
      read: false
      subject: 'ESCALATION: Enterprise client Thornfield & Co. threatening churn'
      to: support-team@company.com
    - body: 'Adding context: the SLA breach was caused by a misconfigured routing
