fixtures:
  gmail:
    inbox:
    - body: 'Hi Support Team,

        We are experiencing a critical production outage since 09:15 AM EST today.
        Our data sync pipeline has completely failed, affecting over 200 active users
        across our finance and operations departments. Transactions are not being
        recorded and reports are generating incorrect figures.

        We have already restarted the service twice with no resolution. This is a
        Severity 1 issue per our SLA and requires immediate escalation to your engineering
        team.

        Please confirm receipt and provide an ETA for resolution within the next 30
        minutes per our contract terms.

        Regards, Marcus Holt VP of Operations, Veridian Systems Contract ID: VRD-2024-0892

        '
      date: '2024-11-14T09:47:00Z'
      from: marcus.holt@veridiansystems.com
      id: msg-001
      priority: high
      read: false
      subject: 'URGENT: Production Outage - Data Sync Failure Affecting 200+ Users'
      to: support@ourcompany.com
    - body: 'Hi, could you clarify the line items on invoice #INV-4421? Some charges
