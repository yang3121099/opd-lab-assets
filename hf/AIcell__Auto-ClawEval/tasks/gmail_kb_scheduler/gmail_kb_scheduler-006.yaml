        '
      id: kb-article-vpn-002
      last_updated: '2024-03-15'
      title: VPN Configuration Guide
    - author: hr-team@company.com
      category: hr
      content: 'Welcome to the company! Complete the following steps during your first
        week: 1. Set up your workstation. 2. Complete compliance training. 3. Meet
        your team lead.

        '
