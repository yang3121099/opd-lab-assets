category: ops
claw_eval_id: T41zh_scheduled_task_management
difficulty: medium
fixtures:
  gmail:
    inbox:
    - body: 'Hi, could you please review KB article kb-article-vpn-002 on VPN configuration?
        I think it may be outdated — it still references our old Cisco AnyConnect
