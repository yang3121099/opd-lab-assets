      from: priya.sharma@company.com
      id: msg-001
      priority: high
      read: false
      subject: 'Action Required: VPN Article Review'
      to: agent@company.com
    - body: 'Here is your weekly IT digest. No critical issues this week.

        '
      date: '2024-11-11T08:00:00Z'
      from: it-helpdesk@company.com
      id: msg-002
      priority: low
      read: true
      subject: Weekly IT Digest
      to: agent@company.com
    - body: 'Hey, do you know where I can find the onboarding checklist for new hires?

        '
      date: '2024-11-10T14:30:00Z'
      from: carlos.mendez@company.com
      id: msg-003
      priority: normal
      read: false
      subject: Onboarding checklist question
      to: agent@company.com
