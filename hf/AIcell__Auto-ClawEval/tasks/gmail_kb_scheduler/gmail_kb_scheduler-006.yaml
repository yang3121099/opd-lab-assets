      title: Password Policy
  scheduler:
    jobs:
    - action: send_kb_review_digest
      cron_expression: 0 9 * * 1
      enabled: false
      id: job-kb-review-01
      last_run: '2024-10-28T09:00:00Z'
      name: Weekly KB Article Review
