- check:
    keywords:
    - Meridian Supplies
    - portal access
    - code of conduct
    - 7 business days
    type: keywords_present
  name: onboarding_steps_mentioned
  weight: 0.15
- check:
    rubric: "Evaluate the agent's welcome email sent to Meridian Supplies (james.okafor@meridiansupplies.com).\
      \ Score on the following dimensions:\n1. ACCURACY (0–0.4): Does the email accurately\
      \ reflect the onboarding steps from kb-101?\n   Specifically: receipt confirmation\
      \ within 2 business days, credit/compliance check 3-5 days,\n   portal access\
      \ within 7 business days, PO only after portal access, code of conduct training\
      \ within 30 days.\n   Full credit if all 5 steps are present; partial if 3-4;\
      \ low if fewer than 3.\n\n2. SCHEDULER CONTEXT (0–0.3): Does the agent mention\
      \ the automated reminder job (job-301,\n   \"Vendor Onboarding Reminder — Day\
      \ 5\") or reference the weekly Monday reminder cadence\n   to set timeline expectations\
      \ for the vendor? Full credit if referenced; partial if vaguely mentioned.\n\
      \n3. PROFESSIONALISM & TONE (0–0.3): Is the email professional, welcoming, and\
      \ clearly structured\n   for a vendor audience? Does it address James Okafor\
      \ by name and include a call to action\n   (e.g., contact procurement@acmecorp.com)?\n\
      \   Full credit for polished, personalized email; partial for adequate but generic;\
      \ zero for poor quality.\n\nFinal score: weighted average of the three dimensions.\n"
    type: llm_judge
  name: email_quality_and_completeness
  weight: 0.35
task_id: gmail_kb_scheduler-015
task_name: Vendor Onboarding Confirmation with Policy Summary
