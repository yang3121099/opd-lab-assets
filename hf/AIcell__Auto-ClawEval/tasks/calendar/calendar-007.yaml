  name: used_user_or_list_events
  weight: 0.1
- check:
    keywords:
    - Q4 Board Strategy Session
    - Vendor Contract Review
    - Apex Logistics
    type: keywords_present
  name: conflict_events_identified
  weight: 0.15
- check:
    keywords:
    - '10:30'
    - '11:30'
    type: keywords_present
  name: conflict_times_mentioned
  weight: 0.1
- check:
    keywords:
    - Boardroom A
    - Conference Room 3B
    type: keywords_present
  name: locations_mentioned
  weight: 0.1
- check:
    rubric: "Evaluate the agent's conflict investigation report for Sandra Reyes on\
      \ 2024-11-18. Score on the following dimensions:\n1. CONFLICT IDENTIFICATION\
      \ (0–0.4): Does the agent correctly identify that evt-101\n   \"Q4 Board Strategy\
      \ Session\" (09:00–11:30, Boardroom A, 12th Floor) and evt-102\n   \"Vendor\
      \ Contract Review — Apex Logistics\" (10:30–12:00, Conference Room 3B, 4th Floor)\n\
      \   overlap between 10:30 and 11:30, and that both require physical presence\
      \ at different\n   locations on the same floor? Full credit if both events are\
      \ named and the overlap window\n   is stated; partial credit if only one event\
      \ is named.\n\n2. DETAIL COMPLETENESS (0–0.3): Does the agent report the key\
      \ details retrieved via\n   get_event — including event titles, start/end times,\
      \ physical locations, and attendees\n   (e.g., james.whitfield@company.com for\
      \ evt-101, legal@company.com and\n   apex.contact@apexlogistics.com for evt-102)?\
      \ Full credit if all four detail types\n   are present for both conflicting\
      \ events.\n\n3. FULL DAY CONTEXT (0–0.2): Does the agent mention Sandra's other\
      \ events on that day\n   (Weekly Operations Standup at 08:00, Lunch with Marcus\
      \ Chen at 12:30, HR Policy Review\n   at 15:00) to give a complete picture of\
      \ her schedule?\n\n4. ACTIONABILITY (0–0.1): Does the agent provide a clear\
      \ conclusion or recommendation\n   (e.g., Sandra cannot attend both conflicting\
      \ events and one needs to be rescheduled)?\n\nScoring: 0.9–1.0 = all four dimensions\
      \ well-covered; 0.7–0.89 = conflict identified with good detail but minor gaps;\
      \ 0.5–0.69 = conflict identified but missing significant details; below 0.5\
      \ = conflict missed or major errors.\n"
    type: llm_judge
  name: conflict_analysis_quality
  weight: 0.35
task_id: calendar-007
task_name: Board Meeting Conflict Investigation
tools:
- description: List all calendar events for a given date range
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Retrieve full details of a specific calendar event by its ID
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: Get all events for a specific user on a given date
  endpoint: /calendar/user_events
  method: POST
  name: user_events
  service: calendar
- description: Create a new calendar event
  endpoint: /calendar/events/create
  method: POST
  name: create_event
  service: calendar
- description: Delete a calendar event by its ID
  endpoint: /calendar/events/delete
  method: POST
  name: delete_event
  service: calendar
