    - overlap
    - conflict
    - 09:30
    - Sprint Planning
    type: keywords_present
  name: overlap_conflict_flagged
  weight: 0.15
- check:
    rubric: "Evaluate the agent's summary of Sarah Chen's and David Park's schedules\
      \ on 2024-03-18 and the conflict analysis.\nScoring dimensions:\n1. ACCURACY\
      \ OF SARAH CHEN'S SCHEDULE (0–0.25):\n   Sarah has: New Hire Orientation (09:00–10:30),\
      \ Team Standup (09:30–09:45), Buddy Check-in (11:00–11:30),\n   Lunch & Learn\
      \ (12:00–13:00), Sprint Planning (15:00–16:30).\n   Score 0.25 if all 5 events\
      \ are mentioned, 0.15 if 3–4, 0.05 if 1–2, 0.0 if none.\n\n2. ACCURACY OF DAVID\
      \ PARK'S SCHEDULE (0–0.25):\n   David has: Team Standup (09:30–09:45), Q1 Engineering\
      \ Roadmap Review (10:00–11:30),\n   Lunch & Learn (12:00–13:00), 1:1 Manager\
      \ Meeting with Marcus (14:00–14:30), Sprint Planning (15:00–16:30).\n   Score\
      \ 0.25 if all 5 events are mentioned, 0.15 if 3–4, 0.05 if 1–2, 0.0 if none.\n\
      \n3. CONFLICT / OVERLAP IDENTIFICATION (0–0.30):\n   Key overlaps to flag:\n\
      \   - Sarah's New Hire Orientation (09:00–10:30) overlaps with Team Standup\
      \ (09:30–09:45) — both Sarah and David share the standup.\n   - David's Q1 Roadmap\
      \ Review (10:00–11:30) overlaps with Sarah's Buddy Check-in (11:00–11:30), meaning\
      \ David is unavailable during that window.\n   - Both share Sprint Planning\
      \ (15:00–16:30) which may limit availability for Marcus late in the day.\n \
      \  Score 0.30 if at least 2 overlaps are clearly identified with times, 0.15\
      \ if 1 overlap identified, 0.0 if no overlaps flagged.\n\n4. ACTIONABILITY /\
      \ RECOMMENDATIONS (0–0.20):\n   Does the agent provide useful context for the\
      \ onboarding coordinator, such as suggesting the best windows\n   for Marcus\
      \ to reach Sarah or David, or noting that the 11:00–11:30 window is tight for\
      \ both?\n   Score 0.20 if concrete recommendations are given, 0.10 if partial,\
      \ 0.0 if none.\n\nTotal score = sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: summary_quality_and_completeness
  weight: 0.3
task_id: calendar-010
task_name: Identify scheduling conflicts for onboarding week
tools:
- description: Get all calendar events for a specific user on a given date
  endpoint: /calendar/user_events
  method: POST
  name: user_events
  service: calendar
- description: Get full details of a specific calendar event by its ID
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: List all calendar events for a date range
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
