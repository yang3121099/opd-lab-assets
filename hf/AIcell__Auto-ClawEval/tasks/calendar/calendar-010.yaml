prompt: 'Our new hire Marcus Webb starts on Monday, 2024-03-18. His onboarding buddy
  is Sarah Chen and his manager is David Park. Please check what events Sarah Chen
  and David Park each have scheduled on 2024-03-18 so we can identify any conflicts
  or back-to-back commitments that might affect their availability to support Marcus
  during his first day. Summarize what each person has scheduled and flag any overlapping
  time blocks between them.

  '
reference_solution:
- Call user_events with user='sarah.chen@company.com' and date='2024-03-18' to retrieve
  Sarah Chen's schedule.
- Call user_events with user='david.park@company.com' and date='2024-03-18' to retrieve
  David Park's schedule.
- 'Review Sarah''s events: New Hire Orientation (09:00–10:30), Team Standup (09:30–09:45),
  Buddy Check-in (11:00–11:30), Lunch & Learn (12:00–13:00), Sprint Planning (15:00–16:30).'
- 'Review David''s events: Team Standup (09:30–09:45), Q1 Engineering Roadmap Review
  (10:00–11:30), Lunch & Learn (12:00–13:00), 1:1 Manager Meeting (14:00–14:30), Sprint
  Planning (15:00–16:30).'
- 'Identify overlapping time blocks: the 09:30–09:45 standup is shared; David''s Roadmap
  Review (10:00–11:30) overlaps with Sarah''s Buddy Check-in (11:00–11:30); both are
  in Sprint Planning (15:00–16:30).'
- Summarize findings for the onboarding coordinator, noting that the 11:00–11:30 slot
  is particularly constrained and recommending the 13:00–14:00 window as the best
  open time for both to support Marcus.
