prompt: 'Our facilities team needs a utilization summary for the week of 2024-03-11
  (Monday through Friday, 5 days). Please list all scheduled events during that week
  and produce a report showing which conference rooms are booked, how many events
  each room hosts, and which day has the highest number of meetings. Identify any
  rooms that appear overloaded (more than 2 events in the week) and flag them.

  '
reference_solution:
- Call list_events with date='2024-03-11' and days=5 to retrieve all events for the
  week.
- 'Review the returned 8 events and group them by location: Boardroom A (evt-001,
  evt-002, evt-004, evt-007 = 4 events), Room 204 (evt-003, evt-005, evt-008 = 3 events),
  Boardroom B (evt-006 = 1 event).'
- 'Count events per day: Monday 2024-03-11 has 2 events, Tuesday 2024-03-12 has 2
  events, Wednesday 2024-03-13 has 1 event, Thursday 2024-03-14 has 1 event, Friday
  2024-03-15 has 2 events.'
- Identify Monday, Tuesday, and Friday as tied for busiest day with 2 events each;
  note Friday has the largest single event (All-Hands Town Hall with 6 attendees).
- Flag Boardroom A as overloaded with 4 events, exceeding the threshold of 2 per week.
- Present a structured report listing room utilization counts, the busiest day analysis,
  and the overloaded room flag for the facilities team.
