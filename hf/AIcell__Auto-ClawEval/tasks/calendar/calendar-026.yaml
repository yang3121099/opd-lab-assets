  name: busiest_day_identified
  weight: 0.1
- check:
    rubric: "Evaluate the agent's conference room utilization report for the week\
      \ of 2024-03-11 to 2024-03-15. Score on the following dimensions:\n1. ACCURACY\
      \ (0–0.4): Does the report correctly count events per room?\n   - Boardroom\
      \ A: 4 events (evt-001, evt-002, evt-004, evt-007)\n   - Room 204: 3 events\
      \ (evt-003, evt-005, evt-008)\n   - Boardroom B: 1 event (evt-006)\n   Award\
      \ 0.4 if all three counts are correct, 0.2 if two are correct, 0.0 if fewer\
      \ than two.\n\n2. OVERLOAD FLAG (0–0.3): Does the agent correctly flag Boardroom\
      \ A as overloaded\n   (4 events, exceeding the threshold of 2)? Award 0.3 if\
      \ Boardroom A is explicitly\n   flagged as overloaded, 0.15 if mentioned as\
      \ busiest but not explicitly flagged, 0.0 otherwise.\n\n3. BUSIEST DAY (0–0.2):\
      \ Does the agent correctly identify Monday March 11 OR Friday March 15\n   as\
      \ tied candidates for busiest day (both have 2 events), or correctly identify\
      \ that\n   Friday March 15 has the most attendees? Award 0.2 if the agent identifies\
      \ either\n   March 11 or March 15 with a reasonable justification, 0.1 if a\
      \ day is named without\n   clear reasoning, 0.0 if wrong or missing.\n\n4. CLARITY\
      \ (0–0.1): Is the report well-structured, easy to read, and actionable for\n\
      \   a facilities team? Award 0.1 for a clearly organized report with headers\
      \ or lists,\n   0.05 for adequate but unstructured prose, 0.0 for confusing\
      \ output.\n\nFinal score = sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: report_quality
  weight: 0.4
task_id: calendar-026
