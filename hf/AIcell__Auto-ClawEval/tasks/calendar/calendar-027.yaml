  events:
  - attendees:
    - sarah.chen@company.com
    - james.whitfield@company.com
    - priya.nair@company.com
    - david.okafor@company.com
    end_time: '2024-03-15T10:30:00'
    id: evt-001
    location: Boardroom A, HQ
