  weight: 0.15
- check:
    action: create_event
    field: title
    service: calendar
    type: audit_field_equals
    value: Project Helios Q3 Launch Kickoff
  name: correct_event_title
  weight: 0.1
- check:
    action: create_event
    field: location
    service: calendar
    type: audit_field_equals
    value: Executive Boardroom (Room 4B)
  name: correct_location
  weight: 0.1
- check:
    keywords:
    - Project Helios
    - Room 4B
    - '2024-07-15'
    - sarah.chen
    - marcus.webb
    - priya.nair
    type: keywords_present
  name: output_mentions_key_details
  weight: 0.15
- check:
    rubric: "Evaluate the agent's scheduling analysis and event creation for the Project\
      \ Helios Q3 Launch Kickoff meeting. Score on these dimensions:\n1. Availability\
      \ Analysis (0.0–0.4): Did the agent correctly check the calendars of all three\
      \ stakeholders\n   (Sarah Chen, Marcus Webb, Priya Nair) for 2024-07-15 and\
      \ identify a 90-minute window where all are free?\n   The correct open slot\
      \ is 12:00–13:30 (after Priya's 11:00–12:00 Marketing Sync ends and before Sarah's\n\
      \   13:00 Design Review). Score 0.4 if the agent correctly identifies this window,\
      \ 0.2 if partially correct,\n   0.0 if wrong or skipped.\n\n2. Event Creation\
      \ Accuracy (0.0–0.3): Did the agent create the event with the correct title\n\
      \   \"Project Helios Q3 Launch Kickoff\", location \"Executive Boardroom (Room\
      \ 4B)\", all three stakeholders\n   as attendees, and a 90-minute duration on\
      \ 2024-07-15? Score 0.3 if all fields correct, 0.15 if most\n   correct, 0.0\
      \ if missing critical fields.\n\n3. Confirmation and Clarity (0.0–0.3): Did\
      \ the agent clearly confirm the created event details in its\n   response, including\
      \ the chosen time slot and reasoning for why that slot works for all attendees?\n\
      \   Score 0.3 for clear, complete confirmation with reasoning, 0.15 for partial,\
      \ 0.0 if absent.\n\nFinal score = sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: quality_of_scheduling_analysis
  weight: 0.35
task_id: calendar-018
task_name: Schedule Cross-Timezone Product Launch Kickoff Meeting
tools:
- description: List all calendar events for a given date range
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Get details of a specific calendar event by ID
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: Create a new calendar event with title, start/end time, attendees,
    and location
  endpoint: /calendar/events/create
  method: POST
  name: create_event
  service: calendar
- description: Delete a calendar event by ID
  endpoint: /calendar/events/delete
  method: POST
  name: delete_event
  service: calendar
- description: Get all events for a specific user on a given date
  endpoint: /calendar/user_events
  method: POST
  name: user_events
  service: calendar
