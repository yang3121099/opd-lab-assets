    type: keywords_present
  name: conflict_days_identified
  weight: 0.15
- check:
    rubric: "Evaluate the agent's response on three dimensions:\n1. ACCURACY (0–0.4):\
      \ Does the agent correctly identify each person's commitments?\n   - Alex Rivera:\
      \ busy June 9 (Q2 Strategy Review, evt-001), June 10 (Sprint Planning, evt-002),\
      \ June 11 (HR Policy Workshop, evt-004), June 12 (Investor Call Prep, evt-006);\
      \ free June 13.\n   - Jordan Kim: busy June 10 (Sprint Planning, evt-002), June\
      \ 11 (HR Policy Workshop, evt-004), June 12 (Product Roadmap Sync, evt-005),\
      \ June 13 (Design Review, evt-007); free June 9.\n   - Priya Nair: busy June\
      \ 9 (Q2 Strategy Review, evt-001), June 10 (Client Demo, evt-003), June 11 (HR\
      \ Policy Workshop, evt-004), June 12 (Investor Call Prep, evt-006); free June\
      \ 13.\n   Score 0.4 if all commitments are accurately listed, 0.2 if mostly\
      \ correct with minor omissions, 0.0 if significantly wrong.\n\n2. RECOMMENDATION\
      \ QUALITY (0–0.4): Does the agent correctly recommend June 13 (Friday) as the\
      \ best day for the welcome lunch, noting that Alex Rivera and Priya Nair are\
      \ both free that day? Note: Jordan Kim has a Design Review on June 13 morning\
      \ (evt-007) but may be free for lunch. Does the agent acknowledge this nuance?\
      \ Does it note that June 9 is the only day Jordan Kim is fully free but conflicts\
      \ with Alex and Priya?\n   Score 0.4 if the recommendation is well-reasoned\
      \ and acknowledges trade-offs, 0.2 if June 13 is recommended without nuance,\
      \ 0.0 if wrong day recommended.\n\n3. CLARITY AND USEFULNESS (0–0.2): Is the\
      \ summary well-organized, easy to read, and actionable for scheduling a welcome\
      \ lunch?\n   Score 0.2 if clearly structured with a day-by-day or person-by-person\
      \ breakdown, 0.1 if somewhat organized, 0.0 if disorganized or hard to use.\n\
      \nFinal score = sum of the three dimension scores (max 1.0).\n"
    type: llm_judge
  name: schedule_summary_quality
  weight: 0.35
task_id: calendar-020
task_name: Identify scheduling conflicts for onboarding week
tools:
- description: Get all calendar events for a specific user on a given date
  endpoint: /calendar/user_events
  method: POST
  name: user_events
  service: calendar
- description: Get detailed information about a specific event by its ID
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: List all calendar events for a date range
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
