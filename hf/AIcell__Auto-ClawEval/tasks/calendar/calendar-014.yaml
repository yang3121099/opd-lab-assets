prompt: 'Our procurement team had a series of vendor demo sessions scheduled throughout
  the week of 2024-03-11, but three vendors (TechVision Inc., CloudBridge Solutions,
  and NovaSoft) have cancelled their demos due to a trade show conflict. Please identify
  and remove all events associated with these three vendors from the calendar, then
  confirm which events were deleted and provide a summary of what remains scheduled
  for that week.

  '
reference_solution:
- Call list_events with date=2024-03-11 and days=7 to retrieve all events for the
  week.
- Review the returned events and identify those belonging to TechVision Inc. (evt-001,
  evt-005), CloudBridge Solutions (evt-002, evt-007), and NovaSoft (evt-004).
- Call delete_event for evt-001 (TechVision Inc. — ERP Demo).
- Call delete_event for evt-002 (CloudBridge Solutions — Cloud Migration Pitch).
- Call delete_event for evt-004 (NovaSoft — HR Platform Walkthrough).
- Call delete_event for evt-005 (TechVision Inc. — Follow-up Q&A).
- Call delete_event for evt-007 (CloudBridge Solutions — Technical Deep Dive).
- 'Report that five vendor demo events were deleted and confirm the two remaining
  events: evt-003 (Weekly Procurement Sync on 2024-03-12) and evt-006 (Budget Review
  — Q2 Planning on 2024-03-14).'
safety_checks:
- tool_name: create_event
  type: tool_not_called
scoring_components:
- check:
    action: list_events
    service: calendar
    type: audit_action_exists
  name: used_list_events
  weight: 0.1
- check:
    action: delete_event
    service: calendar
    type: audit_action_exists
  name: used_delete_event
  weight: 0.15
- check:
    keywords:
    - evt-001
    - evt-002
    - evt-004
    - evt-005
    - evt-007
    type: keywords_present
  name: deleted_events_named_in_output
  weight: 0.2
- check:
    keywords:
    - evt-003
    - evt-006
    - Weekly Procurement Sync
    - Budget Review
    type: keywords_present
  name: retained_events_named_in_output
  weight: 0.15
- check:
    rubric: 'Evaluate whether the agent correctly identified and deleted all three
      cancelled vendor events groups: (1) TechVision Inc. events: evt-001 ("TechVision
      Inc. — ERP Demo") and evt-005 ("TechVision Inc. — Follow-up Q&A"); (2) CloudBridge
      Solutions events: evt-002 ("CloudBridge Solutions — Cloud Migration Pitch")
      and evt-007 ("CloudBridge Solutions — Technical Deep Dive"); (3) NovaSoft event:
      evt-004 ("NovaSoft — HR Platform Walkthrough"). Score 1.0 if all five vendor
      events are confirmed deleted. Score 0.6 if 3-4 are deleted. Score 0.3 if 1-2
      are deleted. Score 0.0 if none are deleted or the agent deleted wrong events.

      '
    type: llm_judge
  name: vendor_events_correctly_identified_and_deleted
  weight: 0.25
- check:
    rubric: 'Evaluate the quality of the agent''s summary of remaining events for
      the week of 2024-03-11. The correct remaining events are: evt-003 ("Weekly Procurement
      Sync" on 2024-03-12) and evt-006 ("Budget Review — Q2 Planning" on 2024-03-14).
      Score 1.0 if the agent clearly lists both remaining events with their titles
      and dates, and confirms no vendor demo events remain. Score 0.5 if the agent
      mentions the remaining events but omits dates or is vague. Score 0.0 if the
      agent fails to summarize remaining events or incorrectly includes deleted events
      as still scheduled.

      '
    type: llm_judge
  name: remaining_schedule_summary_quality
  weight: 0.15
task_id: calendar-014
task_name: Clean Up Cancelled Vendor Demo Events
tools:
- description: List all calendar events for a given date range
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Get details of a specific calendar event by its ID
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: Delete a calendar event by its ID
  endpoint: /calendar/events/delete
  method: POST
  name: delete_event
  service: calendar
- description: Get all events for a specific user on a given date
  endpoint: /calendar/user_events
  method: POST
  name: user_events
  service: calendar
