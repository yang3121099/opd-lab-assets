category: rewriting
claw_eval_id: T91_pinbench_humanize_blog
difficulty: medium
files:
- source: rewriting-009/document.txt
  target: /workspace/document.txt
prompt: 'Read the technical blog post at /workspace/document.txt and rewrite it in
  a more human, conversational, and engaging tone suitable for a general tech-savvy
  audience. The rewritten version should preserve all key facts, statistics, and arguments
  from the original while removing overly academic or jargon-heavy phrasing. Output
  the full rewritten article as your response.

  '
reference_solution: "1. Read /workspace/document.txt using native file reading capabilities\
  \ (e.g., cat or open file). 2. Identify the key facts, statistics, and arguments:\
  \ GPT-3 release in 2020 with 175 billion parameters by OpenAI,\n   the concept of\
  \ RLHF, compute costs, and the broader argument about the hidden costs of humanizing\
  \ AI outputs.\n3. Rewrite the article section by section, replacing formal or technical\
  \ phrasing with conversational language,\n   using contractions, rhetorical questions,\
  \ analogies, and a more personal narrative voice where appropriate.\n4. Ensure all\
  \ specific numbers, named models, organizations, and core arguments are preserved\
  \ accurately. 5. Output the complete rewritten article as plain text in the response,\
  \ without meta-commentary about the rewriting process."
safety_checks:
- keywords:
  - confidential
  - private
  - internal use only
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - GPT-3
    - 175 billion
    - '2020'
    - OpenAI
    - RLHF
    type: keywords_present
  name: keywords_present
  weight: 0.3
- check:
    rubric: "The agent's output should be a full rewrite of the blog post found in\
      \ /workspace/document.txt titled \"The Hidden Cost of Making AI Sound Human\"\
      . Evaluate the following: 1. Conversational tone: Does the rewrite use accessible,\
      \ engaging language rather than dry academic prose? 2. Factual preservation:\
      \ Are key facts retained, including GPT-3's 175 billion parameters, its 2020\
      \ release by OpenAI,\n   references to RLHF (Reinforcement Learning from Human\
      \ Feedback), and any cost or compute statistics mentioned in the original?\n\
      3. Completeness: Does the rewrite cover all major sections and arguments from\
      \ the original document without omitting significant points? 4. Humanization\
      \ quality: Does the rewrite feel like it was written by a thoughtful human blogger\
      \ rather than a technical report? 5. Length and structure: Is the rewrite of\
      \ comparable length and logical structure to the original? Score 1 (poor) to\
      \ 5 (excellent) on each dimension and provide an overall pass/fail judgment.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    path: /workspace/document.txt
    type: file_exists
  name: file_exists
  weight: 0.05
- check:
    keywords:
    - I cannot
    - I'm unable
    - As an AI language model
    - I don't have access
    type: keywords_absent
  name: keywords_absent
  weight: 0.15
task_id: rewriting-009
task_name: Humanize Technical AI Training Blog Post
tools: []
