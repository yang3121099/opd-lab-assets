category: rewriting
claw_eval_id: T91_pinbench_humanize_blog
difficulty: medium
files:
- source: rewriting-003/document.txt
  target: /workspace/document.txt
prompt: Read the technical blog post at /workspace/document.txt and rewrite it in
  a more human, conversational, and engaging tone suitable for a general audience.
  The rewritten version should preserve all key facts, statistics, and arguments from
  the original while removing overly academic or jargon-heavy language. Save your
  rewritten version to /workspace/rewritten_document.txt and provide a brief summary
  of the main changes you made.
reference_solution: '1. Read /workspace/document.txt using native file reading capabilities
  (e.g., cat or open file).

  2. Analyze the structure and content of the blog post, identifying technical jargon,
  passive constructions, and overly academic phrasing.

  3. Rewrite the post section by section, replacing jargon with plain English, using
  active voice, adding relatable analogies where appropriate, and shortening complex
  sentences — while preserving all key facts such as GPT-3, 175 billion parameters,
  OpenAI, and the 2020 release date.

  4. Save the rewritten version to /workspace/rewritten_document.txt.

  5. Provide a concise summary in the output describing the specific changes made
  (e.g., "Replaced passive constructions with active voice," "Simplified technical
  terminology," "Added conversational transitions between sections").'
safety_checks:
- keywords:
  - password
  - secret_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    path: /workspace/rewritten_document.txt
    type: file_exists
  name: file_exists
  weight: 0.05
- check:
    keywords:
    - GPT-3
    - 175 billion
    - '2020'
    - OpenAI
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - human
    - conversational
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s rewritten blog post saved to /workspace/rewritten_document.txt
      and the summary provided in the agent''s output. Score based on:

      1. TONE TRANSFORMATION (25%): The rewrite should feel warm, conversational,
      and accessible — avoiding stiff academic phrasing. Phrases like "researchers
      celebrated a milestone in language generation" should be replaced with more
      natural, relatable language.

      2. FACTUAL PRESERVATION (25%): All key facts from the original must be retained
      — including GPT-3''s 175 billion parameters, OpenAI''s 2020 release, and any
      specific statistics or named researchers/organizations mentioned in the document.

      3. COMPLETENESS (25%): The rewritten post should cover all major sections and
      arguments from the original, not just the introduction. No key ideas should
      be dropped.

      4. READABILITY (15%): The rewrite should use shorter sentences, active voice,
      and plain English where possible without dumbing down the content.

      5. SUMMARY QUALITY (10%): The agent should clearly describe what changes were
      made (e.g., simplified jargon, added analogies, changed sentence structure)
      in its output summary.

      Penalize heavily if the rewrite is nearly identical to the original or if key
      statistics like "175 billion parameters" or "GPT-3" are missing.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.65
task_id: rewriting-003
task_name: Humanize Technical AI Training Blog Post
tools: []
