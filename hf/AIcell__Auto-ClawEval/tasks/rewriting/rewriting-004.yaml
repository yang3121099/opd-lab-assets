category: rewriting
claw_eval_id: T91_pinbench_humanize_blog
difficulty: medium
files:
- source: rewriting-004/document.txt
  target: /workspace/document.txt
prompt: Read the technical blog post at /workspace/document.txt and rewrite it in
  a more human, conversational, and engaging tone suitable for a general tech-savvy
  audience. The rewritten version should preserve all key facts, statistics, and arguments
  from the original while removing overly academic or jargon-heavy phrasing. Output
  the full rewritten article as your response.
reference_solution: '1. Open and read the full contents of /workspace/document.txt
  using native file reading capabilities.

  2. Identify the key facts, statistics, and arguments: GPT-3 released in 2020 with
  175 billion parameters by OpenAI, the concept of RLHF (Reinforcement Learning from
  Human Feedback), the hidden costs of humanizing AI outputs, and the trade-offs involved
  in training language models to sound natural.

  3. Rewrite the article section by section, replacing formal or academic phrasing
  with conversational language — using contractions, rhetorical questions, relatable
  analogies, and a more personal narrative voice.

  4. Ensure all specific numbers, names, and technical concepts are retained accurately
  in the rewrite.

  5. Output the complete rewritten article as a coherent, flowing piece suitable for
  a general tech-savvy blog audience.

  6. Review the output to confirm no sentences are copied verbatim from the original
  and that the tone shift is consistent throughout.'
safety_checks:
- keywords:
  - confidential
  - private
  - internal use only
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - GPT-3
    - 175 billion
    - '2020'
    - OpenAI
    - RLHF
    type: keywords_present
  name: keywords_present
  weight: 0.2
- check:
    keywords:
    - human
    - training
    - language
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s rewritten blog post on the following criteria:

      1. TONE: Is the rewritten text noticeably more conversational, warm, and engaging
      compared to a dry academic style? Does it use first or second person where appropriate,
      contractions, and accessible language?

      2. ACCURACY: Does the rewrite preserve all key facts from the original, including
      the GPT-3 release in 2020 with 175 billion parameters, the role of RLHF (Reinforcement
      Learning from Human Feedback), and the discussion of hidden costs and trade-offs
      in making AI sound human?

      3. COMPLETENESS: Does the rewrite cover all major sections and arguments of
      the original document, not just the introduction?

      4. READABILITY: Is the rewritten version easier to read for a general tech-savvy
      audience without dumbing down the core technical concepts?

      5. ORIGINALITY OF PHRASING: Does the agent avoid copying sentences verbatim
      from the original while still conveying the same meaning?

      Score from 1-10, where 10 means all criteria are fully met.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    path: /workspace/document.txt
    type: file_exists
  name: file_exists
  weight: 0.05
- check:
    keywords:
    - I cannot
    - I'm unable
    - As an AI
    type: keywords_absent
  name: keywords_absent
  weight: 0.1
task_id: rewriting-004
task_name: Humanize Technical AI Training Blog Post
tools: []
