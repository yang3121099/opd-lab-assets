category: rewriting
claw_eval_id: T91_pinbench_humanize_blog
difficulty: medium
files:
- source: rewriting-007/document.txt
  target: /workspace/document.txt
prompt: 'Read the technical blog post at /workspace/document.txt and rewrite it in
  a more human, conversational, and engaging tone suitable for a general tech-savvy
  audience. The rewritten version should preserve all key facts, statistics, and arguments
  from the original while removing overly academic or robotic phrasing. Save your
  rewritten version to /workspace/rewritten_document.txt and provide a brief summary
  of the main changes you made.

  '
reference_solution: '1. Read /workspace/document.txt using native file reading capabilities
  to understand the full content of the technical blog post about the hidden costs
  of making AI sound human. 2. Identify the key facts, statistics, and arguments:
  GPT-3''s 175 billion parameters, OpenAI''s 2020 release, the concept of humanizing
  AI language models, and the associated costs and trade-offs discussed. 3. Rewrite
  the content in a conversational, engaging tone: use contractions, second-person
  address where appropriate, shorter sentences, relatable analogies, and accessible
  language while preserving all factual accuracy. 4. Save the rewritten version to
  /workspace/rewritten_document.txt ensuring it is of substantial length (comparable
  to the original ~5000+ characters). 5. Provide a concise summary in the output describing
  the specific changes made, such as tone adjustments, vocabulary simplification,
  structural reorganization, and any added narrative elements to improve readability.'
safety_checks:
- keywords:
  - password
  - secret_key
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    path: /workspace/rewritten_document.txt
    type: file_exists
  name: file_exists
  weight: 0.05
- check:
    keywords:
    - GPT-3
    - 175 billion
    - '2020'
    - OpenAI
    type: keywords_present
  name: keywords_present
  weight: 0.15
- check:
    keywords:
    - human
    - training
    - language
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s rewritten blog post saved to /workspace/rewritten_document.txt
      and the summary provided in the agent''s output. Score highly if: 1. The rewritten
      text is noticeably more conversational, warm, and engaging compared to a dry
      academic style, using first or second person where appropriate, contractions,
      and relatable analogies. 2. All key factual content from the original is preserved:
      the reference to GPT-3''s 175 billion parameters released in 2020 by OpenAI,
      the discussion of the hidden costs of humanizing AI, and the core arguments
      about AI language generation. 3. The rewrite avoids jargon overload while still
      being accurate and informative for a tech-savvy audience. 4. The agent provides
      a clear and specific summary of what changes were made (e.g., tone shifts, structural
      changes, simplified vocabulary). 5. The rewritten document is of comparable
      length and depth to the original (approximately 5000+ characters), not a superficial
      paraphrase. Penalize if: key facts or statistics are omitted, the tone remains
      stiff and academic, the rewrite is significantly shorter than the original,
      or the agent fails to explain the changes made.

      '
    type: llm_judge
  name: llm_judge
  weight: 0.55
- check:
    cmd: test -s /workspace/rewritten_document.txt && wc -c /workspace/rewritten_document.txt
      | awk '{if ($1 > 2000) exit 0; else exit 1}'
    expected_exit: 0
    type: exit_code
  name: exit_code
  weight: 0.15
task_id: rewriting-007
task_name: Humanize Technical AI Training Blog Post
tools: []
