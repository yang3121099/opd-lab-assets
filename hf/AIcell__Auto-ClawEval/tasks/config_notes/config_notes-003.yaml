category: workflow
claw_eval_id: T89_pinbench_config_workflow_notes
difficulty: medium
fixtures:
  config:
    integrations:
    - api_key: sf_live_key_abc123
      endpoint: https://api.salesforce.com/v2
      id: intg-001
      name: Salesforce CRM
      notes: Primary CRM integration. Renewal approved through 2025.
      secret: sf_secret_xyz789
