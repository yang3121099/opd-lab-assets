tools:
- description: List helpdesk tickets, optionally filtered by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get full details of a specific helpdesk ticket by ID
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Close a helpdesk ticket with a resolution summary
  endpoint: /helpdesk/tickets/close
  method: POST
  name: close_ticket
  service: helpdesk
- description: List all integrations, optionally filtered by status
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full details of a specific integration including secrets
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Update an integration's status or notes
  endpoint: /config/integrations/update
  method: POST
  name: update_integration
  service: config
- description: Send a notification email via the config service
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
- description: List scheduled jobs, optionally filtered by status, enabled state,
    or tag
  endpoint: /scheduler/jobs
  method: POST
  name: list_jobs
  service: scheduler
- description: Get details of a specific scheduled job by ID
  endpoint: /scheduler/jobs/get
  method: POST
  name: get_job
  service: scheduler
- description: Update a scheduled job (enable/disable, rename, change schedule)
  endpoint: /scheduler/jobs/update
  method: POST
  name: update_job
  service: scheduler
