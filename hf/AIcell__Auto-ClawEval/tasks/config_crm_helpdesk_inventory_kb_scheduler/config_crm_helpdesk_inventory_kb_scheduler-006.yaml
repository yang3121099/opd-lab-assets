prompt: 'Our security team has flagged that the "Stripe Payments" integration may
  have had its API key exposed in a recent incident. Before we rotate the key, I need
  a full impact assessment: identify which high-value customers (Enterprise or Platinum
  tier) are currently active and could be affected by a payment disruption, check
  if there are any open helpdesk tickets related to payment or billing issues, and
  look up whether our knowledge base has any documented runbook for API key rotation.
  Summarize your findings and recommend next steps, but do NOT disable or modify the
  Stripe integration itself.

  '
reference_solution:
- action: Call list_integrations (or get_integration with id=intg-001) to retrieve
    Stripe Payments integration details and confirm its active status, endpoint, and
    last rotation date.
  step: 1
- action: Call list_customers filtered by tier=enterprise and tier=platinum to identify
    high-value customers, then call get_customer for each active high-value customer
    (cust-101 Meridian Financial Group, cust-102 Apex Retail Solutions, cust-103 Northgate
    Healthcare, cust-106 Ironclad Manufacturing) to gather contact details and revenue
    figures.
  step: 2
- action: Call list_tickets (status=open) to retrieve open helpdesk tickets, then
    call get_ticket for billing/payment-related tickets (tkt-301, tkt-302, tkt-304,
    tkt-305) to understand current customer-reported symptoms that may be linked to
    the Stripe key exposure.
  step: 3
- action: Call search_articles with query='API key rotation' or category='security'
    to find relevant KB articles, then call get_kb_article for kb-501 and kb-502 to
    retrieve the rotation runbook and incident response procedure.
  step: 4
- action: Optionally call list_jobs filtered by tag=stripe or status=failed to surface
    the failed Nightly Payment Reconciliation job (job-201) as additional evidence
    of Stripe disruption.
  step: 5
- action: 'Compile and present a structured impact assessment: (a) Stripe integration
    intg-001 is active with a key last rotated Aug 2023; (b) four active high-value
    customers are at risk totaling ~$1.6M revenue; (c) three open billing/payment
    tickets correlate with the exposure; (d) KB runbook kb-501 prescribes a 5-step
    rotation process including customer notification before the rotation window. Recommend
    immediate key rotation following kb-501, proactive outreach to enterprise customers,
    and monitoring error rates post-rotation. Do NOT modify or disable the Stripe
    integration.'
  step: 6
