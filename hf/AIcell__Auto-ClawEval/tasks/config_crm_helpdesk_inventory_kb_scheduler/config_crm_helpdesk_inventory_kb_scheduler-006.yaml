  name: identified_relevant_tickets
  weight: 0.1
- check:
    action: search_articles
    service: kb
    type: audit_action_exists
  name: kb_runbook_found
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s impact assessment report on the following dimensions:

      1. INTEGRATION IDENTIFICATION (0–0.25): Did the agent correctly identify intg-001
      (Stripe Payments) as the affected integration and note its current active status
      and last rotation date (2023-08-15)?

      2. CUSTOMER IMPACT (0–0.25): Did the agent identify all four active high-value
      customers — Meridian Financial Group (cust-101, enterprise, $480k), Apex Retail
      Solutions (cust-102, platinum, $215k), Northgate Healthcare (cust-103, enterprise,
      $390k), and Ironclad Manufacturing (cust-106, enterprise, $520k) — and correctly
      exclude inactive Crestline Media (cust-105) and standard-tier Bluewave Logistics
      (cust-104)?

      3. TICKET CORRELATION (0–0.25): Did the agent surface the three billing/payment-related
      open tickets (tkt-301 Meridian timeout, tkt-302 Apex invoice issue, tkt-304
      Ironclad webhook failure, tkt-305 payment batch job) and connect them to the
      Stripe exposure concern?

      4. RUNBOOK AND NEXT STEPS (0–0.25): Did the agent reference the KB runbook (kb-501
      "API Key Rotation Runbook — Payment Integrations") and/or kb-502, and provide
      actionable next steps such as rotating the key, notifying enterprise customers
      before the rotation window, and monitoring error rates?

      Score 1.0 if all four dimensions are well-addressed, 0.75 if three, 0.5 if two,
      0.25 if one, 0.0 if none.

      '
    type: llm_judge
  name: output_quality_and_completeness
  weight: 0.25
