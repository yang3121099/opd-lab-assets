prompt: 'Our security team has flagged that the "Stripe Payments" and "SendGrid Email"
  integrations may have had their API keys exposed in a recent incident. Please disable
  both integrations immediately, add a note to each indicating they are under security
  review, then check if there are any open helpdesk tickets related to this incident
  and update them accordingly. Finally, search the knowledge base for any articles
  about API key rotation procedures and send a notification email to security@company.com
  summarizing what was done, which integrations were affected, and any relevant KB
  guidance you found.

  '
reference_solution: '1. Call list_integrations to get an overview of all integrations
  and identify Stripe Payments (intg-001) and SendGrid Email (intg-002). 2. Call get_integration
  for intg-001 and intg-002 to confirm their current status and details. 3. Call update_integration
  for intg-001 with status=inactive and notes="Disabled pending security review —
  possible API key exposure incident 2024-11-14". 4. Call update_integration for intg-002
  with status=inactive and notes="Disabled pending security review — possible API
  key exposure incident 2024-11-14". 5. Call list_tickets (status=open) to find related
  helpdesk tickets. Identify tkt-101 ("Possible API key leak in GitHub repo") as the
  primary incident ticket and tkt-102 as potentially related. 6. Call get_ticket for
  tkt-101 to read full details. 7. Call update_ticket for tkt-101 to tag it as "in-progress"
  or escalate, and optionally close it with a resolution noting the integrations have
  been disabled. 8. Call search_articles with query="API key rotation" or category="security"
  to find relevant KB guidance. 9. Call get_kb_article for kb-201 ("API Key Rotation
  Procedure") to retrieve the full rotation steps. 10. Call config_notify with to=security@company.com,
  subject="Security Action: Stripe and SendGrid Integrations Disabled", and a body
  summarizing: integrations disabled (intg-001, intg-002), reason (suspected key exposure
  via GitHub), actions taken, and next steps per KB article kb-201 (generate new keys
  from provider dashboards, review audit logs). 11. Provide a clear text summary to
  the user covering all actions taken, tickets identified, and KB guidance referenced.'
