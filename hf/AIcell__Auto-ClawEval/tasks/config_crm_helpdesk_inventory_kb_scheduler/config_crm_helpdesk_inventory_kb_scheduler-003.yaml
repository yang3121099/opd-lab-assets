- check:
    rubric: 'Evaluate the agent''s response on the following dimensions:

      1. INTEGRATION REMEDIATION (0–0.4): Did the agent disable both intg-001 (Stripe
      Payments) and intg-002 (SendGrid Email) by setting their status to inactive/disabled
      AND add a security review note to each? Full credit (0.4) if both integrations
      were updated with status change and notes. Partial credit (0.2) if only one
      was updated or notes were missing.

      2. HELPDESK HANDLING (0–0.2): Did the agent identify ticket tkt-101 ("Possible
      API key leak in GitHub repo") as the primary related ticket and take action
      on it (update priority or close with resolution)? Also note if tkt-102 (payment
      errors) was recognized as potentially related. Full credit (0.2) if tkt-101
      was addressed; partial (0.1) if mentioned but not acted upon.

      3. KB GUIDANCE INTEGRATION (0–0.2): Did the agent find and reference the KB
      article kb-201 ("API Key Rotation Procedure") or kb-202 ("Incident Response
      Checklist") in its summary? Full credit (0.2) if specific article content or
      steps were cited; partial (0.1) if KB was searched but content not meaningfully
      used.

      4. NOTIFICATION QUALITY (0–0.2): Was the notification to security@company.com
      comprehensive — covering which integrations were affected (Stripe, SendGrid),
      what actions were taken, and next steps (e.g., generate new keys from provider
      dashboards)? Full credit (0.2) if all three elements present; partial (0.1)
      if two elements present.

      Score = sum of dimension scores. Return a value between 0.0 and 1.0.

      '
    type: llm_judge
  name: overall_quality_and_completeness
  weight: 0.2
