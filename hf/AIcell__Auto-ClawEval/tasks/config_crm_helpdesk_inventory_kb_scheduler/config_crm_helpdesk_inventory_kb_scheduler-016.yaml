prompt: 'Our platform has several third-party integrations and we''ve received reports
  that some may have configuration issues. Please audit all integrations, retrieve
  the relevant knowledge base troubleshooting articles for any integrations that are
  not active, and then prepare a consolidated remediation report. For each problematic
  integration, include the recommended fix from the KB, update the integration''s
  notes field with a brief remediation summary, and notify the on-call team at oncall@company.com
  with a summary of findings and next steps.

  '
reference_solution: '1. Call list_integrations to retrieve all integrations and identify
  those with non-active statuses: intg-002 (SendGrid, error), intg-003 (Twilio, disabled),
  intg-005 (Datadog, error).

  2. Call get_integration for each of the three problematic integrations to review
  their current configuration details and notes.

  3. Search the knowledge base using search_articles with a query like "integration
  troubleshooting" or category "integrations" to find relevant articles.

  4. Call get_kb_article for kb-101 (SendGrid troubleshooting), kb-102 (Twilio re-enablement),
  and kb-103 (Datadog key rotation) to retrieve full remediation steps.

  5. Call list_tickets and get_ticket for tkt-001 and tkt-002 to correlate open helpdesk
  tickets with the affected integrations (SendGrid and Datadog).

  6. Call update_integration for each problematic integration (intg-002, intg-003,
  intg-005) to update the notes field with a brief remediation summary drawn from
  the KB articles.

  7. Call config_notify with to=oncall@company.com, a subject like "Integration Health
  Audit — 3 Issues Found", and a body summarizing the three affected integrations,
  their issues, and the recommended remediation steps from the KB.

  8. Produce a consolidated text report listing each problematic integration, its
  status, the relevant KB article and key remediation steps, and confirmation that
  the on-call team has been notified. Do not expose raw secrets in the output.'
