        than 90 days old, (3) Update integration status to active and verify the endpoint
        URL matches your Twilio account region, (4) Send a test SMS to confirm delivery.'
      id: kb-102
      last_updated: '2024-10-22'
      title: Twilio SMS Integration Setup and Re-enablement
    - author: devops-team
      category: integrations
      content: 'Datadog ''invalid API key'' errors typically occur after key expiration
        or accidental revocation. Steps: (1) Log into Datadog > Organization Settings
        > API Keys, (2) Create a new API key and copy both the API key and Application
        key, (3) Update the integration config store with the new credentials, (4)
        Verify metrics are flowing within 5 minutes of update.'
      id: kb-103
      last_updated: '2024-12-01'
      title: Datadog API Key Validation and Rotation
    - author: platform-team
