- check:
    rubric: 'Evaluate the agent''s consolidated remediation report on the following
      dimensions:

      1. COMPLETENESS (0-1): Does the report cover all three problematic integrations
      — intg-002 (SendGrid Email, status: error), intg-003 (Twilio SMS, status: disabled),
      and intg-005 (Datadog Monitoring, status: error)? Score 1.0 if all three addressed,
      0.5 if two, 0.2 if one, 0.0 if none.

      2. KB ACCURACY (0-1): Does the report accurately incorporate remediation steps
      from the relevant KB articles (kb-101 for SendGrid, kb-102 for Twilio, kb-103
      for Datadog)? Score 1.0 if all three KB articles'' key steps are reflected,
      0.5 if two, 0.0 if none.

      3. ACTIONABILITY (0-1): Are the recommended next steps specific and actionable
      (e.g., mentioning key rotation, dashboard steps, testing procedures)? Score
      1.0 if clearly actionable for each integration, 0.5 if partially, 0.0 if vague.

      4. NOTIFICATION QUALITY (0-1): Does the agent confirm that oncall@company.com
      was notified with a meaningful summary? Score 1.0 if confirmed with content
      summary, 0.5 if mentioned without detail, 0.0 if absent.

      Final score: average of the four dimensions.

      '
    type: llm_judge
  name: remediation_report_quality
  weight: 0.15
