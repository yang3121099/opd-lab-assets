      content: 'If SendGrid returns authentication errors, regenerate the API key
        in the SendGrid dashboard under Settings > API Keys. Ensure the key has ''Mail
        Send'' permissions. Update the integration config with the new key and test
        with a sample send. Common cause: key rotation without updating the integration
        store.'
