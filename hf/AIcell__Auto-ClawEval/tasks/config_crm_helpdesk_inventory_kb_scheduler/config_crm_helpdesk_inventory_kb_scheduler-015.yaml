category: ops
claw_eval_id: T34_ops_review_dashboard
difficulty: medium
fixtures:
  config:
    integrations:
    - api_key: sf_live_k3y_a1b2c3d4e5f6
      endpoint: https://api.salesforce.com/v2/sync
      id: int-001
      name: Salesforce CRM Sync
      notes: Set up 2021. Uses basic auth pattern.
      secret: sf_secret_LEGACY_BASIC_AUTH_xyz789
      status: active
    - api_key: sk_live_stripe_9z8y7x6w5v4u
      endpoint: https://api.stripe.com/v1/charges
      id: int-002
      name: Stripe Payment Gateway
      notes: Migrated to OAuth2 bearer tokens in 2023.
