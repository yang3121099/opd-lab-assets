tools:
- description: List helpdesk tickets, optionally filtered by status.
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get details of a specific helpdesk ticket by ticket_id.
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Update a helpdesk ticket's priority, tags, and category.
  endpoint: /helpdesk/tickets/update
  method: POST
  name: update_ticket
  service: helpdesk
- description: Close a helpdesk ticket with a resolution note.
  endpoint: /helpdesk/tickets/close
  method: POST
  name: close_ticket
  service: helpdesk
- description: List all integrations in the config store, optionally filtered by status.
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full details of a specific integration including API key and secret.
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: Update an integration's status or notes.
  endpoint: /config/integrations/update
  method: POST
  name: update_integration
  service: config
- description: Send a notification email via the config service.
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
- description: Search the knowledge base for articles by query or category.
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve a specific knowledge base article by article_id.
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Export a CRM report for a set of customers.
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
