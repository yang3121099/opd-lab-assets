task_name: VIP Customer Integration Audit and Export
tools:
- description: List all integrations, optionally filtered by status
  endpoint: /config/integrations
  method: POST
  name: list_integrations
  service: config
- description: Get full details of an integration including API key and secret
  endpoint: /config/integrations/get
  method: POST
  name: get_integration
  service: config
- description: List CRM customers filtered by status, tier, or industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Get full details of a specific CRM customer
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with a title, list of customer IDs, and a summary
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
- description: List helpdesk tickets filtered by status
  endpoint: /helpdesk/tickets
  method: POST
  name: list_tickets
  service: helpdesk
- description: Get full details of a specific helpdesk ticket
  endpoint: /helpdesk/tickets/get
  method: POST
  name: get_ticket
  service: helpdesk
- description: Send a notification email to a recipient
  endpoint: /config/notify
  method: POST
  name: config_notify
  service: config
- description: Search knowledge base articles by query and category
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
