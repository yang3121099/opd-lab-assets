- check:
    rubric: "Evaluate the quality and completeness of the agent's cross-analysis report\
      \ on the following dimensions:\n1. ENTERPRISE CUSTOMER COVERAGE (0-0.25): Does\
      \ the output correctly identify the three active enterprise customers\n   (Nexacloud\
      \ Inc. cust-001 revenue $185,000; Meridian Health Group cust-002 revenue $240,000;\n\
      \   Fortis Logistics cust-003 revenue $310,000) and note that Solaris Energy\
      \ (cust-005) is inactive?\n\n2. VENDOR SPEND ANALYSIS (0-0.25): Does the output\
      \ identify the relevant vendor payments from transactions,\n   specifically\
      \ the Nexacloud payment of $19,500 (txn-001), Meridian Health payment of $42,000\
      \ (txn-002),\n   and Fortis Logistics payment of $8,750 (txn-003), and recognize\
      \ these vendors are also CRM customers?\n\n3. DUAL EXPOSURE RISK (0-0.25): Does\
      \ the output flag the customer-vendor overlap risk, referencing the\n   KB article\
      \ guidance (kb-101) that vendor spend exceeding 15% of customer revenue is a\
      \ risk threshold?\n   Meridian Health vendor spend ($42,000) is 17.5% of their\
      \ revenue ($240,000), which exceeds the threshold.\n\n4. ACTIONABILITY AND BOARD\
      \ READINESS (0-0.25): Is the summary well-structured, suitable for board presentation,\n\
      \   and does it include a CRM export report covering the enterprise customer\
      \ IDs?\n\nScoring: 1.0 = all four dimensions addressed thoroughly; 0.75 = three\
      \ dimensions well covered; 0.5 = two dimensions covered; 0.25 = only surface-level\
      \ output with minimal analysis; 0.0 = missing or irrelevant.\n"
    type: llm_judge
  name: financial_analysis_quality
  weight: 0.3
