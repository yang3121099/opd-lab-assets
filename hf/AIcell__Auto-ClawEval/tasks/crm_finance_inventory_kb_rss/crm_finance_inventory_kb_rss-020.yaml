  kb:
    articles:
    - author: Risk Management Team
      category: financial_risk
      content: When a customer is also a vendor, organizations face dual exposure
        risk. Revenue dependency combined with vendor lock-in can amplify financial
        volatility. Best practice is to maintain a net exposure register and flag
        accounts where vendor spend exceeds 15% of customer revenue.
      id: kb-101
      last_updated: '2024-10-01'
      title: Customer Vendor Overlap Risk Management
    - author: Finance Operations
      category: reporting
      content: Board reports should include top-10 customer revenue breakdown, vendor
        concentration analysis, and any accounts with dual customer-vendor status.
        Use standardized CRM export format for customer data.
      id: kb-102
      last_updated: '2024-09-15'
      title: Quarterly Board Reporting Standards
    - author: Customer Success Team
      category: customer_success
      content: Enterprise customers require quarterly business reviews and dedicated
        account managers. Inactive enterprise accounts should be flagged for re-engagement
        within 90 days of last contact.
      id: kb-103
      last_updated: '2024-11-01'
      title: Enterprise Tier Customer Retention Strategies
prompt: 'Our CFO wants a consolidated view of our top-tier enterprise customers alongside
  recent vendor spending patterns to identify any financial exposure risks before
  the quarterly board meeting. Please pull together the enterprise customer list with
  their revenue figures, review recent finance transactions to spot any large vendor
  payments, and then produce an export report summarizing the top enterprise customers
  and their combined revenue. Also check if there are any relevant knowledge base
  articles about financial risk management that should be referenced in the summary.

  '
reference_solution: "1. Call list_customers with tier=enterprise to retrieve all enterprise-tier\
  \ customers.\n   Identify active ones: Nexacloud Inc. (cust-001, $185,000), Meridian\
  \ Health Group (cust-002, $240,000),\n   Fortis Logistics (cust-003, $310,000).\
  \ Note Solaris Energy (cust-005) is inactive.\n\n2. Call list_transactions with\
  \ a date range covering November-December 2024 to retrieve recent vendor payments.\n\
  \   Identify vendor payments to CRM customers: Nexacloud $19,500 (txn-001), Meridian\
  \ Health $42,000 (txn-002),\n   Fortis Logistics $8,750 (txn-003), Solaris Energy\
  \ $27,500 (txn-006).\n\n3. Call search_articles with query \"financial risk\" or\
  \ category \"financial_risk\" to find relevant KB articles.\n   Retrieve kb-101\
  \ (Customer Vendor Overlap Risk Management) which states vendor spend exceeding\
  \ 15% of\n   customer revenue is a risk flag. Apply this threshold: Meridian Health\
  \ spend ratio is 17.5% — flagged.\n\n4. Synthesize findings: calculate net exposure\
  \ for each dual customer-vendor account, flag Meridian Health\n   as exceeding the\
  \ 15% threshold, note Solaris Energy as inactive with recent vendor spend of $27,500.\n\
  \n5. Call export_report with title, customer_ids for the three active enterprise\
  \ customers\n   (cust-001, cust-002, cust-003), and a summary covering revenue totals,\
  \ vendor overlap risks,\n   and the Meridian Health threshold breach for board presentation.\n\
  \n6. Present the consolidated analysis in text output including customer revenues,\
  \ vendor payments,\n   risk flags, KB article references, and the export confirmation."
