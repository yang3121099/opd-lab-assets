      content: This article outlines the standard procedures for handling supply chain
        disruptions. Customer-facing teams should notify affected accounts within
        48 hours. Escalate hardware shortages to the procurement lead. Review restock
        timelines with suppliers before communicating ETAs.
      id: kb-art-055
      last_updated: '2024-08-10'
      title: Supply Chain Disruption Response Protocol
    - author: Marcus Lim
      category: customer-success
      content: Enterprise customers require priority handling for any service or product
