scoring_components:
- check:
    action: list_products
    service: inventory
    type: audit_action_exists
  name: inventory_reviewed
  weight: 0.1
- check:
    keywords:
    - TurboSync Pro Connector
    - SecureLink Gateway Module
    - CloudBridge Adapter Kit
    - RapidDeploy Server Rack
    type: keywords_present
  name: low_stock_products_identified
  weight: 0.2
- check:
    action: list_customers
    service: crm
    type: audit_action_exists
  name: enterprise_customers_identified
  weight: 0.1
- check:
    action: export_report
    service: crm
    type: audit_action_exists
  name: crm_report_exported
  weight: 0.1
- check:
    action: update_article
    service: kb
    type: audit_action_exists
  name: kb_article_updated
  weight: 0.1
- check:
    rubric: 'Does the agent''s output correctly identify the active enterprise-tier
      customers at risk? The correct active enterprise customers are: Meridian Financial
      Group (cust-101), Orion Healthcare Systems (cust-102), and Vertex Logistics
      Inc. (cust-104). BlueSky Tech Partners (cust-105) should NOT be included because
      their status is inactive. Score 1.0 if all three correct customers are named
      and the inactive customer is excluded. Score 0.5 if two of the three are named
      or the inactive customer is incorrectly included. Score 0.0 if fewer than two
      correct customers are identified.

      '
    type: llm_judge
  name: correct_customers_in_report
  weight: 0.15
- check:
    rubric: 'Evaluate the overall quality and completeness of the agent''s response
      across three dimensions: (1) Stock analysis accuracy: Did the agent correctly
      identify all four low-stock products (TurboSync Pro Connector at 8/10, SecureLink
      Gateway Module at 3/15, CloudBridge Adapter Kit at 12/25, RapidDeploy Server
      Rack at 2/5) and explain why each is below threshold? (2) KB article update
      quality: Did the agent update kb-art-055 (Supply Chain Disruption Response Protocol)
      or kb-art-061 with a meaningful, specific note about the current low-stock situation
      referencing the affected hardware products and impacted enterprise customers?
      (3) CRM report coherence: Does the export report summary clearly connect the
      inventory shortages to the enterprise customer impact in a way that would be
      actionable for account managers? Score 1.0 if all three dimensions are well-addressed
      with specific details. Score 0.7 if two dimensions are well-addressed. Score
      0.4 if only one dimension is adequately addressed. Score 0.0 if the response
      is vague, missing key product/customer details, or incoherent.

      '
    type: llm_judge
  name: analysis_quality
  weight: 0.25
