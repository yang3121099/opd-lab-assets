    - category: financial_services
      date: '2024-09-22'
      id: rss-201
      source: FinTech Weekly
      summary: 'A new Gartner report shows 68% of financial services firms plan to
        increase CRM spending in 2025, driven by client retention challenges and rising
        competition from digital-native challengers. Enterprise clients expect hyper-personalized
        engagement and real-time portfolio insights.

        '
