- check:
    rubric: "Evaluate the agent's final CRM export report on four dimensions:\n1.\
      \ CUSTOMER COVERAGE (0–0.25): Does the report include all five enterprise financial\
      \ services customers\n   (Meridian Capital Group cust-001, Apex Wealth Management\
      \ cust-002, Cornerstone Lending Partners cust-003,\n   BlueSky Fintech Solutions\
      \ cust-004, Harrington Private Equity cust-005)? Score 0.25 if all five are\n\
      \   present, 0.15 if three or four, 0.05 if fewer than three. Summit Retail\
      \ Group and Clearwater Insurance\n   should NOT be included (wrong industry\
      \ or wrong tier).\n\n2. KB INSIGHT INTEGRATION (0–0.25): Does the narrative\
      \ meaningfully reference retention best practices\n   from the knowledge base,\
      \ such as executive business reviews, at-risk recovery steps for Cornerstone\n\
      \   Lending Partners, or the 90-day renewal outreach guidance for high-revenue\
      \ accounts? Score 0.25 for\n   specific and accurate references, 0.15 for vague\
      \ mentions, 0.0 if absent.\n\n3. NEWS/MARKET CONTEXT (0–0.25): Does the report\
      \ incorporate relevant industry trends from the RSS\n   articles, such as the\
      \ Gartner finding about 68% of financial services firms increasing CRM spend,\n\
      \   or the churn risk warning for wealth management/private equity clients?\
      \ Score 0.25 for specific\n   data points cited, 0.15 for general mention of\
      \ trends, 0.0 if absent.\n\n4. ACTIONABILITY AND NARRATIVE QUALITY (0–0.25):\
      \ Is the summary narrative coherent, professional,\n   and actionable — e.g.,\
      \ does it flag Cornerstone Lending Partners as at-risk and recommend\n   immediate\
      \ outreach, and does it prioritize Harrington Private Equity ($540K revenue)\
      \ and\n   Meridian Capital Group ($485K) as top accounts? Score 0.25 for clear\
      \ prioritization and\n   specific recommendations, 0.15 for partial, 0.0 for\
      \ generic or missing.\n\nFinal score = sum of four dimension scores (max 1.0).\n"
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.3
