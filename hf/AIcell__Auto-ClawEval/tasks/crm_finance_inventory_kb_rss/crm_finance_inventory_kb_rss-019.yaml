prompt: 'Our Q3 retention initiative is kicking off and I need a comprehensive report
  on our VIP (enterprise-tier) customers in the financial services industry. Pull
  together their profiles, then search our knowledge base for any retention best practices
  we should reference, and check the latest industry news for relevant trends. Finally,
  export a polished CRM report summarizing these enterprise customers with a brief
  narrative that incorporates the KB insights and news context you found.

  '
reference_solution: "1. Call list_customers with tier=enterprise and industry=financial_services\
  \ to retrieve the five target\n   customers: Meridian Capital Group (cust-001),\
  \ Apex Wealth Management (cust-002), Cornerstone Lending\n   Partners (cust-003),\
  \ BlueSky Fintech Solutions (cust-004), and Harrington Private Equity (cust-005).\n\
  \n2. Optionally call get_customer for individual profiles to gather revenue and\
  \ last_contact details,\n   noting that cust-003 (Cornerstone Lending Partners)\
  \ has status=at_risk and last_contact in July 2024.\n\n3. Call search_articles with\
  \ query=\"retention\" and category=\"retention\" to find KB articles kb-101,\n \
  \  kb-102, and kb-103. Call get_kb_article for the most relevant ones (especially\
  \ kb-101 and kb-103)\n   to extract specific retention tactics: EBRs, at-risk recovery\
  \ framework, 90-day renewal outreach,\n   and white-glove support for >$300K ARR\
  \ accounts.\n\n4. Call list_articles with category=\"financial_services\" to retrieve\
  \ RSS articles rss-201 and rss-202.\n   Note the Gartner statistic (68% of firms\
  \ increasing CRM spend) and the churn risk warning for\n   wealth management and\
  \ private equity clients.\n\n5. Compose a summary narrative that: (a) lists all\
  \ five enterprise financial services customers with\n   revenue figures, (b) flags\
  \ Cornerstone Lending Partners as at-risk and recommends immediate outreach\n  \
  \ per the KB recovery framework, (c) highlights Harrington Private Equity and Meridian\
  \ Capital Group\n   as top-revenue accounts qualifying for white-glove support,\
  \ (d) references the market trend of\n   rising CRM investment and elevated churn\
  \ risk in the sector.\n\n6. Call export_report with title=\"Q3 Enterprise Financial\
  \ Services Retention Report\",\n   customer_ids=[cust-001, cust-002, cust-003, cust-004,\
  \ cust-005], and the composed summary.\n\n7. Present the exported report content\
  \ to the user, including the customer list, KB-backed\n   recommendations, and market\
  \ intelligence context."
