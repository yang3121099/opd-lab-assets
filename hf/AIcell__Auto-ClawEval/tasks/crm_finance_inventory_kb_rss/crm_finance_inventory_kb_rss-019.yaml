  kb:
    articles:
    - author: Sarah Chen
      category: retention
      content: 'Key retention strategies for enterprise accounts include quarterly
        executive business reviews (EBRs), dedicated customer success managers, proactive
        health scoring, and personalized renewal roadmaps. At-risk accounts should
        receive immediate outreach within 48 hours of risk flag. High-revenue accounts
        (>$300K ARR) qualify for white-glove support tiers and custom SLA agreements.

        '
      id: kb-101
      last_updated: '2024-08-01'
      title: Enterprise Customer Retention Playbook
    - author: Marcus Webb
      category: retention
      content: 'Financial services clients prioritize compliance, data security, and
        regulatory reporting features. Engagement touchpoints should reference recent
        regulatory changes (e.g., SEC updates, Basel III). Offer tailored demos of
        audit trail and reporting modules. Annual contract renewals should begin outreach
        90 days in advance with ROI documentation.

        '
      id: kb-102
      last_updated: '2024-07-15'
      title: Financial Services Client Engagement Guide
    - author: Sarah Chen
      category: retention
      content: 'Accounts flagged as at-risk require a structured recovery plan: (1)
        root cause analysis call within one week, (2) executive sponsor assignment,
        (3) 30-60-90 day success milestones, (4) discounted renewal offer if churn
        probability exceeds 60%. Document all recovery actions in CRM notes.

        '
      id: kb-103
      last_updated: '2024-09-10'
      title: At-Risk Account Recovery Framework
  rss:
