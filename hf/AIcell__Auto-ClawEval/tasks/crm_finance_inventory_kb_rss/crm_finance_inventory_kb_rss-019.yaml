tools:
- description: List CRM customers filtered by status, tier, and/or industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Get detailed profile for a specific customer by ID
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with selected customer IDs, a title, and a summary
    narrative
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
- description: Search the knowledge base for articles by query and/or category
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve the full content of a knowledge base article by ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: List RSS news articles by source, category, and/or max results
  endpoint: /rss/articles
  method: POST
  name: list_articles
  service: rss
- description: Get the full content of a specific RSS news article by ID
  endpoint: /rss/articles/get
  method: POST
  name: get_rss_article
  service: rss
