- check:
    rubric: 'Evaluate the agent''s final output on three dimensions:

      1. FINANCIAL ACCURACY (0–0.4): Did the agent correctly identify the enterprise-linked
      Q3 transactions? Enterprise customers are cust-101 (Apex Dynamics LLC), cust-102
      (Meridian Health Systems), and cust-104 (Northgate Capital Partners). Enterprise-linked
      transactions are txn-3001 ($18,500), txn-3002 ($42,000), txn-3003 ($27,500),
      txn-3005 ($5,500), and txn-3006 ($31,000). The correct total is $124,500. Award
      0.4 if the total is correct or very close with clear reasoning, 0.2 if enterprise
      transactions are identified but total is wrong, 0.0 if the agent includes non-enterprise
      transactions (e.g., txn-3004 from Solaris Retail Group) without noting they
      are excluded.

      2. REPORT COMPLETENESS (0–0.4): Did the agent submit the expense report with
      the correct title "Q3 Enterprise Customer Reconciliation", export a CRM report
      covering the three enterprise customers, and mention at least one relevant KB
      article (kb-201 "Enterprise Account Management Best Practices" or kb-203 "Enterprise
      Billing and Reconciliation Guidelines")? Award 0.4 if all three actions are
      completed and referenced in the output, 0.2 if one or two are missing, 0.0 if
      the report was not submitted.

      3. CLARITY AND INSIGHT (0–0.2): Is the output well-organized, does it clearly
      distinguish enterprise vs. non-enterprise customers, and does it provide a useful
      summary for the finance team? Award 0.2 for a clear, professional summary; 0.1
      for adequate but sparse output; 0.0 for confusing or incomplete output.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.3
