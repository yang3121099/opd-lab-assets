prompt: 'Our finance team needs a reconciliation report for Q3 enterprise customer
  activity. First, pull the list of enterprise-tier customers from the CRM, then find
  all Q3 transactions (July–September 2024) from finance. Cross-reference the two
  to identify which transactions are linked to enterprise accounts, calculate the
  total amount, and submit a formal expense report titled "Q3 Enterprise Customer
  Reconciliation" summarizing the findings. Also export a CRM report for the enterprise
  customers involved. Finally, check if there are any relevant knowledge base articles
  about enterprise account management and mention any you find.

  '
reference_solution:
- 'Call POST /crm/customers with tier=enterprise to retrieve enterprise customers:
  Apex Dynamics LLC (cust-101), Meridian Health Systems (cust-102), and Northgate
  Capital Partners (cust-104).'
- Call POST /finance/transactions with start_date=2024-07-01 and end_date=2024-09-30
  to retrieve all Q3 transactions.
- 'Cross-reference transaction vendors against enterprise customer names to identify
  enterprise-linked transactions: txn-3001, txn-3002, txn-3003, txn-3005, txn-3006.
  Note that txn-3004 (Solaris Retail Group) is a standard-tier customer and should
  be excluded.'
- 'Calculate the total: $18,500 + $42,000 + $27,500 + $5,500 + $31,000 = $124,500.'
- Call POST /finance/report/submit with title='Q3 Enterprise Customer Reconciliation',
  the enterprise transaction IDs, and total_amount=124500.
- Call POST /crm/export with title referencing the Q3 report, customer_ids=[cust-101,
  cust-102, cust-104], and a summary of enterprise activity.
- Call POST /kb/search with a query like 'enterprise account management' to find relevant
  articles (kb-201, kb-203).
- Retrieve at least one article (e.g., kb-201 or kb-203) using POST /kb/articles/get
  and mention its relevance in the output.
- 'Summarize all findings in the text response: enterprise customers identified, transactions
  reconciled, total amount, report submitted, CRM export completed, and KB articles
  referenced.'
