prompt: 'Our sales team needs a competitive intelligence briefing for our enterprise-tier
  customers in the technology industry. Pull the latest industry news articles, cross-reference
  with our enterprise tech customers'' profiles, and produce a consolidated report
  summarizing which customers should be prioritized for outreach based on recent market
  developments. Also check if there are any relevant knowledge base articles on competitive
  positioning that should be referenced in the briefing.

  '
reference_solution: "1. Call list_feeds (category: technology) to discover available\
  \ RSS feeds. 2. Call list_articles (category: technology) to get a list of recent\
  \ technology articles. 3. Call get_rss_article for each article (art-001, art-002,\
  \ art-003, art-004) to retrieve full details on\n   cloud consolidation, AI spending,\
  \ cybersecurity mandates, and SaaS churn trends.\n4. Call search_articles (query:\
  \ \"competitive positioning enterprise\", category: sales) to find relevant KB articles.\
  \ 5. Call get_kb_article for kb-001 (Competitive Positioning Guide), kb-002 (Enterprise\
  \ Renewal Playbook), and\n   kb-003 (AI and Analytics Upsell Strategy) to retrieve\
  \ full content.\n6. Call list_customers (tier: enterprise, industry: technology)\
  \ to retrieve the five enterprise tech customers. 7. Call get_customer for each\
  \ customer (cust-101 through cust-105) to review revenue, status, and last contact\
  \ dates. 8. Synthesize findings: flag Stratos Digital (at-risk, last contacted Aug\
  \ 30) as highest urgency using the renewal\n   playbook; recommend AI upsell for\
  \ Meridian Analytics and Nexora Systems based on the AI spending article and kb-003;\n\
  \   note cybersecurity procurement changes relevant to all five accounts.\n9. Call\
  \ export_report with a title like \"Enterprise Tech Competitive Intelligence Briefing\
  \ Q4 2024\", include all five\n   customer IDs, and provide a summary connecting\
  \ news themes to customer-specific recommendations.\n10. Present the full briefing\
  \ in the response, including article summaries, customer prioritization rationale,\n\
  \    KB-backed recommendations, and specific next steps for the sales team."
