  weight: 0.1
- check:
    action: export_report
    service: crm
    type: audit_action_exists
  name: exported_crm_report
  weight: 0.1
- check:
    keywords:
    - Nexora Systems
    - Meridian Analytics
    - Stratos Digital
    type: keywords_present
  name: key_customers_mentioned
  weight: 0.15
- check:
    keywords:
    - cloud
    - AI
    - cybersecurity
    - churn
    type: keywords_present
  name: news_themes_referenced
  weight: 0.1
- check:
    rubric: "Evaluate the competitive intelligence briefing produced by the agent\
      \ on the following dimensions:\n1. ARTICLE COVERAGE (0–0.25): Did the agent\
      \ retrieve and reference specific RSS articles?\n   Full credit if at least\
      \ 3 of the 4 articles (art-001 through art-004) are summarized with their themes\n\
      \   (cloud consolidation, AI spending, cybersecurity mandates, SaaS churn).\
      \ Partial credit for 1–2 articles.\n\n2. CUSTOMER PRIORITIZATION (0–0.25): Did\
      \ the agent identify and rank enterprise technology customers for outreach?\n\
      \   Full credit if Stratos Digital (cust-103, at-risk, $275K) is flagged as\
      \ highest urgency, and Meridian Analytics\n   (cust-104, $520K, active) and\
      \ Nexora Systems (cust-101, $480K) are highlighted as high-value targets.\n\
      \   Partial credit if customers are listed without clear prioritization rationale.\n\
      \n3. KB INTEGRATION (0–0.25): Did the agent incorporate knowledge base insights\
      \ into the briefing?\n   Full credit if the agent references competitive positioning\
      \ (kb-001), AI upsell strategy (kb-003), or the\n   enterprise renewal playbook\
      \ (kb-002) in the context of specific customers or news themes.\n   Partial\
      \ credit if KB is mentioned but not connected to specific customers or articles.\n\
      \n4. ACTIONABILITY (0–0.25): Is the briefing actionable for the sales team?\n\
      \   Full credit if the output includes specific recommended next steps per customer\
      \ (e.g., renewal conversation\n   for Stratos Digital, AI upsell pitch for Meridian\
      \ Analytics based on AI spending article).\n   Partial credit if recommendations\
      \ are generic. No credit if no recommendations are provided.\n\nScore: Sum the\
      \ four dimension scores (each 0–0.25) for a total between 0.0 and 1.0.\n"
    type: llm_judge
  name: briefing_quality
  weight: 0.3
