prompt: 'Our sales team is preparing for Q4 outreach. Pull together a briefing for
  our enterprise-tier customers in the technology industry: list who they are (with
  revenue and last contact date), then find recent RSS articles about technology industry
  trends to include as talking points, and finally export a CRM report summarizing
  these customers with a note about the relevant trend topics you found. The briefing
  should help the sales team walk into conversations informed and ready.

  '
reference_solution: '1. Call POST /crm/customers with filters tier=enterprise and
  industry=technology to retrieve the list of enterprise tech customers. This should
  return Apex Systems Inc. (cust-101), NovaTech Solutions (cust-102), Meridian Cloud
  Corp (cust-103), and Stratosphere AI (cust-106). 2. Optionally call POST /crm/customers/get
  for individual customers to confirm revenue and last_contact details. 3. Call POST
  /rss/articles with category=technology (and optionally max_results=5) to retrieve
  recent technology trend articles. This returns art-201 through art-204 covering
  AI adoption, cloud spending, cybersecurity budgets, and SaaS consolidation. 4. Review
  the article summaries and extract 2–4 key talking points relevant to enterprise
  technology buyers. 5. Call POST /crm/export with title="Q4 Enterprise Technology
  Customer Briefing", customer_ids=[cust-101, cust-102, cust-103, cust-106], and a
  summary that references the trend topics found (AI adoption, cloud infrastructure,
  cybersecurity, SaaS consolidation). 6. Present the final briefing in the response:
  list each customer with revenue and last contact date, then provide the trend talking
  points with article titles/sources, and confirm the CRM report was exported.'
