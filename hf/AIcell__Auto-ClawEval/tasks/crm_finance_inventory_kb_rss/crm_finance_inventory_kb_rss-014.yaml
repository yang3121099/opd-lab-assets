scoring_components:
- check:
    action: list_articles
    service: rss
    type: audit_action_exists
  name: listed_technology_articles
  weight: 0.15
- check:
    action: list_customers
    service: crm
    type: audit_action_exists
  name: listed_enterprise_tech_customers
  weight: 0.1
- check:
    action: export_report
    service: crm
    type: audit_action_exists
  name: exported_crm_report
  weight: 0.1
- check:
    keywords:
    - Apex Systems
    - NovaTech Solutions
    - Meridian Cloud Corp
    - Stratosphere AI
    type: keywords_present
  name: correct_customers_identified
  weight: 0.2
- check:
    keywords:
    - AI
    - cloud
    - cybersecurity
    type: keywords_present
  name: trend_topics_referenced
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s Q4 sales briefing on the following dimensions:

      1. CUSTOMER ACCURACY (0–0.3): Does the output correctly identify all four enterprise-tier
      technology customers — Apex Systems Inc. (cust-101, $485K), NovaTech Solutions
      (cust-102, $312K), Meridian Cloud Corp (cust-103, $670K), and Stratosphere AI
      (cust-106, $540K)? Does it include revenue figures and last contact dates? Deduct
      if Greenfield Retail Group (retail) or Pinnacle Finance Ltd. (standard tier)
      are incorrectly included.

      2. TREND INTEGRATION (0–0.4): Does the output incorporate specific technology
      trend talking points drawn from the RSS articles (e.g., AI adoption acceleration
      from art-201, record cloud spending from art-202, cybersecurity budget surges
      from art-203, SaaS consolidation from art-204)? Are at least 2 distinct trends
      cited with enough detail to be useful in a sales conversation?

      3. REPORT EXPORT (0–0.2): Did the agent export a CRM report that includes the
      correct customer IDs and a meaningful summary connecting the customers to the
      trend briefing?

      4. ACTIONABILITY (0–0.1): Is the final briefing structured and clear enough
      that a salesperson could use it directly for Q4 outreach preparation?

      Score 1.0 if all four dimensions are fully satisfied. Score 0.7 if customer
      list is correct and at least 2 trends are cited but export summary is thin.
      Score 0.4 if customers are partially correct or trends are vague. Score 0.1
      if output is mostly incomplete or inaccurate.

      '
    type: llm_judge
  name: briefing_quality
  weight: 0.3
