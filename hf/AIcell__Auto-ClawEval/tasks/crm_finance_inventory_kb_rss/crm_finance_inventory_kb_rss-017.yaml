prompt: 'Our sales director wants a comprehensive health snapshot of our enterprise-tier
  customers to prepare for the upcoming quarterly business review. For each enterprise
  customer, pull their details and assess their status. Then search our knowledge
  base for any relevant account management best practices, and check the latest industry
  news to add market context. Finally, compile everything into a CRM export report
  summarizing the enterprise customer landscape, key risks, and recommended next steps.

  '
reference_solution:
- action: Call list_customers with tier=enterprise to retrieve all enterprise-tier
    customers from the CRM.
  step: 1
- action: Call get_customer for each enterprise customer ID (cust-001, cust-002, cust-003,
    cust-004, cust-005, cust-007) to retrieve full details including revenue, status,
    and last_contact dates.
  step: 2
- action: Call search_articles in the knowledge base with a query like "enterprise
    account management health" and category=account_management to find relevant best
    practice articles (kb-101, kb-102, kb-103).
  step: 3
- action: Call get_kb_article for the most relevant articles (kb-101 for health scoring,
    kb-102 for churn recovery, kb-103 for QBR prep) to read their full content.
  step: 4
- action: Call list_articles from RSS feeds to retrieve recent industry news relevant
    to enterprise customers (logistics, healthcare, finance/technology categories).
  step: 5
- action: Call get_rss_article for relevant articles (rss-201 logistics margin pressure,
    rss-202 healthcare IT growth, rss-203 finance SaaS churn) to get full summaries
    for market context.
  step: 6
- action: Synthesize findings — flag Vantage Capital Partners (at_risk, $720K, last
    contact Sept 3) and BlueSky Energy Corp (at_risk, $540K, last contact Oct 10)
    as high-priority outreach; flag Nexbridge Healthcare Systems (churned, $0, last
    contact July 22) for win-back given healthcare IT growth news; note active accounts
    for upsell review.
  step: 7
- action: Call export_report with a title like "Q4 Enterprise Customer Health Report",
    include all enterprise customer IDs, and provide a comprehensive summary covering
    health status, market context, KB-backed recommendations, and prioritized next
    steps.
  step: 8
- action: Present the full report in the text response, including customer-by-customer
    health assessment, integrated market insights, and a prioritized action plan for
    the sales director.
  step: 9
