  name: exported_crm_report
  weight: 0.1
- check:
    keywords:
    - Vantage Capital Partners
    - BlueSky Energy Corp
    - Nexbridge Healthcare Systems
    - at_risk
    - churned
    type: keywords_present
  name: key_customers_identified
  weight: 0.12
- check:
    rubric: 'Evaluate the agent''s enterprise customer health report on four dimensions:

      1. CUSTOMER COVERAGE (0–0.25): Does the report cover all five enterprise customers
      — Meridian Logistics Group (cust-001, active, $485K), Vantage Capital Partners
      (cust-002, at_risk, $720K), Solaris Manufacturing Co. (cust-003, active, $310K),
      Nexbridge Healthcare Systems (cust-004, churned, $0), Orion Retail Collective
      (cust-005, active, $198K), and BlueSky Energy Corp (cust-007, at_risk, $540K)?
      Score 0.25 if all six are addressed, 0.15 if four or five, 0.05 if fewer.

      2. RISK IDENTIFICATION (0–0.25): Does the report clearly flag Vantage Capital
      Partners and BlueSky Energy Corp as at-risk (noting last contact dates of Sept
      3 and Oct 10 respectively, both 60+ days ago), and identify Nexbridge Healthcare
      Systems as churned with win-back potential given prior revenue? Score 0.25 if
      all three are specifically called out with reasoning, 0.15 if two, 0.05 if one
      or none.

      3. KB AND MARKET CONTEXT INTEGRATION (0–0.25): Does the report incorporate knowledge
      base insights (e.g., 90-day contact rule from kb-101, churn recovery playbook
      from kb-102, QBR prep from kb-103) AND relevant market news (e.g., logistics
      margin pressure affecting Meridian, healthcare IT growth creating Nexbridge
      win-back opportunity, finance sector SaaS churn risk for Vantage)? Score 0.25
      if both KB and news are meaningfully integrated, 0.15 if only one source is
      used, 0.05 if neither.

      4. ACTIONABILITY OF RECOMMENDATIONS (0–0.25): Does the report provide specific,
      prioritized next steps (e.g., executive outreach to Vantage and BlueSky within
      2 weeks, post-mortem for Nexbridge, upsell review for active accounts)? Score
      0.25 if recommendations are specific and tied to individual customers, 0.15
      if generic, 0.05 if absent.

      Total score = sum of four dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.25
- check:
    rubric: 'Does the agent''s output include a clear recommended next steps or action
      plan section? Specifically check: - Is there an explicit recommendation to prioritize
      outreach to at-risk accounts (Vantage Capital Partners cust-002 and BlueSky
      Energy Corp cust-007)? - Is there a win-back or post-mortem recommendation for
      Nexbridge Healthcare Systems (cust-004, churned)? - Are active accounts (Meridian,
      Solaris, Orion) mentioned with upsell or retention notes? Score 1.0 if all three
      elements are present and specific, 0.6 if two are present, 0.3 if only one,
      0.0 if no actionable next steps are provided.

      '
    type: llm_judge
  name: next_steps_present
  weight: 0.15
