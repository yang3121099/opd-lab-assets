prompt: 'Our enterprise-tier customers in the manufacturing industry have been asking
  about product compatibility and stock availability for their upcoming procurement
  cycle. Please look up the details for our key inventory products (especially the
  industrial equipment items), cross-reference which enterprise manufacturing customers
  we have on file, and then compile and export a CRM report summarizing which customers
  should be contacted about available products. Also check if there are any relevant
  knowledge base articles about product compatibility that should be updated with
  current stock information, and include a brief summary of your findings in your
  response.

  '
reference_solution:
- action: Use list_customers with filters tier=enterprise and industry=manufacturing
    to identify active enterprise manufacturing customers.
  step: 1
- action: Use get_customer to retrieve details for cust-101 (Hargrove Industrial Solutions),
    cust-102 (Meridian Fabrication Group), and cust-103 (Apex Precision Components),
    confirming they are active.
  step: 2
- action: Use list_products with category=industrial_equipment to retrieve the industrial
    equipment catalog.
  step: 3
- action: Use get_product for each industrial equipment product (prod-501 HydraPress
    X200, prod-502 TorqueMaster 3000, prod-503 PrecisionCNC Milling Station, prod-505
    AutoWeld Pro Robotic Welder) to get detailed stock and pricing information.
  step: 4
- action: Note that prod-502 TorqueMaster 3000 (quantity 3, min_stock 4) and prod-505
    AutoWeld Pro (quantity 2, min_stock 3) are below minimum stock thresholds.
  step: 5
- action: Use search_articles with query about product compatibility or manufacturing
    to find relevant KB articles.
  step: 6
- action: Use get_kb_article for kb-301 "Industrial Equipment Compatibility Guide
    for Manufacturing Clients" and compare its listed stock figures against current
    inventory — noting the figures are outdated.
  step: 7
- action: Use update_article for kb-301 to refresh the stock figures with current
    inventory data.
  step: 8
- action: Use export_report with customer_ids [cust-101, cust-102, cust-103] and a
    summary describing available products, low-stock alerts, and recommended outreach.
  step: 9
- action: Provide a written summary identifying the three target customers, product
    availability status, low-stock items, and recommended next steps including updating
    the KB article and initiating customer outreach.
  step: 10
