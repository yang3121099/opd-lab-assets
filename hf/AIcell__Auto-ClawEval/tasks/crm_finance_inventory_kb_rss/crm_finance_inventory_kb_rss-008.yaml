  weight: 0.1
- check:
    action: get_kb_article
    service: kb
    type: audit_action_exists
  name: kb_article_accessed_or_updated
  weight: 0.1
- check:
    keywords:
    - Hargrove Industrial Solutions
    - Meridian Fabrication Group
    - Apex Precision Components
    - TorqueMaster 3000
    - AutoWeld Pro
    type: keywords_present
  name: correct_customers_and_products_named
  weight: 0.15
- check:
    keywords:
    - TorqueMaster 3000
    - AutoWeld Pro
    type: keywords_present
  name: low_stock_items_flagged
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s final response on four dimensions:

      1. PRODUCT ANALYSIS (0-0.25): Did the agent correctly identify and describe
      the industrial equipment products? Specifically: HydraPress X200 (14 units,
      healthy stock), TorqueMaster 3000 (3 units, BELOW min_stock of 4 — low stock),
      PrecisionCNC Milling Station (8 units, healthy), AutoWeld Pro Robotic Welder
      (2 units, BELOW min_stock of 3 — low stock). Score 0.25 if all four are discussed
      with stock status, 0.15 if two or three, 0.05 if only one.

      2. CUSTOMER TARGETING (0-0.25): Did the agent correctly identify the three active
      enterprise manufacturing customers (Hargrove Industrial Solutions cust-101,
      Meridian Fabrication Group cust-102, Apex Precision Components cust-103) and
      exclude non-manufacturing or inactive customers (BlueSky Retail, Northgate Logistics)?
      Score 0.25 if all three named and exclusions justified, 0.15 if two named, 0.05
      if one.

      3. KB ARTICLE RELEVANCE (0-0.25): Did the agent find and reference the knowledge
      base article kb-301 "Industrial Equipment Compatibility Guide for Manufacturing
      Clients" and note that its stock figures are outdated (it lists HydraPress X200
      at 12, TorqueMaster at 7, PrecisionCNC at 6, all differing from current inventory)?
      Score 0.25 if article identified and outdated data noted, 0.15 if article found
      but discrepancy not highlighted, 0.05 if only mentioned in passing.

      4. ACTIONABILITY (0-0.25): Does the response provide clear, actionable recommendations
      — such as contacting the three enterprise customers, flagging low-stock items
      (TorqueMaster 3000, AutoWeld Pro) for restock consideration, and updating kb-301
      with current stock figures? Score 0.25 if all three action areas addressed,
      0.15 if two, 0.05 if one.

      Total score = sum of four dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.25
