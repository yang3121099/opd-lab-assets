  kb:
    articles:
    - author: Dana Reyes
      category: customer_success
      content: 'Key churn indicators include reduced login frequency, unresolved support
        tickets, payment disputes, and lack of executive sponsor engagement. Accounts
        with last contact older than 90 days and disputed payments are high priority
        for intervention. Recommended actions: schedule executive business review,
        offer contract flexibility, assign dedicated CSM.'
      id: kb-501
      last_updated: '2024-09-01'
      title: 'Identifying At-Risk Enterprise Accounts: Early Warning Signals'
    - author: Marcus Lin
      category: customer_success
      content: For accounts above $200K ARR, initiate renewal conversations at least
        120 days before contract end. Leverage ROI reports, executive sponsorship,
        and tailored success plans. Offer multi-year discounts for at-risk accounts.
        Escalate disputed payments to finance and account management jointly within
        30 days.
      id: kb-502
      last_updated: '2024-10-15'
      title: 'Enterprise Renewal Playbook: Strategies for High-Value Accounts'
    - author: Priya Nair
      category: customer_success
      content: Analysis of churned enterprise accounts shows that 78% had at least
        one unresolved billing dispute in the 6 months prior to churn. Proactive outreach
        within 14 days of a missed payment reduces churn risk by 40%. Document all
        churn reasons in CRM for future reference.
      id: kb-503
      last_updated: '2024-08-20'
      title: 'Post-Churn Analysis: Lessons from Lost Enterprise Accounts'
prompt: 'Our sales director needs a comprehensive renewal risk briefing for our top-tier
  enterprise customers. Pull detailed profiles for each of our "enterprise" tier customers,
  cross-reference any recent financial transactions related to their accounts, and
  search the knowledge base for any churn or renewal best-practice articles. Then
  compile and export a CRM report summarizing which customers are at renewal risk
  and what actions are recommended, including key insights from the KB articles you
  find.

  '
reference_solution: "1. Call POST /crm/customers with tier=enterprise to list all\
  \ enterprise-tier customers. 2. Call POST /crm/customers/get for each enterprise\
  \ customer (cust-101, cust-102, cust-103, cust-104)\n   to retrieve full profiles\
  \ including status, revenue, and last_contact dates.\n3. Call POST /finance/transactions\
  \ with a broad date range (e.g., 2024-01-01 to 2024-11-30) to\n   retrieve recent\
  \ financial transactions and identify any disputed or anomalous payments linked\n\
  \   to enterprise accounts. Note txn-3002 (Apex Financial Partners, disputed, $60,000).\n\
  4. Call POST /kb/search with query=\"enterprise renewal churn risk\" and category=customer_success\n\
  \   to find relevant articles.\n5. Call POST /kb/articles/get for kb-501, kb-502,\
  \ and kb-503 to read full content and extract\n   actionable guidance (90-day contact\
  \ threshold, 120-day renewal window, billing dispute churn correlation).\n6. Synthesize\
  \ findings: flag Apex Financial Partners as highest renewal risk (at_risk status,\n\
  \   disputed payment, last contact >90 days ago); note Vantage Retail as already\
  \ churned;\n   confirm Meridian Logistics and Solaris Healthcare as healthy.\n7.\
  \ Call POST /crm/export with title=\"Enterprise Renewal Risk Report Q4 2024\",\n\
  \   customer_ids=[cust-101, cust-102, cust-103, cust-104], and a summary incorporating\n\
  \   risk levels and KB-backed recommendations.\n8. Present the briefing in text,\
  \ including per-customer risk assessment, KB insights cited,\n   and specific recommended\
  \ actions for each at-risk account."
