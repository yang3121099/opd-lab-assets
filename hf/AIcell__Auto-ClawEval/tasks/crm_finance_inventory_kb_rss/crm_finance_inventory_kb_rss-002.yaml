- check:
    keywords:
    - Apex Financial Partners
    - disputed
    - at_risk
    - Meridian Logistics Group
    - Solaris Healthcare
    - Vantage Retail
    type: keywords_present
  name: key_customers_and_risk_signals_mentioned
  weight: 0.2
- check:
    rubric: 'Evaluate the agent''s renewal risk briefing on three dimensions:

      1. ACCURACY OF RISK IDENTIFICATION (0–0.4): Does the agent correctly identify
      Apex Financial Partners (cust-102, status=at_risk, disputed payment txn-3002
      for $60,000, last contact 2024-07-02 — over 90 days ago) as the highest-risk
      account? Does it flag Vantage Retail Co. (cust-104, status=churned) as already
      lost? Does it note Meridian Logistics Group and Solaris Healthcare as healthy
      based on completed payments and recent contact?

      2. KB INSIGHT INTEGRATION (0–0.3): Does the agent reference specific guidance
      from the knowledge base articles — such as the 90-day last-contact threshold
      (kb-501), the 120-day renewal conversation window for accounts above $200K ARR
      (kb-502), or the finding that 78% of churned accounts had billing disputes (kb-503)?
      Score 0.3 if two or more KB insights are woven into recommendations, 0.15 if
      one, 0.0 if none.

      3. ACTIONABILITY OF RECOMMENDATIONS (0–0.3): Are concrete next steps provided
      for at-risk accounts (e.g., schedule executive business review for Apex Financial,
      escalate disputed payment, assign dedicated CSM)? Are recommendations specific
      to the customer data rather than generic? Score 0.3 for specific, data-grounded
      actions; 0.15 for partially specific; 0.0 for vague or missing recommendations.

      Total score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: renewal_risk_assessment_quality
  weight: 0.35
