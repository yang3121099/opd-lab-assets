  name: list_transactions
  service: finance
- description: Get details of a specific transaction by ID
  endpoint: /finance/transactions/get
  method: POST
  name: get_transaction
  service: finance
- description: List CRM customers filtered by status, tier, or industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Get details of a specific CRM customer by ID
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with selected customers and a summary
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
- description: Publish a newsletter to specified recipients
  endpoint: /rss/publish
  method: POST
  name: publish_newsletter
  service: rss
- description: List inventory products by category
  endpoint: /inventory/products
  method: POST
  name: list_products
  service: inventory
