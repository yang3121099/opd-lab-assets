- check:
    rubric: 'Evaluate the agent''s final report and output on the following dimensions:

      1. CUSTOMER COVERAGE (0–0.25): Does the output correctly identify all four enterprise-tier
      customers (Meridian Logistics Group cust-001, Apex Financial Partners cust-002,
      Solaris Manufacturing cust-003, Brightwave Media cust-004) and exclude the standard-tier
      customer Crestline Healthcare (cust-005)? Full credit if all four enterprise
      customers are included and Crestline is excluded. Partial credit if 2–3 enterprise
      customers are mentioned.

      2. FINANCIAL CONTEXT (0–0.25): Does the output incorporate relevant Q3 financial
      data, such as Apex Financial Partners'' credit adjustment of -$15,000 (txn-105)
      as a risk signal, Brightwave Media''s final invoice (txn-103) in context of
      churn, or Meridian''s Q3 invoice (txn-102)? Full credit if at least two transactions
      are meaningfully referenced.

      3. RETENTION RISK ANALYSIS (0–0.25): Does the output flag Apex Financial Partners
      as at-risk and Brightwave Media as churned, and reference knowledge base guidance
      (e.g., at-risk playbook kb-202 or retention best practices kb-201) to support
      recommendations? Full credit if both risk statuses are noted with KB-backed
      recommendations.

      4. REPORT EXPORT EXECUTION (0–0.25): Did the agent actually call the export_report
      tool with a meaningful title referencing Q3 or enterprise customers, and include
      the relevant customer IDs (cust-001, cust-002, cust-003, cust-004) in the export?
      Full credit if the export was called with at least 3 of the 4 enterprise customer
      IDs and a descriptive title.

      Score 1.0 if all four dimensions are fully satisfied. Score 0.75 if three are
      fully satisfied. Score 0.5 if two are satisfied. Score 0.25 if only one is satisfied.
      Score 0.0 if the output is missing or entirely off-task.

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.4
