prompt: 'Our sales leadership needs a consolidated Q3 health report for all enterprise-tier
  customers. Pull together the relevant customer data, cross-reference any recent
  financial transactions related to these accounts, check if there are any knowledge
  base articles about enterprise customer retention strategies, and then export a
  formal CRM report summarizing the enterprise customer portfolio with key insights
  about their revenue, status, and any retention risks.

  '
reference_solution:
- Call list_customers with tier=enterprise to retrieve the four enterprise customers
  (cust-001, cust-002, cust-003, cust-004).
- Optionally call get_customer for individual customers to retrieve full details including
  revenue and last_contact.
- Call list_transactions with start_date=2024-07-01 and end_date=2024-09-30 to retrieve
  Q3 financial transactions.
- Review transactions to identify Apex Financial Partners' credit adjustment (txn-105,
  -$15,000) as a risk signal and Brightwave Media's final invoice (txn-103) as churn
  context.
- Call search_articles with query="enterprise customer retention" or category=retention
  to find relevant KB articles.
- Review kb-201 (Enterprise Customer Retention Best Practices) and kb-202 (At-Risk
  Account Playbook) for guidance to include in the report.
- Call export_report with a title such as "Q3 Enterprise Customer Health Report",
  customer_ids=[cust-001, cust-002, cust-003, cust-004], and a summary that covers
  active vs. at-risk vs. churned status, Q3 revenue contributions, the Apex Financial
  Partners risk situation with the credit adjustment, Brightwave Media churn, and
  KB-backed retention recommendations.
- Present the exported report details and key insights in the final text output, highlighting
  Apex Financial Partners as the primary at-risk account requiring immediate action
  per the at-risk playbook.
