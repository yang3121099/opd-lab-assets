- check:
    rubric: 'Evaluate the agent''s written summary on the following dimensions:

      1. KB Article Coverage (0–0.3): Did the agent retrieve and accurately summarize
      content from at least two KB articles, specifically kb-501 ("Enterprise Customer
      Onboarding Best Practices" by Sarah Nguyen) and kb-502 ("VIP and High-Value
      Customer Handling Guidelines" by James Okafor)? Award 0.3 if both are clearly
      referenced with key details (e.g., 90-day ramp plan, quarterly EBRs, named account
      manager), 0.15 if only one is covered, 0.0 if neither.

      2. Customer Identification (0–0.3): Did the agent correctly identify the active
      enterprise customers — Meridian Logistics (cust-101), Apex Financial Group (cust-102),
      and Greenfield Tech (cust-103) — and note that Northstar Healthcare (cust-105)
      is inactive? Award 0.3 if all three active enterprise customers are named and
      the inactive one is flagged, 0.15 if at least two active ones are named, 0.0
      if fewer than two.

      3. Transaction Insights (0–0.2): Did the agent surface relevant transaction
      data, such as Apex Financial Group''s combined transactions (txn-3002: $72,000
      and txn-3005: $15,000) or Meridian Logistics'' renewal (txn-3001: $48,000)?
      Award 0.2 if at least two transactions are cited with amounts, 0.1 if one is
      cited, 0.0 if none.

      4. Report Export and Synthesis (0–0.2): Did the agent confirm that a CRM export
      report was generated and provide a coherent synthesis linking KB guidance to
      the customer data (e.g., recommending EBRs for VIP customers, noting onboarding
      steps for new enterprise accounts)? Award 0.2 if both confirmed and synthesized,
      0.1 if only one, 0.0 if neither.

      Total score is the sum of the four dimensions (max 1.0).

      '
    type: llm_judge
  name: output_quality_and_completeness
  weight: 0.25
