  kb:
    articles:
    - author: Sarah Nguyen
      category: onboarding
      content: Enterprise onboarding requires a dedicated success manager, a 90-day
        structured ramp plan, and executive sponsor alignment. Key milestones include
        kickoff within 5 business days, integration review at day 30, and first value
        checkpoint at day 60. Ensure all enterprise accounts have SLA documentation
        signed before go-live.
      id: kb-501
      last_updated: '2024-08-14'
      title: Enterprise Customer Onboarding Best Practices
    - author: James Okafor
      category: customer_success
      content: VIP customers (enterprise tier with revenue >$300K annually) require
        quarterly executive business reviews (EBRs), a named account manager, and
        priority support routing. Escalations must be acknowledged within 1 hour.
        Proactive outreach should occur at least monthly. Ensure CRM records are updated
        within 24 hours of any interaction.
      id: kb-502
      last_updated: '2024-09-22'
      title: VIP and High-Value Customer Handling Guidelines
    - author: Priya Sharma
      category: operations
      content: All customer records must include a valid email, tier classification,
        and last_contact date within 90 days. Inactive accounts should be reviewed
        quarterly. Revenue figures must be reconciled with finance records monthly.
      id: kb-503
      last_updated: '2024-10-05'
      title: CRM Data Quality Standards
    - author: Marcus Lee
      category: support
      content: Enterprise SLAs guarantee 99.9% uptime and 4-hour response times for
        critical issues. SLA breaches must be logged in the CRM and escalated to the
        VP of Customer Success within 2 hours. Monthly SLA reports are required for
        all enterprise accounts.
      id: kb-504
      last_updated: '2024-07-30'
      title: Escalation and SLA Management
prompt: 'Our sales team is onboarding a new batch of enterprise customers and needs
  a consolidated briefing. First, pull up the knowledge base articles on enterprise
  onboarding best practices and VIP customer handling so we can verify they are current
  and accurate. Then identify our active enterprise-tier customers from the CRM, look
  up any recent high-value transactions tied to them, and finally export a CRM report
  summarizing the VIP customers along with key insights drawn from the KB articles
  and transaction data. Provide a full written summary of your findings and the report
  you generated.

  '
reference_solution:
- Search the knowledge base for enterprise onboarding and VIP customer handling articles
  (search_articles with relevant queries).
- Retrieve kb-501 ("Enterprise Customer Onboarding Best Practices") using get_kb_article
  with id kb-501.
- Retrieve kb-502 ("VIP and High-Value Customer Handling Guidelines") using get_kb_article
  with id kb-502.
- List active enterprise customers from the CRM using list_customers with filters
  status=active and tier=enterprise, identifying cust-101 (Meridian Logistics), cust-102
  (Apex Financial Group), and cust-103 (Greenfield Tech).
- Note that cust-105 (Northstar Healthcare) is enterprise but inactive and should
  be flagged for review per KB data quality standards.
- List recent transactions using list_transactions with a November 2024 date range
  to surface txn-3001, txn-3002, txn-3003, and txn-3005 tied to enterprise customers.
- Review key transactions such as Apex Financial Group's $72,000 consulting engagement
  (txn-3002) and $15,000 implementation (txn-3005), and Meridian Logistics' $48,000
  renewal (txn-3001).
- Export a CRM report using export_report with a title like "Active Enterprise VIP
  Customer Briefing", including customer IDs [cust-101, cust-102, cust-103], and a
  summary incorporating KB guidance and transaction highlights.
- Write a comprehensive text summary covering: KB article key points (90-day ramp,
    quarterly EBRs, SLA requirements), the three active enterprise customers and their
    revenue/transaction data, the inactive account flag for Northstar Healthcare,
    and actionable recommendations for the sales team.
