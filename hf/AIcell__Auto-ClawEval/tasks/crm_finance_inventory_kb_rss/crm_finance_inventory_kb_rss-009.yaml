  inventory:
    products:
    - category: manufacturing-supplies
      id: prod-101
      min_stock: 20
      name: Industrial Conveyor Belt Kit
      price: 1250.0
      quantity: 4
      supplier: BeltTech Industries
    - category: logistics-equipment
      id: prod-102
      min_stock: 15
      name: Warehouse Shelving Unit (Heavy Duty)
      price: 890.0
      quantity: 3
      supplier: StorePro Supplies
    - category: retail-fixtures
      id: prod-103
      min_stock: 25
