prompt: 'Our sales team is onboarding several new enterprise customers this quarter
  and wants to ensure our knowledge base is aligned with their industries. Search
  the knowledge base for onboarding and industry-specific articles, then cross-reference
  with our current active enterprise customers to identify any knowledge gaps. Finally,
  export a CRM report summarizing the enterprise customers and publish a newsletter
  to our RSS channel highlighting the top onboarding resources found. Provide a full
  summary of your findings and recommendations.

  '
reference_solution: '1. Call search_articles (kb) with query "onboarding" and category
  "onboarding" to retrieve relevant KB articles (kb-001 through kb-006). 2. Optionally
  call get_kb_article for specific articles to review their content in detail. 3.
  Call list_customers (crm) with tier "enterprise" and status "active" to retrieve
  the five enterprise customers: Apex Financial Group, MedCore Health Systems, Brightline
  Retail Co., Nexus SaaS Inc., and Ironclad Manufacturing Ltd. 4. Optionally call
  get_customer for individual customers to confirm industry details. 5. Cross-reference
  the KB articles with customer industries: kb-002 → Apex Financial Group, kb-003
  → MedCore Health Systems, kb-004 → Brightline Retail Co., kb-005 → Nexus SaaS Inc.,
  kb-006 → Ironclad Manufacturing Ltd. Note that kb-004 is under customer-success
  rather than onboarding, and no logistics article exists for Greenfield Logistics.
  6. Call export_report (crm) with the five enterprise customer IDs (cust-101 to cust-105)
  and a summary of the knowledge alignment findings. 7. Call list_feeds (rss) to identify
  available RSS channels, then call publish_newsletter with a title like "Top Onboarding
  Resources for Enterprise Clients", content referencing the top KB articles (kb-001,
  kb-002, kb-003, kb-005), and appropriate recipients. 8. Provide a written summary
  covering: the five enterprise customers, their matched KB articles, identified gaps
  (logistics coverage, retail article categorization), the exported report, and the
  published newsletter details.'
