- check:
    rubric: 'Evaluate the quality of the agent''s knowledge gap analysis. The agent
      should have: (1) Identified the five active enterprise customers: Apex Financial
      Group (cust-101, financial-services), MedCore Health Systems (cust-102, healthcare),
      Brightline Retail Co. (cust-103, retail), Nexus SaaS Inc. (cust-104, technology),
      and Ironclad Manufacturing Ltd. (cust-105, manufacturing). (2) Searched the
      knowledge base for onboarding articles and matched them to customer industries
      — noting that kb-002 covers financial services, kb-003 covers healthcare, kb-004
      covers retail, kb-005 covers SaaS/technology, and kb-006 covers manufacturing.
      (3) Identified any gaps — notably that Greenfield Logistics (logistics industry)
      lacks a dedicated onboarding article, or that the retail article (kb-004) is
      categorized under customer-success rather than onboarding. Score 1.0 if all
      five enterprise customers are identified, at least three KB articles are matched
      to industries, and at least one gap or observation is noted. Score 0.7 if four
      customers are identified and two articles matched. Score 0.4 if only partial
      customer or article coverage with minimal gap analysis. Score 0.0 if no meaningful
      analysis is present.

      '
    type: llm_judge
  name: knowledge_gap_analysis_quality
  weight: 0.25
- check:
    rubric: 'Evaluate whether the agent produced a high-quality CRM export and newsletter.
      For the CRM export: it should include the five enterprise customer IDs (cust-101
      through cust-105) and a meaningful summary describing the onboarding knowledge
      alignment findings. For the newsletter: it should have a clear title related
      to onboarding resources, reference at least two specific KB articles (e.g.,
      kb-001 ''Enterprise Onboarding Best Practices'', kb-005 ''SaaS Platform Onboarding
      Workflow''), and be directed at a relevant audience. Score 1.0 if both the export
      and newsletter are complete, specific, and reference actual fixture data. Score
      0.6 if one of the two (export or newsletter) is well-formed but the other is
      vague or missing key details. Score 0.3 if both are present but generic with
      no reference to specific customers or articles. Score 0.0 if either the export
      or newsletter is entirely absent.

      '
    type: llm_judge
  name: newsletter_and_export_quality
  weight: 0.25
