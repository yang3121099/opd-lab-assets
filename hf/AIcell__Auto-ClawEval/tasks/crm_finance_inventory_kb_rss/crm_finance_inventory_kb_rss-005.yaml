- description: Get detailed information about a specific customer by customer_id
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with a title, list of customer IDs, and summary
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
- description: List finance transactions filtered by date range
  endpoint: /finance/transactions
  method: POST
  name: list_transactions
