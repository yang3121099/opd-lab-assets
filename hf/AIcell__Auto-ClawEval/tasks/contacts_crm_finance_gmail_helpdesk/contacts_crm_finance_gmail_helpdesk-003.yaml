- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: sent_messages_to_engineers
  weight: 0.15
- check:
    keywords:
    - tkt-2201
    - 503
    type: keywords_present
  name: correct_ticket_referenced_in_output
  weight: 0.15
- check:
    keywords:
    - Priya Nair
    - Marcus Webb
    - Sofia Delgado
    - Lena Hoffmann
    type: keywords_present
  name: engineers_named_in_summary
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s overall performance on this outage notification
      task across three dimensions:

      1. TICKET IDENTIFICATION (0.0–0.33): Did the agent correctly identify the critical/high-priority
      tickets? The agent should have identified tkt-2201 ("CRITICAL: Main application
      API returning 503 errors") as the primary ticket, and ideally tkt-2202 as a
      secondary concern. Score 0.33 if both identified, 0.20 if only tkt-2201, 0.0
      if neither.

      2. ENGINEER NOTIFICATION COVERAGE (0.0–0.33): Did the agent send messages to
      all four Engineering department contacts — Priya Nair (c-001), Marcus Webb (c-002),
      Sofia Delgado (c-003), and Lena Hoffmann (c-005)? Score 0.33 if all four notified,
      0.20 if three, 0.10 if two, 0.0 if one or none. Non-engineering contacts (James
      Okafor — Marketing, Rachel Kim — Finance) should NOT have been messaged.

      3. MESSAGE QUALITY AND SUMMARY (0.0–0.34): Were the messages personalized and
      informative (including ticket ID and issue description)? Does the final summary
      clearly state who was notified, which ticket(s) were referenced, and what action
      engineers should take? Score 0.34 for a complete, professional summary; 0.17
      for a partial summary missing key details; 0.0 for no meaningful summary.

      Sum the three dimension scores for a total between 0.0 and 1.0.

      '
    type: llm_judge
  name: quality_of_outreach_and_summary
  weight: 0.25
