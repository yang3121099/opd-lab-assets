- check:
    keywords:
    - '5605'
    - Patricia
    - Nguyen
    type: keywords_present
  name: correct_total_and_transactions_identified
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s overall performance on this task across three dimensions:

      1. EXPENSE REPORT ACCURACY (0.0–0.4): Did the agent correctly identify the six
      offsite-related transactions (txn-101 through txn-106) and exclude the unrelated
      SaaS subscription (txn-107)? Did the agent calculate the correct total of $5,605.00
      (3200 + 640 + 850 + 420 + 310 + 185)? Was the report submitted with the exact
      title "Q3 Engineering Offsite Expenses"? Score 0.4 if all correct, 0.2 if total
      is right but one transaction is wrong, 0.0 if total is significantly off or
      wrong title used.

      2. CONTACT IDENTIFICATION (0.0–0.3): Did the agent correctly identify Patricia
      Nguyen (cnt-201) as the Finance Director and send the message to her specifically,
      not to another Finance contact like James Thornton (cnt-204)? Score 0.3 if Patricia
      Nguyen was messaged, 0.0 if wrong contact was messaged.

      3. MESSAGE QUALITY (0.0–0.3): Did the message sent to Patricia Nguyen clearly
      communicate that the expense report has been submitted, include the report title
      "Q3 Engineering Offsite Expenses", and state the total amount of $5,605.00?
      Score 0.3 if all three elements are present, 0.15 if two are present, 0.0 if
      the message is vague or missing key information.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.3
