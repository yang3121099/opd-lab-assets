prompt: 'Our engineering team recently held a quarterly offsite and I need to wrap
  up the financials. Please review the offsite-related transactions from our finance
  records, compile a formal expense report titled "Q3 Engineering Offsite Expenses"
  summarizing the costs, and then find the Finance Director in our contacts directory
  and send them a message letting them know the report has been submitted and what
  the total came to.

  '
reference_solution: "1. Call list_transactions with a date range covering September\
  \ 2024 to retrieve all recent transactions. 2. Review the results and identify the\
  \ six offsite-related transactions: txn-101 (hotel, $3,200), txn-102\n   (team dinner,\
  \ $640), txn-103 (conference room, $850), txn-104 (team lunch, $420), txn-105 (shuttle,\
  \ $310),\n   and txn-106 (supplies, $185). Exclude txn-107 (SaaS subscription, $999)\
  \ as it is unrelated to the offsite.\n3. Calculate the total: $3,200 + $640 + $850\
  \ + $420 + $310 + $185 = $5,605.00. 4. Call submit_report with title \"Q3 Engineering\
  \ Offsite Expenses\", the list of offsite transaction IDs, a\n   summary of the\
  \ costs, and total_amount of 5605.00.\n5. Call search_contacts with a query for\
  \ \"Finance Director\" or department \"Finance\" to find Patricia Nguyen. 6. Call\
  \ get_contact with cnt-201 to confirm Patricia Nguyen's details. 7. Call send_message\
  \ to cnt-201 with a message informing her that the \"Q3 Engineering Offsite Expenses\"\
  \ report\n   has been submitted with a total of $5,605.00.\n8. Report back to the\
  \ user confirming the expense report submission and the notification sent to Patricia\
  \ Nguyen."
