- check:
    rubric: "Evaluate the agent's output on the following dimensions:\n1. CUSTOMER\
      \ IDENTIFICATION (0.0–0.4): Did the agent correctly identify all 5 active enterprise-tier\
      \ customers?\n   Full credit (0.4) if all five are named: Meridian Financial\
      \ Group (cust-001, $285,000),\n   Apex Logistics Inc (cust-002, $412,000), Solaris\
      \ Tech Partners (cust-004, $530,000),\n   Cascade Manufacturing (cust-006, $367,000),\
      \ and Pinnacle Energy Solutions (cust-007, $621,000).\n   Partial credit (0.2)\
      \ if 3–4 are named. Zero if fewer than 3.\n   The churned customer Northgate\
      \ Healthcare must NOT be included.\n   The mid-market customer Brightwater Retail\
      \ Co must NOT be included.\n\n2. INTERNAL MESSAGE QUALITY (0.0–0.3): Did the\
      \ agent send a clear, useful internal message to Marcus Webb\n   (the Enterprise\
      \ Account Manager) summarizing the customers he needs to follow up with?\n \
      \  Full credit (0.3) if the message is addressed to the correct person and includes\
      \ the customer names.\n   Partial credit (0.15) if the message is sent but incomplete\
      \ or to the wrong person.\n\n3. EMAIL TO SALES DIRECTOR (0.0–0.3): Did the agent\
      \ send a well-structured email to sarah.chen@company.com\n   that includes the\
      \ active enterprise customer list with revenue figures?\n   Full credit (0.3)\
      \ if the email contains customer names and revenue amounts.\n   Partial credit\
      \ (0.15) if the email is sent but missing revenue data or customer details.\n\
      \nScore: Sum the three dimension scores (max 1.0).\n"
    type: llm_judge
  name: output_quality_and_completeness
  weight: 0.2
task_id: contacts_crm_finance_gmail_helpdesk-004
task_name: VIP Customer Renewal Outreach Coordination
tools:
- description: List CRM customers, optionally filtered by status, tier, or industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Get detailed information about a specific CRM customer by ID
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with selected customers and a summary
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
- description: Search the internal contacts directory by name, department, or keyword
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Get full details for a specific internal contact by ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send an internal message to a contact by their contact ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
- description: Send an email to a recipient with a subject and body
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
