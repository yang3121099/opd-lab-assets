prompt: 'Our sales team is preparing for Q4 renewal season. Please identify all active
  enterprise-tier customers from the CRM, then find the internal account manager responsible
  for enterprise accounts in the contacts directory, and send them a summary message
  listing the enterprise customers they need to follow up with. Also send an email
  to the sales director (sarah.chen@company.com) with the full list of active enterprise
  customers and their revenue figures so she can prioritize outreach.

  '
reference_solution: "1. Call list_customers with filters tier=enterprise and status=active\
  \ to retrieve active enterprise customers.\n   This should return: Meridian Financial\
  \ Group (cust-001), Apex Logistics Inc (cust-002),\n   Solaris Tech Partners (cust-004),\
  \ Cascade Manufacturing (cust-006), and Pinnacle Energy Solutions (cust-007).\n\
  \   Note that Northgate Healthcare (cust-003) is enterprise but churned, so it should\
  \ be excluded.\n   Brightwater Retail Co (cust-005) is mid-market and should also\
  \ be excluded.\n\n2. Call search_contacts with a query for \"enterprise account\
  \ manager\" or department=Sales to find Marcus Webb (contact-101).\n3. Call get_contact\
  \ with contact_id=contact-101 to confirm Marcus Webb's details and role.\n4. Call\
  \ send_message with contact_id=contact-101 and a message summarizing the 5 active\
  \ enterprise customers\n   he needs to follow up with for Q4 renewals, including\
  \ their names and industries.\n\n5. Call send_email with to=sarah.chen@company.com,\
  \ a subject such as \"Q4 Active Enterprise Customer Renewal List\",\n   and a body\
  \ listing all 5 active enterprise customers with their revenue figures\n   (Pinnacle\
  \ Energy $621,000, Solaris Tech $530,000, Apex Logistics $412,000,\n   Cascade Manufacturing\
  \ $367,000, Meridian Financial $285,000).\n\n6. Summarize the actions taken in the\
  \ text output, confirming the message was sent to Marcus Webb\n   and the email\
  \ was sent to Sarah Chen with the full enterprise customer list."
