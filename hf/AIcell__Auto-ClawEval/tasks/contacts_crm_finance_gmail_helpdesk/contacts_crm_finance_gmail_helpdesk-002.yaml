prompt: 'A high-priority support ticket has come in from a VIP customer who is very
  unhappy about a billing discrepancy. Find the open ticket related to billing, look
  up the customer involved, identify the internal account manager responsible for
  VIP accounts in the Finance or Accounts department from the contacts directory,
  and send them a direct message alerting them to the situation with the relevant
  ticket and customer details so they can intervene immediately.

  '
reference_solution:
- action: Call list_tickets with status='open' to retrieve all open helpdesk tickets.
  step: 1
- action: Identify TKT-1001 ('Billing discrepancy on Q3 invoice') as the relevant
    high-priority billing ticket.
  step: 2
- action: Call get_ticket with ticket_id='TKT-1001' to retrieve full ticket details
    including the customer name Hartwell Industries and the $4,200 overcharge description.
  step: 3
- action: Call list_customers or get_customer with customer_id='CUST-501' to retrieve
    Hartwell Industries' CRM profile and confirm their platinum tier status.
  step: 4
- action: Call search_contacts with query='VIP Account Manager' or department='Finance'
    to find the internal contact responsible for VIP accounts.
  step: 5
- action: Call get_contact with contact_id='CON-101' to retrieve Sandra Okafor's full
    contact details (VIP Account Manager, Finance).
  step: 6
- action: Call send_message with contact_id='CON-101' and a message that includes
    ticket TKT-1001, customer Hartwell Industries, the $4,200 billing discrepancy,
    the legal escalation threat, and a request for immediate intervention.
  step: 7
- action: 'Summarize the completed escalation in the text output: ticket found, customer
    identified, Sandra Okafor messaged with full context.'
  step: 8
