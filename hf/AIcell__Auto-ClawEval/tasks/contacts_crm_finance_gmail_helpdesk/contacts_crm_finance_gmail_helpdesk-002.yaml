    - Sandra Okafor
    - Hartwell Industries
    - TKT-1001
    - billing
    type: keywords_present
  name: key_details_in_output
  weight: 0.15
- check:
    rubric: "Evaluate the agent's escalation workflow on three dimensions:\n1. ACCURACY\
      \ (0–0.4): Did the agent correctly identify ticket TKT-1001 (\"Billing discrepancy\
      \ on Q3 invoice\")\n   as the relevant open billing ticket, link it to customer\
      \ Hartwell Industries (CUST-501, platinum tier,\n   $4,200 overcharge), and\
      \ identify Sandra Okafor (CON-101, VIP Account Manager, Finance) as the correct\n\
      \   internal contact to alert? Award 0.4 if all three are correct, 0.2 if two\
      \ are correct, 0.0 if fewer.\n\n2. MESSAGE QUALITY (0–0.4): Was the internal\
      \ message sent to Sandra Okafor informative and actionable?\n   It should include:\
      \ the ticket ID (TKT-1001), the customer name (Hartwell Industries), the nature\
      \ of\n   the issue (billing discrepancy / $4,200 overcharge), the urgency (legal\
      \ escalation threat), and a\n   clear call to action for the account manager.\
      \ Award 0.4 for all elements present, 0.2 for partial,\n   0.0 if the message\
      \ is vague or missing critical details.\n\n3. SUMMARY CLARITY (0–0.2): Does\
      \ the agent's final text output clearly summarize what was done —\n   which\
      \ ticket was found, which customer is affected, who was contacted, and what\
      \ was communicated?\n   Award 0.2 for a clear and complete summary, 0.1 for\
      \ partial, 0.0 for absent or confusing.\n\nTotal score = sum of the three dimension\
      \ scores (max 1.0).\n"
    type: llm_judge
  name: escalation_quality
  weight: 0.35
