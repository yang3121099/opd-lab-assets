    - Priya Nair
    - Marcus Webb
    - Leo Tanaka
    type: keywords_present
  name: contact_names_in_output
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s output on three dimensions:

      1. COVERAGE (0–0.4): Did the agent prepare draft emails for all three qualifying
      open tickets from Engineering/Sales contacts — tkt-101 (Priya Nair, priya.nair@techcorp.io,
      API rate limiting), tkt-102 (Marcus Webb, marcus.webb@globalretail.com, pricing
      discrepancy), and tkt-104 (Leo Tanaka, leo.tanaka@techcorp.io, dashboard performance)?
      Award 0.4 if all three are covered, 0.2 if two, 0.1 if one, 0.0 if none.

      2. PERSONALIZATION & ACCURACY (0–0.4): Do the drafts address each contact by
      name, reference their specific ticket issue, and correctly identify their CRM
      customer account (TechCorp for Priya and Leo, GlobalRetail for Marcus)? Award
      0.4 if all drafts are personalized with correct details, 0.2 if partially correct,
      0.0 if generic or incorrect.

      3. SUMMARY QUALITY (0–0.2): Does the agent provide a clear summary of what was
      prepared, listing the contacts, ticket IDs, and confirming drafts were saved?
      Award 0.2 for a complete summary, 0.1 for a partial summary, 0.0 if no summary.

      Total score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: draft_quality_and_completeness
  weight: 0.35
