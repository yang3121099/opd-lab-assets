prompt: 'We have several open helpdesk tickets from VIP enterprise clients that need
  personal attention from our account management team. For each open ticket created
  by a contact in the Engineering or Sales department, look up the contact''s details,
  check if they are a CRM customer, and prepare a draft email response addressing
  their issue by name and referencing their ticket. Save all drafts so the account
  manager can review and send them later. Summarize what you prepared.

  '
reference_solution:
- Call list_tickets with status=open to retrieve all open helpdesk tickets (tkt-101,
  tkt-102, tkt-104, tkt-105).
- Review each ticket's created_by field to identify the submitter's email address.
- For each open ticket, call search_contacts to find the contact record matching the
  submitter's email.
- Identify that tkt-101 (priya.nair@techcorp.io) maps to Priya Nair in Engineering,
  tkt-102 (marcus.webb@globalretail.com) maps to Marcus Webb in Sales, tkt-104 (leo.tanaka@techcorp.io)
  maps to Leo Tanaka in Engineering, and tkt-105 (rachel.bloom@globalretail.com) maps
  to Rachel Bloom in Marketing.
- Filter to only Engineering and Sales contacts: Priya Nair (tkt-101), Marcus Webb
    (tkt-102), Leo Tanaka (tkt-104).
- Call list_customers or search CRM to identify that TechCorp (cust-501) is the enterprise
  account for Priya and Leo, and GlobalRetail (cust-502) is the enterprise account
  for Marcus.
- Call create_draft three times — one for each qualifying contact — with personalized
  subject lines referencing the ticket title, the contact's name in the greeting,
  a summary of their reported issue, and a note that the account team is prioritizing
  their case.
- Summarize in the output: the three drafts saved, the contact names, ticket IDs,
    and their respective issues.
