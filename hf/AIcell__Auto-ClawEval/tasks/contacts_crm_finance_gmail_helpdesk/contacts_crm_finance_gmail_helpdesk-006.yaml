  name: crm_report_exported
  weight: 0.15
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: sales_contacts_messaged
  weight: 0.1
- check:
    keywords:
    - Meridian Logistics Group
    - Apex Financial Partners
    - Solaris Tech Ventures
    type: keywords_present
  name: tier1_customers_identified
  weight: 0.15
- check:
    keywords:
    - Rachel Nguyen
    - Derek Okafor
    - James Whitfield
    type: keywords_present
  name: sales_contacts_named
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s output on three dimensions:

      1. CRM Export Completeness (0.0–0.4): Did the agent export a report that includes
      all three Tier 1 active customers — Meridian Logistics Group (cust-101), Apex
      Financial Partners (cust-102), and Solaris Tech Ventures (cust-104)? Did the
      export summary mention the Sales contacts coordinating outreach? Score 0.4 if
      all three customers and Sales contacts are referenced in the export, 0.2 if
      partially complete, 0.0 if missing.

      2. Sales Contact Outreach (0.0–0.4): Did the agent send internal messages to
      all three Sales department contacts — Rachel Nguyen (cont-201), Derek Okafor
      (cont-202), and James Whitfield (cont-204)? Were non-Sales contacts like Priya
      Mehta (Marketing) and Sandra Kowalski (Operations) correctly excluded? Score
      0.4 if all three Sales contacts were messaged and non-Sales excluded, 0.2 if
      one Sales contact was missed or a non-Sales contact was incorrectly included,
      0.0 if outreach was largely incorrect.

      3. Output Clarity and Summary (0.0–0.2): Does the agent''s final text response
      clearly summarize what was done — which customers were included in the report,
      which Sales contacts were notified, and confirm the export was submitted? Score
      0.2 for a clear and complete summary, 0.1 for a partial summary, 0.0 for a vague
      or missing summary.

      Total score is the sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.3
