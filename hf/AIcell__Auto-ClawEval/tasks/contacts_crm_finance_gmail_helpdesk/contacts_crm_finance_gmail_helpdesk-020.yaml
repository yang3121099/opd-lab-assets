prompt: 'There''s a critical production outage affecting the payment processing system.
  I need you to find all contacts in the Engineering department, check if any open
  helpdesk tickets are related to this outage, and send each engineering contact a
  direct message alerting them about the situation — include the relevant ticket ID
  and a brief summary of the issue so they can act immediately. Summarize what you
  did and who you notified.

  '
reference_solution:
- Search contacts with department filter set to Engineering to retrieve all engineering
  staff.
- Identify the four Engineering contacts returned: Priya Nair (c-001), Marcus Webb
    (c-002), Yuki Tanaka (c-003), and Rafael Moreno (c-005).
- List open helpdesk tickets to find outage-related issues.
- Identify ticket tkt-881 ("Payment Processing Service Down") as the critical, relevant
  ticket.
- Retrieve full details of tkt-881 to get the description, priority, and impact summary.
- Send a direct message to each of the four engineering contacts (c-001, c-002, c-003,
  c-005) via send_message, including ticket ID tkt-881, a summary of the payment processing
  outage, and a request for immediate action.
- Output a summary listing all four engineers notified, the ticket referenced, and
  the content of the alert sent.
