  name: correct_ticket_referenced
  weight: 0.1
- check:
    keywords:
    - Priya Nair
    - Marcus Webb
    - Yuki Tanaka
    - Rafael Moreno
    type: keywords_present
  name: all_engineers_identified
  weight: 0.15
- check:
    keywords:
    - payment
    - outage
    type: keywords_present
  name: outage_context_in_output
  weight: 0.1
- check:
    rubric: "Evaluate the agent's overall performance on this outage notification\
      \ task. Score across these dimensions:\n1. CONTACT IDENTIFICATION (0–0.25):\
      \ Did the agent correctly identify all four Engineering contacts\n   (Priya\
      \ Nair c-001, Marcus Webb c-002, Yuki Tanaka c-003, Rafael Moreno c-005) and\
      \ exclude\n   non-Engineering contacts like Danielle Osei (Finance) and Chloe\
      \ Bergmann (Marketing)?\n\n2. TICKET RELEVANCE (0–0.25): Did the agent correctly\
      \ identify ticket tkt-881\n   (\"Payment Processing Service Down\") as the relevant\
      \ critical outage ticket, and not confuse it\n   with lower-priority tickets\
      \ tkt-882 or tkt-883?\n\n3. MESSAGE CONTENT (0–0.25): Were the messages sent\
      \ to each engineer informative and actionable?\n   Did they include the ticket\
      \ ID (tkt-881), a description of the payment processing outage,\n   and a call\
      \ to action for immediate response?\n\n4. SUMMARY QUALITY (0–0.25): Did the\
      \ agent provide a clear summary of who was notified (all four\n   engineers\
      \ by name), what ticket was referenced, and confirm that messages were sent?\n\
      \nScore 1.0 if all four dimensions are fully satisfied. Score 0.75 if three\
      \ dimensions are satisfied. Score 0.5 if two dimensions are satisfied. Score\
      \ 0.25 if only one dimension is satisfied. Score 0.0 if the agent failed to\
      \ notify engineers or referenced the wrong ticket entirely.\n"
    type: llm_judge
  name: message_quality_and_completeness
  weight: 0.3
