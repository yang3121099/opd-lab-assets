  name: checked_user_calendars
  weight: 0.1
- check:
    action: create_event
    service: calendar
    type: audit_action_exists
  description: Agent created the Q3 Engineering Sync event
  name: event_created
  weight: 0.1
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  description: Agent sent a summary email
  name: email_sent_to_marcus
  weight: 0.1
- check:
    action: create_event
    field: location
    service: calendar
    type: audit_field_equals
    value: Eng-Lab B
  description: Event was created with the correct location Eng-Lab B
  name: event_location_correct
  weight: 0.1
- check:
    keywords:
    - Priya
    - Tomás
    - Sprint Planning
    - conflict
    type: keywords_present
  description: Agent's output identifies Priya Nair and Tomás Herrera as having a
    conflict due to Sprint Planning
  name: conflicts_identified_in_output
  weight: 0.15
- check:
    keywords:
    - Yuki
    - Brendan
    - Fatima
    - Engineering
    type: keywords_present
  description: Agent's output references the Engineering team members being included
  name: engineering_attendees_mentioned
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. CONFLICT DETECTION (0.0–0.4): Did the agent correctly identify that Priya
      Nair (priya.nair@company.com) and Tomás Herrera (tomas.herrera@company.com)
      have a conflict at 2:00 PM on 2024-07-16 due to "Sprint Planning" (evt-001)?
      Did the agent note that Yuki Tanaka, Brendan O''Sullivan, and Fatima Al-Rashid
      appear free at 2:00 PM? Award 0.4 if all conflicts and free attendees are correctly
      identified, 0.2 if partial, 0.0 if missed entirely.

      2. EVENT CREATION ACCURACY (0.0–0.3): Did the agent create the event titled
      "Q3 Engineering Sync" at 2024-07-16 14:00 with all four Engineering contacts
      (priya.nair, tomas.herrera, yuki.tanaka, brendan.osullivan, fatima.alrashid)
      as attendees and location "Eng-Lab B"? Award 0.3 if fully correct, 0.15 if mostly
      correct with minor omissions, 0.0 if event not created or major details wrong.

      3. EMAIL SUMMARY QUALITY (0.0–0.3): Did the agent send Marcus Webb (marcus.webb@company.com)
      a clear, professional email summarizing the availability check results, naming
      the conflicted attendees and confirming the meeting was created? Award 0.3 if
      the email is clear, accurate, and addresses Marcus directly, 0.15 if partially
      complete, 0.0 if no email or email is missing key information.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: quality_and_completeness
  weight: 0.2
