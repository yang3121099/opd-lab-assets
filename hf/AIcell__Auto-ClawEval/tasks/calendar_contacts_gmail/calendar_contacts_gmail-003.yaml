- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. INFORMATION GATHERING (0.0–0.33): Did the agent correctly identify the relevant
      email (msg-001 from Diana Chen about the Phoenix Initiative), extract the three
      attendees (Diana Chen, Marcus Webb, Priya Nair), and look up their contact details
      including emails (diana.chen@company.com, marcus.webb@company.com, priya.nair@company.com)?

      2. EVENT CREATION ACCURACY (0.0–0.33): Was the event created with the correct
      title referencing "Phoenix Initiative", scheduled for next Monday at 10:00 AM–11:30
      AM, in Conference Room B, and with all three attendees included?

      3. SUMMARY QUALITY (0.0–0.34): Does the agent''s final summary clearly confirm
      the meeting was created, name all three invitees with their roles/departments
      (Marcus Webb from Engineering, Priya Nair from Marketing, Diana Chen from Product),
      and provide enough detail for the user to verify the booking?

      Score 1.0 if all three dimensions are fully satisfied, 0.7 if two are fully
      satisfied, 0.4 if only one is fully satisfied, 0.0 if the agent failed to create
      the event or missed all attendees.

      '
    type: llm_judge
  name: meeting_quality_and_completeness
  weight: 0.3
