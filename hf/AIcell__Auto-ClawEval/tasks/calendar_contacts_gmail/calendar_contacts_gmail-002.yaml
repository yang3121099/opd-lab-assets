prompt: 'I think there may be a scheduling conflict with our upcoming board meeting.
  Can you look up the details of event EVT-2024-0815 and check whether any of the
  attendees have other commitments on that same day? If you find a conflict, please
  send an email to Sarah Chen letting her know about the overlap and suggest she review
  her schedule.

  '
reference_solution:
- Call GET /calendar/events/get with event_id='EVT-2024-0815' to retrieve full details
  of the Q3 Board Strategy Meeting, including attendees, time (09:00–11:30 on 2024-09-12),
  and location.
- Call POST /calendar/user_events for each attendee (sarah.chen@company.com, marcus.wright@company.com,
  linda.park@company.com, david.okafor@company.com) on date 2024-09-12 to check their
  individual schedules.
- Identify that Sarah Chen is also organizer/attendee of the Product Roadmap Review
  (EVT-2024-0816, 10:00–12:00) which overlaps with the board meeting from 10:00–11:30.
- Optionally identify that David Okafor has a 1:1 Coaching Session (EVT-2024-0801,
  09:30–10:00) also overlapping with the board meeting.
- Call POST /contacts/search with query='Sarah Chen' to retrieve her contact details
  including email sarah.chen@company.com.
- Call POST /gmail/send to email Sarah Chen at sarah.chen@company.com, informing her
  of the scheduling conflict between the Q3 Board Strategy Meeting and her Product
  Roadmap Review, and suggesting she review and resolve the overlap.
- Report the findings in the text output, summarizing the conflict details, the email
  sent, and any other attendees with potential issues.
