  name: board_meeting_facts_accurate
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s response on three dimensions:

      1. CONFLICT IDENTIFICATION (0.0–0.4): Did the agent correctly identify that
      Sarah Chen has a scheduling conflict — specifically that the Q3 Board Strategy
      Meeting (EVT-2024-0815, 09:00–11:30) overlaps with the Product Roadmap Review
      (EVT-2024-0816, 10:00–12:00) on September 12, 2024? Award 0.4 if the overlap
      is clearly and accurately described, 0.2 if partially described, 0.0 if missed.

      2. EMAIL QUALITY (0.0–0.4): Was the email sent to Sarah Chen (sarah.chen@company.com)
      professional, clear, and actionable? Did it mention the specific conflicting
      events by name, the overlap time window (10:00–11:30), and suggest she review
      or resolve her schedule? Award 0.4 for a complete, professional email with all
      key details, 0.2 if the email is present but missing key specifics, 0.0 if no
      email was sent or it is irrelevant.

      3. ADDITIONAL CONFLICTS NOTED (0.0–0.2): Did the agent also note that David
      Okafor has a 1:1 Coaching Session (EVT-2024-0801, 09:30–10:00) overlapping with
      the board meeting? Award 0.2 if mentioned, 0.0 if not.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: quality_and_completeness
  weight: 0.25
