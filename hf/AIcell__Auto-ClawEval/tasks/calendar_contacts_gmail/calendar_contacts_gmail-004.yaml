prompt: 'Our colleague Marcus Webb has just left the company effective immediately.
  Please find all of his upcoming meetings this week, cancel them by removing them
  from the calendar, and notify each of the other attendees (excluding Marcus) via
  email that the meeting has been cancelled due to an internal scheduling change.
  Summarize what you did when you''re done.

  '
reference_solution: "1. Check the inbox (list_inbox) and read the HR offboarding notice\
  \ (get_message for msg-001)\n   to confirm Marcus Webb's departure and email address.\n\
  2. Search contacts (search_contacts) for Marcus Webb to confirm his email, then\
  \ retrieve\n   his calendar events for the week using user_events or list_events\
  \ filtered to his address.\n3. Identify the events where Marcus is the organizer:\
  \ evt-101 (Q4 Budget Review),\n   evt-102 (Product Roadmap Sync), evt-103 (Weekly\
  \ Sales Stand-up), evt-105\n   (Client Onboarding Call - Vertex Inc.). Note that\
  \ evt-104 (All-Hands) is organized by\n   all-hands@acmecorp.com and should NOT\
  \ be deleted.\n4. Use get_event to confirm attendee lists for each event, then delete\
  \ each of the 4\n   Marcus-organized events using delete_event (evt-101, evt-102,\
  \ evt-103, evt-105).\n5. Look up attendee contact details as needed (search_contacts\
  \ / get_contact) and send\n   cancellation emails (send_email) to all non-Marcus\
  \ attendees: Sarah Kim, David Okafor,\n   Priya Nair, and Tom Ellison, mentioning\
  \ the specific meeting name and that it has been\n   cancelled due to an internal\
  \ scheduling change.\n6. Provide a written summary listing the 4 cancelled events,\
  \ the attendees notified, and\n   confirmation that the All-Hands meeting was left\
  \ intact."
