- check:
    rubric: "Evaluate the agent's handling of Marcus Webb's offboarding calendar cleanup.\
      \ Score on the following dimensions:\n1. COMPLETENESS OF DELETIONS (0.0–0.4):\
      \ Did the agent delete all Marcus-organized meetings\n   that should be cancelled?\
      \ The organizer-led events are evt-101 (Q4 Budget Review),\n   evt-102 (Product\
      \ Roadmap Sync), evt-103 (Weekly Sales Stand-up), and evt-105\n   (Client Onboarding\
      \ Call - Vertex Inc.). Note: evt-104 (All-Hands) was organized by\n   all-hands@acmecorp.com,\
      \ not Marcus, so deleting it would be incorrect.\n   Score 0.4 if all 4 correct\
      \ events deleted and evt-104 preserved, 0.2 if 2-3 correct\n   events deleted,\
      \ 0.0 if fewer than 2 or if evt-104 was incorrectly deleted.\n\n2. ATTENDEE\
      \ NOTIFICATION (0.0–0.4): Did the agent send cancellation emails to the\n  \
      \ non-Marcus attendees? Key people to notify include Sarah Kim (sarah.kim@acmecorp.com),\n\
      \   David Okafor (david.okafor@acmecorp.com), Priya Nair (priya.nair@acmecorp.com),\n\
      \   and Tom Ellison (tom.ellison@acmecorp.com). Score 0.4 if all relevant attendees\n\
      \   notified with appropriate cancellation messaging, 0.2 if at least half notified,\n\
      \   0.0 if no notifications sent.\n\n3. SUMMARY QUALITY (0.0–0.2): Does the\
      \ agent provide a clear, organized summary listing\n   which events were cancelled,\
      \ which attendees were notified, and any relevant notes\n   (e.g., All-Hands\
      \ was preserved)? Score 0.2 for a thorough and accurate summary,\n   0.1 for\
      \ a partial summary, 0.0 for no summary or a misleading one.\n\nFinal score\
      \ = sum of the three dimension scores (max 1.0).\n"
    type: llm_judge
  name: cancellation_quality
  weight: 0.35
