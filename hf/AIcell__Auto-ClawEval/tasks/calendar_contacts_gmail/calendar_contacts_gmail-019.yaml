- check:
    rubric: "Evaluate the agent's briefing email sent to Sarah Chen (sarah.chen@internal.com,\
      \ contact C-004). Score on the following dimensions:\n1. Contact completeness\
      \ (0.0–0.3): Does the briefing include Marcus Webb's full contact details —\n\
      \   name, title (VP of Enterprise Partnerships), email (marcus.webb@enterprisecorp.com),\n\
      \   phone (+1-415-555-0192), and department (Enterprise Solutions)?\n\n2. Calendar\
      \ accuracy (0.0–0.4): Does the briefing correctly identify the meetings involving\
      \ Marcus Webb\n   this week? It should mention at minimum:\n   - \"Q1 Enterprise\
      \ Partnership Review\" on 2024-03-18 in Conference Room A\n   - \"Contract Renewal\
      \ Discussion\" on 2024-03-20 via Zoom\n   - \"New Product Demo for Enterprise\
      \ Solutions\" on 2024-03-21 in Demo Suite, Floor 3\n   (Note: EVT-103 and EVT-105\
      \ do NOT involve Marcus and should NOT be listed as his meetings.)\n   Score\
      \ 0.4 if all 3 correct meetings are included and no incorrect ones, 0.2 if 2\
      \ correct, 0.1 if 1 correct.\n\n3. Usefulness and clarity (0.0–0.3): Is the\
      \ email well-organized, clearly addressed to Sarah Chen,\n   and actionable\
      \ for a new account manager preparing for client engagement?\n   Does it read\
      \ like a professional briefing rather than a raw data dump?\n\nFinal score =\
      \ sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: briefing_quality
  weight: 0.3
