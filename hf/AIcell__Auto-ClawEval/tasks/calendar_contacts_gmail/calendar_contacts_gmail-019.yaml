  method: POST
  name: get_contact
  service: contacts
- description: Send an internal message to a contact
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
- description: List calendar events starting from a date for a given number of days
  endpoint: /calendar/events
  method: POST
  name: list_events
  service: calendar
- description: Get full details of a specific calendar event by ID
  endpoint: /calendar/events/get
  method: POST
  name: get_event
  service: calendar
- description: Create a new calendar event
  endpoint: /calendar/events/create
  method: POST
  name: create_event
  service: calendar
- description: Delete a calendar event by ID
  endpoint: /calendar/events/delete
  method: POST
  name: delete_event
  service: calendar
- description: Get all events for a specific user on a given date
  endpoint: /calendar/user_events
  method: POST
  name: user_events
  service: calendar
- description: List emails in the inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
