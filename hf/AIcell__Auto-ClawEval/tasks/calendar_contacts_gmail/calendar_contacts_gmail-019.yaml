prompt: 'Our new account manager, Sarah Chen, is starting tomorrow and needs a briefing
  package for her first client meeting. The client is Marcus Webb from the Enterprise
  Solutions team. Please look up Marcus Webb''s contact details, check what calendar
  events involve him this week (starting 2024-03-18 for 7 days), and then send Sarah
  Chen an email summarizing Marcus''s contact info and any upcoming meetings she should
  be aware of. Sarah''s contact ID is C-004.

  '
reference_solution:
- description: Search for Marcus Webb using search_contacts with query 'Marcus Webb'
    to find his contact ID (C-001).
  step: 1
- description: 'Call get_contact with contact_id ''C-001'' to retrieve Marcus Webb''s
    full details: email, phone, title, and department.'
  step: 2
- description: Call get_contact with contact_id 'C-004' to retrieve Sarah Chen's email
    address (sarah.chen@internal.com) for sending the briefing.
  step: 3
- description: Call list_events with date '2024-03-18' and days 7 to retrieve all
    calendar events for the week.
  step: 4
- description: 'Review the returned events and identify those where Marcus Webb (marcus.webb@enterprisecorp.com)
    appears as an attendee: EVT-101 (Q1 Enterprise Partnership Review, Mar 18), EVT-102
    (Contract Renewal Discussion, Mar 20), and EVT-104 (New Product Demo for Enterprise
    Solutions, Mar 21).'
  step: 5
- description: 'Compose and send an email via send_email to sarah.chen@internal.com
    with subject such as ''Client Briefing: Marcus Webb — Enterprise Solutions'' including
    Marcus''s contact details and the three relevant upcoming meetings with dates,
    times, and locations.'
  step: 6
