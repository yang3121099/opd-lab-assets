prompt: 'I received a complaint email about a conference room double-booking situation
  this week. Please read the complaint email, identify which events are conflicting
  in the calendar, look up the organizers'' contact details, and give me a clear summary
  of the conflict including who organized each event, when they overlap, and a recommended
  resolution message I can send to one of the organizers.

  '
reference_solution:
- action: Call list_inbox to find recent unread emails, then call get_message on msg-501
    (the URGENT facilities complaint), msg-502 (James Okafor's reply), and msg-503
    (Sarah Chen's reply) to read the full context of the double-booking complaint.
  step: 1
- action: Call list_events for date 2024-11-14 to see all events that day, then call
    get_event for evt-101 (Q3 Budget Review) and evt-102 (Product Roadmap Sync) to
    confirm both are in Conference Room B and identify the overlap window (10:30–11:30
    AM).
  step: 2
- action: Call search_contacts for 'Sarah Chen' and 'James Okafor' (or search by email/department)
    to retrieve their full contact details including titles and phone numbers.
  step: 3
- action: 'Synthesize findings: evt-101 runs 10:00–11:30, evt-102 runs 10:30–12:00,
    both in Conference Room B — overlap is 10:30–11:30. Sarah Chen (Finance Director)
    has CFO Marcus Bell attending; James Okafor (Senior Product Manager) has remote
    attendees flying in.'
  step: 4
- action: Recommend a resolution — e.g., suggest James Okafor move to Conference Room
    A (which is free until 13:00) or reschedule to the afternoon, given the CFO's
    presence in Sarah's meeting makes it harder to move. Draft a polite message to
    James Okafor explaining the situation and proposing the alternative.
  step: 5
