    service: calendar
    type: audit_action_exists
  description: Agent retrieved details of the conflicting calendar events
  name: checked_calendar_events
  weight: 0.1
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  description: Agent searched for contact information of the event organizers
  name: looked_up_organizer_contacts
  weight: 0.1
- check:
    keywords:
    - Conference Room B
    - evt-101
    - evt-102
    - '10:30'
    type: keywords_present
  description: Agent's output identifies the specific conflicting events and overlap
    time
  name: conflict_details_in_output
  weight: 0.2
- check:
    keywords:
    - Sarah Chen
    - James Okafor
    type: keywords_present
  description: Agent correctly names both event organizers from the fixture data
  name: organizer_names_identified
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s conflict analysis and resolution recommendation
      on three dimensions:

      1. ACCURACY (0-1): Does the agent correctly identify that evt-101 (Q3 Budget
      Review, organizer Sarah Chen, Finance Director) and evt-102 (Product Roadmap
      Sync, organizer James Okafor, Senior Product Manager) both occupy Conference
      Room B on November 14th, and that they overlap between 10:30 AM and 11:30 AM?
      Score 1.0 if both events, both organizers, and the overlap window are correctly
      stated; 0.5 if partial; 0.0 if wrong.

      2. CONTEXT AWARENESS (0-1): Does the agent incorporate context from the emails
      — specifically that James has remote attendees flying in (msg-502) and that
      Sarah has the CFO Marcus Bell attending (msg-503) — when framing the difficulty
      of rescheduling? Score 1.0 if both constraints are acknowledged; 0.5 if one
      is mentioned; 0.0 if neither.

      3. RESOLUTION RECOMMENDATION (0-1): Does the agent provide a concrete, actionable
      recommendation — such as suggesting one party move to a different room, proposing
      a specific alternative time, or drafting a message to one organizer? Score 1.0
      if a specific and reasonable recommendation is given; 0.5 if vague; 0.0 if absent.

      Final score = average of the three dimensions.

      '
    type: llm_judge
  name: conflict_analysis_quality
  weight: 0.25
- check:
    rubric: 'Does the agent provide a ready-to-send or near-ready resolution message
      addressed to one of the organizers (Sarah Chen at sarah.chen@company.com or
      James Okafor at james.okafor@company.com)? Score 1.0 if the message is professional,
      references the specific conflict (Conference Room B, November 14), and proposes
      a concrete next step (e.g., move to another room, reschedule to a specific time).
      Score 0.5 if a message is present but lacks specifics or is too generic. Score
      0.0 if no message or draft is provided at all.

      '
    type: llm_judge
  name: resolution_message_provided
  weight: 0.15
