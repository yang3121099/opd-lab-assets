prompt: 'A colleague has emailed you about organizing an offsite strategy workshop
  for the product team next week. Review the email to get the details, look up the
  attendees'' contact information, check for any scheduling conflicts, and create
  the calendar event with all the right participants and location.

  '
reference_solution:
- Call list_inbox or get_message to retrieve email msg-001 from Diana Chen and read
  the workshop details.
- 'Extract event details: title ''Q3 Product Strategy Offsite'', date 2025-07-24,
  9:00 AM–5:00 PM, location ''The Grand Oak Conference Center, 450 Lakeview Drive'',
  attendees Diana Chen, Marcus Webb, Priya Nair, Tom Okafor.'
- Call search_contacts with department 'Product' or individual names to find email
  addresses for Marcus Webb (marcus.webb@company.com), Priya Nair (priya.nair@company.com),
  Tom Okafor (tom.okafor@company.com), and Diana Chen (diana.chen@company.com).
- Call list_events for 2025-07-24 to check for scheduling conflicts; note evt-001
  'Weekly Product Sync' at 10:00–10:30 AM involves Marcus Webb and overlaps with the
  offsite.
- Call create_event with title='Q3 Product Strategy Offsite', start_time='2025-07-24T09:00:00',
  end_time='2025-07-24T17:00:00', location='The Grand Oak Conference Center, 450 Lakeview
  Drive', attendees=['diana.chen@company.com','marcus.webb@company.com','priya.nair@company.com','tom.okafor@company.com'].
- Report back to the user confirming the event was created, listing all attendees,
  the location, and flagging the potential conflict with the Weekly Product Sync for
  Marcus Webb.
