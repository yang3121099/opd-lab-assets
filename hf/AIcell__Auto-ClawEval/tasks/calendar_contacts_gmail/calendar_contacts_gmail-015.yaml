  name: output_mentions_key_details
  weight: 0.1
- check:
    rubric: "Evaluate the agent's overall performance on this scheduling task across\
      \ three dimensions:\n1. INFORMATION GATHERING (0–0.33): Did the agent correctly\
      \ read email msg-001 from Diana Chen\n   to extract all event details (title\
      \ \"Q3 Product Strategy Offsite\", date 2025-07-24,\n   9:00 AM–5:00 PM, location\
      \ \"The Grand Oak Conference Center, 450 Lakeview Drive\",\n   attendees Diana\
      \ Chen, Marcus Webb, Priya Nair, Tom Okafor)? Did the agent look up\n   contact\
      \ emails for the attendees?\n\n2. CONFLICT AWARENESS (0–0.33): Did the agent\
      \ check the calendar for 2025-07-24 and note\n   that evt-001 \"Weekly Product\
      \ Sync\" (10:00–10:30 AM) involves Marcus Webb and may conflict\n   with the\
      \ all-day offsite? Did the agent mention this conflict or flag it to the user?\n\
      \n3. EVENT CREATION ACCURACY (0–0.34): Was the created event complete and accurate\
      \ — correct\n   title, correct date/time (9:00 AM to 5:00 PM on 2025-07-24),\
      \ correct location, and all\n   four attendee emails (diana.chen@company.com,\
      \ marcus.webb@company.com,\n   priya.nair@company.com, tom.okafor@company.com)\
      \ included?\n\nScore 1.0 if all three dimensions are fully satisfied, 0.7 if\
      \ two are fully satisfied, 0.4 if only one is fully satisfied, 0.1 if the agent\
      \ attempted the task but missed most key details, 0.0 if the agent failed to\
      \ create the event or produced incorrect output.\n"
    type: llm_judge
  name: event_quality_and_completeness
  weight: 0.35
