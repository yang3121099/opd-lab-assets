    - api_key: sf_prod_xK9mN2pQ8rL5vW3jY7tZ
      endpoint: https://mycompany.salesforce.com/services/oauth2
      id: intg-004
      name: Salesforce CRM
      notes: CRM integration — key rotated Q1 2023, next rotation due Q1 2024
