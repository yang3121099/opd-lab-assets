category: ops
claw_eval_id: T48_oss_comparison
difficulty: medium
fixtures:
  config:
    integrations:
    - api_key: sk_test_FAKE_0041_xxxxxx_xxx
      endpoint: https://api.stripe.com/v1
      id: intg-001
      name: Stripe Payment Gateway
      notes: Production payment processing — migrated from sandbox but keys not updated
      secret: whsec_test_placeholder_secret_123
      status: active
    - api_key: SG.FAKE_0001_xxxxxx_xxxxxx_xxxxxx_xxxxxx_xxxxxx_xxxxxx_xxxxxx_xxxxxxx
      endpoint: https://api.sendgrid.com/v3
