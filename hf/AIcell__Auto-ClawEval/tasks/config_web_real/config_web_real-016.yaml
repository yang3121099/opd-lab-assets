      notes: CI/CD pipeline — integration disabled pending security review
      secret: github_pat_changeme_replace_before_use
      status: inactive
    - api_key: dd_prod_m8nK3pR9sL6wV4jX2tY
      endpoint: https://api.datadoghq.com
