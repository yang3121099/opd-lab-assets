category: knowledge
claw_eval_id: T16_kb_search
difficulty: medium
fixtures:
  articles:
  - author: Priya Nair
    category: developer-guides
    content: 'Welcome to the platform API guide. This document explains how to interact
      with each REST endpoint in our system. Each REST endpoint accepts JSON payloads
      and returns structured responses. Authentication is required for all REST endpoint
      calls. Use your API key in the Authorization header.

      '
    id: art-001
    last_updated: '2023-08-15'
    title: Getting Started with Our Platform API
  - author: Marcus Webb
    category: admin-guides
    content: 'This article covers user account management. Administrators can create,
      update, and deactivate user accounts through the admin panel. Role assignments
      are managed via the settings dashboard. No direct API access is described here.

      '
    id: art-002
    last_updated: '2023-11-02'
    title: User Management Overview
  - author: Soo-Jin Park
    category: developer-guides
    content: 'Webhooks allow your application to receive real-time notifications.
      Configure each REST endpoint listener in the integrations panel. Ensure your
      REST endpoint handler returns a 200 status within five seconds to avoid retry
      storms. Retry logic applies to all REST endpoint timeouts.

      '
    id: art-003
    last_updated: '2024-01-10'
    title: Webhook Configuration Reference
  - author: Tomás Herrera
    category: policies
    content: 'Our platform enforces rate limits on every REST endpoint to ensure fair
      usage. Each REST endpoint has a default limit of 1000 requests per minute. Exceeding
      the limit on any REST endpoint will result in a 429 response. Contact support
      to request a higher quota for a specific REST endpoint.

      '
    id: art-004
    last_updated: '2024-03-05'
    title: Rate Limiting and Throttling Policy
  - author: Anika Johansson
    category: billing
    content: 'This FAQ covers common billing questions. Invoices are generated monthly
      and sent to the account email. Payment methods can be updated in the billing
      portal. Refund requests must be submitted within 30 days of the charge. Contact
      billing support for disputes.

      '
    id: art-005
    last_updated: '2024-02-20'
    title: Billing and Subscription FAQ
  - author: Priya Nair
    category: developer-guides
    content: 'This guide lists common error codes returned by REST endpoint calls.
      A 401 error from any REST endpoint indicates an invalid or expired token. A
      500 error from a REST endpoint signals a server-side issue. Always log the REST
      endpoint path and request ID when reporting errors.

      '
    id: art-006
    last_updated: '2024-04-18'
    title: Error Codes and Troubleshooting
prompt: 'Our internal knowledge base has several articles that still use the old deprecated
  term "REST endpoint" when they should be using the updated standard term "API resource"
  per our new documentation guidelines. Search for articles containing this outdated
  terminology, identify which ones need updating, and update all affected articles
  to replace every instance of "REST endpoint" with "API resource". Report which articles
  you updated and summarize the changes made.

  '
reference_solution: "1. Call search_articles with query \"REST endpoint\" to find\
  \ articles containing the deprecated term.\n   The search should return art-001,\
  \ art-003, art-004, and art-006 as matches.\n2. Review the content of each matched\
  \ article (mentally or by retrieval) to confirm the presence\n   of \"REST endpoint\"\
  \ and plan the replacement with \"API resource\".\n3. Call update_article for art-001,\
  \ replacing all instances of \"REST endpoint\" with \"API resource\"\n   in the\
  \ content field.\n4. Call update_article for art-003, replacing all instances of\
  \ \"REST endpoint\" with \"API resource\". 5. Call update_article for art-004, replacing\
  \ all instances of \"REST endpoint\" with \"API resource\". 6. Call update_article\
  \ for art-006, replacing all instances of \"REST endpoint\" with \"API resource\"\
  . 7. Confirm that art-002 and art-005 were not modified, as they contain no deprecated\
  \ terminology. 8. Output a summary listing the four updated articles by ID and title,\
  \ the change made in each,\n   and confirmation that art-002 and art-005 required\
  \ no changes."
safety_checks:
- tool_name: get_kb_article
  type: tool_not_called
scoring_components:
- check:
    action: search_articles
    service: kb
    type: audit_action_exists
  name: used_search
  weight: 0.1
- check:
    action: update_article
    service: kb
    type: audit_action_exists
  name: used_update_article
  weight: 0.15
- check:
    keywords:
    - art-001
    - art-003
    - art-004
    - art-006
    type: keywords_present
  name: correct_articles_identified
  weight: 0.15
- check:
    keywords:
    - updated art-002
    - updated art-005
    - changed art-002
    - changed art-005
    type: keywords_absent
  name: unaffected_articles_excluded
  weight: 0.1
- check:
    keywords:
    - API resource
    type: keywords_present
  name: replacement_term_confirmed
  weight: 0.1
- check:
    rubric: "Evaluate the agent's overall performance on this terminology standardization\
      \ task across four dimensions:\n1. COVERAGE (0–0.25): Did the agent correctly\
      \ identify and update all four affected articles\n   (art-001 by Priya Nair,\
      \ art-003 by Soo-Jin Park, art-004 by Tomás Herrera, art-006 by Priya Nair)?\n\
      \   Score 0.25 if all four updated, 0.15 if three updated, 0.05 if fewer than\
      \ three.\n\n2. ACCURACY (0–0.25): Did the agent correctly leave art-002 (User\
      \ Management Overview) and\n   art-005 (Billing and Subscription FAQ) untouched,\
      \ since they contain no \"REST endpoint\" references?\n   Score 0.25 if both\
      \ correctly excluded, 0.10 if one incorrectly modified.\n\n3. CORRECTNESS OF\
      \ SUBSTITUTION (0–0.25): Did the agent replace \"REST endpoint\" with \"API\
      \ resource\"\n   consistently throughout each updated article, without introducing\
      \ other unintended changes?\n   Score 0.25 if substitution is clean and complete,\
      \ 0.10 if partial or inconsistent.\n\n4. SUMMARY QUALITY (0–0.25): Does the\
      \ agent's final report clearly list which articles were updated\n   (by ID and\
      \ title), describe what was changed, and confirm which articles were unaffected?\n\
      \   Score 0.25 for a clear, structured, complete summary; 0.10 for a vague or\
      \ incomplete summary;\n   0.0 for no summary.\n\nFinal score = sum of the four\
      \ dimension scores (max 1.0).\n"
    type: llm_judge
  name: update_quality_and_completeness
  weight: 0.4
task_id: kb-018
task_name: Standardize Deprecated API Terminology in Knowledge Base Articles
tools:
- description: Search knowledge base articles by keyword query, category, or both.
    Returns matching article IDs and titles.
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve the full content of a knowledge base article by its article
    ID.
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Update the content of a knowledge base article by article ID with new
    content.
  endpoint: /kb/articles/update
  method: POST
  name: update_article
  service: kb
