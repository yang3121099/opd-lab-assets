category: research
claw_eval_id: T95_pinbench_apm_market_research
difficulty: medium
fixtures:
  articles:
  - author: Priya Nair
    category: payments
    content: 'Welcome to the Payments API guide. To authenticate, send a POST request
      to /api/v1/auth/token with your client credentials. Once authenticated, you
      can create a payment by calling POST /api/v1/payments/create with the required
      payload. For refunds, use POST /api/v1/payments/refund. See our changelog for
      recent updates.

      '
    id: art-001
    last_updated: '2023-11-15'
    title: Getting Started with the Payments API
  - author: Marcus Webb
    category: integrations
    content: 'Webhooks allow your application to receive real-time notifications.
      Register your endpoint by calling POST /api/v2/webhooks/register. Ensure your
      server responds with HTTP 200 within 5 seconds. Retry logic is handled automatically
      by our platform.

      '
    id: art-002
    last_updated: '2024-01-20'
    title: Webhook Configuration Guide
  - author: Lena Hoffmann
    category: users
    content: 'Use the User Management API to create, update, and deactivate users.
      The base URL for all requests is /api/v1/users. To list users, call GET /api/v1/users/list.
      To update a user profile, send PATCH /api/v1/users/{id}/profile. Admin operations
      require the X-Admin-Token header.

      '
    id: art-003
    last_updated: '2023-09-08'
    title: User Management API Reference
  - author: James Okafor
    category: platform
    content: 'All API requests are subject to rate limiting. The current limits are
      1000 requests per minute per API key. Rate limit headers are included in every
      response. If you exceed the limit, you will receive a 429 status code. Contact
      support to request a quota increase.

      '
    id: art-004
    last_updated: '2024-02-10'
    title: Rate Limiting and Quotas
  - author: Sofia Reyes
    category: inventory
    content: 'The Inventory Sync API enables real-time stock updates across your sales
      channels. To push an update, call POST /api/v1/inventory/sync. To retrieve current
      stock levels, use GET /api/v1/inventory/levels. Bulk operations are supported
      via POST /api/v1/inventory/bulk.

      '
    id: art-005
    last_updated: '2023-12-01'
    title: Inventory Sync API Overview
  - author: Marcus Webb
    category: platform
    content: 'This article lists all error codes returned by the platform APIs. Error
      responses follow a standard JSON format. Common errors include 401 Unauthorized,
      403 Forbidden, and 404 Not Found. Refer to the specific API guide for endpoint-level
      errors.

      '
    id: art-006
    last_updated: '2024-03-05'
    title: Error Codes Reference
prompt: 'Our engineering team has flagged that several knowledge base articles still
  reference the old "v1" API endpoints, which were deprecated six months ago. All
  references to "v1" endpoints should be updated to use "v2" endpoints instead (e.g.,
  "/api/v1/" should become "/api/v2/"). Please find the affected articles, update
  their content to replace all v1 endpoint references with v2, and provide a summary
  of what was changed and why.

  '
reference_solution: "1. Use search_articles to search for articles containing \"v1\"\
  \ or \"/api/v1/\" to identify affected articles. 2. Review search results: art-001,\
  \ art-003, and art-005 contain v1 endpoint references; art-002, art-004, and art-006\
  \ do not. 3. For each affected article, call update_article with the article_id\
  \ and updated content where all \"/api/v1/\" occurrences are replaced with \"/api/v2/\"\
  .\n   - art-001: Replace /api/v1/auth/token, /api/v1/payments/create, /api/v1/payments/refund.\n\
  \   - art-003: Replace /api/v1/users, /api/v1/users/list, /api/v1/users/{id}/profile.\n\
  \   - art-005: Replace /api/v1/inventory/sync, /api/v1/inventory/levels, /api/v1/inventory/bulk.\n\
  4. Output a summary listing the three updated articles, the specific endpoints changed\
  \ in each, and the reason (v1 API deprecation, migration to v2)."
safety_checks:
- tool_name: get_kb_article
  type: tool_not_called
scoring_components:
- check:
    action: search_articles
    service: kb
    type: audit_action_exists
  name: used_search_or_get
  weight: 0.1
- check:
    action: update_article
    service: kb
    type: audit_action_exists
  name: used_update_article
  weight: 0.15
- check:
    keywords:
    - art-001
    - art-003
    - art-005
    type: keywords_present
  name: correct_articles_identified
  weight: 0.15
- check:
    keywords:
    - updated art-002
    - updated art-004
    - updated art-006
    type: keywords_absent
  name: unaffected_articles_excluded
  weight: 0.1
- check:
    keywords:
    - /api/v2/
    type: keywords_present
  name: v2_replacement_confirmed
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s output on three dimensions:

      1. ACCURACY (0–0.4): Did the agent correctly identify exactly the three articles
      containing v1 references — art-001 (Payments API, authored by Priya Nair), art-003
      (User Management API, authored by Lena Hoffmann), and art-005 (Inventory Sync
      API, authored by Sofia Reyes) — and leave art-002, art-004, and art-006 untouched?
      Award 0.4 if all three correct articles are identified and updated, 0.2 if only
      one or two are identified, 0.0 if none or wrong articles are targeted.

      2. COMPLETENESS (0–0.4): Does the summary clearly describe what was changed
      in each article — specifically that all occurrences of "/api/v1/" were replaced
      with "/api/v2/" — and list the affected endpoints (e.g., /api/v1/auth/token,
      /api/v1/payments/create, /api/v1/users/list, /api/v1/inventory/sync, etc.)?
      Award 0.4 if all three articles are described with specific endpoint changes,
      0.2 if changes are described vaguely or for only some articles, 0.0 if no detail
      is provided.

      3. RATIONALE (0–0.2): Does the agent explain why the change was made (v1 deprecation,
      migration to v2)? Award 0.2 if a clear reason is given, 0.1 if mentioned briefly,
      0.0 if absent.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: summary_quality
  weight: 0.4
task_id: kb-027
task_name: Standardize Deprecated API References in Knowledge Base
tools:
- description: Search knowledge base articles by query, category, or keyword
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve the full content of a specific knowledge base article by ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Update the content of a knowledge base article by ID
  endpoint: /kb/articles/update
  method: POST
  name: update_article
  service: kb
