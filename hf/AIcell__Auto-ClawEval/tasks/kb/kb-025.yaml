category: research
claw_eval_id: T95_pinbench_apm_market_research
difficulty: medium
fixtures:
  articles:
  - author: Sandra Kowalski
    category: onboarding
    content: 'Welcome to the team! As part of your onboarding, please review our remote
      work policy. Employees are allowed up to 2 remote days per week. All remote
      work must be approved by your direct manager on a case-by-case basis. Equipment
      requests should be submitted via the old HR portal at hr-legacy.company.com.
      Please complete your I-9 within 3 days of your start date.

      '
    id: art-001
    last_updated: '2023-06-15'
    title: New Employee Onboarding Guide
  - author: Marcus Delgado
    category: remote-work
    content: 'Updated Q1 2024: Employees may now work remotely up to 4 days per week
      without manager pre-approval. Equipment requests are handled through the new
      IT portal at it-portal.company.com. A dedicated remote work stipend of $75/month
      is available to all full-time employees. Please refer to the Remote Work Agreement
      form (RWA-2024) when setting up your arrangement.

      '
    id: art-002
    last_updated: '2024-02-10'
    title: Remote Work Policy Overview
  - author: Sandra Kowalski
    category: onboarding
    content: 'Day 1: Meet your buddy, set up your workstation. Day 2: Complete compliance
      training. Day 3: Submit remote work preference form — note that remote work
      is limited to 2 days per week and requires manager sign-off each week. Equipment
      can be ordered through hr-legacy.company.com/equipment. Day 5: 1:1 with your
      manager.

      '
    id: art-003
    last_updated: '2023-09-22'
    title: First Week Checklist for New Hires
  - author: Priya Nair
    category: onboarding
    content: 'New employees must enroll in benefits within 30 days of their start
      date. Visit benefits.company.com to select your health, dental, and vision plans.
      The 401k match is 4% with immediate vesting. Contact benefits@company.com for
      assistance.

      '
