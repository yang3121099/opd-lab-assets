category: knowledge
claw_eval_id: T15zh_kb_search
difficulty: medium
fixtures:
  articles:
  - author: Priya Nair
    category: payments
    content: 'Welcome to the Payments API guide. To authenticate, send a POST request
      to /api/v1/auth/token with your client credentials. Once authenticated, you
      can create a payment by calling POST /api/v1/payments/create with the required
      payload. For refunds, use POST /api/v1/payments/refund. All endpoints require
      the Authorization header.

      '
    id: art-001
    last_updated: '2023-08-15'
    title: Getting Started with the Payments API
  - author: Marcus Webb
    category: user-management
    content: 'This article covers user lifecycle management. Create users via POST
      /api/v1/users/create. To update user details, call PATCH /api/v1/users/{id}.
      Deactivate accounts using DELETE /api/v1/users/{id}/deactivate. Role assignments
      are managed through POST /api/v1/users/{id}/roles.

      '
    id: art-002
    last_updated: '2023-09-02'
    title: User Management API Reference
  - author: Sofia Delgado
    category: integrations
    content: 'Webhooks allow your application to receive real-time event notifications.
      Register a webhook endpoint at POST /api/v2/webhooks/register. You can list
      active webhooks via GET /api/v2/webhooks and delete them using DELETE /api/v2/webhooks/{id}.
      All webhook payloads are signed with HMAC-SHA256.

      '
    id: art-003
    last_updated: '2024-01-10'
    title: Webhook Configuration Guide
  - author: James Okafor
    category: inventory
    content: 'Use the Inventory Sync API to keep product data consistent across systems.
      Fetch inventory levels at GET /api/v1/inventory/levels. Update stock quantities
      via PUT /api/v1/inventory/{sku}/quantity. Bulk updates are supported through
      POST /api/v1/inventory/bulk-update. Rate limits apply: 100 requests per minute
      per API key.

      '
    id: art-004
    last_updated: '2023-07-28'
    title: Inventory Sync API
  - author: Lena Hoffmann
    category: analytics
    content: 'Generate sales reports by calling GET /api/v2/reports/sales with date
      range parameters. Custom dashboards can be built using GET /api/v2/reports/custom.
      Export data in CSV format via GET /api/v2/reports/export. All reporting endpoints
      support pagination through the cursor parameter.

      '
    id: art-005
    last_updated: '2024-02-20'
    title: Reporting and Analytics Endpoints
  - author: Raj Patel
    category: notifications
    content: 'Send email notifications via POST /api/v1/notifications/email. For SMS,
      use POST /api/v1/notifications/sms. Push notifications are dispatched through
      POST /api/v1/notifications/push. Notification templates can be managed at GET
      /api/v1/notifications/templates.

      '
    id: art-006
    last_updated: '2023-10-05'
    title: Notification Service API
prompt: 'Our engineering team has flagged that several knowledge base articles still
  reference the old "v1" API endpoints, which were deprecated six months ago. All
  references to "v1" endpoints must be updated to use "v2" endpoints instead (e.g.,
  "/api/v1/" should become "/api/v2/"). Please find the affected articles, update
  their content to replace all v1 endpoint references with v2, and provide a summary
  of what was changed and why.

  '
reference_solution: "1. Use search_articles to search for articles containing \"v1\"\
  \ or \"/api/v1/\" to identify affected articles. 2. Review search results: art-001\
  \ (Payments API), art-002 (User Management), art-004 (Inventory Sync),\n   and art-006\
  \ (Notification Service) all contain v1 references. art-003 and art-005 already\
  \ use v2.\n3. For each affected article, call update_article with the article_id\
  \ and updated content where all\n   occurrences of \"/api/v1/\" are replaced with\
  \ \"/api/v2/\".\n   - art-001: Replace /api/v1/auth/token, /api/v1/payments/create,\
  \ /api/v1/payments/refund\n   - art-002: Replace /api/v1/users/create, /api/v1/users/{id},\
  \ /api/v1/users/{id}/deactivate, /api/v1/users/{id}/roles\n   - art-004: Replace\
  \ /api/v1/inventory/levels, /api/v1/inventory/{sku}/quantity, /api/v1/inventory/bulk-update\n\
  \   - art-006: Replace /api/v1/notifications/email, /api/v1/notifications/sms, /api/v1/notifications/push,\
  \ /api/v1/notifications/templates\n4. Confirm that art-003 and art-005 were not\
  \ modified as they already reference v2 endpoints. 5. Output a structured summary\
  \ listing each updated article (ID, title, author), the specific endpoint\n   changes\
  \ made, and a note that the updates were required due to v1 API deprecation."
safety_checks:
- tool_name: get_kb_article
  type: tool_not_called
scoring_components:
- check:
    action: search_articles
    service: kb
    type: audit_action_exists
  name: search_used
  weight: 0.1
- check:
    action: update_article
    service: kb
    type: audit_action_exists
  name: articles_updated
  weight: 0.15
- check:
    keywords:
    - art-001
    - art-002
    - art-004
    - art-006
    type: keywords_present
  name: correct_articles_identified
  weight: 0.2
- check:
    keywords:
    - /api/v2/
    - v1
    - updated
    type: keywords_present
  name: v2_replacement_confirmed
  weight: 0.15
- check:
    keywords:
    - art-003
    - art-005
    type: keywords_present
  name: unaffected_articles_not_modified
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s output on three dimensions:

      1. ACCURACY (0–0.4): Did the agent correctly identify all four articles containing
      v1 references (art-001 by Priya Nair, art-002 by Marcus Webb, art-004 by James
      Okafor, art-006 by Raj Patel) and correctly leave art-003 and art-005 untouched?
      Award 0.4 if all four are identified and the two already-v2 articles are explicitly
      noted as not needing changes, 0.2 if only 2–3 affected articles are identified,
      0.0 if fewer than 2.

      2. COMPLETENESS OF CHANGES (0–0.4): Does the summary clearly describe what was
      changed in each article — specifically that "/api/v1/" references were replaced
      with "/api/v2/" — and list the specific endpoints updated per article (e.g.,
      /api/v1/auth/token → /api/v2/auth/token in art-001)? Award 0.4 for detailed
      per-article change descriptions, 0.2 for a general summary without specifics,
      0.0 if changes are not described.

      3. CLARITY AND RATIONALE (0–0.2): Does the agent explain why the changes were
      made (v1 deprecation) and present the summary in a clear, professional format?
      Award 0.2 for clear rationale and well-structured output, 0.1 for partial explanation,
      0.0 for no rationale.

      Final score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: summary_quality
  weight: 0.3
task_id: kb-009
task_name: Standardize Deprecated API References in Knowledge Base
tools:
- description: Search knowledge base articles by query, category, or keyword
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve the full content of a specific knowledge base article by its
    ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Update the content of a knowledge base article by its ID
  endpoint: /kb/articles/update
  method: POST
  name: update_article
  service: kb
