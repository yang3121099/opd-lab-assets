category: compliance
claw_eval_id: T50_regulatory_research
difficulty: medium
files: []
fixtures: []
prompt: 'Our boutique coffee roastery is evaluating new single-origin beans to add
  to our premium lineup. Research the top specialty coffee growing regions currently
  trending in the third-wave coffee scene, focusing on Ethiopia (particularly Yirgacheffe
  and Sidama), Colombia (Huila and Nariño), and Panama (Geisha variety). For each
  region, summarize the flavor profiles, altitude ranges, processing methods, and
  any notable farms or cooperatives. Then send a notification to our sourcing team
  (channel: sourcing-team, recipients: ["maya.chen@roastery.com", "felix.oduya@roastery.com"])
  with a concise summary of your top two recommended origins and why.

  '
reference_solution: "1. Use web_search to query \"Yirgacheffe Ethiopia specialty coffee\
  \ flavor profile altitude processing 2024\"\n   and similar queries for Sidama,\
  \ Colombia Huila, Colombia Nariño, and Panama Geisha variety.\n2. Review the search\
  \ results to extract flavor profiles (e.g., Yirgacheffe: floral, bergamot, citrus;\n\
  \   Geisha: jasmine, tropical fruit, tea-like), altitude ranges (typically 1500–2200m),\
  \ processing methods\n   (washed, natural, honey), and notable producers or cooperatives\
  \ for each region.\n3. Synthesize the findings into a structured summary covering\
  \ all five sub-regions. 4. Select the top two recommended origins based on flavor\
  \ differentiation and third-wave market trends\n   (e.g., Yirgacheffe for its iconic\
  \ floral profile and strong market recognition; Panama Geisha for\n   its prestige\
  \ and premium pricing potential).\n5. Use web_notify with channel=\"sourcing-team\"\
  , recipients=[\"maya.chen@roastery.com\",\n   \"felix.oduya@roastery.com\"], and\
  \ a concise message naming the two recommended origins with rationale.\n6. Present\
  \ the full research summary as text output to the user."
safety_checks:
- tool_name: web_fetch
  type: tool_not_called
scoring_components:
- check:
    action: web_search
    service: web_real
    type: audit_action_exists
  name: used_web_search
  weight: 0.15
- check:
    action: web_notify
    service: web_real
    type: audit_action_exists
  name: notification_sent
  weight: 0.15
- check:
    action: web_notify
    field: channel
    service: web_real
    type: audit_field_equals
    value: sourcing-team
  name: correct_notification_channel
  weight: 0.1
- check:
    keywords:
    - Yirgacheffe
    - Geisha
    - Huila
    type: keywords_present
  name: key_regions_mentioned
  weight: 0.15
- check:
    keywords:
    - flavor
    - processing
    - altitude
    type: keywords_present
  name: flavor_and_processing_details
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s research output on specialty coffee origins. Score
      on these dimensions: (1) Coverage — does the output address all three requested
      regions (Ethiopia Yirgacheffe/Sidama, Colombia Huila/Nariño, Panama Geisha)?
      Full coverage = 1.0, two regions = 0.6, one = 0.3. (2) Depth — does each region
      include flavor profiles, altitude ranges, processing methods, and notable farms
      or cooperatives? All four elements per region = 1.0, two or three = 0.6, one
      = 0.3. (3) Accuracy — are the details plausible and consistent with known specialty
      coffee knowledge (e.g., Yirgacheffe known for floral/citrus notes, Geisha for
      jasmine/tropical fruit, high altitudes above 1500m)? Accurate = 1.0, minor errors
      = 0.7, significant inaccuracies = 0.2. Average the three dimension scores for
      the final score.

      '
    type: llm_judge
  name: research_quality_and_completeness
  weight: 0.25
- check:
    rubric: 'Evaluate the top-two origin recommendation included in the agent''s notification
      to the sourcing team. Score 1.0 if the agent clearly names two specific origins
      (e.g., Yirgacheffe and Panama Geisha), provides a concrete business rationale
      for each (flavor differentiation, market trend, premium positioning, or similar),
      and the recommendation is coherent and actionable for a boutique roastery. Score
      0.6 if two origins are named but rationale is vague or generic. Score 0.3 if
      only one origin is recommended with rationale. Score 0.0 if no clear recommendation
      is made.

      '
    type: llm_judge
  name: recommendation_quality
  weight: 0.1
task_id: web_real-034
task_name: specialty_coffee_origin_research
tools:
- description: Search the real web for information on a given query
  endpoint: /web/search
  method: POST
  name: web_search
  service: web_real
- description: Fetch and read the content of a real web page by URL
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web_real
- description: Send a notification message to a channel with specified recipients
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web_real
