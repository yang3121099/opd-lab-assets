category: communication
claw_eval_id: T01zh_email_triage
difficulty: medium
fixtures:
  inbox:
  - body: Great news — the Hartwell Analytics deal closed this morning. Please send
      an announcement to James, Priya, and Tom. Highlight that the partnership kicks
      off Q3 2025 and will focus on data intelligence services. Make it sound exciting!
    date: '2025-06-10'
    from: diana.reyes@meridiancg.com
    id: msg-001
    priority: high
    read: false
    subject: Hartwell Analytics Partnership — FINALIZED
    to: assistant@meridiancg.com
  - body: 'Attached is the signed partnership agreement with Hartwell Analytics. Effective
      date: July 1, 2025. Duration: 3 years. Scope: data intelligence and predictive
      analytics consulting.'
    date: '2025-06-10'
    from: legal@meridiancg.com
    id: msg-002
    priority: high
    read: false
    subject: Signed Agreement — Hartwell Analytics
    to: assistant@meridiancg.com
  - body: Hey, any update on whether the Hartwell deal went through? I have a client
      call tomorrow and want to mention it if confirmed.
    date: '2025-06-09'
    from: tom.whitfield@meridiancg.com
    id: msg-003
    priority: normal
    read: true
    subject: 'Re: Hartwell deal status?'
    to: assistant@meridiancg.com
  - body: Can you confirm if the Hartwell partnership is locked in before I finalize
      the Q3 roadmap? Need to know by EOD.
    date: '2025-06-09'
    from: priya.nair@meridiancg.com
    id: msg-004
    priority: normal
    read: true
    subject: Q3 Planning — Data Services
    to: assistant@meridiancg.com
  - body: 'Quick notes from the intro call: Hartwell''s team is led by CEO Marcus
      Vance. They are very enthusiastic about the data intelligence scope. Expecting
      formal close by end of week.'
    date: '2025-06-08'
    from: james.okafor@meridiancg.com
    id: msg-005
    priority: normal
    read: true
    subject: Intro call with Hartwell — notes
    to: assistant@meridiancg.com
prompt: 'You are an executive assistant at Meridian Consulting Group. The company
  has just finalized a strategic partnership with Hartwell Analytics. Your manager,
  Diana Reyes, has asked you to check the inbox for any recent messages about the
  Hartwell partnership, then send a professional announcement email to all key stakeholders
  informing them of the finalized partnership. The email should reference the partnership
  details and convey enthusiasm. The stakeholders to notify are: james.okafor@meridiancg.com,
  priya.nair@meridiancg.com, and tom.whitfield@meridiancg.com. Use "Meridian Consulting
  Group" as the sign-off organization in the email body.

  '
reference_solution: '1. Call list_inbox to retrieve recent emails and identify messages
  related to the Hartwell Analytics partnership. 2. Call get_message for msg-001 (from
  diana.reyes@meridiancg.com) to read the manager''s instructions: announce the partnership,
  highlight Q3 2025 kickoff, data intelligence focus. 3. Call get_message for msg-002
  (from legal@meridiancg.com) to gather official details: effective July 1 2025, 3-year
  duration, data intelligence and predictive analytics scope. 4. Compose a professional,
  enthusiastic announcement email incorporating all key details from the inbox messages.
  5. Call send_email with to set to james.okafor@meridiancg.com, priya.nair@meridiancg.com,
  and tom.whitfield@meridiancg.com, an appropriate subject such as "Exciting News:
  Meridian Consulting Group Partners with Hartwell Analytics", and a body that includes
  the Q3/July 1 2025 start date, 3-year term, data intelligence scope, and a sign-off
  from Meridian Consulting Group. 6. Report back confirming the email was sent, listing
  the recipients and summarizing the key details included.'
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: inbox_checked
  weight: 0.1
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  name: email_sent_to_stakeholders
  weight: 0.15
- check:
    keywords:
    - james.okafor@meridiancg.com
    - priya.nair@meridiancg.com
    - tom.whitfield@meridiancg.com
    type: keywords_present
  name: stakeholder_recipients_mentioned
  weight: 0.15
- check:
    keywords:
    - Hartwell Analytics
    - Q3
    type: keywords_present
  name: partnership_details_present
  weight: 0.15
- check:
    action: send_email
    field: body
    service: gmail
    type: audit_field_contains
    value: Meridian Consulting Group
  name: meridian_signoff_used
  weight: 0.1
- check:
    rubric: 'Evaluate the quality and completeness of the partnership announcement
      email the agent sent. The agent should have: (1) checked the inbox and identified
      the relevant Hartwell partnership messages (msg-001 from diana.reyes@meridiancg.com
      and msg-002 from legal@meridiancg.com) to gather key details; (2) sent a single
      announcement email addressing all three stakeholders — james.okafor@meridiancg.com,
      priya.nair@meridiancg.com, and tom.whitfield@meridiancg.com; (3) included key
      partnership details: Q3 2025 / July 1 2025 kickoff, 3-year duration, data intelligence
      and predictive analytics scope, and Hartwell Analytics as the partner; (4) used
      a professional, enthusiastic tone appropriate for an executive announcement;
      (5) included "Meridian Consulting Group" as the sign-off organization. Score
      1.0 if all five criteria are met with high quality. Score 0.7 if the email is
      sent to all recipients and includes most key details but is missing one element.
      Score 0.4 if the email is sent but is missing multiple details or recipients.
      Score 0.1 if an email was attempted but is largely incomplete or incorrect.
      Score 0.0 if no email was sent.

      '
    type: llm_judge
  name: announcement_quality
  weight: 0.35
task_id: gmail-003
task_name: Send Partnership Announcement to Key Stakeholders
tools:
- description: List recent emails in the inbox, optionally filtered by how many days
    back and max results.
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a specific email by its message ID.
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email to one or more recipients with a subject and body.
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save an email as a draft, optionally as a reply to an existing message.
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
