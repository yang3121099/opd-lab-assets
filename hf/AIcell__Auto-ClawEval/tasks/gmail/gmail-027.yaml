category: communication
claw_eval_id: T05zh_email_reply_draft
difficulty: medium
fixtures:
  inbox:
  - body: 'Dear Operations Team, this is a reminder that your TechSupply Pro License
      contract (Contract #TS-2024-089) is set to expire on December 31, 2024. The
      annual renewal cost is $18,500. Please confirm renewal by December 15 to avoid
      service interruption. Contact your account manager Sarah Chen at schen@techsupply.com.'
    date: '2024-11-28'
    from: contracts@techsupply.com
    id: msg-001
    priority: high
    read: false
    subject: Contract Renewal Notice — TechSupply Pro License
    to: operations@company.com
  - body: 'This is your final notice. Your CloudInfra Enterprise subscription (Contract
      #CI-9921) expires on December 20, 2024. Failure to renew will result in immediate
      suspension of all cloud services. Renewal price: $42,000/year. Please contact
      renewals@cloudinfra.io immediately.'
    date: '2024-11-29'
    from: billing@cloudinfra.io
    id: msg-002
    priority: high
    read: false
    subject: 'FINAL NOTICE: CloudInfra Subscription Expiring'
    to: operations@company.com
  - body: 'Hi team, just a reminder that the holiday party is scheduled for December
      20th at 6pm. Please RSVP by December 10th. Venue: The Grand Ballroom, 123 Main
      St.'
    date: '2024-11-27'
    from: hr@company.com
    id: msg-003
    priority: normal
    read: true
    subject: Holiday Party Planning Update
    to: operations@company.com
  - body: 'Your recent order of office supplies has shipped. Expected delivery: December
      3, 2024. Tracking number: 1Z999AA10123456784.'
    date: '2024-11-26'
    from: support@officesupplies.net
    id: msg-004
    priority: normal
    read: true
    subject: 'Your Order #78432 Has Shipped'
    to: operations@company.com
  - body: 'Your SecurityTools Enterprise Suite (Contract #ST-4410) is due for renewal
      on January 5, 2025. This covers endpoint protection for 200 devices. Renewal
      quote: $9,800. Please log in to your portal or reply to this email to confirm
      renewal.'
    date: '2024-11-30'
    from: noreply@securitytools.com
    id: msg-005
    priority: normal
    read: false
    subject: Security Suite Annual Renewal — Action Required
    to: operations@company.com
prompt: 'Our procurement team needs to be notified about an urgent vendor contract
  renewal. Check the inbox for any emails from vendors about contract renewals or
  expirations, then send a consolidated summary email to procurement@company.com with
  the subject "Urgent: Vendor Contract Renewal Required" — include the vendor name(s),
  contract details, and a recommendation to act within 48 hours. Make sure your output
  summarizes what you found and what you sent.

  '
reference_solution: '1. Call list_inbox to retrieve recent emails in the inbox. 2.
  Review the results and identify emails related to vendor contract renewals: msg-001
  (TechSupply Pro License, Contract #TS-2024-089, expiring Dec 31, $18,500), msg-002
  (CloudInfra Enterprise, Contract #CI-9921, expiring Dec 20, $42,000), and msg-005
  (SecurityTools Enterprise Suite, Contract #ST-4410, expiring Jan 5, $9,800). 3.
  Call get_message for each of the three vendor renewal emails to read their full
  details. 4. Call send_email with to="procurement@company.com", subject="Urgent:
  Vendor Contract Renewal Required", and a body that summarizes all three vendors,
  their contract numbers, expiration dates, renewal costs, and a recommendation to
  act within 48 hours. 5. Output a text summary confirming what was found and what
  was sent, including the recipient and key vendor details.'
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: inbox_checked
  weight: 0.1
- check:
    action: get_message
    service: gmail
    type: audit_action_exists
  name: vendor_email_read
  weight: 0.1
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  name: email_sent
  weight: 0.15
- check:
    action: send_email
    field: to
    service: gmail
    type: audit_field_equals
    value: procurement@company.com
  name: correct_recipient
  weight: 0.15
- check:
    keywords:
    - TechSupply
    - CloudInfra
    - procurement@company.com
    type: keywords_present
  name: vendor_details_in_output
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s output on three dimensions: 1. COMPLETENESS (0–0.4):
      Did the agent identify all three vendor contract renewal emails (msg-001 from
      TechSupply Pro License #TS-2024-089, msg-002 from CloudInfra Enterprise #CI-9921,
      and msg-005 from SecurityTools Enterprise Suite #ST-4410)? Score 0.4 if all
      three are mentioned, 0.2 if two are mentioned, 0.1 if only one is mentioned.
      2. EMAIL QUALITY (0–0.4): Was the email sent to procurement@company.com with
      subject "Urgent: Vendor Contract Renewal Required"? Does the email body include
      vendor names, contract numbers or expiration dates, renewal costs, and a recommendation
      to act within 48 hours? Score 0.4 if all elements are present, 0.2 if most are
      present, 0.0 if the email is vague or missing key details. 3. SUMMARY CLARITY
      (0–0.2): Does the agent''s text output clearly summarize what was found in the
      inbox and what was sent, making it easy for a human to verify the action taken?
      Score 0.2 if the summary is clear and complete, 0.1 if partial, 0.0 if absent.
      Total score = sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: email_quality_and_completeness
  weight: 0.35
task_id: gmail-027
task_name: Vendor Contract Renewal Notification
tools:
- description: List emails in the inbox, optionally filtered by recency and result
    count
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a specific email by its message ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email to a specified recipient with a subject and body
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save an email as a draft without sending it
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
