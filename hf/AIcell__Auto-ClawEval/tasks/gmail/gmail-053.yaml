category: organization
claw_eval_id: T93_pinbench_email_triage_report
difficulty: medium
fixtures:
  inbox:
  - body: Hello, I'm reaching out to complete our vendor registration with Acme Corp.
      We've submitted our W-9 and insurance certificates via your supplier portal.
      Could you confirm receipt and let us know the next steps? We're hoping to be
      approved before the end of the quarter. Best, Sarah Kim, Nexus Logistics Inc.
    date: '2024-11-18T09:14:00Z'
    from: sarah.kim@nexuslogistics.com
    id: msg-001
    priority: normal
    read: false
    subject: Vendor Registration - Nexus Logistics Inc.
    to: procurement@acmecorp.com
  - body: Dear Procurement Team, Our legal team has finalized the Master Service Agreement
      for Brightfield Supply Co. The contract must be countersigned by this Friday,
      November 22nd, or we will need to restart the approval process from scratch,
      delaying your Q1 supply chain by 6-8 weeks. Please review and sign at your earliest
      convenience. Regards, Brightfield Supply Legal
    date: '2024-11-19T11:30:00Z'
    from: contracts@brightfield-supply.com
    id: msg-002
    priority: high
    read: false
    subject: 'URGENT: Master Service Agreement - Signature Required by Friday'
    to: procurement@acmecorp.com
  - body: Hi there, We completed our initial application last week and are waiting
      for portal access credentials so we can upload our compliance documents. Could
      someone from your team send us the login details? We have all documents ready
      to go. Thanks, Terrapack Materials Onboarding Team
    date: '2024-11-17T14:55:00Z'
    from: onboarding@terrapack-materials.com
    id: msg-003
    priority: normal
    read: true
    subject: Terrapack Materials - Supplier Portal Access Request
    to: procurement@acmecorp.com
  - body: Good morning, I submitted our vendor qualification questionnaire two weeks
      ago and haven't received an acknowledgment. Could you confirm it was received?
      We're very interested in becoming an approved supplier for your IT hardware
      category. Please let me know if any additional information is needed. Thank
      you, James Oduya, Alpine Edge Technologies
    date: '2024-11-20T08:22:00Z'
    from: james.oduya@alpineedge-tech.com
    id: msg-004
    priority: normal
    read: false
    subject: 'Follow-up: Vendor Qualification Questionnaire Submission'
    to: procurement@acmecorp.com
  - body: 'This is an automated notification. A new supplier application has been
