prompt: 'Our vendor Hartwell Supplies has confirmed they are ready to renew their
  annual contract with us. I need you to check our inbox for any recent messages from
  Hartwell Supplies to get the right contact details and context, then send a formal
  notification email to their representative confirming we are proceeding with the
  renewal and that our legal team will be in touch within 5 business days to finalize
  the paperwork.

  '
reference_solution: "1. Call list_inbox to retrieve recent emails and identify messages\
  \ from Hartwell Supplies. 2. Identify msg-001 from patricia.nguyen@hartwellsupplies.com\
  \ as the primary renewal confirmation message. 3. Optionally call get_message with\
  \ message_id msg-001 to read the full content and confirm Patricia Nguyen is the\
  \ correct contact. 4. Call send_email with to=patricia.nguyen@hartwellsupplies.com,\
  \ a subject referencing the FY2025 contract renewal,\n   and a body that: (a) confirms\
  \ the company is proceeding with the renewal, and (b) informs Patricia that the\
  \ legal team\n   will be in touch within 5 business days to finalize the paperwork.\n\
  5. Report back in text summarizing the inbox review, the identified contact, and\
  \ the email sent."
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: inbox_checked
  weight: 0.1
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  name: email_sent_to_vendor
  weight: 0.15
- check:
    action: send_email
    field: to
    service: gmail
    type: audit_field_equals
    value: patricia.nguyen@hartwellsupplies.com
  name: correct_recipient_address
  weight: 0.15
- check:
    keywords:
    - patricia.nguyen@hartwellsupplies.com
    - renewal
    - legal
    - 5 business days
    type: keywords_present
  name: renewal_and_legal_mentioned
  weight: 0.15
- check:
    rubric: 'Evaluate the email the agent sent to Patricia Nguyen at Hartwell Supplies
      (patricia.nguyen@hartwellsupplies.com). Score on the following dimensions: 1.
      Correct recipient: Was the email addressed to Patricia Nguyen at patricia.nguyen@hartwellsupplies.com?
      (required) 2. Confirmation of renewal intent: Does the email clearly confirm
      that the company is proceeding with the FY2025 contract renewal? (required)
      3. Legal team follow-up: Does the email state that the legal team will be in
      touch within 5 business days to finalize paperwork? (required) 4. Professional
      tone: Is the email formal, courteous, and appropriate for a vendor relationship?
      5. Contextual accuracy: Does the email reflect awareness of the prior communication
      from Patricia (e.g., referencing the renewal or the ongoing partnership)? Scoring:
      1.0 if all five dimensions are met; 0.75 if four are met; 0.5 if three are met
      (must include dimensions 1 and 2); 0.25 if only one or two met; 0.0 if email
      was not sent or sent to wrong person.

      '
    type: llm_judge
  name: email_content_quality
  weight: 0.3
- check:
    rubric: 'Evaluate the agent''s final text response summarizing what it did. Score
      1.0 if the agent: (a) confirms it reviewed the inbox and identified Patricia
      Nguyen as the Hartwell Supplies contact, (b) states it sent the renewal confirmation
      email to patricia.nguyen@hartwellsupplies.com, and (c) summarizes the key content
      of the email sent (renewal confirmation + legal team follow-up within 5 business
      days). Score 0.5 if the agent confirms sending the email but omits the inbox
      review context or key email details. Score 0.0 if the agent did not send the
      email or the summary is missing or inaccurate.

      '
    type: llm_judge
  name: agent_summary_quality
  weight: 0.15
task_id: gmail-067
task_name: Vendor Contract Renewal Notification
tools:
- description: List recent emails from the inbox, optionally filtering by how many
    days back and max results
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a specific email by its message ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email to a recipient with a specified subject and body
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save an email as a draft, optionally as a reply to an existing message
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
