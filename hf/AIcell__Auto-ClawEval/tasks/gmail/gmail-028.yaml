category: communication
claw_eval_id: T05zh_email_reply_draft
difficulty: medium
fixtures:
  inbox:
  - body: 'Hi team, our current agreement #AS-2024-117 expires on March 31st. We''d
      like to discuss renewing for another 24 months with updated pricing reflecting
      a 5% increase due to material costs. Please let us know if you''d like to schedule
      a call this week. Best, Patricia Nguyen, Account Manager, Apex Supplies.

      '
    date: '2025-01-14'
    from: patricia.nguyen@apexsupplies.com
    id: msg-001
    priority: high
    read: false
    subject: 'Contract Renewal - Apex Supplies Agreement #AS-2024-117'
    to: contracts@meridianconsulting.com
  - body: 'Following up on our earlier conversation — License #CB-9902 covers your
      50-seat subscription and is set to expire February 28th. We''re offering a loyalty
