    date: '2024-11-08'
    from: james.whitfield@deltacorp.com
    id: msg-002
    priority: medium
    read: true
    subject: 'Follow-up: Proposal Review'
    to: manager@company.com
  - body: 'This week in tech: AI breakthroughs, cloud cost optimization tips, and
