category: communication
claw_eval_id: T02_email_triage
difficulty: medium
fixtures:
  inbox:
  - body: 'Dear Accounts Payable, please find attached Invoice #INV-4421 for $12,450.00
      for office supplies delivered on Nov 18. Payment is due November 25. Please
      confirm receipt.'
    date: '2024-11-22'
    from: billing@acmesupplies.com
    id: msg-001
    priority: high
    read: false
    subject: 'Invoice #INV-4421 - Payment Due in 3 Days'
    to: ap@company.com
  - body: 'This is a second notice. Invoice #DL-8803 for $34,200.00 (freight services,
      October) is now 15 days past due. Please remit payment immediately or contact
      us to arrange terms. Late fees may apply.'
    date: '2024-11-21'
    from: accounts@deltalogistics.net
    id: msg-002
    priority: high
    read: false
    subject: 'OVERDUE NOTICE: Invoice #DL-8803 - 15 Days Past Due'
    to: ap@company.com
  - body: 'Hi, attached is Invoice #GLC-0092 totaling $2,875.00 for catering services
      provided on Nov 5, 12, and 19. Payment terms are Net 30. No rush, just wanted
      to get this over to you.'
    date: '2024-11-20'
    from: invoices@greenleafcatering.com
    id: msg-003
    priority: normal
    read: true
    subject: 'Invoice #GLC-0092 for November Team Lunch Events'
    to: ap@company.com
