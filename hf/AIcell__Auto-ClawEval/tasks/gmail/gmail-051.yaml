prompt: 'Our procurement team needs to be notified about an urgent vendor contract
  renewal. Check the inbox for any emails from vendors about contract renewals or
  expirations, then send a consolidated summary email to procurement@company.com with
  the subject "Urgent: Vendor Contract Renewal Required" that includes the vendor
  name(s), contract details, and a recommendation to act within 5 business days.

  '
reference_solution:
- Call list_inbox to retrieve recent emails in the inbox.
- Review the results and identify emails related to vendor contract renewals — msg-001
  (TechSupply), msg-002 (CloudInfra), and msg-005 (Office Solutions).
- Optionally call get_message on each relevant email ID to retrieve full details.
- Compose a consolidated summary email addressed to procurement@company.com with subject "Urgent: Vendor
    Contract Renewal Required".
- The email body should list all three vendors with their contract numbers, renewal
  costs, expiration dates, and a clear recommendation to act within 5 business days.
- Call send_email with to=procurement@company.com, the required subject, and the composed
  body.
- Report back to the user confirming the email was sent and summarizing what was included.
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: inbox_checked
  weight: 0.1
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  name: email_sent
  weight: 0.15
- check:
    action: send_email
    field: to
    service: gmail
    type: audit_field_contains
    value: procurement@company.com
  name: correct_recipient
  weight: 0.15
- check:
    keywords:
    - TechSupply
    - CloudInfra
    - contract
    type: keywords_present
  name: vendor_contracts_identified
  weight: 0.2
- check:
    rubric: 'Evaluate the agent''s summary email sent to procurement@company.com.
      Score on these dimensions: 1. Completeness (0-0.4): Does the email mention all
      three vendor contracts — TechSupply (Contract #TS-2024-089, $42,500, expiring
      Feb 28 2025), CloudInfra (Contract #CI-9921, $18,200, expiring Feb 15 2025),
      and Office Solutions (Contract #OS-4471, $7,800, expiring Mar 31 2025)? Award
      0.4 if all three included, 0.25 if two, 0.1 if one. 2. Urgency and Recommendation
      (0-0.3): Does the email clearly convey urgency and include a recommendation
      to act within 5 business days? Award 0.3 if both present, 0.15 if only one.
      3. Clarity and Professionalism (0-0.3): Is the email well-structured, professional,
      and actionable for the procurement team? Award 0.3 for excellent clarity, 0.15
      for adequate, 0.0 for poor. Final score = sum of dimension scores (max 1.0).

      '
    type: llm_judge
  name: summary_email_quality
  weight: 0.25
- check:
    rubric: 'Evaluate the agent''s final text response to the user. Does it confirm
      that the summary email was sent to procurement@company.com, mention the subject
      line "Urgent: Vendor Contract Renewal Required", and briefly describe what was
      included (vendor names and contract details)? Score 1.0 if all three elements
      are present, 0.5 if two are present, 0.2 if only one, 0.0 if none.

      '
    type: llm_judge
  name: output_summary_quality
  weight: 0.15
task_id: gmail-051
task_name: Vendor Contract Renewal Notification
tools:
- description: List emails in the inbox, optionally filtered by how many days back
    and max results
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a specific email by its message ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email to a recipient with a specified subject and body
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save an email as a draft, optionally as a reply to an existing message
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
