    id: TKT-1046
    priority: medium
    status: open
    title: VPN connection dropping intermittently
  - category: billing
    created_at: '2024-03-23T10:00:00Z'
    created_by: anna.kowalski@polishco.pl
    description: Customer's dashboard shows Basic plan despite upgrading to Business.
