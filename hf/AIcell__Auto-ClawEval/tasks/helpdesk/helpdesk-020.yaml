category: operations
claw_eval_id: T18_ticket_triage
difficulty: medium
fixtures:
  tickets:
  - category: billing
    created_at: '2024-03-15T09:22:00Z'
    created_by: maria.santos@acme.com
    description: Customer was billed twice for the Pro plan in March. Finance confirmed
      refund issued on 2024-03-18.
    id: TKT-1041
    priority: high
    status: open
    title: 'Double charge on invoice #8821'
  - category: billing
    created_at: '2024-03-19T14:05:00Z'
    created_by: james.okafor@techcorp.io
    description: Customer paid for upgrade but features not unlocked. Engineering
      confirmed fix deployed 2024-03-20.
    id: TKT-1042
    priority: medium
    status: open
    title: Unable to access premium features after payment
  - category: billing
    created_at: '2024-03-21T11:30:00Z'
    created_by: helga.brandt@euroclient.de
    description: VAT was calculated at 20% instead of 0% for a B2B customer in Germany.
      Finance corrected and reissued invoice on 2024-03-22.
    id: TKT-1043
    priority: medium
    status: open
    title: Wrong tax rate applied to EU invoice
  - category: hardware
    created_at: '2024-03-20T08:45:00Z'
    created_by: tom.nguyen@internal.com
    description: User's printer stopped responding after Windows 11 update. IT support
      is still investigating driver compatibility.
    id: TKT-1044
    priority: low
    status: open
    title: Printer not working after OS update
  - category: billing
    created_at: '2024-03-23T16:00:00Z'
    created_by: priya.mehta@startupxyz.com
    description: Customer requested cancellation on 2024-03-10 but was billed again.
