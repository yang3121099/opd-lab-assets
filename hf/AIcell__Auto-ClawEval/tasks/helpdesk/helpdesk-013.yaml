category: operations
claw_eval_id: T18_ticket_triage
difficulty: medium
fixtures:
  tickets:
  - category: billing
    created_at: '2024-11-04T08:15:00Z'
    created_by: maya.chen@acme.com
    description: Customers are reporting checkout failures. Error logs show 500 responses
      from the payment processor API roughly 15% of the time.
    id: TKT-1001
    priority: critical
    status: open
    title: Payment gateway returning 500 errors intermittently
  - category: access
    created_at: '2024-11-05T09:30:00Z'
    created_by: hr@acme.com
    description: Three new hires starting Monday cannot log into the onboarding portal.
      SSO redirect is failing with a 403.
    id: TKT-1002
    priority: high
    status: open
    title: New employee onboarding portal login broken
  - category: branding
    created_at: '2024-11-07T14:00:00Z'
    created_by: marketing@acme.com
    description: Marketing wants the new brand logo applied to all outgoing email
      templates.
    id: TKT-1003
    priority: low
    status: open
    title: Request to update company logo in email footer
  - category: data
    created_at: '2024-11-04T11:45:00Z'
    created_by: salesops@acme.com
    description: Sales ops cannot export CRM records for accounts with more than 10,000
