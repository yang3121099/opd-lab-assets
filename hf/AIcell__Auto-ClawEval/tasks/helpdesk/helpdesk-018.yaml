category: operations
claw_eval_id: T18_ticket_triage
difficulty: medium
fixtures:
  tickets:
  - category: billing
    created_at: '2024-03-14T09:22:00Z'
    created_by: margaret.holloway@nexuscorp.com
    description: I was billed twice on March 14th for my annual plan renewal. Both
      charges of $1,200 appeared on my corporate card. I need an immediate refund
      for the duplicate charge. This is unacceptable for a platinum account.
    id: TKT-1041
    priority: high
    status: open
    title: Charged twice for annual subscription renewal
  - category: billing
    created_at: '2024-03-14T11:05:00Z'
    created_by: derek.osman@stratford-partners.com
    description: Our March invoice shows $1,600 but our contract rate is $1,200 annually.
      We have been a customer for 6 years and this has never happened before. Please
      correct the invoice and refund the difference.
    id: TKT-1042
    priority: high
    status: open
    title: Invoice shows wrong amount — overpaid by $400
  - category: technical
    created_at: '2024-03-14T13:45:00Z'
    created_by: priya.nair@blueridge-tech.com
    description: Since yesterday afternoon our team cannot log in using Safari 17.3.
      Chrome works fine. Affects 12 users in our office. Please advise on a workaround.
    id: TKT-1043
    priority: medium
    status: open
    title: Login page not loading on Safari
  - category: billing
    created_at: '2024-03-14T14:30:00Z'
    created_by: carlos.vega@imperiallogistics.com
    description: We noticed two identical transactions of $950 each on March 14th
      on our billing statement. Our plan is $950/year. It looks like the system charged
      us twice. We are a VIP enterprise client and expect this resolved urgently.
    id: TKT-1044
    priority: high
    status: open
    title: Duplicate payment processed on account
  - category: technical
    created_at: '2024-03-15T08:10:00Z'
    created_by: james.whitfield@datastream-inc.com
    description: Our integration started throwing 429 errors this morning. Our enterprise
      plan includes 10,000 API calls/hour but we are now being throttled at 1,000.
      This is breaking our production pipeline.
    id: TKT-1045
    priority: high
    status: open
    title: API rate limits suddenly reduced
  - category: billing
    created_at: '2024-03-15T09:55:00Z'
    created_by: linda.chen@apexventures.io
    description: My account was migrated to the enterprise plan in February but the
      March 14th charge was at the Pro rate of $600 instead of $1,200. I need the
