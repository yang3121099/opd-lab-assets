category: operations
claw_eval_id: T17zh_ticket_triage
difficulty: medium
fixtures:
  tickets:
  - category: infrastructure
    created_at: '2024-11-18T06:12:00Z'
    created_by: alice.morgan@company.com
    description: All database connections are being held and new requests are timing
      out. Affecting all users on the platform.
    id: TKT-1001
    priority: critical
    status: open
    title: Production database connection pool exhausted
  - category: authentication
    created_at: '2024-11-18T07:45:00Z'
    created_by: bob.chen@company.com
    description: Multiple users reporting they never receive the password reset link.
      Issue started Friday afternoon.
    id: TKT-1002
    priority: high
    status: open
    title: Password reset emails not being delivered
  - category: ui_bug
    created_at: '2024-11-17T14:30:00Z'
    created_by: carol.diaz@company.com
    description: The CSV export button has disappeared from the reports dashboard
      after last week's UI update.
    id: TKT-1003
    priority: medium
    status: open
    title: Export to CSV button missing on reports page
  - category: documentation
    created_at: '2024-11-15T09:00:00Z'
    created_by: david.okafor@company.com
    description: Several links in the new user onboarding flow point to pages that
      no longer exist.
    id: TKT-1004
    priority: low
    status: open
    title: Onboarding documentation links return 404
  - category: billing
    created_at: '2024-11-18T08:20:00Z'
    created_by: emily.santos@company.com
    description: Customers in California are seeing wrong tax rates on their invoices
