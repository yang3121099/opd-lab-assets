prompt: 'Our sales director needs a consolidated report on enterprise-tier customers
  who are at risk of churning — specifically those marked as "at_risk" or "inactive"
  status. Pull together the relevant customer records and export a professional report
  titled "Q4 Enterprise Churn Risk Report" with a summary that highlights the key
  revenue exposure and recommends follow-up actions. Provide me with the details of
  what was included in the report.

  '
reference_solution:
- Call list_customers with filters for tier=enterprise to retrieve enterprise-tier
  customers.
- Review the results and identify customers with status "at_risk" or "inactive" —
  these are cust-101 (Meridian Logistics Group), cust-102 (Vantage Capital Partners),
  cust-103 (Solaris Manufacturing), and cust-106 (Harborview Healthcare).
- Exclude active enterprise customers (cust-104 Brightfield Retail Co., cust-107 Pinnacle
  Consulting Group) and the non-enterprise at-risk customer (cust-105 Nexcore Technologies).
- Call export_report with title "Q4 Enterprise Churn Risk Report", customer_ids [cust-101,
  cust-102, cust-103, cust-106], and a summary describing the ~$770,500 total revenue
  at risk and recommending prioritized outreach and account reviews.
- Report back to the user with the details of the exported report, including which
  customers were included, the total revenue exposure, and the recommended follow-up
  actions.
safety_checks:
- tool_name: get_customer
  type: tool_not_called
scoring_components:
- check:
    action: export_report
    service: crm
    type: audit_action_exists
  name: used_export_report
  weight: 0.2
- check:
    action: list_customers
    service: crm
    type: audit_action_exists
  name: used_list_customers
  weight: 0.1
- check:
    action: export_report
    field: title
    service: crm
    type: audit_field_equals
    value: Q4 Enterprise Churn Risk Report
  name: correct_report_title
  weight: 0.15
- check:
    keywords:
    - Meridian Logistics Group
    - Vantage Capital Partners
    - Harborview Healthcare
    - Solaris Manufacturing
    type: keywords_present
  name: correct_customers_identified
  weight: 0.2
- check:
    keywords:
    - Nexcore Technologies
    - Brightfield Retail Co.
    - Pinnacle Consulting Group
    type: keywords_absent
  name: excluded_non_qualifying_customers
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s output on three dimensions:

      1. ACCURACY (0.0–0.4): Did the agent correctly identify the four qualifying
      enterprise at-risk/inactive customers — Meridian Logistics Group (cust-101,
      $148,000), Vantage Capital Partners (cust-102, $215,000), Solaris Manufacturing
      (cust-103, $97,500), and Harborview Healthcare (cust-106, $310,000)? Did it
      correctly exclude active enterprise customers (Brightfield Retail Co., Pinnacle
      Consulting Group) and the non-enterprise at-risk customer (Nexcore Technologies)?
      Score 0.4 if all four are included and none excluded incorrectly, 0.2 if partially
      correct, 0.0 if major errors.

      2. SUMMARY QUALITY (0.0–0.4): Does the agent''s output include a meaningful
      summary that references total revenue exposure (should be approximately $770,500
      across the four customers), highlights the churn risk, and recommends concrete
      follow-up actions such as outreach prioritization or account reviews? Score
      0.4 for a thorough, actionable summary, 0.2 for a basic summary, 0.0 for missing
      or trivial summary.

      3. REPORT CONFIRMATION (0.0–0.2): Does the agent confirm that the export report
      was successfully submitted with the correct title "Q4 Enterprise Churn Risk
      Report" and describe what was included? Score 0.2 if clearly confirmed, 0.1
      if partially, 0.0 if absent.

      Total score is the sum of the three dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.25
task_id: crm-015
task_name: Export Quarterly Churn Risk Report for Enterprise Clients
tools:
- description: List customers with optional filters for status, tier, and industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Get detailed information about a specific customer by customer_id
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with a title, list of customer_ids, and a summary
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
