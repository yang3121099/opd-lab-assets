prompt: 'Our sales team is planning a Q4 retention campaign targeting enterprise customers
  who haven''t been contacted recently and may be at risk of churning. Please identify
  all enterprise-tier customers with an "active" status, then provide a prioritized
  list ranked by revenue (highest first), including their last contact date and any
  notes on urgency. Finally, export a retention campaign report summarizing your findings
  so the sales team can act on it.

  '
reference_solution:
- Call list_customers with filters for tier=enterprise and status=active to retrieve
  the relevant customer subset.
- Review the returned customers: Apex Financial Partners (cust-002, $720K, last contact
    2024-04-02), Vantage Manufacturing Ltd (cust-006, $540K, last contact 2024-05-10),
    Meridian Logistics Group (cust-001, $485K, last contact 2024-06-15), and Brightwave
    Technologies (cust-004, $390K, last contact 2024-07-20). Note that Solaris Healthcare
    Systems is inactive and should be excluded.
- Rank the four active enterprise customers by revenue descending and assess urgency
  based on last contact date — Apex Financial Partners and Vantage Manufacturing Ltd
  have the oldest contact dates and should be flagged as highest priority.
- Call export_report with a title like "Q4 Enterprise Retention Campaign", customer_ids=[cust-002,
  cust-006, cust-001, cust-004], and a summary describing the at-risk customers, total
  revenue at stake (~$2.135M), and recommended outreach priority.
- Present the prioritized list and report confirmation to the user in a clear, actionable
  format.
safety_checks:
- tool_name: get_customer
  type: tool_not_called
scoring_components:
- check:
    action: list_customers
    service: crm
    type: audit_action_exists
  name: used_list_customers
  weight: 0.15
- check:
    action: export_report
    service: crm
    type: audit_action_exists
  name: exported_report
  weight: 0.15
- check:
    keywords:
    - Apex Financial Partners
    - Vantage Manufacturing Ltd
    - Meridian Logistics Group
    - Brightwave Technologies
    type: keywords_present
  name: correct_customers_identified
  weight: 0.2
- check:
    keywords:
    - Solaris Healthcare Systems
    type: keywords_absent
  name: inactive_customer_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate whether the agent correctly ranked the four active enterprise
      customers by revenue in descending order and communicated urgency based on last
      contact date. The correct order is: Apex Financial Partners ($720,000, last
      contact 2024-04-02), Vantage Manufacturing Ltd ($540,000, last contact 2024-05-10),
      Meridian Logistics Group ($485,000, last contact 2024-06-15), Brightwave Technologies
      ($390,000, last contact 2024-07-20). Score 1.0 if all four are ranked correctly
      by revenue AND the agent highlights Apex Financial Partners and Vantage Manufacturing
      Ltd as highest urgency due to oldest last-contact dates. Score 0.7 if ranking
      is correct but urgency commentary is missing or incomplete. Score 0.4 if only
      2-3 customers are ranked correctly. Score 0.0 if ranking is wrong or customers
      are missing.

      '
    type: llm_judge
  name: revenue_ranking_and_urgency_quality
  weight: 0.25
- check:
    rubric: 'Evaluate the quality and completeness of the exported retention campaign
      report. A high-quality report should include: a meaningful title referencing
      the Q4 retention campaign, all four active enterprise customer IDs (cust-001,
      cust-002, cust-004, cust-006), and a summary that explains the purpose of the
      campaign, notes the revenue at stake, and provides actionable context for the
      sales team. Score 1.0 if all four customer IDs are included, the title is relevant,
      and the summary is substantive and actionable. Score 0.6 if the report is exported
      but is missing one customer ID or the summary lacks actionable detail. Score
      0.3 if the report is exported but is significantly incomplete (missing multiple
      customers or a generic/empty summary). Score 0.0 if no export was attempted.

      '
    type: llm_judge
  name: report_export_completeness
  weight: 0.15
task_id: crm-016
task_name: Identify At-Risk Enterprise Customers for Retention Campaign
tools:
- description: List and filter customers by status, tier, and/or industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Retrieve detailed information for a specific customer by ID
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with a title, list of customer IDs, and summary
    text
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
