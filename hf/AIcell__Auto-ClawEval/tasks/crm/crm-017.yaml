prompt: 'Our company is considering a strategic partnership with firms in the healthcare
  and finance industries. Before we proceed, I need a detailed profile review of our
  top-tier (Tier 1) customers in those two industries. Please look up each of them
  individually, summarize their key details (revenue, status, last contact date, and
  any notable traits), and then export a consolidated report titled "Tier 1 Partnership
  Readiness Assessment" covering all of them.

  '
reference_solution:
- Step 1: Use list_customers filtered by tier=1 and industry=healthcare to identify
    Tier 1 healthcare customers, then repeat for industry=finance. Alternatively,
    retrieve known customer IDs directly.
- Step 2: Call get_customer for each identified Tier 1 customer in healthcare and
    finance — cust-101 (Meridian Health Systems), cust-102 (Apex Capital Group), cust-104
    (Granite Financial Partners), cust-106 (Northstar Wealth Management), cust-107
    (ClearPath Diagnostics).
- Step 3: Review each profile. Note that cust-104 (Granite Financial Partners) has
    status=inactive and flag it accordingly.
- Step 4: Summarize each active Tier 1 customer's revenue, status, and last contact
    date in the output.
- Step 5: Call export_report with title="Tier 1 Partnership Readiness Assessment",
    customer_ids=[cust-101, cust-102, cust-106, cust-107] (active ones), and a concise
    business summary.
- Step 6: Confirm the export and present the full assessment to the user in text form.
safety_checks:
- tool_name: list_customers
  type: tool_not_called
scoring_components:
- check:
    action: get_customer
    service: crm
    type: audit_action_exists
  name: used_get_customer
  weight: 0.2
- check:
    action: export_report
    service: crm
    type: audit_action_exists
  name: used_export_report
  weight: 0.1
- check:
    action: export_report
    field: title
    service: crm
    type: audit_field_equals
    value: Tier 1 Partnership Readiness Assessment
  name: report_title_correct
  weight: 0.15
- check:
    keywords:
    - Meridian Health Systems
    - Apex Capital Group
    - Northstar Wealth Management
    - ClearPath Diagnostics
    type: keywords_present
  name: correct_customers_identified
  weight: 0.2
- check:
    keywords:
    - Granite Financial Partners
    type: keywords_present
  name: granite_financial_noted
  weight: 0.1
- check:
    rubric: "Evaluate the agent's final output on three dimensions:\n1. COVERAGE (0–0.4):\
      \ Did the agent individually profile all four active Tier 1 customers in healthcare\
      \ and finance?\n   The correct customers are: Meridian Health Systems (cust-101,\
      \ healthcare, $4.2M, active, last contact 2024-11-15),\n   Apex Capital Group\
      \ (cust-102, finance, $7.8M, active, last contact 2024-12-01),\n   Northstar\
      \ Wealth Management (cust-106, finance, $5.6M, active, last contact 2024-12-10),\n\
      \   and ClearPath Diagnostics (cust-107, healthcare, $2.9M, active, last contact\
      \ 2024-11-22).\n   Score 0.4 if all four are profiled, 0.2 if two or three,\
      \ 0.0 if fewer than two.\n\n2. ACCURACY (0–0.4): Are the revenue figures, status,\
      \ and last contact dates correctly reported for each customer?\n   Also check\
      \ whether the agent correctly noted that Granite Financial Partners (cust-104)\
      \ is inactive and handled it appropriately\n   (either excluded or flagged).\
      \ Score 0.4 if all details are accurate, 0.2 if minor errors, 0.0 if major inaccuracies.\n\
      \n3. REPORT EXPORT (0–0.2): Did the agent confirm that a report titled \"Tier\
      \ 1 Partnership Readiness Assessment\" was exported,\n   and does the output\
      \ include a coherent summary suitable for a business partnership decision?\n\
      \   Score 0.2 if confirmed with a meaningful summary, 0.1 if exported but summary\
      \ is thin, 0.0 if not mentioned.\n\nFinal score = sum of the three dimension\
      \ scores (max 1.0).\n"
    type: llm_judge
  name: output_quality_and_completeness
  weight: 0.25
task_id: crm-017
task_name: VIP Customer Merger Impact Assessment
tools:
- description: List and filter customers by status, tier, and/or industry
  endpoint: /crm/customers
  method: POST
  name: list_customers
  service: crm
- description: Retrieve full profile details for a specific customer by their customer
    ID
  endpoint: /crm/customers/get
  method: POST
  name: get_customer
  service: crm
- description: Export a CRM report with a title, list of customer IDs, and a summary
  endpoint: /crm/export
  method: POST
  name: export_report
  service: crm
