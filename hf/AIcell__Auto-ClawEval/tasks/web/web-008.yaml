scoring_components:
- check:
    action: web_fetch
    service: web
    type: audit_action_exists
  name: fetched_product_pages
  weight: 0.15
- check:
    action: web_search
    service: web
    type: audit_action_exists
  name: used_search
  weight: 0.1
- check:
    keywords:
    - Titan X500
    - Forge Pro 800
    - NexLayer HD300
    - $18,500
    - $24,900
    - $15,200
    type: keywords_present
  name: key_vendors_and_prices_mentioned
  weight: 0.2
- check:
    keywords:
    - 10%
    - warranty
    - bundle
    type: keywords_present
  name: promotions_and_warranty_coverage
  weight: 0.15
- check:
    rubric: "Evaluate the agent's competitive pricing report on industrial 3D printers\
      \ across four dimensions:\n1. COVERAGE (0–0.25): Does the report cover at least\
      \ three vendors? Full credit if Titan X500 (IndustrialPrint3D),\n   Forge Pro\
      \ 800 (ForgePrinting), NexLayer HD300 (NexLayerTech), and SolidForm V2 (SolidFormWorks)\
      \ are all included.\n   Partial credit (0.15) for three vendors; minimal credit\
      \ (0.05) for two.\n\n2. ACCURACY (0–0.25): Are prices, specs, and promotions\
      \ accurately reported from the fetched pages?\n   Check: Titan X500 at $18,500\
      \ with Q4 bundle at $20,000; Forge Pro 800 at $24,900 with 10% discount to $22,410;\n\
      \   NexLayer HD300 at $15,200 with 18-month warranty; SolidForm V2 at $31,000\
      \ with PEEK/Ultem support.\n   Deduct for any significant factual errors.\n\n\
      3. ACTIONABILITY (0–0.25): Does the report highlight differentiators useful\
      \ for a procurement decision?\n   Examples: NexLayer's fastest lead time (1–2\
      \ weeks), SolidForm's PEEK/Ultem support for aerospace/medical,\n   Forge Pro's\
      \ 24/7 operation rating, Titan X500's \"Best Value\" award. Award full credit\
      \ if at least three\n   differentiators are clearly called out.\n\n4. CLARITY\
      \ AND STRUCTURE (0–0.25): Is the report well-organized (e.g., table or structured\
      \ sections per vendor),\n   easy to scan, and free of irrelevant filler? Full\
      \ credit for a clearly structured, professional summary.\n\nFinal score = sum\
      \ of four dimension scores (max 1.0).\n"
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.3
- check:
    keywords:
