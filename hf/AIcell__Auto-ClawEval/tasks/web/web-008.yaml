prompt: 'Our procurement team needs a competitive pricing analysis for industrial-grade
  3D printers before a major purchasing decision next week. Search for current pricing
  and product details, then fetch the most relevant product pages to compile a comparison
  of at least three vendors, including model names, prices, key specs, and any notable
  promotions or warranties. Summarize your findings in a clear report.

  '
reference_solution: "1. Call web_search with a query such as \"industrial 3D printer\
  \ pricing comparison 2024\" to retrieve relevant URLs\n   from the fixture search\
  \ results (Titan X500, Forge Pro 800, NexLayer HD300, SolidForm V2).\n2. Call web_fetch\
  \ for each of the four product page URLs to retrieve full pricing, specs, warranty,\
  \ and promotion details:\n   - https://www.industrialprint3d.com/products/titan-x500\n\
  \   - https://www.forgeprinting.com/shop/forge-pro-800\n   - https://www.nexlayertech.com/nexlayer-hd300\n\
  \   - https://www.solidformworks.com/products/solidform-v2\n3. Compile the fetched\
  \ data into a structured comparison report covering:\n   - Vendor and model name\n\
  \   - Base price and any active promotions (Forge Pro 10% discount, Titan X500 Q4\
  \ bundle)\n   - Build volume and key specs\n   - Compatible materials (highlight\
  \ SolidForm V2's PEEK and Ultem support)\n   - Warranty terms and support options\n\
  \   - Lead time and notable differentiators\n4. Summarize with a procurement recommendation\
  \ noting trade-offs: NexLayer HD300 is lowest cost with fastest delivery;\n   Titan\
  \ X500 offers best value award; Forge Pro 800 suits 24/7 production; SolidForm V2\
  \ is premium with advanced material support.\n5. Do NOT send any notifications —\
  \ this is an internal research task only."
