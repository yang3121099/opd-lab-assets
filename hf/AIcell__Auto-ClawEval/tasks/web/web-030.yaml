fixtures:
  pages:
  - content: 'CPSC Recall Notification Requirements: All recall notices must include
      (1) the product name and model number, (2) a description of the hazard, (3)
      the number of units affected, (4) consumer instructions — typically ''stop use
      immediately'', (5) how to obtain a remedy (refund, replacement, or repair),
      and (6) a contact method for consumers. Reference: CPSC Recall Handbook, Section
      4.2. Hotline: 1-800-638-2772.

      '
    title: CPSC Product Recall Guidelines and Notification Templates
    url: https://www.cpsc.gov/recalls/guidelines
  - content: 'URGENT RECALL NOTICE TEMPLATE: [Company Name] is voluntarily recalling
      [Product Name], Model [Number], due to [Hazard Description]. This recall affects
      units sold between [Date Range]. Consumers should STOP USE IMMEDIATELY and [Action:
      return/dispose/contact support]. For assistance, contact [Support Contact].
      This recall is being conducted in cooperation with the [Regulatory Body]. Failure
      to act may result in [Risk Description].

      '
    title: Urgent Product Recall Notice Templates | RecallPro
    url: https://www.recallpro.com/templates/urgent-recall-notice
  search_results:
