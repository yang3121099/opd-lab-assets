prompt: 'Our e-commerce team needs a competitive pricing analysis for our top product
  category: wireless noise-canceling headphones. Search for current competitor pricing
  pages and fetch the details from the most relevant results to compile a summary
  of competitor prices, key features highlighted, and any ongoing promotions or discounts.
  Present your findings as a structured competitive intelligence report.

  '
reference_solution: "1. Call web_search with a query such as \"wireless noise-canceling\
  \ headphones competitor pricing 2024\" to retrieve\n   relevant URLs from the fixture\
  \ search results.\n2. Identify the most relevant URLs from the search results: soundgear-store.com/headphones/noise-canceling,\n\
  \   audiophile-direct.com/collections/anc-headphones, retailgiant.com/electronics/headphones,\
  \ and\n   techdeals-hub.com/best-noise-canceling-headphones-2024.\n3. Call web_fetch\
  \ for each of those URLs to retrieve full page content including prices, features,\
  \ and promotions. 4. Extract and organize the following data from fetched pages:\n\
  \   - OmniSound Z3: $179.99 (sale from $219.99), RetailGiant, IPX4, 28hr battery\n\
  \   - BeatWave X7: $189.99, Audiophile Direct, free cable promo\n   - SoundGear\
  \ Pro NC-900: $249.99 (save $50 weekly deal), 40hr battery, hybrid ANC -35dB\n \
  \  - ClearSound Elite Pro: $299.00, SUMMER15 for 15% off, ANC -40dB, LDAC\n   -\
  \ PureAudio Max: $329.00, RetailGiant, 45hr battery, spatial audio\n5. Note active\
  \ promotions: RetailGiant members 10% off through June 30, SoundGear weekly $50\
  \ deal,\n   ClearSound SUMMER15 code, BeatWave free cable.\n6. Summarize market\
  \ price range ($179.99–$329.00), average (~$245), and most competitive segment ($180–$250).\
  \ 7. Present findings as a structured competitive intelligence report with sections\
  \ for each competitor,\n   a promotions summary, feature comparison highlights,\
  \ and a market overview with actionable recommendations.\n8. Do NOT send any notifications\
  \ — this is an internal research task only."
