- check:
    rubric: "Evaluate the competitive pricing intelligence report on three dimensions:\n\
      1. COVERAGE (0–0.4): Does the report include pricing data for all five key products\
      \ found in the fetched pages?\n   - OmniSound Z3 ($179.99, was $219.99, RetailGiant)\n\
      \   - BeatWave X7 ($189.99, Audiophile Direct)\n   - SoundGear Pro NC-900 ($249.99,\
      \ SoundGear Store, $50 weekly discount)\n   - ClearSound Elite Pro ($299.00,\
      \ Audiophile Direct, SUMMER15 code for 15% off)\n   - PureAudio Max ($329.00,\
      \ RetailGiant)\n   Score 0.4 if all 5 are present with prices, 0.2 if 3–4 are\
      \ present, 0.1 if 1–2 are present.\n\n2. PROMOTIONS & FEATURES (0–0.3): Does\
      \ the report accurately capture active promotions (e.g., RetailGiant members\
      \ 10% off,\n   SoundGear $50 weekly deal, ClearSound SUMMER15 code, BeatWave\
      \ free cable) and at least 2 notable feature differentiators\n   (e.g., battery\
      \ life, ANC dB ratings, water resistance, spatial audio)?\n   Score 0.3 if 3+\
      \ promotions and 2+ features are mentioned accurately, 0.15 if partial, 0.0\
      \ if missing.\n\n3. STRUCTURE & ACTIONABILITY (0–0.3): Is the report well-organized\
      \ (e.g., uses headers, tables, or clear sections),\n   includes a market summary\
      \ or price range insight (e.g., range $179.99–$329.00, average ~$245), and provides\n\
      \   at least one actionable insight or recommendation for the e-commerce team?\n\
      \   Score 0.3 if all three elements are present, 0.15 if two are present, 0.0\
      \ if poorly structured with no insights.\n\nFinal score = sum of the three dimension\
      \ scores (max 1.0).\n"
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.35
