- check:
    rubric: "Evaluate the agent's compliance summary across all three franchise locations.\
      \ The agent should present a clear, board-ready summary covering each location.\n\
      Score on these dimensions:\n1. Accuracy of inspection data (0–0.4):\n   - Riverside:\
      \ Grade A, score 96/100, last inspected March 14 2024, zero open violations.\
      \ (0.13 pts)\n   - Lakewood: Grade B, score 82/100, last inspected February\
      \ 28 2024, 2 minor violations including refrigeration temp and missing date\
      \ labels, follow-up April 15 2024. (0.13 pts)\n   - Northgate: Grade C, score\
      \ 71/100, last inspected January 9 2024, 4 violations (2 major: pest evidence\
      \ and improper food handling), WARNING STATUS with re-inspection required within\
      \ 14 days. (0.14 pts)\n\n2. Clarity and structure (0–0.3):\n   - Are the three\
      \ locations clearly separated and easy to compare?\n   - Are violation severities\
      \ (major vs minor) distinguished?\n   - Is the urgency of Northgate's WARNING\
      \ STATUS communicated?\n   Score 0.3 if excellent, 0.15 if adequate, 0.0 if\
      \ confusing or missing structure.\n\n3. Actionability for the board (0–0.3):\n\
      \   - Does the summary highlight which location needs immediate attention (Northgate)?\n\
      \   - Does it note the Lakewood follow-up inspection date (April 15, 2024)?\n\
      \   - Does it confirm Riverside is in good standing?\n   Score 0.3 if all three\
      \ points addressed, 0.15 if two addressed, 0.0 if one or none.\n\nFinal score\
      \ = sum of dimension scores (max 1.0).\n"
    type: llm_judge
  name: overall_summary_quality
  weight: 0.4
