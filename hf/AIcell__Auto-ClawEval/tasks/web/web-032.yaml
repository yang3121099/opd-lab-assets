prompt: 'Our product team needs a competitive pricing analysis for our SaaS project
  management tool. Visit the competitor pricing pages listed in our research tracker
  and extract their current pricing tiers, key features, and any promotional offers,
  then summarize the findings in a clear comparison report our team can act on.

  '
reference_solution: "1. Use web_fetch to retrieve the full content of each competitor\
  \ pricing page:\n   https://www.taskflow-pro.com/pricing, https://www.orbitpm.io/plans,\n\
  \   https://www.nexuswork.com/pricing, and https://www.sprintdesk.com/pricing.\n\
  2. Extract pricing tiers, per-user costs (annual and monthly), included features,\n\
  \   storage limits, support levels, and any active promotional offers from each\
  \ page.\n3. Compile a structured comparison report covering all four competitors\
  \ side by side,\n   highlighting key differentiators: NexusWork's flat-rate model\
  \ vs. per-seat pricing\n   of others, OrbitPM's free tier, SprintDesk's agile tooling\
  \ and SWITCH25 promo,\n   and TaskFlow Pro's June 30 limited-time offer.\n4. Present\
  \ the report in a clear format (e.g., per-competitor sections with tier\n   breakdowns,\
  \ a summary table, and actionable observations) so the product team\n   can immediately\
  \ use the intelligence for positioning decisions."
