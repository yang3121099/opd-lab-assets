- check:
    rubric: "Evaluate the competitive pricing report on four dimensions:\n1. COVERAGE\
      \ (0–0.25): Does the report cover all four competitors — TaskFlow Pro,\n   OrbitPM,\
      \ NexusWork, and SprintDesk — with their specific pricing tiers and\n   dollar\
      \ amounts (e.g., TaskFlow $9/$29, OrbitPM $19/$49, NexusWork $299/$599,\n  \
      \ SprintDesk $12/$35/$75)?\n\n2. PROMOTIONAL OFFERS (0–0.25): Does the report\
      \ mention the active promotions:\n   TaskFlow Pro's \"3 months free before June\
      \ 30\", SprintDesk's \"25% off with\n   code SWITCH25\", and NexusWork's \"\
      30-day money-back guarantee\"?\n\n3. COMPARATIVE INSIGHT (0–0.25): Does the\
      \ report highlight meaningful\n   differentiators such as NexusWork's flat-rate\
      \ vs. per-seat models, OrbitPM's\n   free tier, SprintDesk's agile focus, or\
      \ storage/support differences across\n   tiers? Does it offer actionable observations\
      \ the product team can use?\n\n4. CLARITY & STRUCTURE (0–0.25): Is the report\
      \ well-organized (e.g., uses\n   headers, tables, or clear sections per competitor)?\
      \ Is it easy to scan and\n   act on?\n\nScore each dimension 0.0–0.25 and sum\
      \ for a total 0.0–1.0. Deduct 0.1 if any competitor is entirely missing from\
      \ the report.\n"
    type: llm_judge
  name: report_quality
  weight: 0.4
