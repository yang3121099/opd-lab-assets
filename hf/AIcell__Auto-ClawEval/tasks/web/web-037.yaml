- check:
    rubric: 'Evaluate the competitive pricing intelligence report produced by the
      agent on four dimensions:

      1. ACCURACY OF COMPETITOR PRICES (0–0.25): Does the report correctly cite Blue
      Bottle''s 12oz single-origin range ($21–$24, subscription ~$19.80), Stumptown''s
      range ($18–$21, subscribe-save 10%), and Intelligentsia''s range ($18.50–$25,
      loyalty 15% off)? Award 0.25 if all three are accurately represented, 0.15 if
      two are accurate, 0.05 if only one.

      2. MARKET CONTEXT (0–0.25): Does the report reference the 2024 market average
      of $21.50 per 12oz and the premium tier of $23–$26 from the Coffee Review report?
      Award 0.25 if both figures are cited, 0.15 if one is cited, 0.0 if neither.

      3. PRICING RECOMMENDATION FOR VERITAS (0–0.25): Does the agent provide a concrete,
      reasoned pricing recommendation for Veritas Coffee Roasters? The recommendation
      should reference competitor data and market positioning (e.g., suggesting a
      specific price range or tier). Award 0.25 for a specific, well-reasoned recommendation,
      0.10 for a vague suggestion, 0.0 for no recommendation.

      4. REPORT STRUCTURE AND CLARITY (0–0.25): Is the report organized, easy to read,
      and suitable for a head buyer preparing for supplier negotiations? Does it include
      a summary or key takeaways? Award 0.25 for a well-structured report with clear
      sections, 0.15 for adequate organization, 0.05 for disorganized output.

      Final score = sum of the four dimension scores (max 1.0).

      '
    type: llm_judge
  name: report_quality_and_recommendation
  weight: 0.4
