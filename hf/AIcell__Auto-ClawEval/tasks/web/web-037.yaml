prompt: 'You are a market analyst for Veritas Coffee Roasters, a specialty artisan
  coffee company. The head buyer wants a competitive pricing intelligence report before
  renegotiating supplier contracts next week. Search for current retail pricing and
  market positioning information for our top three competitors — Blue Bottle Coffee,
  Stumptown Coffee Roasters, and Intelligentsia Coffee — focusing on their single-origin
  whole bean 12oz offerings. Fetch any relevant pages you find and compile a concise
  report summarizing their price points, any promotional pricing, and your recommendation
  on where Veritas should position its own pricing.

  '
reference_solution: '1. Search for "Blue Bottle Coffee single origin 12oz pricing"
  to find current retail prices and subscription details. 2. Search for "Stumptown
  Coffee Roasters single origin whole bean pricing 2024" to retrieve Stumptown''s
  lineup and subscribe-save offer. 3. Search for "Intelligentsia Coffee single origin
  12oz direct trade pricing" to find Intelligentsia''s price range and loyalty program.
  4. Search for "specialty coffee market pricing report 2024" to find the Coffee Review
  market benchmark ($21.50 average, $23–$26 premium tier). 5. Fetch the Blue Bottle
  single-origin collection page to confirm prices: Ethiopia Yirgacheffe $22, Kenya
  Kiambu $24, Colombia Huila $21; subscription saves 10%. 6. Fetch the Stumptown single-origin
  page to confirm: Ethiopia Duromina $19, Guatemala Finca El Injerto $21, Honduras
  El Puente $18; subscribe-save 10%. 7. Fetch the Intelligentsia single-origin page
  to confirm: Black Cat $18.50, El Gallo Colombia $23, Ethiopia Kochere $25 (94pts),
  Guatemala $22; loyalty 15% off. 8. Fetch the Coffee Review 2024 market report to
  extract the $21.50 average and tier breakdowns. 9. Compile a structured report with
  sections for each competitor (prices, subscription/loyalty programs, positioning),
  a market context section citing the 2024 benchmarks, and a recommendation for Veritas
  to position in the $21–$23 mid-to-premium range with a subscription model to compete
  with Blue Bottle and Stumptown, while differentiating on sourcing story to justify
  pricing near Intelligentsia''s mid-tier.'
