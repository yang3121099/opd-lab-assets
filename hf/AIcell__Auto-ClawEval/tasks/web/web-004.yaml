- description: Fetch the full content of a specific web page by URL.
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web
- description: Send a notification with a message to specified recipients via a channel.
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web
