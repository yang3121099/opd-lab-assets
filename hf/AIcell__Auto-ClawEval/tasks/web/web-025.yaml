prompt: 'You are a market analyst for Veritas Coffee Roasters, a specialty artisan
  coffee company. The head of sales, Marcus Delgado, needs a competitive pricing intelligence
  report before tomorrow''s board meeting. Search for current pricing information
  on our top three competitors — Blue Bottle Coffee, Stumptown Coffee Roasters, and
  Intelligentsia Coffee — focusing on their single-origin whole bean 12oz offerings.
  Then fetch the most relevant pages to gather specific price points and any promotional
  details. Summarize your findings in a clear report that Marcus can present, including
  a pricing comparison table and any strategic observations.

  '
reference_solution: '1. Use web_search to query for pricing information on Blue Bottle
  Coffee, Stumptown Coffee Roasters, and Intelligentsia Coffee single-origin 12oz
  offerings. 2. Review the search results to identify the most relevant pages (the
  competitor store/collection pages and the market analysis article). 3. Use web_fetch
  on the Blue Bottle single-origin page (https://bluebottlecoffee.com/store/single-origin)
  to retrieve detailed pricing: Ethiopia Yirgacheffe $22.00, Kenya Kiambu $24.00,
  Panama Geisha $38.00, plus subscription discount of 12%. 4. Use web_fetch on the
  Stumptown single-origin page (https://stumptowncoffee.com/collections/single-origin)
  to retrieve: Hair Bender Ethiopia $19.00, Guatemala Huehuetenango $17.50, Colombia
  Nariño $20.00, plus 10% subscribe-and-save. 5. Use web_fetch on the Intelligentsia
  single-origin page (https://www.intelligentsiacoffee.com/collections/single-origin-coffee)
  to retrieve: Black Cat Ethiopia $21.00, Colombia El Paraiso $23.50, Guatemala $19.50,
  plus 15% loyalty discount. 6. Optionally fetch the Perfect Daily Grind market analysis
  for broader context on 2024 pricing trends ($17–$28 standard range, 8% YoY increase).
  7. Compile a structured report for Marcus Delgado including: a pricing comparison
  table across all three competitors, subscription/loyalty program details, and strategic
  observations such as Veritas positioning in the $18–$24 range to remain competitive
  while differentiating on sourcing story.'
