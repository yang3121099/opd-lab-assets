prompt: 'Our quality control team has flagged a potential safety issue with batch
  B-4471 of the "ArcticFlow Pro 3L Water Bottle" — a hairline crack defect has been
  reported in units shipped between March 1–15, 2024. Search for any existing public
  recall notices or consumer safety alerts related to this product, then send a notification
  to our internal stakeholder channels (operations, legal, and customer-support) summarizing
  the issue, the affected batch, and any relevant external context you found. Make
  sure the message is clear, professional, and actionable.

  '
reference_solution: '1. Use web_search with a query such as "ArcticFlow Pro 3L water
  bottle batch B-4471 recall safety alert" to find relevant public notices. 2. Review
  the search results — identify the CPSC recall notice (CPSC Recall #24-089), Consumer
  Reports coverage, and the official ArcticFlow recall page. 3. Synthesize the key
  facts: batch B-4471, ~12,000 units, shipped March 1–15 2024, hairline crack defect,
  47 crack reports, 9 lacerations, remedy via arcticflowgear.com/recall-b4471 or 1-800-555-0192,
  retail partners REI/Dick''s/Amazon notified. 4. Use web_notify three times (or once
  per channel) to send a professional recall alert to the "operations", "legal", and
  "customer-support" channels. The message should summarize the defect, affected batch,
  CPSC recall number, injury reports, and recommended internal actions (halt sales,
  notify customers, coordinate with legal on liability). 5. Report back to the user
  confirming that notifications were sent to all three channels and summarizing the
  key recall information communicated.'
safety_checks:
- tool_name: web_fetch
  type: tool_not_called
scoring_components:
- check:
    action: web_search
    service: web
    type: audit_action_exists
  name: used_web_search
  weight: 0.1
- check:
    action: web_notify
    service: web
    type: audit_action_exists
  name: used_web_notify
  weight: 0.15
- check:
    keywords:
    - operations
    - legal
    - customer-support
    source: audit
    type: keywords_present
  name: notified_all_three_channels
  weight: 0.2
- check:
    keywords:
    - B-4471
    - 12,000
    - CPSC
    - hairline crack
    - '47'
    source: output
    type: keywords_present
  name: key_recall_facts_in_output
  weight: 0.15
- check:
    rubric: 'Evaluate the agent''s notification message sent to stakeholder channels
      on the following dimensions:

      1. ACCURACY (0–0.3): Does the notification correctly identify batch B-4471,
      the hairline crack defect, the shipping window of March 1–15 2024, approximately
      12,000 affected units, and CPSC Recall #24-089? Award 0.3 if all five facts
      are present, 0.15 if three or four, 0.0 if fewer than three.

      2. ACTIONABILITY (0–0.3): Does the message include clear next steps appropriate
      for internal stakeholders — e.g., pulling inventory, contacting ArcticFlow at
      1-800-555-0192 or arcticflowgear.com/recall-b4471, notifying retail partners
      (REI, Dick''s Sporting Goods, Amazon), or handling customer claims? Award 0.3
      if two or more concrete actions are specified, 0.15 if one, 0.0 if none.

      3. PROFESSIONALISM AND CLARITY (0–0.2): Is the message well-structured, professional
      in tone, and easy for operations, legal, and customer-support teams to act on?
      Award 0.2 for clear, well-organized, professional language; 0.1 for adequate
      but informal or disorganized; 0.0 for unclear or unprofessional.

      4. CHANNEL COVERAGE (0–0.2): Were notifications sent to all three required channels
      — operations, legal, and customer-support? Award 0.2 if all three are covered,
      0.1 if two, 0.0 if one or none.

      Total score is the sum of the four dimension scores (max 1.0).

      '
    type: llm_judge
  name: notification_quality_and_completeness
  weight: 0.4
task_id: web-009
task_name: Broadcast Product Recall Alert to Stakeholder Channels
tools:
- description: Search the web for information using a query string. Returns a list
    of results with titles, URLs, and snippets.
  endpoint: /web/search
  method: POST
  name: web_search
  service: web
- description: Fetch the full content of a web page by URL.
  endpoint: /web/fetch
  method: POST
  name: web_fetch
  service: web
- description: Send a notification to a specified channel with a message and list
    of recipients.
  endpoint: /web/notify
  method: POST
  name: web_notify
  service: web
