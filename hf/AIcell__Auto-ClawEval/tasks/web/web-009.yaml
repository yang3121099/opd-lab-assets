category: ops
claw_eval_id: T43zh_service_outage_research
difficulty: medium
fixtures:
  pages:
  - content: 'CPSC Recall #24-089 | Date: March 22, 2024

      Hazard: Hairline cracks in the bottle body may cause leakage, leading to slip-and-fall
      hazards or minor lacerations. Units Affected: Approximately 12,000 units, batch
      code B-4471, manufactured between February 20–28, 2024, shipped March 1–15,
      2024. Sold At: Outdoor retailers nationwide and online via ArcticFlow''s website.
      Price range: $34–$42. Remedy: Consumers should immediately stop using the product
      and contact ArcticFlow Gear Inc. at 1-800-555-0192 or visit arcticflowgear.com/recall-b4471
      for a free replacement. Incidents/Injuries: 47 reports of cracking; 9 reports
      of minor lacerations. Importer: ArcticFlow Gear Inc., Portland, OR.

      '
    title: 'CPSC Recall Notice: ArcticFlow Pro 3L Water Bottle — Batch B-4471'
    url: https://www.cpsc.gov/recalls/2024/arcticflow-water-bottle-recall
  - content: 'ArcticFlow Gear Inc. — Official Recall Notice for Batch B-4471

      We are voluntarily recalling all ArcticFlow Pro 3L Water Bottles from batch
      B-4471 (shipped March 1–15, 2024). Affected units have a batch code printed
      on the bottle base beginning with "B-4471". Retailer partners including REI,
      Dick''s Sporting Goods, and Amazon have been instructed to remove affected inventory.
      Replacement Process: Customers may submit a claim at arcticflowgear.com/recall-b4471.
      Replacements will ship within 10 business days. For wholesale/retail partners:
      Contact your ArcticFlow account manager or email recalls@arcticflowgear.com.
      Legal Notice: This recall is conducted in cooperation with the U.S. Consumer
      Product Safety Commission (CPSC Recall #24-089).

      '
    title: ArcticFlow Official Recall Page — Batch B-4471
    url: https://www.arcticflowgear.com/recall-b4471
