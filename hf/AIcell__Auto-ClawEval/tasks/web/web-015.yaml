category: ops
claw_eval_id: T44_service_outage_research
difficulty: medium
fixtures:
  pages:
  - content: 'URGENT PRODUCT RECALL NOTICE

      Product: NutriBlend Pro X2 Protein Powder

      Batch Number: NB-2024-0891

      Recall Class: Class I (FDA)

      Hazard: Potential Salmonella contamination

      Manufacture Dates: October 1–15, 2024

      Distribution Dates: October 18 – November 5, 2024

      Units Affected: Approximately 45,000

      States Affected: CA, TX, FL, NY, IL, PA, OH, GA, NC, MI, NJ, WA


      RECOMMENDED ACTIONS:

      - Immediately quarantine all units of batch #NB-2024-0891

      - Do not sell or distribute affected product

      - Contact NutriBlend at 1-800-NUTRI-SAFE for return/refund instructions

      - Notify customers who may have purchased affected product

      - Document all quarantined inventory for audit purposes


      For customer-facing guidance: advise customers to stop consumption immediately
      and seek medical attention if symptoms of Salmonella infection appear (fever,
      diarrhea, nausea).

      '
    title: 'URGENT RECALL: NutriBlend Pro X2 Protein Powder Batch #NB-2024-0891'
    url: https://www.foodsafety.gov/recalls/nutriblend-pro-x2-recall-2024
  - content: 'NutriBlend Inc. Voluntary Recall — Safety Notice

      Date Issued: October 22, 2024

      Product: NutriBlend Pro X2 (all sizes: 1lb, 2lb, 5lb)

      Batch: NB-2024-0891

      Reason: Routine testing identified potential Salmonella contamination in batch
      NB-2024-0891.

      No illnesses reported to date, but recall is precautionary and mandatory per
      FDA guidance.


      Retailer/Distributor Instructions:

      1. Pull all NutriBlend Pro X2 units with batch code NB-2024-0891 from shelves
      immediately.

      2. Quarantine stock in a secure area labeled "RECALLED — DO NOT SELL."

      3. Complete the online recall form at nutriblend.com/recall-form within 48 hours.

      4. Arrange return shipment via prepaid label (email recalls@nutriblend.com).

      5. Refunds will be processed within 10 business days of receipt.


      Customer Support Guidance:

      - Hotline: 1-800-NUTRI-SAFE (available 24/7 during recall period)

      - Email: recalls@nutriblend.com

      - Advise customers: stop use, return product, full refund guaranteed

      - Symptom guidance: refer to FDA Salmonella information page

      '
    title: NutriBlend Safety Notice — Voluntary Recall October 2024
    url: https://www.nutriblend.com/safety-notices/recall-nb-2024-0891
  search_results:
