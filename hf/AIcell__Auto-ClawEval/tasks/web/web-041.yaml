      '
    title: BurgerCo Northgate — Location Details
    url: https://franchise-portal.burgerco.com/locations/northgate
  - content: 'Welcome to the BurgerCo Franchise Portal.

      Compliance threshold: Health inspection score must be 75 or above.

      Locations with scores below 75 or missing inspection records are flagged for
