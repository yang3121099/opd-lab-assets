    url: https://franchise-portal.burgerco.com/overview
  search_results:
  - keywords:
    - franchise
    - burgerco
    - compliance
    - locations
    snippet: Central hub for all BurgerCo franchise location data, compliance scores,
      and operating details.
    title: BurgerCo Franchise Portal — Overview
    url: https://franchise-portal.burgerco.com/overview
  - keywords:
    - downtown
    - burgerco
    - health inspection
    - hours
    snippet: Downtown location at 142 Main Street. Health score 94. Manager Sandra
      Okafor.
    title: BurgerCo Downtown — Location Details
    url: https://franchise-portal.burgerco.com/locations/downtown
  - keywords:
    - westside
    - burgerco
    - health inspection
    - closure
    snippet: Westside location at 88 Riverside Drive. Health score 71 — below threshold.
      Dine-in closed.
    title: BurgerCo Westside — Location Details
    url: https://franchise-portal.burgerco.com/locations/westside
  - keywords:
    - airport
    - burgerco
    - inspection missing
