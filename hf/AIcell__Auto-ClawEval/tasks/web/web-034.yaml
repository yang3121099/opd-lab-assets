prompt: 'Our small-batch coffee roasting company, Ember & Ash Roasters, is preparing
  to launch a new line of single-origin Ethiopian Yirgacheffe beans. Before we finalize
  our retail pricing, I need a competitive pricing analysis. Search for what competitors
  are currently charging for premium single-origin Ethiopian Yirgacheffe coffee (12
  oz bags), identify the price range and key players, and give me a clear pricing
  recommendation for our product along with a brief rationale.

  '
reference_solution: '1. Use web_search to query for "Ethiopia Yirgacheffe 12 oz coffee
  price competitors" or similar terms to surface competitor pricing pages and market
  reviews. 2. Use web_fetch to retrieve full page content from key results: Blue Bottle
  ($22.00), Stumptown ($19.00), Intelligentsia ($21.50), Counter Culture ($18.50),
  and the Onibus 2024 market review. 3. Compile the competitor prices into a clear
  comparison: the market range is $18.50–$22.00 among major specialty roasters, with
  the broader premium market reaching $24.00 for micro-lots. 4. Reference the Onibus
  market review finding that the artisan sweet spot is $20–$22, and that pricing below
  $18 risks commodity perception. 5. Recommend that Ember & Ash Roasters price their
  Ethiopia Yirgacheffe at $20.00–$21.00 — competitive with Intelligentsia and Blue
  Bottle, above Counter Culture''s value positioning, and justified by direct trade
  or traceability messaging. 6. Present the analysis as a structured text response
  with competitor table, price range summary, and a clear recommendation with rationale.
  Do not send any notifications.'
