- check:
    rubric: 'Evaluate the quality and completeness of the agent''s competitive pricing
      analysis and recommendation for Ember & Ash Roasters'' Ethiopia Yirgacheffe
      12 oz bag.

      Score on these dimensions:

      1. Competitor coverage (0–0.25): Does the output mention at least 3 of the 4
      key competitors found in the data — Blue Bottle ($22.00), Stumptown ($19.00),
      Intelligentsia ($21.50), Counter Culture ($18.50)? Full credit for 3–4 competitors
      with prices, partial for 1–2.

      2. Price range accuracy (0–0.25): Does the output correctly identify the market
      price range as approximately $18–$24 for premium 12 oz bags, with the artisan
      sweet spot around $20–$22 as noted in the Onibus 2024 market review?

      3. Pricing recommendation specificity (0–0.25): Does the agent provide a specific,
      actionable price recommendation (e.g., $20–$22 or a specific dollar figure in
      that range) with a clear rationale referencing competitor positioning, direct
      trade, or consumer perception?

      4. Business rationale quality (0–0.25): Is the recommendation grounded in the
      competitive landscape? Does it mention factors like direct trade credentials,
      brand positioning, or the risk of pricing below $18 being perceived as commodity-grade?

      Scoring: 1.0 = all four dimensions addressed thoroughly; 0.75 = three dimensions
      well-covered; 0.5 = two dimensions covered or all four partially; 0.25 = only
      basic price data listed with no real recommendation; 0.0 = no meaningful analysis.

      '
    type: llm_judge
  name: pricing_recommendation_quality
  weight: 0.35
- check:
    rubric: 'Does the agent''s response include a clear, direct pricing recommendation
      for Ember & Ash Roasters'' Ethiopia Yirgacheffe 12 oz product? The recommendation
      should state a specific price or price range (ideally between $20 and $22 based
      on the market data) and briefly explain why. Score 1.0 if a specific recommendation
      with rationale is present, 0.5 if a recommendation is implied but vague, 0.0
      if no recommendation is made.

      '
    type: llm_judge
  name: recommendation_present
  weight: 0.1
