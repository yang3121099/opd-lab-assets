fixtures:
  pages:
  - content: 'NovaTech officially launched the Aurora smartwatch on March 15, 2024,
      at a starting price of $349. The device targets fitness enthusiasts and health-conscious
      consumers with a 14-day battery life, ECG monitoring, blood oxygen tracking,
      sleep analysis, and a titanium case option at $429. CEO Sandra Okafor presented
      the Aurora at a San Francisco event, calling it ''the most advanced smartwatch
      under $400.'' The Aurora ships March 28 and is available for pre-order now with
      over 50,000 units already reserved. NovaTech claims the Aurora''s AI-powered
      coaching differentiates it from competitors like Fitbit and Garmin. Analysts
      from Morgan Stanley raised their NovaTech price target from $85 to $102 following
      the announcement.

      '
    title: 'NovaTech Unveils Aurora: A Bold Move Into Premium Wearables'
    url: https://techcrunch.com/2024/03/15/novatech-aurora-smartwatch-launch
  - content: 'Market analysts at WearableTech Research believe NovaTech''s Aurora
      is positioned to capture 15% of the mid-premium smartwatch segment by Q4 2024.
      The $349 price point undercuts Garmin''s Forerunner 965 ($599) and Apple Watch
      Series 9 ($399) while offering comparable health features. Pre-orders surpassed
      50,000 units within 24 hours of the March 15 launch event. The Aurora''s 14-day
      battery life is a key differentiator, as most competitors offer 7 days or fewer.
      NovaTech plans to expand to European markets in Q3 2024 and Asian markets in
      Q4 2024.

      '
    title: 'Aurora vs. Competition: How NovaTech Plans to Capture 15% Market Share'
    url: https://wearabletech.io/novatech-aurora-market-analysis
  - content: 'FOR IMMEDIATE RELEASE - San Francisco, March 15, 2024. NovaTech Inc.
      announces the Aurora smartwatch. Key specs: 1.4-inch AMOLED display, 14-day
      battery, ECG, SpO2, GPS, titanium or aluminum case. CEO Sandra Okafor: ''Aurora
      redefines what consumers expect at this price point.'' MSRP: $349 aluminum,
      $429 titanium. Ships March 28, 2024. Pre-orders open at novatech.com.

      '
