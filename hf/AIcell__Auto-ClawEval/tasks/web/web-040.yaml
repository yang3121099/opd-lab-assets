- check:
    rubric: "Evaluate the competitive pricing intelligence report produced by the\
      \ agent for Beancraft Roasters. Score on four dimensions:\n1. ACCURACY OF COMPETITOR\
      \ DATA (0–0.25): Does the report correctly cite specific price points from the\
      \ fixture data?\n   Full credit if it mentions Verve's range ($19–$28, with\
      \ Kenya Kiambu AA at $28), Onyx's range ($22–$34, with Panama Geisha at $34),\
      \ and Counter Culture's range ($17–$26, with Finca El Puente at $24).\n   Partial\
      \ credit if at least two competitors are accurately represented with specific\
      \ prices.\n\n2. INDUSTRY CONTEXT (0–0.25): Does the report reference broader\
      \ market trends such as the $18–$28 average for specialty 12oz bags, tiered\
      \ pricing strategies, or subscription discount norms (10–20%)?\n   Full credit\
      \ if at least two industry insights are incorporated. Partial credit for one.\n\
      \n3. STRATEGIC RECOMMENDATION (0–0.25): Does the agent provide a clear, reasoned\
      \ pricing recommendation for Beancraft Roasters?\n   Full credit if the recommendation\
      \ references competitor positioning and suggests a specific price range or tier\
      \ strategy (e.g., entry-level under $20, mid-tier $21–$26, premium $27+).\n\
      \   Partial credit if a recommendation is made but lacks specificity or competitive\
      \ grounding.\n\n4. REPORT CLARITY AND STRUCTURE (0–0.25): Is the report well-organized,\
      \ easy to read, and suitable for a board meeting audience?\n   Full credit if\
      \ it has clear sections (e.g., competitor summaries, market context, recommendation).\n\
      \   Partial credit if content is present but poorly organized.\n\nFinal score\
      \ = sum of four dimension scores (max 1.0).\n"
