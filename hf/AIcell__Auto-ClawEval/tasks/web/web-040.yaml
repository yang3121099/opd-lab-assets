prompt: 'You are a market analyst for Beancraft Roasters, a specialty coffee company.
  The head of sales wants a competitive pricing intelligence report for our flagship
  product line before a board meeting tomorrow. Search for current pricing information
  on our top three competitors — Verve Coffee Roasters, Onyx Coffee Lab, and Counter
  Culture Coffee — focusing on their 12oz bag pricing for single-origin coffees. Then
  fetch any relevant pages to gather specific price points and product details. Summarize
  your findings in a clear report that includes competitor price ranges, any notable
  pricing strategies or promotions you find, and a recommendation on where Beancraft
  Roasters should position its pricing.

  '
reference_solution: '1. Use web_search to query for pricing information on Verve Coffee
  Roasters, Onyx Coffee Lab, and Counter Culture Coffee single-origin 12oz bags. 2.
  Use web_search again (or the same query) to find industry pricing trend context
  (e.g., Sprudge or Perfect Daily Grind articles). 3. Use web_fetch to retrieve the
  full page content for the Verve, Onyx, and Counter Culture product pages to get
  specific SKU-level prices. 4. Optionally fetch the Sprudge pricing trends article
  for industry benchmarks. 5. Compile findings: Verve ranges $19–$28 (Kenya Kiambu
  AA micro-lot at $28, buy-3 promo), Onyx ranges $22–$34 (Panama Geisha at $34, 15%
  first subscription), Counter Culture ranges $17–$26 (Finca El Puente at $24, B-Corp
  certified). 6. Note industry context: specialty 12oz average $18–$28, tiered pricing
  dominant, subscriptions with 10–20% discounts are standard, sustainability certifications
  support premium pricing. 7. Provide a recommendation: Beancraft Roasters should
  adopt a tiered strategy — entry-level single origins at $18–$20 to compete with
  Counter Culture''s volume offerings, mid-tier at $22–$26 aligned with Verve and
  Onyx core lines, and a premium micro-lot tier at $28–$32 to compete with Onyx''s
  Geisha positioning. Emphasize sustainability story and subscription discounts to
  match market norms. 8. Present findings in a structured report with competitor summaries,
  market context, and actionable recommendation — suitable for a board meeting.'
