category: ops
claw_eval_id: T44_service_outage_research
difficulty: medium
fixtures:
  pages:
  - content: 'OFFICIAL RECALL NOTICE — U.S. Consumer Product Safety Commission. Product:
      ThermoBlend Pro Blender | SKU: 7741 | Hazard: Motor overheating causing fire
      risk. Units Affected: ~45,000 manufactured March–August 2024. Remedy: Full refund.
      Consumers must immediately stop using the product. Return instructions at recall.thermoblend.com
      or call 1-800-555-0192. Retailers must remove all units from shelves and contact
      their ThermoBlend account manager for return logistics. Incident reports: 12
      minor fires, 3 injuries reported.

      '
    title: 'CPSC Recall Notice: ThermoBlend Pro SKU-7741 Overheating Risk'
    url: https://cpsc.gov/recalls/2024/thermoblend-pro-recall
  - content: 'Q: Which units are affected? A: All SKU-7741 units with manufacture
      dates March 2024 – August 2024. Q: What should consumers do? A: Stop use immediately.
      Register at recall.thermoblend.com for a full refund. Q: What should retail
      partners do? A: Pull all SKU-7741 inventory from shelves. Contact your account
      manager for prepaid return shipping labels. Display CPSC recall notice at point
      of sale. Q: Is there a replacement product? A: A redesigned unit will be available
      Q1 2025. Hotline: 1-800-555-0192 (Mon–Fri 8am–6pm ET).

      '
    title: ThermoBlend Pro Recall FAQ — Official Manufacturer Response
    url: https://manufacturerportal.thermoblend.com/recall-faq
  search_results:
  - keywords:
