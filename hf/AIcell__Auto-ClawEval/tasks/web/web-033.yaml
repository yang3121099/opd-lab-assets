difficulty: medium
fixtures:
  pages:
  - content: 'NutriPure has issued a voluntary recall of its Whey Protein Powder (2
      lb and 5 lb containers) affecting lot numbers NP-2024-0441, NP-2024-0442, and
      NP-2024-0443. The recall was initiated after routine testing revealed potential
      Salmonella contamination in the affected batches. The products were distributed
      nationwide between March 1 and April 15, 2024. Consumers are advised to immediately
      stop using the product and return it to the place of purchase for a full refund.
      No illnesses have been reported to date. For questions, contact NutriPure customer
      service at 1-800-555-0192 or recall@nutripure.com.

      '
    title: NutriPure Protein Powder Recall — Salmonella Contamination Risk
    url: https://www.foodsafety-news.com/2024/nutripure-protein-recall
  - content: 'FDA Class II Recall — NutriPure Whey Protein Powder. Recalling Firm:
      NutriPure Nutrition Inc., Austin, TX. Reason for Recall: Potential Salmonella
      contamination detected during routine quality testing. Affected Lot Numbers:
      NP-2024-0441, NP-2024-0442, NP-2024-0443. Distribution: Nationwide, March–April
      2024. Consumer Action: Stop use immediately. Return to retailer for full refund.
      Health Risk: Salmonella infection can cause serious illness, particularly in
      children, elderly, and immunocompromised individuals. Symptoms include diarrhea,
      fever, and abdominal cramps.

      '
    title: 'FDA Recall Notice: NutriPure Whey Protein Powder'
    url: https://www.fda.gov/safety/recalls-market-withdrawals/nutripure-2024
  - content: 'NutriPure Nutrition Inc. is voluntarily recalling specific lots of Whey
      Protein Powder as a precautionary measure following internal quality testing.
      Affected lots: NP-2024-0441, NP-2024-0442, NP-2024-0443. No consumer illnesses
      have been reported. Customers may return the product to any retailer for a full
      refund or contact us directly at recall@nutripure.com.

      '
    title: NutriPure Official Recall Statement
    url: https://www.nutripure-official.com/recall-notice
  - content: 'If you have NutriPure Whey Protein Powder at home, check the lot number
      printed on the bottom of the container. Lot numbers NP-2024-0441, NP-2024-0442,
      and NP-2024-0443 are affected. Stop using the product immediately and return
      it for a refund. The recall is due to potential Salmonella contamination. Vulnerable
      populations including children, the elderly, and those with weakened immune
      systems face the highest risk.

      '
    title: 'Consumer Reports: NutriPure Recall — What You Need to Know'
    url: https://www.consumerreports.org/food-safety/nutripure-recall-2024
