- check:
    rubric: "Evaluate the quality and completeness of the agent's recall notification\
      \ message sent via web_notify. The agent should have researched the UBP-3000\
      \ overheating issue (12 incidents, 3 burn injuries, 2 fire incidents, ~28,000\
      \ affected units, serial range UBP3000-10001 through UBP3000-38000) and incorporated\
      \ CPSC/FTC/appliance safety standards into a compliant recall message.\nScore\
      \ on these dimensions: 1. Accuracy (0-0.3): Does the message correctly reference\
      \ the UBP-3000 product, overheating hazard, and specific\n   incident data from\
      \ the fixture (12 incidents, burns, fires)?\n2. Compliance (0-0.3): Does the\
      \ message follow CPSC/recall standards — product ID, hazard description, consumer\n\
      \   action (stop use immediately), remedy (refund/replacement), and contact\
      \ info?\n3. Completeness (0-0.2): Are all three recipients (compliance@company.com,\
      \ legal@company.com, pr@company.com)\n   addressed and the channel 'safety-alerts'\
      \ used correctly?\n4. Clarity and Urgency (0-0.2): Is the message clear, urgent,\
      \ and actionable without minimizing language?\nScore 1.0 if all four dimensions\
      \ are well-addressed with specific fixture data referenced. Score 0.7 if three\
      \ dimensions are met but one is weak or missing specific data. Score 0.4 if\
      \ only two dimensions are met or the message is generic without fixture-specific\
      \ details. Score 0.1 if the notification was sent but the message is vague,\
      \ inaccurate, or non-compliant. Score 0.0 if no notification was sent or the\
      \ output is entirely off-task.\n"
    type: llm_judge
  name: recall_notification_quality
  weight: 0.35
