fixtures:
  pages:
  - content: 'FDA Recall Notification Requirements: All Class I recalls (health hazard)
      require immediate notification to direct accounts within 24 hours. Notifications
      must include: (1) Product name and description, (2) Lot/batch numbers affected,
      (3) Nature and severity of hazard, (4) Instructions for handling recalled product
      — quarantine, return, or destroy, (5) Contact information for questions. For
      listeria contamination, classify as Class I (serious adverse health consequences).
      Retailers must post visible notices and remove product from shelves immediately.

      '
    title: FDA Food Recall Procedures and Notification Guidelines
    url: https://www.fda.gov/food/recalls-outbreaks-emergencies/recalls
  - content: 'Listeria monocytogenes causes listeriosis, a serious infection. Symptoms
      include fever, muscle aches, and gastrointestinal distress. Particularly dangerous
      for pregnant women, newborns, elderly adults, and people with weakened immune
      systems. In food safety incidents, immediate removal of contaminated product
      is essential. Store managers should cease all sales of affected batches, isolate
      stock in a designated quarantine area, and await further instructions from the
      manufacturer or regulatory authority.

      '
    title: Listeria (Listeriosis) - CDC
    url: https://www.cdc.gov/listeria/index.html
  - content: 'Immediate actions for store managers upon receiving a recall notice:
      Step 1 — Pull all units of affected batch numbers from shelves immediately.
      Step 2 — Place in a clearly labeled quarantine area away from other products.
      Step 3 — Do not sell, donate, or discard without authorization. Step 4 — Complete
      the recall acknowledgment form and return to your compliance officer within
      2 hours. Step 5 — Document the number of units removed and their storage location.
      Contact the recall hotline if you have questions.

      '
    title: Recall Manager Best Practices for Retail Notification
    url: https://www.recallmanagers.org/best-practices
