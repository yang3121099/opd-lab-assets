category: ops
claw_eval_id: T43zh_service_outage_research
difficulty: medium
fixtures:
  pages:
  - content: 'FDA RECALL NOTICE — Issued: November 14, 2024. Product: NutriBlend Pro
      X2 Protein Powder. Batch Number: NB-2024-447. Recall Class: Class II. Reason:
      Undeclared peanut allergen contamination detected during routine quality audit.
      Units Affected: approximately 45,000. Distribution: nationwide across 200+ retail
      locations. Action Required: Retailers must remove product from shelves immediately.
      Consumers should discontinue use and return product for a full refund. For questions
      contact the FDA at 1-800-FDA-1088 or recall@nutriblend.com.

      '
    title: 'FDA Recall Notice: NutriBlend Pro X2 Protein Powder Batch #NB-2024-447'
    url: https://www.foodsafety.gov/recalls/2024/nutriblend-pro-x2-recall
  - content: 'NutriBlend Inc. Official Recall Statement — November 14, 2024. We are
      voluntarily recalling batch #NB-2024-447 of our Pro X2 Protein Powder following
      the discovery of a manufacturing error at our Denver facility. A cross-contamination
      event introduced undeclared peanut allergens into the affected batch. No injuries
      have been reported to date. We are working closely with the FDA and have notified
      all distribution partners. Consumers may return the product to the point of
      purchase for a full refund or contact recall@nutriblend.com. We sincerely apologize
      for any inconvenience and are committed to the highest safety standards.

      '
    title: 'NutriBlend Official Statement: Voluntary Recall of Pro X2 Batch #NB-2024-447'
    url: https://www.nutriblend.com/news/recall-notice-2024
  - content: 'Consumer Reports Analysis — November 15, 2024. The NutriBlend Pro X2
      recall affects batch #NB-2024-447 distributed between October 1 and November
      10, 2024. Approximately 45,000 units are in circulation. The contamination was
      identified through a third-party lab test commissioned by a retail partner.
      Consumers with peanut allergies are at highest risk. Retailers including major
      grocery chains and online platforms have begun pulling inventory. Consumer Reports
      recommends checking your batch number on the bottom of the container and contacting
      NutriBlend directly if you have the affected product.

      '
    title: 'Consumer Reports: NutriBlend Pro X2 Recall — What You Need to Know'
    url: https://www.consumerreports.org/food-safety/nutriblend-recall-2024
  search_results:
