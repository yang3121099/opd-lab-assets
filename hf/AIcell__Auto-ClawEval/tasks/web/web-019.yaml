scoring_components:
- check:
    action: web_search
    service: web
    type: audit_action_exists
  name: used_web_search
  weight: 0.1
- check:
    action: web_fetch
    service: web
    type: audit_action_exists
  name: used_web_fetch
  weight: 0.1
- check:
    keywords:
    - Blue Bottle
    - Stumptown
    - Intelligentsia
    - $22
    - $18
    - $20
    type: keywords_present
  name: competitor_prices_mentioned
  weight: 0.2
- check:
    keywords:
    - $20.40
    - '2024'
    - market
    type: keywords_present
  name: market_context_included
  weight: 0.1
- check:
    rubric: 'Evaluate the quality and completeness of the competitive pricing intelligence
      report provided by the agent. The report should: (1) Present a clear comparison
      of all three competitors — Blue Bottle Coffee (avg ~$22.00/12oz), Stumptown
      Coffee Roasters (avg ~$18.33/12oz), and Intelligentsia Coffee (avg ~$20.25/12oz)
      — with specific price points for individual SKUs where available; (2) Reference
      the 2024 market average of $20.40 per 12oz from the Sprudge industry report
      as context; (3) Include a comparison table or structured summary that Marcus
      Delgado could present at a board meeting; (4) Provide at least one concrete,
      actionable pricing recommendation for Veritas Coffee Roasters (e.g., targeting
      the $19–$23 range, or positioning above/below specific competitors); (5) Be
      professional in tone and suitable for a board-level audience. Scoring: 1.0 if
      all five criteria are met with accuracy and clarity; 0.75 if four criteria met;
      0.5 if three criteria met or data is partially inaccurate; 0.25 if only surface-level
      comparison with no recommendation; 0.0 if output is missing, incoherent, or
      contains no competitor pricing data.

      '
    type: llm_judge
  name: pricing_recommendation_quality
  weight: 0.3
- check:
    rubric: 'Does the agent''s output include a specific, actionable pricing recommendation
      for Veritas Coffee Roasters? A strong recommendation should reference a concrete
      price range (e.g., $19–$23, or a specific dollar figure), explain the strategic
      rationale (e.g., undercutting Blue Bottle while matching Intelligentsia, or
      positioning as a premium player above Stumptown), and ideally reference the
      market sweet spot of $19–$22 identified in the 2024 Sprudge report. Score 1.0
      if the recommendation is specific, justified, and references competitor data;
      0.5 if a recommendation is present but vague or lacks justification; 0.0 if
      no recommendation is provided.

      '
    type: llm_judge
  name: actionable_recommendation_present
  weight: 0.2
