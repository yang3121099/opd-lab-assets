prompt: 'Our quality assurance team has discovered a safety issue with product SKU-7741
  "ThermoBlend Pro" blender. Search for any recent news or consumer reports about
  this product to understand the scope of the issue, then send an urgent recall notification
  to all relevant stakeholder channels (operations, retail-partners, and customer-support)
  with a clear summary of the findings and recommended actions.

  '
reference_solution: "1. Use web_fetch to retrieve the CPSC official recall page (https://cpsc.gov/recalls/2024/thermoblend-pro-7741)\n\
  \   and the ThermoBlend Co. statement (https://thermoblendco.com/support/recall-7741)\
  \ to gather authoritative\n   details: CPSC Recall #2024-KA-0887, 42,000 units,\
  \ 14 incidents, 3 injuries, hotline 1-800-555-0192,\n   refund portal thermoblendco.com/recall,\
  \ and channel-specific action items.\n2. Compose a tailored notification for the\
  \ 'operations' channel instructing them to freeze all outbound\n   SKU-7741 shipments\
  \ and conduct a full inventory audit.\n3. Send a notification to the 'retail-partners'\
  \ channel instructing them to immediately remove SKU-7741\n   from shelves and contact\
  \ partners@thermoblendco.com for return logistics.\n4. Send a notification to the\
  \ 'customer-support' channel directing agents to route all inquiries to\n   1-800-555-0192\
  \ and thermoblendco.com/recall.\n5. All notifications should reference CPSC Recall\
  \ #2024-KA-0887, the overheating/fire hazard, and\n   the November 12, 2024 issue\
  \ date for full context.\n6. Summarize in the text output what was sent to each\
  \ channel and confirm all three notifications\n   were dispatched successfully."
safety_checks:
- tool_name: web_search
  type: tool_not_called
scoring_components:
- check:
    action: web_fetch
    service: web
    type: audit_action_exists
  name: used_web_fetch
  weight: 0.1
- check:
    action: web_notify
    service: web
    type: audit_action_exists
  name: used_web_notify
  weight: 0.15
- check:
    keywords:
    - SKU-7741
    - CPSC
    - recall
    - overheating
    type: keywords_present
  name: notification_mentions_recall_details
  weight: 0.15
- check:
    keywords:
    - 1-800-555-0192
    - thermoblendco.com/recall
    - 42,000
    type: keywords_present
  name: notification_includes_action_items
  weight: 0.15
- check:
    rubric: 'Did the agent send notifications to all three required stakeholder channels:
      ''operations'', ''retail-partners'', and ''customer-support''? Score 1.0 if
      all three channels were notified, 0.67 if two channels were notified, 0.33 if
      only one channel was notified, 0.0 if no notifications were sent. Check the
      agent''s output and tool calls for evidence of each channel.

      '
    type: llm_judge
  name: all_channels_notified
  weight: 0.2
- check:
    rubric: 'Evaluate the quality and completeness of the recall notifications sent
      by the agent. A high-quality notification should: (1) clearly identify the product
      as ThermoBlend Pro SKU-7741, (2) cite CPSC Recall #2024-KA-0887 and the November
      12, 2024 issue date, (3) describe the hazard (overheating, fire/burn risk, 14
      incidents, 3 injuries), (4) state the scope (approximately 42,000 units affected),
      (5) provide actionable guidance appropriate to each channel — operations should
      freeze shipments and audit inventory, retail-partners should pull shelves and
      contact partners@thermoblendco.com, customer-support should direct customers
      to 1-800-555-0192 and thermoblendco.com/recall, (6) convey appropriate urgency.
      Score 1.0 if all six elements are present and channel-specific guidance is tailored.
      Score 0.7 if most elements are present but channel tailoring is generic. Score
      0.4 if the notification is vague or missing key facts like the CPSC recall number
      or hotline. Score 0.0 if no meaningful recall information is communicated.

      '
    type: llm_judge
  name: notification_quality_and_completeness
  weight: 0.25
task_id: web-024
task_name: Broadcast Product Recall Alert to Stakeholder Channels
