fixtures:
  pages:
  - content: 'CPSC Recall #2024-KA-0887 | ThermoBlend Pro SKU-7741 | Issued: November
      12, 2024. Hazard: The motor assembly can overheat, posing a fire and burn risk
      to consumers. Incidents: 14 confirmed overheating incidents; 3 minor burn injuries
      reported. Units Affected: Approximately 42,000 units sold between January 2024
      and October 2024. Remedy: Full refund. Consumers should immediately stop using
      the product and visit thermoblendco.com/recall or call 1-800-555-0192 to initiate
      a refund. Retailers must halt all sales and return inventory.

      '
    title: CPSC Official Recall Notice — ThermoBlend Pro SKU-7741
    url: https://cpsc.gov/recalls/2024/thermoblend-pro-7741
  - content: 'ThermoBlend Co. is voluntarily cooperating with CPSC Recall #2024-KA-0887.
      All retail partners should immediately remove SKU-7741 from shelves and contact
      our partner relations team at partners@thermoblendco.com to arrange return logistics.
      Customer support teams should direct all inquiries to the recall hotline 1-800-555-0192
      and the refund portal at thermoblendco.com/recall. Operations teams should freeze
      all outbound shipments of SKU-7741 and initiate a full inventory audit.

      '
    title: ThermoBlend Co. Official Statement on SKU-7741 Recall
    url: https://thermoblendco.com/support/recall-7741
  - content: 'Consumer Reports has tracked 14 overheating incidents involving the
      ThermoBlend Pro SKU-7741 since September 2024. Three users sustained minor burns.
      The product''s motor housing shows signs of inadequate thermal protection. CPSC
      issued Recall #2024-KA-0887 on November 12, 2024. Consumers are advised to unplug
      and store the unit safely until a refund is processed.

      '
    title: ThermoBlend Pro SKU-7741 Overheating Reports Surface
