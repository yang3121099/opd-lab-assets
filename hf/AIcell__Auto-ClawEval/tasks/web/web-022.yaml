prompt: 'You are a market analyst for Beancraft Roasters, a specialty coffee company.
  The head of sales, Marcus Delgado, needs a competitive pricing report before tomorrow''s
  board meeting. Search for current pricing information on our three main competitors
  — Blue Bottle Coffee, Stumptown Coffee, and Intelligentsia Coffee — focusing on
  their 12oz bag prices for single-origin beans. Then fetch the most relevant pages
  to gather detailed pricing data and summarize your findings in a clear competitive
  pricing report that Marcus can present to the board.

  '
reference_solution: "1. Use web_search to query for pricing information on Blue Bottle\
  \ Coffee single-origin 12oz bags.\n2. Use web_search to query for Stumptown Coffee\
  \ single-origin 12oz pricing.\n3. Use web_search to query for Intelligentsia Coffee\
  \ single-origin 12oz pricing.\n4. Use web_fetch on the Blue Bottle single-origin\
  \ collection page (https://bluebottlecoffee.com/store/single-origin)\n   to retrieve\
  \ detailed pricing: Ethiopia Yirgacheffe $22, Kenya Kiambu $24, Guatemala $21.\n\
  5. Use web_fetch on the Stumptown single-origin collection page (https://stumptowncoffee.com/collections/single-origin)\n\
  \   to retrieve: Hair Bender $17, Ethiopia Duromina $19, Colombia El Injerto $21,\
  \ Honduras $18.\n6. Use web_fetch on the Intelligentsia single-origin page (https://www.intelligentsiacoffee.com/collections/single-origin)\n\
  \   to retrieve: Black Cat $18, El Gallo Guatemala $20, Rwandan Karaba $23, Ethiopia\
  \ Chelchele $22.\n7. Optionally fetch the Coffee Review analysis page for market\
  \ context and average pricing data.\n8. Compile a competitive pricing report for\
  \ Marcus Delgado that includes:\n   - A table or structured list of each competitor's\
  \ products and 12oz prices\n   - Price ranges and averages per brand (Blue Bottle:\
  \ $21–$24 avg $22.33; Stumptown: $17–$21 avg $18.75; Intelligentsia: $18–$23 avg\
  \ $20.75)\n   - Note that all three offer 10% subscription discounts\n   - Market\
  \ context: industry average $18–$25 for specialty single-origin 12oz\n   - A recommendation\
  \ for Beancraft Roasters to price between $18–$22 to remain competitive\n9. Present\
  \ the report as clear text output suitable for a board meeting presentation."
