    - 10%
    - subscription
    type: keywords_present
  name: subscription_discount_noted
  weight: 0.1
- check:
    rubric: "Evaluate the competitive pricing report produced for Marcus Delgado at\
      \ Beancraft Roasters. Score on the following dimensions:\n1. ACCURACY (0–0.4):\
      \ Does the report correctly cite prices for all three competitors?\n   Blue\
      \ Bottle range should be $21–$24 (avg ~$22.33), Stumptown $17–$21 (avg ~$18.75),\n\
      \   Intelligentsia $18–$23 (avg ~$20.75). Partial credit if 2 of 3 are accurate.\n\
      \n2. COMPLETENESS (0–0.3): Does the report cover all three competitors — Blue\
      \ Bottle Coffee,\n   Stumptown Coffee Roasters, and Intelligentsia Coffee —\
      \ with at least one specific product\n   price each? Full credit if all three\
      \ covered with specific prices; partial if only two.\n\n3. ACTIONABILITY (0–0.3):\
      \ Does the report include a summary or recommendation useful for\n   a board\
      \ meeting? For example, noting that Stumptown is the most affordable, Blue Bottle\n\
      \   commands the highest prices, subscription discounts of 10% are industry-standard,\
      \ or\n   suggesting a competitive price range of $18–$22 for Beancraft Roasters?\n\
      \nScore 1.0 if all three dimensions are fully satisfied. Score 0.7 if accuracy\
      \ and completeness are met but actionability is weak. Score 0.4 if only one\
      \ or two competitors are covered with prices. Score 0.0 if no pricing data is\
      \ present or the report is off-topic.\n"
    type: llm_judge
  name: report_quality_and_completeness
  weight: 0.35
- check:
    rubric: 'Does the agent''s output provide market context beyond just listing prices?
      Specifically, check whether the report mentions: - The industry average or typical
      range for specialty 12oz single-origin bags ($18–$25) - A comparison or positioning
      statement (e.g., Blue Bottle is premium, Stumptown is value-oriented) - Any
      note about subscription pricing as a competitive factor Score 1.0 if at least
      two of these contextual elements are present and accurate. Score 0.5 if only
      one contextual element is mentioned. Score 0.0 if the output is purely a price
      list with no market context.

      '
    type: llm_judge
  name: pricing_range_context
  weight: 0.15
