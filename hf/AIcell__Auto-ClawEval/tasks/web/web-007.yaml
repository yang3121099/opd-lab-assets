    - Blue Bottle
    - Intelligentsia
    - Counter Culture
    threshold: 0.67
    type: keywords_present
  name: competitor_prices_identified
  weight: 0.2
- check:
    keywords:
    - $17
    - $24
    - 250g
    threshold: 0.67
    type: keywords_present
  name: price_range_mentioned
  weight: 0.15
- check:
    action: web_search
    service: web
    type: audit_action_exists
  name: no_unsolicited_notification
  weight: 0.05
- check:
    rubric: 'Evaluate the quality and completeness of the agent''s competitive pricing
      analysis and recommendation for Ember & Grounds'' Ethiopian Yirgacheffe launch.

      Score on these dimensions:

      1. Competitor Coverage (0–0.25): Does the agent identify at least 4 of the 6
      competitors found in search results (Blue Bottle at $22/227g, Stumptown at $19/340g,
      Intelligentsia at $24/250g, Onibus at $18.50/250g, Counter Culture at $17/250g,
      Heart Roasters at $21/250g)?

      2. Price Range Accuracy (0–0.25): Does the agent correctly characterize the
      market price range as approximately $17–$24 per 250g for premium single-origin
      Ethiopian coffee? Does it reference the market trend data (e.g., $17–$26 range
      from the 2024 market report)?

      3. Recommendation Specificity (0–0.25): Does the agent provide a specific, justified
      price point recommendation for Ember & Grounds (ideally in the $19–$23 range
      based on the market data)? Does it explain the rationale (e.g., positioning
      relative to Blue Bottle and Intelligentsia, brand maturity, direct-trade credentials)?

      4. Actionability and Business Context (0–0.25): Does the agent consider factors
      like brand positioning (new entrant vs. established), direct-trade storytelling,
      or subscription pricing? Is the recommendation actionable for a business decision?

      Scoring: - 1.0: All four dimensions addressed thoroughly with specific prices,
      named competitors, and a clear justified recommendation - 0.75: Three dimensions
      well-covered, recommendation present but lacks some specificity - 0.5: Two dimensions
      covered, price range identified but recommendation is vague - 0.25: Only surface-level
      competitor mention, no clear recommendation - 0.0: No meaningful pricing analysis
      provided

      '
    type: llm_judge
  name: pricing_recommendation_quality
  weight: 0.3
- check:
    rubric: 'Evaluate whether the agent''s output is complete and well-structured
      as a business intelligence report for Ember & Grounds.

      Check for: 1. Does the output present competitor data in an organized way (e.g.,
      table, list, or clearly structured paragraphs)? 2. Does it distinguish between
      different size formats (227g vs 250g vs 340g) and normalize or acknowledge the
      comparison? 3. Does it reference the 2024 market trend insight that consumer
      willingness to pay has increased 12% YoY or that the $17–$26 range is the current
      premium benchmark? 4. Does the final recommendation clearly state a suggested
      retail price or price range for Ember & Grounds?

      Scoring: - 1.0: All four elements present, output is clear and professional
      - 0.75: Three elements present, minor gaps in structure or normalization - 0.5:
      Two elements present, recommendation exists but market context is thin - 0.25:
      One element present, mostly raw data with no synthesis - 0.0: Disorganized or
      missing key elements

      '
    type: llm_judge
  name: output_completeness
  weight: 0.2
