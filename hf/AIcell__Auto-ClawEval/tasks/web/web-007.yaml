prompt: 'Our artisan coffee roasting company, Ember & Grounds, is preparing to launch
  a new single-origin Ethiopian Yirgacheffe blend next month. Before we finalize our
  retail pricing, I need a competitive pricing analysis. Search for what competitors
  are currently charging for premium single-origin Ethiopian coffee (250g or similar
  sizes), identify the price range and key players, and give me a clear recommendation
  on where Ember & Grounds should position its price point to be competitive yet premium.

  '
reference_solution: '1. Use web_search with a query like "premium single-origin Ethiopian
  Yirgacheffe coffee 250g price competitors 2024" to retrieve competitor pricing data.
  2. Review the search results to identify key competitors: Blue Bottle ($22/227g),
  Stumptown ($19/340g), Intelligentsia ($24/250g), Onibus ($18.50/250g), Counter Culture
  ($17/250g), Heart Roasters ($21/250g). 3. Optionally use web_fetch on one or two
  URLs (e.g., Intelligentsia or the Seattle Coffee Works market report) to get deeper
  pricing context and market trend data. 4. Normalize prices to a per-250g basis where
  possible and identify the market range of approximately $17–$24 for established
  specialty roasters. 5. Reference the 2024 market trend data: premium Ethiopian coffees
  range $17–$26, consumer willingness to pay is up 12% YoY, and new entrants are advised
  to position at $19–$23. 6. Synthesize findings into a structured competitive analysis
  listing each competitor with their price and positioning. 7. Provide a specific
  price recommendation for Ember & Grounds — e.g., $20–$22 for a 250g bag — justified
  by the brand''s new-entrant status, the need to undercut Intelligentsia slightly
  while staying above Counter Culture, and room to raise prices as brand recognition
  grows. 8. Present the output as a clear, actionable business recommendation without
  sending any notifications.'
