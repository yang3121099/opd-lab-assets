- check:
    rubric: "Evaluate the competitive pricing intelligence report produced by the\
      \ agent for Veritas Coffee Roasters. Score on the following dimensions:\n1.\
      \ ACCURACY OF COMPETITOR PRICES (0–0.3): Does the report correctly cite Blue\
      \ Bottle's Ethiopia Yirgacheffe at $19.00,\n   Stumptown's range of $15.00–$17.50\
      \ (Hair Bender $16.00, Congo Kivu $17.50), and Intelligentsia's range of\n \
      \  $17.00–$20.50 (Black Cat $18.00, El Gallo $20.50)? Award 0.3 if all three\
      \ competitors' prices are accurately\n   represented, 0.15 if two are correct,\
      \ 0.05 if only one.\n\n2. PROMOTIONS AND DISCOUNTS (0–0.2): Does the report\
      \ mention Stumptown's SPRING10 promo code (10% off),\n   Blue Bottle's Subscribe\
      \ & Save (15% off), and Stumptown's loyalty member discount (5%)? Award 0.2\
      \ if all three\n   are noted, 0.1 if two, 0.05 if one.\n\n3. POSITIONING RECOMMENDATION\
      \ (0–0.3): Does the agent provide a clear, reasoned recommendation about where\n\
      \   Veritas's $18.50 product sits in the market? A strong answer should note\
      \ that $18.50 is competitive with\n   Intelligentsia's Black Cat ($18.00) and\
      \ above Stumptown's range, positioning Veritas in the premium-mid tier.\n  \
      \ Award 0.3 for a specific, well-reasoned recommendation referencing actual\
      \ competitor prices, 0.15 for a\n   vague recommendation, 0.0 for no recommendation.\n\
      \n4. REPORT STRUCTURE AND USABILITY (0–0.2): Is the report clearly organized\
      \ with sections or headers, easy for\n   Marcus Chen to present at a board meeting?\
      \ Award 0.2 for a well-structured report with clear sections,\n   0.1 for adequate\
      \ but unstructured prose, 0.0 for disorganized output.\n\nTotal score = sum\
      \ of dimension scores (max 1.0).\n"
    type: llm_judge
  name: report_quality_and_recommendation
  weight: 0.45
