prompt: 'You are a market analyst for Veritas Coffee Roasters, a specialty coffee
  company. The head of sales, Marcus Chen, needs a competitive pricing intelligence
  report before tomorrow''s board meeting. Search for current pricing information
  on our top competitors — Blue Bottle Coffee, Stumptown Coffee, and Intelligentsia
  Coffee — focusing on their single-origin whole bean 12oz offerings. Fetch any relevant
  pages to gather specific price points, and summarize your findings in a clear report
  that includes competitor prices, any promotional offers, and a recommendation on
  where Veritas should position its own $18.50 single-origin 12oz product.

  '
reference_solution: '1. Search the web for "Blue Bottle Coffee single origin 12oz
  pricing" to find Blue Bottle''s product page and prices. 2. Search for "Stumptown
  Coffee single origin 12oz whole bean price" to find Stumptown''s offerings and the
  SPRING10 promotion. 3. Search for "Intelligentsia Coffee single origin 12oz pricing
  2024" to find Intelligentsia''s premium pricing. 4. Fetch the Blue Bottle single-origin
  page (https://bluebottlecoffee.com/store/single-origin) to confirm prices: Ethiopia
  Yirgacheffe $19.00, Kenya Kiambu $21.00, Colombia Huila $18.50; Subscribe & Save
  15%. 5. Fetch the Stumptown single-origin page (https://stumptowncoffee.com/collections/single-origin)
  to confirm: Hair Bender $16.00, Congo Kivu $17.50, SPRING10 promo 10% off, loyalty
  5% off. 6. Fetch the Intelligentsia single-origin page (https://www.intelligentsiacoffee.com/collections/single-origin)
  to confirm: Black Cat $18.00, El Gallo $20.50, no current promotions. 7. Compile
  a structured report for Marcus Chen with: (a) competitor price tables, (b) active
  promotions, (c) market positioning analysis noting Veritas at $18.50 sits between
  Stumptown''s top tier and Intelligentsia''s entry price, competing directly with
  Intelligentsia''s Black Cat, and (d) a recommendation to maintain $18.50 as a premium-mid
  positioning, emphasizing direct-trade or quality differentiators to justify the
  price versus Stumptown''s discounted offerings.'
