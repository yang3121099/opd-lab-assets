scoring_components:
- check:
    action: web_search
    service: web
    type: audit_action_exists
  name: used_web_search
  weight: 0.15
- check:
    keywords:
    - Blue Bottle
    - Stumptown
    - Intelligentsia
    - $22
    - $19.50
    - $24
    type: keywords_present
  name: competitor_prices_identified
  weight: 0.2
- check:
    keywords:
    - range
    - average
    type: keywords_present
  name: price_range_and_average_reported
  weight: 0.15
- check:
    keywords:
    - Sweet Maria
    type: keywords_present
  name: green_bean_excluded_or_noted
  weight: 0.1
- check:
    rubric: "Evaluate the agent's competitive pricing analysis for Beancraft Roasters\
      \ on Ethiopia Yirgacheffe 250g bags.\nScore on these dimensions:\n1. DATA ACCURACY\
      \ (0–0.3): Does the output correctly report prices from the fixture data?\n\
      \   - Blue Bottle: $22.00, Stumptown: $19.50 (sale) / $21.00 (regular), Intelligentsia:\
      \ $24.00,\n     Onibus: $18.00, Counter Culture: $20.00, Trade Coffee: $17.50\
      \ (subscriber) / $21.00 (retail).\n   - Full credit if at least 4 of these 6\
      \ roasted-bean competitors are accurately cited.\n\n2. ANALYTICAL INSIGHT (0–0.3):\
      \ Does the output compute or estimate a meaningful price range\n   (approximately\
      \ $18–$24 for roasted retail) and note an average around $20–$21?\n   Does it\
      \ correctly flag Sweet Maria's as a home-roasting supplier (not a direct retail\
      \ competitor)?\n\n3. DIFFERENTIATORS NOTED (0–0.2): Does the output mention\
      \ relevant competitive differentiators\n   such as Intelligentsia's Good Food\
      \ Award 2023, Counter Culture's organic/B-Corp status,\n   Stumptown's current\
      \ sale, or subscription pricing models?\n\n4. ACTIONABLE RECOMMENDATIONS (0–0.2):\
      \ Does the output provide specific, logical pricing\n   recommendations for\
      \ Beancraft (e.g., suggested price point, positioning strategy, whether\n  \
      \ to offer subscriptions, how to compete with premium or value players)?\n\n\
      Scoring: - 0.9–1.0: All four dimensions addressed thoroughly with accurate data\
      \ and concrete recommendations. - 0.7–0.89: Three dimensions well-covered; minor\
      \ gaps in data or recommendations. - 0.5–0.69: Two dimensions covered; missing\
      \ key prices or recommendations are vague. - 0.3–0.49: Only one dimension addressed\
      \ or significant factual errors. - 0.0–0.29: Output is incomplete, inaccurate,\
      \ or does not address the task.\n"
    type: llm_judge
  name: analysis_quality_and_recommendations
  weight: 0.4
