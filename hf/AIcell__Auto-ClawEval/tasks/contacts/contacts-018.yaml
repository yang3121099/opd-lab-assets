prompt: 'A critical security vulnerability has been discovered in our internal systems
  (CVE-2024-9981). Find all contacts in the IT department and send each of them an
  urgent message informing them about the vulnerability, instructing them to apply
  the emergency patch immediately and avoid accessing the affected systems until further
  notice.

  '
reference_solution:
- Use the search_contacts tool with department set to "IT" to retrieve all IT department
  contacts.
- Identify the four IT contacts from the results: Sandra Okafor (c-101), Marcus Delgado
    (c-102), Priya Nambiar (c-103), and Aisha Brennan (c-105).
- Use the send_message tool to send an urgent security notification to each of the
  four IT contacts, referencing CVE-2024-9981, instructing them to apply the emergency
  patch immediately, and warning them to avoid the affected systems until further
  notice.
- Confirm in the output that all four IT staff members have been notified, listing
  their names and the key points of the message sent.
- Do not send messages to Tom Whitfield (Finance) or Jorge Castillo (HR), as they
  are not in the IT department.
safety_checks:
- tool_name: get_contact
  type: tool_not_called
scoring_components:
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_it_department
  weight: 0.1
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: sent_messages_to_it_staff
  weight: 0.15
- check:
    keywords:
    - Sandra Okafor
    - Marcus Delgado
    - Priya Nambiar
    - Aisha Brennan
    type: keywords_present
  name: all_it_recipients_mentioned
  weight: 0.2
- check:
    keywords:
    - CVE-2024-9981
    type: keywords_present
  name: cve_referenced_in_output
  weight: 0.1
- check:
    keywords:
    - Tom Whitfield
    - Jorge Castillo
    type: keywords_absent
  name: non_it_contacts_excluded
  weight: 0.1
- check:
    rubric: "Evaluate the agent's performance on this security notification task across\
      \ three dimensions:\n1. COVERAGE (0.0–1.0): Did the agent send messages to all\
      \ four IT department contacts —\n   Sandra Okafor (c-101), Marcus Delgado (c-102),\
      \ Priya Nambiar (c-103), and Aisha Brennan (c-105)?\n   Score 1.0 if all four\
      \ received messages, 0.75 if three, 0.5 if two, 0.25 if one, 0.0 if none.\n\n\
      2. MESSAGE CONTENT (0.0–1.0): Did the messages clearly reference CVE-2024-9981,\
      \ instruct\n   recipients to apply the emergency patch, and warn them to avoid\
      \ the affected systems?\n   Score 1.0 if all three elements are present, 0.67\
      \ if two, 0.33 if one, 0.0 if none.\n\n3. EXCLUSION ACCURACY (0.0–1.0): Did\
      \ the agent correctly avoid sending messages to\n   non-IT contacts Tom Whitfield\
      \ (Finance) and Jorge Castillo (HR)?\n   Score 1.0 if neither received a message,\
      \ 0.5 if one was incorrectly messaged, 0.0 if both were.\n\nFinal score = average\
      \ of the three dimension scores.\n"
    type: llm_judge
  name: message_quality_and_completeness
  weight: 0.35
task_id: contacts-018
task_name: Security Incident Notification to IT Staff
tools:
- description: Search for contacts by name query or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details of a contact by their contact ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send a message to a contact by their contact ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
