category: communication
claw_eval_id: T09zh_contact_lookup
difficulty: medium
fixtures:
  contacts:
  - department: Engineering
    email: priya.nair@company.com
    id: contact-001
    name: Priya Nair
    phone: +1-415-555-0101
    title: Senior Software Engineer
  - department: DevOps
    email: marcus.webb@company.com
    id: contact-002
    name: Marcus Webb
    phone: +1-415-555-0102
    title: Site Reliability Engineer
  - department: Engineering
    email: yuki.tanaka@company.com
    id: contact-003
    name: Yuki Tanaka
    phone: +1-415-555-0103
    title: Backend Engineer
  - department: Finance
    email: sandra.okonkwo@company.com
    id: contact-004
    name: Sandra Okonkwo
    phone: +1-415-555-0104
    title: Financial Analyst
  - department: DevOps
    email: derek.hollis@company.com
    id: contact-005
