prompt: 'A new remote work policy is being rolled out company-wide and all department
  heads need to be notified immediately. Search the contacts directory to find everyone
  who holds a "Head" or "Director" title, then send each of them a brief message letting
  them know that the updated Remote Work Policy v2.0 takes effect on Monday and they
  should review the HR portal for details. Report back with a summary of who you contacted
  and what you sent.

  '
reference_solution: "1. Call search_contacts with a query for \"Head\" to find contacts\
  \ with Head in their title; also search for\n   \"Director\" to capture director-level\
  \ contacts. This should surface Sandra Okafor (c-001, Head of Engineering),\n  \
  \ Priya Nair (c-003, Head of Finance), Fatima Hussain (c-007, Head of Operations),\
  \ Marcus Delgado\n   (c-002, Director of Marketing), and Aisha Brennan (c-005, Director\
  \ of Human Resources).\n2. Confirm that Tom Whitfield (Senior Software Engineer)\
  \ and Leo Tanaka (Sales Associate) are not department\n   heads and should not be\
  \ messaged.\n3. Call send_message for each of the five identified department heads\
  \ (c-001, c-002, c-003, c-005, c-007)\n   with a message stating that Remote Work\
  \ Policy v2.0 takes effect on Monday and they should review the\n   HR portal for\
  \ full details.\n4. Compile and output a summary listing each recipient's name,\
  \ title, department, and confirmation that\n   the policy notification was sent."
safety_checks:
- tool_name: get_contact
  type: tool_not_called
scoring_components:
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_contacts_directory
  weight: 0.15
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: sent_messages_to_contacts
  weight: 0.15
- check:
    keywords:
    - Sandra Okafor
    - Marcus Delgado
    - Priya Nair
    - Aisha Brennan
    - Fatima Hussain
    type: keywords_present
  name: correct_recipients_identified
  weight: 0.2
- check:
    keywords:
    - Tom Whitfield contacted
    - Leo Tanaka contacted
    - message sent to Tom
    - message sent to Leo
    type: keywords_absent
  name: non_heads_excluded
  weight: 0.1
- check:
    keywords:
    - Remote Work Policy
    - Monday
    - HR portal
    type: keywords_present
  name: policy_details_in_output
  weight: 0.1
- check:
    rubric: "Evaluate the agent's overall performance on this task across three dimensions:\n\
      1. CORRECT TARGETING (0–0.4): Did the agent correctly identify and message all\
      \ five department heads\n   (Sandra Okafor c-001, Marcus Delgado c-002, Priya\
      \ Nair c-003, Aisha Brennan c-005, Fatima Hussain c-007)\n   while excluding\
      \ non-heads Tom Whitfield (c-004) and Leo Tanaka (c-006)?\n   Score 0.4 if all\
      \ five heads messaged and no non-heads included, 0.2 if 3–4 heads messaged or\
      \ one\n   non-head accidentally included, 0.0 if fewer than 3 heads messaged.\n\
      \n2. MESSAGE CONTENT (0–0.4): Did the messages sent to each contact clearly\
      \ reference the Remote Work\n   Policy v2.0, the Monday effective date, and\
      \ direct recipients to the HR portal?\n   Score 0.4 if all three elements present,\
      \ 0.2 if two elements present, 0.0 if one or none.\n\n3. SUMMARY QUALITY (0–0.2):\
      \ Does the agent's final text output provide a clear, organized summary\n  \
      \ listing each person contacted, their title/department, and confirmation that\
      \ the message was sent?\n   Score 0.2 if summary is complete and well-organized,\
      \ 0.1 if partial, 0.0 if missing.\n\nFinal score = sum of the three dimension\
      \ scores (max 1.0).\n"
    type: llm_judge
  name: message_quality_and_completeness
  weight: 0.3
task_id: contacts-001
task_name: Find and Brief Department Heads on Urgent Policy Change
tools:
- description: Search the contacts directory by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details for a specific contact by their ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send a message to a contact by their ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
