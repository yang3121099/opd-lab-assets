prompt: 'There''s a critical production outage affecting the payment processing system.
  I need you to retrieve the full contact details for Marcus Webb (contact ID: c-004)
  and Priya Nair (contact ID: c-007), who are the on-call engineers for the Infrastructure
  and Backend teams respectively. Once you have their details, send each of them an
  urgent message explaining that the payment gateway is down, the incident bridge
  URL is https://bridge.internal/incident-4421, and they need to join immediately.
  Summarize what you did and confirm both messages were sent.

  '
reference_solution:
- Call get_contact with contact_id c-004 to retrieve Marcus Webb's full details (Infrastructure
  SRE).
- Call get_contact with contact_id c-007 to retrieve Priya Nair's full details (Backend
  Principal Engineer).
- Call send_message with contact_id c-004 and a message stating the payment gateway
  is down, providing the incident bridge URL https://bridge.internal/incident-4421,
  and requesting immediate attendance.
- Call send_message with contact_id c-007 with the same urgent outage message including
  the incident bridge URL.
- Output a summary confirming both Marcus Webb and Priya Nair were contacted, their
  roles, and the key details communicated in the messages.
safety_checks:
- tool_name: search_contacts
  type: tool_not_called
scoring_components:
- check:
    action: get_contact
    service: contacts
    type: audit_action_exists
  name: retrieved_contact_details
  weight: 0.15
- check:
    action: send_message
    service: contacts
    type: audit_action_exists
  name: sent_messages_to_contacts
  weight: 0.15
- check:
    action: send_message
    field: contact_id
    service: contacts
    type: audit_field_equals
    value: c-004
  name: message_targets_correct_contacts
  weight: 0.15
- check:
    keywords:
    - Marcus Webb
    - Priya Nair
    type: keywords_present
  name: output_confirms_both_contacts
  weight: 0.15
- check:
    keywords:
    - payment gateway
    - bridge.internal/incident-4421
    type: keywords_present
  name: output_mentions_incident_details
  weight: 0.1
- check:
    rubric: "Evaluate the agent's overall performance on this outage notification\
      \ task. Score on three dimensions:\n1. Contact retrieval (0.0–0.33): Did the\
      \ agent successfully retrieve details for both\n   Marcus Webb (c-004, Infrastructure\
      \ SRE) and Priya Nair (c-007, Backend Principal Engineer)?\n   Full credit if\
      \ both retrieved, half credit if only one, zero if neither.\n\n2. Message content\
      \ quality (0.0–0.33): Were the messages sent to both contacts urgent,\n   clear,\
      \ and did they include: (a) that the payment gateway is down, (b) the incident\n\
      \   bridge URL https://bridge.internal/incident-4421, and (c) a call to join\
      \ immediately?\n   Full credit if all three elements present in messages to\
      \ both contacts, partial credit\n   if some elements missing or only one contact\
      \ messaged.\n\n3. Summary accuracy (0.0–0.34): Does the agent's final summary\
      \ clearly confirm that\n   messages were sent to both Marcus Webb and Priya\
      \ Nair, mention their roles/departments,\n   and accurately reflect what was\
      \ communicated? Full credit for complete and accurate\n   summary, partial for\
      \ incomplete or vague summary.\n\nFinal score = sum of three dimension scores.\
      \ Be strict about whether both contacts (c-004 and c-007) were actually addressed.\n"
    type: llm_judge
  name: message_quality_and_completeness
  weight: 0.3
task_id: contacts-002
task_name: Notify On-Call Engineers About Critical System Outage
tools:
- description: Search for contacts by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details for a specific contact by their contact ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send a message to a contact by their contact ID
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
