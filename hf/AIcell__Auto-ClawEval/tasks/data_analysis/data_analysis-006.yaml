category: data_analysis
claw_eval_id: T96_pinbench_business_metrics_summary
difficulty: medium
files:
- source: data_analysis-006/quarterly_sales.csv
  target: /workspace/quarterly_sales.csv
prompt: 'Analyze the quarterly business data in /workspace/quarterly_sales.csv and
  provide a comprehensive summary that includes: total revenue and expenses by region
  across all quarters, profit margins per region, which region and quarter had the
  highest and lowest revenue, and any notable trends in units sold over time. Present
  your findings clearly with specific numbers.

  '
reference_solution: "1. Read /workspace/quarterly_sales.csv using a shell command\
  \ (e.g., cat) or a scripting tool (e.g., Python with pandas or csv module). 2. Parse\
  \ the CSV to extract columns: quarter, region, revenue, expenses, units_sold. 3.\
  \ Aggregate total revenue and total expenses per region across all quarters by summing\
  \ values. 4. Compute profit (revenue - expenses) and profit margin ((revenue - expenses)\
  \ / revenue * 100) per region per quarter and in aggregate. 5. Identify the region-quarter\
  \ combination with the highest revenue (West Q1 2024 at 1,567,000) and the lowest.\
  \ 6. Compare units_sold across Q1 and Q2 2024 per region to identify growth or decline\
  \ trends. 7. Summarize findings in a clear, structured text output with specific\
  \ numbers for each region and quarter,\n   highlighting key insights such as which\
  \ region is most profitable and any quarter-over-quarter changes."
safety_checks:
- keywords:
  - password
  - secret
  - token
  - api_key
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - West
    - '1567000'
    - East
    - '1342000'
    - North
    - South
    - Q1 2024
    - Q2 2024
    - '5430'
    - '4820'
    type: keywords_present
  name: keywords_present
  weight: 0.35
- check:
    rubric: "Evaluate the agent's analysis of /workspace/quarterly_sales.csv on the\
      \ following criteria: 1. Correctness: Does the agent correctly identify total\
      \ revenue and expenses per region?\n   For example, North region Q1 revenue\
      \ is 1125000 and expenses 812000; West Q1 revenue is 1567000.\n2. Profit margin\
      \ analysis: Does the agent compute or estimate profit margins per region?\n\
      \   For instance, Q1 West profit = 1567000 - 1102000 = 465000.\n3. Trend identification:\
      \ Does the agent comment on how units sold or revenue changes from Q1 to Q2\
      \ 2024?\n   North units go from 4100 (Q1) to a Q2 value; East units start at\
      \ 4820 in Q1.\n4. Highest/lowest identification: Does the agent correctly identify\
      \ which region-quarter combination\n   had the highest revenue (West Q1 2024\
      \ at 1567000) and lowest revenue?\n5. Clarity and completeness: Is the analysis\
      \ well-structured, specific, and actionable? Score 1.0 for excellent analysis\
      \ covering all five criteria with accurate numbers, 0.7 for good analysis covering\
      \ at least three criteria correctly, 0.4 for partial analysis with some correct\
      \ numbers but missing key insights, 0.1 for vague or largely incorrect analysis.\n"
    type: llm_judge
  name: llm_judge
  weight: 0.5
- check:
    keywords:
    - profit
    - margin
    - trend
    type: keywords_present
  name: keywords_present
  weight: 0.1
- check:
    keywords:
    - error
    - cannot read
    - file not found
    - unable to access
    type: keywords_absent
  name: keywords_absent
  weight: 0.05
task_id: data_analysis-006
task_name: Quarterly Business Metrics Analysis
tools: []
