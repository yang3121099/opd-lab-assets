    type: audit_field_equals
    value: product-safety
  name: correct_channel
  weight: 0.1
- check:
    keywords:
    - AquaPure Pro 3000
    - WF-2024-09B
    - recall
    - contamination
    type: keywords_present
  name: recall_facts_present
  weight: 0.15
- check:
