    - CPSC
    - FDA
    - 24 hours
    - 48 hours
    type: keywords_present
  name: regulatory_guidance_cited
  weight: 0.1
- check:
    rubric: 'Evaluate the notification message sent to the ''product-safety'' channel.
      Score on three dimensions: 1) Accuracy (0–0.4): Does the message correctly reference
      the AquaPure Pro 3000, batch code WF-2024-09B, and cite specific regulatory
      requirements from CPSC (24-hour consumer notification) and FDA (48-hour distributor
      notification, MedWatch filing)? Full marks if both agencies and timeframes are
      mentioned; partial if only one. 2) Completeness (0–0.4): Does the message include
      recommended immediate actions such as halting distribution, notifying consumers,
      coordinating with retailers, and offering replacements? Full marks if 3+ actions
      are listed; partial for 1–2. 3) Stakeholder appropriateness (0–0.2): Is the
      tone professional and suitable for safety-team, legal, and pr-team recipients?
      Deduct if the message is vague, alarmist without substance, or missing recipient
      context. Final score: sum of dimension scores (max 1.0).

      '
    type: llm_judge
  name: notification_quality
  weight: 0.25
- check:
    rubric: 'Evaluate the agent''s final text output summarizing its research and
      actions. Score 1.0 if the output: (a) summarizes findings from at least two
      sources (e.g., CPSC and FDA or recallnews.com), (b) explains why the AquaPure
      Pro 3000 batch WF-2024-09B is at risk (microbial contamination, September 2024
      manufacturing window), and (c) confirms the notification was sent to the product-safety
      channel with the correct recipients (safety-team, legal, pr-team). Score 0.5
      if only two of three criteria are met. Score 0.0 if the output is a bare acknowledgment
      with no substantive content.

      '
    type: llm_judge
  name: output_summary_quality
  weight: 0.15
