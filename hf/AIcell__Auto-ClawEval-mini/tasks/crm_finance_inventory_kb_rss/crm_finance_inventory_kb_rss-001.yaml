    - churned
    - Orion Healthcare
    type: keywords_present
  name: risk_and_churn_flagged
  weight: 0.1
- check:
    rubric: "Evaluate the quality and completeness of the agent's enterprise customer\
      \ health briefing. Score on the following dimensions:\n1. CUSTOMER COVERAGE\
      \ (0–0.3): Does the output correctly identify all 5 enterprise-tier customers\n\
      \   (Meridian Logistics Group cust-001, Apex Financial Partners cust-002, Greenfield\
      \ Manufacturing\n   cust-003, Skyline Retail Corp cust-004, Orion Healthcare\
      \ Systems cust-005, Coastal Energy\n   Partners cust-007)? Note that BluePeak\
      \ Technologies (cust-006) is professional tier and should\n   NOT be included\
      \ as an enterprise customer. Score 0.3 if all 6 enterprise customers are covered,\n\
      \   0.15 if 3–5 are covered, 0.0 if fewer than 3.\n\n2. STATUS INSIGHTS (0–0.3):\
      \ Does the briefing clearly flag Greenfield Manufacturing as at_risk\n   and\
      \ Orion Healthcare Systems as churned, and highlight Coastal Energy Partners\
      \ ($890,000\n   revenue) and Apex Financial Partners ($720,000 revenue) as top\
      \ revenue accounts? Score 0.3\n   if all four are addressed, 0.15 if two or\
      \ three are addressed, 0.0 if none.\n\n3. INDUSTRY NEWS INTEGRATION (0–0.2):\
      \ Does the briefing incorporate relevant industry news\n   from the RSS feeds\
      \ — such as supply chain disruptions for Meridian Logistics, interest rate\n\
      \   pressures for Apex Financial, workforce shortages for Greenfield Manufacturing,\
      \ or renewable\n   energy investment growth for Coastal Energy? Score 0.2 if\
      \ at least two industry insights are\n   woven into the briefing, 0.1 if one\
      \ is mentioned, 0.0 if none.\n\n4. ACTIONABILITY (0–0.2): Does the briefing\
      \ provide concrete, prioritized outreach recommendations\n   for sales leadership\
      \ — e.g., urgent re-engagement for Greenfield (at_risk), win-back strategy\n\
      \   for Orion Healthcare (churned), expansion opportunity for Coastal Energy\
      \ (high revenue, growing\n   sector)? Score 0.2 if recommendations are specific\
      \ and prioritized, 0.1 if general, 0.0 if absent.\n\nFinal score = sum of dimension\
      \ scores (max 1.0).\n"
    type: llm_judge
  name: briefing_quality
  weight: 0.35
