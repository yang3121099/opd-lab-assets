prompt: 'Our sales leadership team is preparing for the quarterly business review
  and needs a comprehensive health briefing on our enterprise-tier customers. Please
  identify all enterprise customers, look up any relevant industry news or trends
  for their sectors, and then produce a consolidated CRM export report summarizing
  their status, revenue, and key insights. The briefing should help leadership prioritize
  outreach for the upcoming quarter.

  '
reference_solution:
- action: Call list_customers with tier=enterprise to retrieve all enterprise-tier
    customers.
  detail: 'This returns cust-001 (Meridian Logistics Group), cust-002 (Apex Financial
    Partners), cust-003 (Greenfield Manufacturing), cust-004 (Skyline Retail Corp),
    cust-005 (Orion Healthcare Systems), and cust-007 (Coastal Energy Partners). cust-006
    (BluePeak Technologies) is professional tier and should be excluded.

    '
  step: 1
- action: Call list_articles for relevant industry categories (logistics, finance,
    manufacturing, energy).
  detail: 'Retrieve RSS articles for the industries represented by enterprise customers.
    Key articles include supply chain disruptions (logistics), interest rate pressures
    (finance), workforce shortages (manufacturing), and renewable energy investment
    growth (energy).

    '
  step: 2
- action: Optionally call get_rss_article on specific articles for fuller context.
  detail: 'The agent may retrieve full article content for art-001 through art-004
    to enrich the briefing with specific data points and quotes.

    '
  step: 3
- action: Synthesize findings into a structured briefing.
  detail: 'Identify Coastal Energy Partners ($890K) and Apex Financial Partners ($720K)
    as top revenue accounts. Flag Greenfield Manufacturing as at_risk (last contact
    Aug 10) and Orion Healthcare as churned. Integrate industry news to contextualize
    each customer''s situation and risks.

    '
  step: 4
- action: Call export_report with a title, the list of enterprise customer IDs, and
    a summary.
  detail: Submit the consolidated report via the CRM export endpoint, including all
    6 enterprise customer IDs and a summary that captures status, revenue highlights,
    and outreach priorities for leadership review.
  step: 5
