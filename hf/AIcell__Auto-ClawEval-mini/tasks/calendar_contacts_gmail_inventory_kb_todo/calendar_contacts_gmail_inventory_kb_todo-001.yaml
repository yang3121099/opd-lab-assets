  name: confirmation_messages_sent
  weight: 0.15
- check:
    action: create_task
    service: todo
    type: audit_action_exists
  name: followup_task_created
  weight: 0.1
- check:
    keywords:
    - Q1 Budget Review
    - Client Onboarding
    - Nexus Corp
    - Product Roadmap Sync
    type: keywords_present
  name: key_events_mentioned
  weight: 0.15
- check:
    keywords:
    - Marcus Bell
    - Diana Ross
    - Tom Walsh
    type: keywords_present
  name: external_attendees_identified
  weight: 0.1
- check:
    rubric: "Evaluate the agent's response on three dimensions:\n1. COMPLETENESS (0–0.4):\
      \ Did the agent correctly identify all five events (evt-001 through evt-005)\n\
      \   and distinguish external attendees (marcus.bell@partnerco.com, tom.walsh@vendorx.com,\n\
      \   diana.ross@nexuscorp.com, kevin.park@nexuscorp.com) from internal ones?\n\
      \   Score 0.4 if all external attendees identified, 0.2 if at least two, 0.0\
      \ if none.\n\n2. ACTION TAKEN (0–0.4): Did the agent send confirmation messages\
      \ to the external attendees\n   (Marcus Bell con-002, Tom Walsh con-003, Diana\
      \ Ross con-004, Kevin Park con-005)?\n   Did the agent create a follow-up task\
      \ for the most important event (Client Onboarding — Nexus Corp\n   or Q1 Budget\
      \ Review are both valid choices)? Score 0.4 if both done, 0.2 if only one, 0.0\
      \ if neither.\n\n3. CLARITY AND REASONING (0–0.2): Is the agent's summary well-organized,\
      \ clearly explaining\n   which events have external attendees, what messages\
      \ were sent, and why the chosen event\n   was selected for follow-up? Score\
      \ 0.2 for clear reasoning, 0.1 for partial, 0.0 for unclear.\n\nFinal score\
      \ = sum of the three dimension scores (max 1.0).\n"
    type: llm_judge
  name: schedule_summary_quality
  weight: 0.3
