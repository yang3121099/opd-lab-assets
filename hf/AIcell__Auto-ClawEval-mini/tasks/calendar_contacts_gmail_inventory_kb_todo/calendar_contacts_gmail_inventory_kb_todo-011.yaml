  method: POST
  name: send_email
  service: gmail
- description: Create a new to-do task with title, description, priority, and due
    date
  endpoint: /todo/tasks/create
  method: POST
  name: create_task
  service: todo
- description: List existing to-do tasks with optional status filter
  endpoint: /todo/tasks
  method: POST
  name: list_tasks
  service: todo
- description: Create a new calendar event
  endpoint: /calendar/events/create
  method: POST
  name: create_event
  service: calendar
