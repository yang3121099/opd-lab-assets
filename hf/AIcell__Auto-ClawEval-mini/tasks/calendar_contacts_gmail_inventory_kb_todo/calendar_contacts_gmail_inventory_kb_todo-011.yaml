  name: affected_parties_identified
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s conflict resolution output on three dimensions:

      1. CONFLICT IDENTIFICATION (0–0.33): Did the agent correctly identify that evt-001
      ("Q2 Planning Summit — Executive Team", 09:00–12:00) and evt-002 ("Product Roadmap
      Review — Engineering", 10:00–13:00) both occupy Boardroom A on 2024-03-19 with
      a 2-hour overlap (10:00–12:00)? Full credit if both events and the overlap window
      are clearly described.

      2. EMAIL QUALITY (0–0.33): Was the email sent to the affected parties (sarah.chen@company.com,
      raj.patel@company.com, and/or marcus.obi@company.com who appears in both events)?
      Does the email professionally explain the conflict, reference the room booking
      policy (first-come first-served, 48-hour notice), and propose a concrete resolution
      such as moving one event to Conference Room B or rescheduling? Full credit for
      professional tone, correct recipients, and actionable proposal.

      3. FOLLOW-UP TASK (0–0.34): Did the agent create a meaningful follow-up task
      in the to-do service to confirm resolution acceptance, with an appropriate due
      date before 2024-03-19 and a clear description? Full credit if the task is specific
      and time-bound.

      Score 1.0 if all three dimensions are fully satisfied, 0.7 if two are fully
      satisfied, 0.4 if only one is fully satisfied, 0.0 if the agent failed to address
      the conflict meaningfully.

      '
    type: llm_judge
  name: resolution_quality
  weight: 0.3
task_id: calendar_contacts_gmail_inventory_kb_todo-011
