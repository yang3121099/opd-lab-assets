prompt: 'Our quarterly planning summit scheduled for next week has a room booking
  conflict — two teams have overlapping events in the same conference room. Please
  investigate the calendar for the week of 2024-03-18, identify the conflicting events
  in "Boardroom A", look up the relevant attendees in contacts, check if there''s
  a knowledge base article about our room booking policy, and then send a professional
  email to all affected parties explaining the conflict and proposing a resolution.
  Also create a follow-up task to confirm the resolution was accepted.

  '
reference_solution: "1. Call list_events for the week of 2024-03-18 (days=7) to retrieve\
  \ all events. 2. Identify evt-001 (\"Q2 Planning Summit\") and evt-002 (\"Product\
  \ Roadmap Review\") both\n   booked in Boardroom A on 2024-03-19 with overlapping\
  \ times (10:00–12:00).\n3. Call get_event for evt-001 and evt-002 to confirm attendee\
  \ lists and organizers. 4. Call search_contacts to look up Sarah Chen (con-001),\
  \ Raj Patel (con-002), and\n   Marcus Obi (con-003) — the organizers and shared\
  \ attendee.\n5. Call search_articles with query \"room booking policy\" or category\
  \ \"Facilities\" to find kb-007. 6. Call get_kb_article for kb-007 to read the full\
  \ policy (first-come first-served,\n   48-hour notice, alternative room required).\n\
  7. Call send_email to sarah.chen@company.com, raj.patel@company.com, and marcus.obi@company.com\n\
  \   explaining the double-booking conflict in Boardroom A on March 19, citing the\
  \ policy,\n   and proposing that the Engineering team move to Conference Room B\
  \ or reschedule.\n8. Call create_task to create a follow-up task titled \"Confirm\
  \ Boardroom A conflict resolution\n   accepted by all parties\" with priority high\
  \ and due_date 2024-03-17 (48 hours before the event).\n9. Report the conflict details,\
  \ the email recipients, the proposed resolution, and the\n   created task ID in\
  \ the final text output."
