  method: POST
  name: get_event
  service: calendar
- description: Search contacts by name, email, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Get full contact details by contact ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Search knowledge base articles by query or category
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve a specific knowledge base article by ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Send an email to one or more recipients
