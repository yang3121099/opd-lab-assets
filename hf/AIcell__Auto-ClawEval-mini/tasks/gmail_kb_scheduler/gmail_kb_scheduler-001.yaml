  kb:
    articles:
    - author: Linda Park
      category: hr
      content: '## Onboarding Standard Process (v3.2)


        **Day 0 (Before Start Date):**

        - IT provisioning job runs automatically at 6am on the business day before
        start date

        - New hire receives credentials via personal email

        - Slack invite sent automatically


        **Day 1:**

        - New hire attends orientation at 9am

        - Buddy assigned and introduced via Slack

        - Laptop provided by IT — new hires do NOT bring their own


        **Escalation:**

        - If provisioning fails, HR must manually trigger re-provisioning via the
        IT portal within 24 hours

        - Contact: it-support@acme.com with subject "Manual Provisioning Request:
        [employee name]"


        **Common Issues:**

        - Credentials not received: Check spam folder first; if not found, escalate
        to IT within 4 hours

        - Slack invite missing: IT can resend from admin panel

        '
