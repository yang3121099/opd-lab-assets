- check:
    action: web_search
    service: web_real
    type: audit_action_exists
  name: used_web_search
  weight: 0.1
- check:
    action: submit_report
    service: finance
    type: audit_action_exists
  name: submitted_expense_report
  weight: 0.1
- check:
    action: submit_report
    field: title
    service: finance
    type: audit_field_contains
    value: Q4 Sales Conference Travel Expenses - November 2024
  name: correct_report_title
  weight: 0.1
- check:
    keywords:
    - txn-001
    - txn-005
    - United Airlines
    type: keywords_present
  name: travel_transactions_identified
  weight: 0.15
- check:
    keywords:
    - txn-003
    - txn-006
    type: keywords_present
  name: transportation_included
  weight: 0.1
- check:
    keywords:
    - Staples
    - Gibsons
    type: keywords_absent
  name: non_travel_excluded
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s expense report summary on three dimensions:

      1. TRANSACTION SELECTION (0.0-0.4): Did the agent correctly identify travel
      and transportation transactions from November 2024? The correct transactions
      are: txn-001 (United Airlines flight $487.50), txn-003 (Chicago Yellow Cab $54.75),
      txn-005 (United Airlines return $412.00), and txn-006 (O''Hare Airport Parking
      $87.00). Lodging (txn-002 Marriott $312.00), meals (txn-004 Gibsons $238.90),
      and supplies (txn-007 Staples $145.20) should NOT be included as travel/transportation.
      Score 0.4 if all four travel/transport transactions included and non-travel
      excluded, 0.2 if partial, 0.0 if major errors.

      2. IRS MILEAGE RATE CONTEXT (0.0-0.3): Did the agent successfully search for
      and include the 2024 IRS standard mileage rate in the summary? Score 0.3 if
      a specific rate is mentioned (e.g., 67 cents per mile for 2024), 0.15 if mileage
      was searched but rate unclear, 0.0 if absent.

      3. SUMMARY CLARITY (0.0-0.3): Is the final summary clear, professional, and
      actionable? Does it state the total amount submitted, list the included transactions
      with vendors and amounts, and explain why certain transactions were excluded?
      Score 0.3 for excellent clarity, 0.15 for adequate, 0.0 for poor or missing
      summary.

      Final score = sum of the three dimension scores.

      '
    type: llm_judge
  name: report_quality_and_accuracy
  weight: 0.25
