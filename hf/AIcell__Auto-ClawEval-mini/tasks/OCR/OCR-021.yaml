category: OCR
claw_eval_id: T55zh_chinese_food_identification
difficulty: medium
files:
- source: OCR-021/image.jpg
  target: /workspace/image.jpg
prompt: Analyze the whiteboard diagram image at /workspace/image.jpg and identify
  all labeled components, text, arrows, and structural elements visible in the diagram.
  Provide a detailed description of what the diagram shows, including all readable
  text labels, the relationships between components, and the overall purpose or topic
  of the diagram.
reference_solution: '1. Use a native image viewing or OCR capability to open and read
  /workspace/image.jpg.

  2. Apply OCR or vision analysis to extract all text visible on the whiteboard, including
  labels, titles, annotations, and any handwritten or printed text.

  3. Identify structural elements such as boxes, circles, arrows, lines, and groupings
  that indicate relationships between components.

  4. Organize the extracted information to describe the diagram''s layout, the labeled
  components, and the connections between them.

  5. Summarize the overall topic or purpose of the diagram based on the identified
  components and their relationships.

  6. Report all findings as a structured text output, listing each identified label
  and describing the diagram''s structure and meaning.'
safety_checks:
- keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - whiteboard
    - diagram
    type: keywords_present
  description: Agent identifies the image as a whiteboard diagram
  name: Agent identifies the image as a whiteboa
  weight: 0.15
- check:
    keywords:
    - component
    - label
    - arrow
    - box
    - node
    - block
    - element
    type: keywords_present
  description: Agent identifies structural elements such as boxes, arrows, or labeled
    nodes in the diagram
  name: Agent identifies structural elements suc
  weight: 0.2
- check:
    rubric: 'Evaluate whether the agent has thoroughly analyzed the whiteboard diagram
      in /workspace/image.jpg. The agent should: (1) identify and list all readable
      text labels present on the whiteboard, (2) describe the relationships or connections
      shown between components (e.g., arrows, lines, groupings), (3) describe the
      overall structure or layout of the diagram, (4) infer or state the apparent
      topic or purpose of the diagram based on its content. A high-quality response
      will be specific, organized, and demonstrate that the agent actually read the
      image rather than providing generic descriptions. Penalize vague or generic
      responses that do not reference specific text or visual elements from the image.'
    type: llm_judge
  description: Quality and completeness of the diagram analysis
  name: 'Quality and completeness of the diagram '
  weight: 0.5
- check:
    keywords:
    - cannot read
    - unable to analyze
    - no text visible
    - image is blank
    - cannot process
    type: keywords_absent
  description: Agent does not claim the image is unreadable or blank without attempting
    analysis
  name: Agent does not claim the image is unread
  weight: 0.15
task_id: OCR-021
task_name: Whiteboard Diagram OCR and Component Analysis
tools: []
