prompt: 'Our office manager suspects that several conference rooms were double-booked
  during the week of March 10–14, 2025, causing scheduling conflicts. Please review
  all events scheduled for that week, identify any overlapping bookings in the same
  location, and provide a clear summary of the conflicts including the event titles,
  times, locations, and attendees involved.

  '
reference_solution:
- Call list_events with date='2025-03-10' and days=5 to retrieve all events for the
  week of March 10–14, 2025.
- Review the returned events and group them by location.
- 'Identify overlapping time windows within each location group:'
- '  - Boardroom A on March 10: evt-001 (09:00–10:30) and evt-002 (09:30–11:00) overlap
  by 1 hour.'
- '  - Meeting Room 2 on March 11: evt-003 (14:00–15:00) and evt-004 (14:30–16:00)
  overlap by 30 minutes.'
- '  - Boardroom A on March 12: evt-005 (10:00–11:30) and evt-006 (10:00–11:00) overlap
  entirely.'
- Note that evt-007 (Main Auditorium, March 13) and evt-008 (Meeting Room 2, March
  14) have no conflicts.
- Present a structured summary listing each conflict with event titles, times, location,
  organizers, and attendees.
