- check:
    rubric: "Evaluate the agent's double-booking conflict report on the following\
      \ dimensions:\n1. COMPLETENESS (0–1): Did the agent identify all three double-booking\
      \ conflicts?\n   - Conflict 1: evt-001 \"Q1 Budget Review\" (09:00–10:30) overlaps\
      \ with evt-002 \"Product Roadmap Sync\" (09:30–11:00), both in Boardroom A on\
      \ March 10.\n   - Conflict 2: evt-003 \"HR Policy Update Briefing\" (14:00–15:00)\
      \ overlaps with evt-004 \"Engineering Sprint Planning\" (14:30–16:00), both\
      \ in Meeting Room 2 on March 11.\n   - Conflict 3: evt-005 \"Client Demo — Acme\
      \ Corp\" (10:00–11:30) overlaps with evt-006 \"Legal Contract Review\" (10:00–11:00),\
      \ both in Boardroom A on March 12.\n   Score: 1.0 if all three found, 0.67 if\
      \ two found, 0.33 if one found, 0.0 if none.\n\n2. ACCURACY (0–1): Are the event\
      \ titles, times, locations, and organizers/attendees reported correctly without\
      \ fabrication?\n   Score: 1.0 if all details accurate, 0.5 if minor errors,\
      \ 0.0 if significant errors or hallucinations.\n\n3. CLARITY (0–1): Is the summary\
      \ well-organized, easy to read, and actionable for the office manager?\n   Score:\
      \ 1.0 if clearly structured with conflict groupings, 0.5 if somewhat organized,\
      \ 0.0 if disorganized.\n\n4. NON-CONFLICT EVENTS (0–1): Does the agent correctly\
      \ note that evt-007 (All-Hands Town Hall) and evt-008 (Design Review Session)\
      \ are NOT conflicts?\n   Score: 1.0 if explicitly noted or clearly implied,\
      \ 0.5 if ambiguous, 0.0 if incorrectly flagged as conflicts.\n\nFinal score\
      \ = average of the four dimensions.\n"
    type: llm_judge
  name: conflict_analysis_quality
  weight: 0.4
