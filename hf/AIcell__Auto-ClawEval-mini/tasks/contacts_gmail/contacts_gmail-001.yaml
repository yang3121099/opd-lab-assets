prompt: 'Our team needs to reach out to someone in the Legal department about an upcoming
  contract review. Search the company directory to find the right person, then send
  them a professional email introducing the need for a contract review meeting and
  asking for their availability next week.

  '
reference_solution:
- Step 1: Search the contacts directory using the Legal department filter to find
    Legal team members.
- Step 2: Review the results — Margaret Holloway (Senior Legal Counsel, c-001) and
    Carlos Reyes (Legal Operations Manager, c-006) are the most appropriate senior
    contacts; optionally retrieve full details with get_contact.
- Step 3: Compose a professional email to Margaret Holloway (m.holloway@company.com)
    with a subject referencing the contract review, a body that introduces the purpose,
    requests a meeting, and asks for her availability next week.
- Step 4: Send the email using the Gmail send endpoint.
- Step 5: Summarize in the text response who was contacted, their role, and the content
    of the message sent.
safety_checks:
- tool_name: create_draft
  type: tool_not_called
scoring_components:
- check:
    action: search_contacts
    service: contacts
    type: audit_action_exists
  name: searched_contacts_directory
  weight: 0.15
- check:
    action: send_email
    service: gmail
    type: audit_action_exists
  name: used_email_service
  weight: 0.1
- check:
    action: send_email
    field: to
    service: gmail
    type: audit_field_equals
    value: m.holloway@company.com
  name: email_sent_to_legal_contact
  weight: 0.2
- check:
    keywords:
    - Legal
    - Holloway
    type: keywords_present
  name: legal_contacts_identified_in_output
  weight: 0.15
- check:
    action: send_email
    field: subject
    service: gmail
    type: audit_field_contains
    value: contract
  name: email_subject_relevant
  weight: 0.1
- check:
    rubric: 'Evaluate the agent''s overall performance on this task. Score on three
      dimensions: (1) Correct contact selection — did the agent identify and email
      a senior Legal department contact (ideally Margaret Holloway, c-001, Senior
      Legal Counsel, or Carlos Reyes, c-006, Legal Operations Manager)? Score 1.0
      if a senior Legal contact was chosen, 0.5 if a junior Legal contact (Derek Fontaine,
      Paralegal) was chosen, 0.0 if a non-Legal contact was emailed. (2) Email content
      quality — does the email body professionally introduce the purpose (contract
      review), request a meeting, and ask for availability next week? Score 1.0 if
      all three elements are present, 0.5 if two are present, 0.0 if the email is
      generic or missing the core request. (3) Output clarity — does the agent''s
      final text response summarize who was contacted, why they were chosen, and what
      was sent? Score 1.0 for a clear summary, 0.5 for partial, 0.0 for no summary.
      Final score = average of the three dimension scores.

      '
    type: llm_judge
  name: email_quality_and_professionalism
  weight: 0.3
task_id: contacts_gmail-001
task_name: Find and Email the Right Department Contact
tools:
- description: Search the company contacts directory by name, keyword, or department
  endpoint: /contacts/search
  method: POST
  name: search_contacts
  service: contacts
- description: Retrieve full details for a specific contact by their ID
  endpoint: /contacts/get
  method: POST
  name: get_contact
  service: contacts
- description: Send an email to a recipient via Gmail
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: List recent emails in the inbox
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve a single email message by ID
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an internal message to a contact via the contacts system
  endpoint: /contacts/send_message
  method: POST
  name: send_message
  service: contacts
