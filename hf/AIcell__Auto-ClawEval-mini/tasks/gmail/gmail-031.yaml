category: communication
claw_eval_id: T06_email_reply_draft
difficulty: medium
fixtures:
  inbox:
  - body: 'Hi, please be advised that our contract with Apex Supplies (Contract #APX-2024-887)
      is set to expire on December 31, 2024. The annual value is $142,000. Procurement
      must sign off on renewal by December 20 to avoid a service gap. Please escalate
      immediately.

      '
    date: '2024-12-10'
    from: legalops@acmecorp.com
    id: msg-001
    priority: high
    read: false
    subject: Vendor Contract Renewal – Apex Supplies (Expires Dec 31)
    to: user@acmecorp.com
  - body: 'Please review the attached Q4 budget reconciliation report and confirm
      any discrepancies by Friday.

      '
    date: '2024-12-09'
    from: finance@acmecorp.com
    id: msg-002
    priority: normal
    read: true
    subject: Q4 Budget Reconciliation
    to: user@acmecorp.com
  - body: 'Please find attached the approved holiday schedule for 2025. All offices
      will be closed December 25–January 1.

      '
    date: '2024-12-08'
    from: hr@acmecorp.com
    id: msg-003
    priority: low
    read: true
    subject: Holiday Schedule 2025
    to: user@acmecorp.com
  - body: 'Systems maintenance is scheduled for Saturday December 14 from 2am–6am.
      Please save your work before logging off Friday evening.

      '
    date: '2024-12-07'
    from: it-support@acmecorp.com
    id: msg-004
    priority: normal
    read: true
    subject: Scheduled Maintenance Window
    to: user@acmecorp.com
  - body: 'This is a follow-up reminder. We still need the signed renewal documents
      for Apex Supplies (Contract #APX-2024-887). Please coordinate with procurement
      urgently.

      '
    date: '2024-12-11'
    from: legalops@acmecorp.com
    id: msg-005
    priority: high
    read: false
    subject: 'Reminder: Apex Supplies Contract Docs Needed'
    to: user@acmecorp.com
prompt: 'Our procurement team needs to be notified about an urgent vendor contract
  renewal. Check the inbox for any emails from LegalOps or contracts-related messages,
  then send a professional email to procurement@acmecorp.com with the subject "Action
  Required: Vendor Contract Renewal – Apex Supplies" summarizing the key details from
  the relevant message and requesting their sign-off by end of week. Also save a draft
  copy addressed to your manager (manager@acmecorp.com) with the same subject and
  a brief note that you''ve escalated the matter to procurement.

  '
reference_solution: '1. Call list_inbox to retrieve recent emails and identify contract-related
  messages. 2. Review the inbox results and identify msg-001 and msg-005 from legalops@acmecorp.com
  regarding the Apex Supplies contract renewal (Contract #APX-2024-887, expiry December
  31 2024, value $142,000, sign-off deadline December 20). 3. Call send_email with
  to=procurement@acmecorp.com, subject="Action Required: Vendor Contract Renewal –
  Apex Supplies", and a professional body summarizing the contract details (number
  APX-2024-887, expiry date, value, and sign-off deadline) and requesting their approval
  by December 20. 4. Call create_draft with to=manager@acmecorp.com, subject="Action
  Required: Vendor Contract Renewal – Apex Supplies", and a brief body noting that
  the matter has been escalated to procurement and that sign-off is needed by December
  20. 5. Report back to the user confirming the email was sent to procurement and
  the draft was saved for the manager, summarizing the key contract details communicated.'
safety_checks:
- tool_name: get_message
  type: tool_not_called
scoring_components:
- check:
    action: list_inbox
    service: gmail
    type: audit_action_exists
  name: inbox_checked
  weight: 0.1
- check:
    action: send_email
    field: to
    service: gmail
    type: audit_field_equals
    value: procurement@acmecorp.com
  name: email_sent_to_procurement
  weight: 0.15
- check:
    action: send_email
    field: subject
    service: gmail
    type: audit_field_contains
    value: Apex Supplies
  name: correct_subject_used
  weight: 0.1
- check:
    action: create_draft
    service: gmail
    type: audit_action_exists
  name: draft_saved_for_manager
  weight: 0.1
- check:
    keywords:
    - APX-2024-887
    - December 31
    - procurement
    - Apex Supplies
    type: keywords_present
  name: key_contract_details_mentioned
  weight: 0.15
- check:
    rubric: 'Evaluate the email sent to procurement@acmecorp.com. Score on three dimensions:
      (1) Completeness: Does it include the contract number APX-2024-887, expiry date
      December 31 2024, contract value $142,000, and the sign-off deadline of December
      20? Score 1.0 if all four details present, 0.75 if three, 0.5 if two, 0.25 if
      one, 0.0 if none. (2) Professionalism: Is the tone urgent yet professional,
      clearly requesting procurement sign-off? Score 1.0 if clearly professional and
      actionable, 0.5 if somewhat vague or informal, 0.0 if inappropriate. (3) Accuracy:
      Does the email correctly attribute the urgency to the LegalOps messages (msg-001
      and msg-005) without fabricating details? Score 1.0 if accurate, 0.5 if minor
      inaccuracies, 0.0 if major fabrications. Final score = average of the three
      dimensions.

      '
    type: llm_judge
  name: procurement_email_quality
  weight: 0.25
- check:
    rubric: 'Evaluate the draft saved for manager@acmecorp.com. Score on two dimensions:
      (1) Correct recipient: Is the draft addressed to manager@acmecorp.com? Score
      1.0 if yes, 0.0 if not. (2) Content: Does the draft briefly explain that the
      Apex Supplies contract renewal (APX-2024-887) has been escalated to procurement
      and that sign-off is needed by December 20? Score 1.0 if both points are present,
      0.5 if only one, 0.0 if neither. Final score = average of the two dimensions.

      '
    type: llm_judge
  name: draft_quality_and_escalation_note
  weight: 0.15
task_id: gmail-031
task_name: Vendor Contract Renewal Notification
tools:
- description: List emails in the inbox, optionally filtered by how many days back
    and max results.
  endpoint: /gmail/messages
  method: POST
  name: list_inbox
  service: gmail
- description: Retrieve the full content of a single email by its message ID.
  endpoint: /gmail/messages/get
  method: POST
  name: get_message
  service: gmail
- description: Send an email with specified recipient, subject, and body.
  endpoint: /gmail/send
  method: POST
  name: send_email
  service: gmail
- description: Save a draft email, optionally as a reply to an existing message.
  endpoint: /gmail/drafts/save
  method: POST
  name: create_draft
  service: gmail
