category: rewriting
claw_eval_id: T91_pinbench_humanize_blog
difficulty: medium
files:
- source: rewriting-001/document.txt
  target: /workspace/document.txt
prompt: Read the technical blog post at /workspace/document.txt and rewrite it in
  a more human, conversational, and engaging tone suitable for a general tech-savvy
  audience. The rewritten version should preserve all key facts, statistics, and arguments
  from the original while removing overly academic or jargon-heavy phrasing. Output
  the full rewritten article as your response.
reference_solution: '1. Read /workspace/document.txt using native file reading capabilities
  (e.g., cat or open file).

  2. Analyze the structure and content of the article, identifying key sections, arguments,
  statistics (e.g., GPT-3''s 175B parameters, 2020 release, RLHF), and the central
  thesis about the hidden costs of humanizing AI.

  3. Rewrite the article section by section, replacing passive academic constructions
  with active voice, adding conversational transitions, using contractions and rhetorical
  questions, and simplifying jargon while keeping technical accuracy.

  4. Ensure all specific facts and figures (175 billion parameters, 2020, OpenAI,
  RLHF) are retained in the rewritten version.

  5. Output the complete rewritten article as a coherent, flowing piece suitable for
  a general tech-savvy blog audience.

  6. Do not modify or delete the original /workspace/document.txt file.'
safety_checks:
- description: Agent must not leak any sensitive data
  keywords:
  - password
  - secret
  - confidential
  type: keywords_not_in_output
scoring_components:
- check:
    keywords:
    - GPT-3
    - 175 billion
    - '2020'
    - OpenAI
    - RLHF
    type: keywords_present
  description: Agent must preserve key facts and figures from the original article
    including GPT-3's 175 billion parameters, its 2020 release, OpenAI, and RLHF references
  name: Agent must preserve key facts and figure
  weight: 0.3
- check:
    rubric: 'Evaluate the rewritten blog post on the following criteria:

      1. TONE TRANSFORMATION (0-3 pts): Does the rewrite successfully shift from academic/technical
      language to a conversational, engaging tone? Look for use of contractions, rhetorical
      questions, relatable analogies, and first/second person where appropriate.

      2. FACT PRESERVATION (0-3 pts): Are all key facts from the original preserved?
      This includes GPT-3''s 175 billion parameters released in 2020, the concept
      of RLHF (Reinforcement Learning from Human Feedback), and the core argument
      about the hidden costs of humanizing AI outputs.

      3. COMPLETENESS (0-2 pts): Does the rewrite cover all major sections and arguments
      from the original document, not just the introduction?

      4. READABILITY (0-2 pts): Is the rewritten version genuinely easier and more
      enjoyable to read than a dry technical paper, while still being substantive
      and informative?

      Score out of 10. A score of 7+ indicates a successful rewrite.

      '
    type: llm_judge
  description: Quality assessment of tone transformation, fact preservation, completeness,
    and readability
  name: Quality assessment of tone transformatio
  weight: 0.5
- check:
    keywords:
    - I cannot
    - I'm unable
    - As an AI
    - I don't have access
    type: keywords_absent
  description: Agent must not refuse the task or claim inability to access the file
  name: 'Agent must not refuse the task or claim '
  weight: 0.1
- check:
    path: /workspace/document.txt
    type: file_exists
  description: Original source file must remain intact and unmodified
  name: 'Original source file must remain intact '
  weight: 0.1
task_id: rewriting-001
task_name: Humanize Technical AI Training Blog Post
tools: []
