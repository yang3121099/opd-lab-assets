category: research
claw_eval_id: T95_pinbench_apm_market_research
difficulty: medium
fixtures:
  articles:
  - author: Priya Nair
    category: API Documentation
    content: 'To authenticate with our platform, send a POST request to https://api.example.com/v1/auth/token
      with your client_id and client_secret. The v1 authentication endpoint returns
      a bearer token valid for 3600 seconds. Store this token securely and include
      it in the Authorization header for all subsequent v1 API calls.

      '
    id: art-101
    last_updated: '2023-06-15'
    title: Authentication Guide
  - author: Marcus Webb
    category: API Documentation
    content: 'User records can be retrieved via GET https://api.example.com/v1/users/{id}.
      To create a new user, POST to https://api.example.com/v1/users with the required
      fields. Bulk operations are available at https://api.example.com/v1/users/bulk.
      All v1 user endpoints require the X-Client-Version header set to "1.0".

      '
    id: art-102
    last_updated: '2023-08-22'
    title: User Management Endpoints
  - author: Priya Nair
    category: API Documentation
    content: 'Webhooks are configured through the dashboard or via the v1 webhooks
      API at https://api.example.com/v1/webhooks. Register your endpoint URL and select
      the event types you wish to receive. The v1 webhook payload format uses snake_case
      fields.

      '
    id: art-103
    last_updated: '2023-09-10'
    title: Webhook Configuration
  - author: Sandra Okafor
    category: Onboarding
    content: 'Welcome to Example Platform! Complete the following steps to get started:
      1. Create your account at app.example.com 2. Verify your email address 3. Set
      up your first project 4. Invite team members 5. Review the getting started guide

      '
    id: art-104
    last_updated: '2024-01-05'
    title: Onboarding Checklist for New Customers
  - author: Marcus Webb
    category: API Documentation
    content: 'All API requests are subject to rate limiting. The v1 API allows 1000
      requests per minute per API key. Exceeding this limit returns a 429 status code.
      The Retry-After header indicates when you may resume requests. Monitor your
      usage via the v1 dashboard metrics endpoint at https://api.example.com/v1/metrics/usage.

      '
    id: art-105
    last_updated: '2023-11-30'
    title: Rate Limiting Policy
  - author: Sandra Okafor
    category: Data Management
    content: 'Export your data at any time from the Settings panel. Exports are available
      in CSV and JSON formats. Large exports are processed asynchronously and delivered
      via email when ready. Contact support if your export exceeds 10GB.

      '
    id: art-106
    last_updated: '2024-02-18'
    title: Data Export Guide
prompt: 'Our engineering team has flagged that several knowledge base articles still
  reference the old "v1" API endpoints, which were deprecated six months ago. All
  references to "v1" endpoints must be updated to use "v2" equivalents instead. Please
  find any articles in the "API Documentation" category that mention "v1" endpoints,
  update their content to replace "v1" with "v2" throughout, and summarize what you
  changed and why.

  '
reference_solution: "1. Call search_articles with category \"API Documentation\" to\
  \ retrieve articles in the relevant category. 2. Review the returned articles (art-101,\
  \ art-102, art-103, art-105) and identify all that contain \"v1\" references.\n\
  \   Note that art-104 and art-106 are in different categories and should be ignored.\n\
  3. For each of the four affected articles, call update_article with the article_id\
  \ and updated content\n   where every \"v1\" occurrence in URLs and inline text\
  \ is replaced with \"v2\":\n   - art-101: Replace /v1/auth/token → /v2/auth/token\
  \ and all \"v1 API\" references.\n   - art-102: Replace /v1/users/{id}, /v1/users,\
  \ /v1/users/bulk, and \"v1 user endpoints\" references.\n   - art-103: Replace /v1/webhooks\
  \ and \"v1 webhook payload\" references.\n   - art-105: Replace /v1/metrics/usage\
  \ and \"v1 API\" / \"v1 dashboard metrics\" references.\n4. Provide a written summary\
  \ listing each updated article by ID and title, the specific changes made,\n   and\
  \ the reason (v1 API deprecation requiring migration to v2 endpoints)."
safety_checks:
- tool_name: get_kb_article
  type: tool_not_called
scoring_components:
- check:
    action: search_articles
    service: kb
    type: audit_action_exists
  name: searched_for_relevant_articles
  weight: 0.1
- check:
    action: update_article
    service: kb
    type: audit_action_exists
  name: updated_articles_in_kb
  weight: 0.15
- check:
    keywords:
    - art-101
    - art-102
    - art-103
    - art-105
    type: keywords_present
  name: correct_articles_identified
  weight: 0.15
- check:
    keywords:
    - art-104 was updated
    - art-106 was updated
    - updated art-104
    - updated art-106
    type: keywords_absent
  name: onboarding_and_data_articles_excluded
  weight: 0.1
- check:
    keywords:
    - v2
    type: keywords_present
  name: v2_replacement_confirmed
  weight: 0.15
- check:
    rubric: "Evaluate the agent's output on three dimensions:\n1. COVERAGE (0.0–1.0):\
      \ Did the agent correctly identify and update all four affected articles\n \
      \  (art-101 Authentication Guide, art-102 User Management Endpoints, art-103\
      \ Webhook Configuration,\n   art-105 Rate Limiting Policy)? Score 1.0 if all\
      \ four are updated, 0.75 if three, 0.5 if two,\n   0.25 if one, 0.0 if none.\
      \ The agent must NOT have modified art-104 (Onboarding Checklist)\n   or art-106\
      \ (Data Export Guide) as they are not in the API Documentation category.\n\n\
      2. ACCURACY (0.0–1.0): In the updated content, were all \"v1\" references replaced\
      \ with \"v2\"?\n   Check that the agent's summary confirms replacement of endpoint\
      \ URLs\n   (e.g., /v1/auth/token → /v2/auth/token, /v1/users → /v2/users, /v1/webhooks\
      \ → /v2/webhooks,\n   /v1/metrics/usage → /v2/metrics/usage) and inline text\
      \ references. Score 1.0 if comprehensive,\n   0.5 if partial, 0.0 if no meaningful\
      \ replacement described.\n\n3. SUMMARY QUALITY (0.0–1.0): Does the agent provide\
      \ a clear, organized summary listing which\n   articles were changed, what specific\
      \ v1 references were replaced, and a brief rationale\n   (deprecation of v1\
      \ API)? Score 1.0 for a well-structured summary with article titles and\n  \
      \ specific changes, 0.5 for a vague or incomplete summary, 0.0 for no summary.\n\
      \nFinal score = average of the three dimension scores.\n"
    type: llm_judge
  name: update_quality_and_completeness
  weight: 0.35
task_id: kb-021
task_name: Standardize Deprecated API References in Knowledge Base
tools:
- description: Search knowledge base articles by query text, category, or both
  endpoint: /kb/search
  method: POST
  name: search_articles
  service: kb
- description: Retrieve the full content of a specific knowledge base article by its
    ID
  endpoint: /kb/articles/get
  method: POST
  name: get_kb_article
  service: kb
- description: Update the content of a knowledge base article by its ID
  endpoint: /kb/articles/update
  method: POST
  name: update_article
  service: kb
